<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive English Portal - Level A1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- CSS ARCHITECTURE & RESET (ESTILO PORTAL) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        :root {
            --bg-base: #f1f5f9;
            --bg-card: #ffffff;
            --text-title: #0f172a;
            --text-body: #475569;
            --border-ui: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            
            /* Identidad Visual Exclusiva A1 */
            --accent-g: linear-gradient(135deg, #ef4444, #b91c1c);
            --accent-text: #ef4444;
        }

        [data-theme="dark"] {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --text-title: #f8fafc;
            --text-body: #94a3b8;
            --border-ui: #334155;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-body);
        }

        /* --- CONFIGURACIONES BOTÓN DE TEMA PORTAL --- */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1.5rem;
            background-color: var(--bg-card);
            border: 2px solid var(--border-ui);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            touch-action: manipulation;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* --- IDENTIDAD GRÁFICA UNIFICADA --- */
        .brand-color-text { color: var(--accent-text); }       
        .brand-color-bg { background: var(--accent-g); }     
        .brand-color-button { background: var(--accent-g); } 
        .brand-color-button:hover { filter: brightness(1.15); }
        
        .sidebar-btn.active { 
            background: var(--accent-g); 
            color: #ffffff !important; 
            border-color: transparent; 
            box-shadow: var(--shadow-lg);
        }

        /* Contenedores estilizados tipo Tarjeta Portal */
        .portal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--accent-g);
        }

        .portal-card-interactive:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        /* --- ANIMACIONES DE ENTRADA --- */
        .animate-fade-down { animation: moveDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .animate-fade-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

        @keyframes moveDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilos obligatorios para la animación 3D de las Flashcards */
        .flashcard-scene { perspective: 1000px; }
        .flashcard-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { backface-visibility: hidden; }
        .flashcard-back { transform: rotateY(180deg); }

        /* =====================================================================
           🚀 ANTI-COLAPSO ONESCREEN: PRESERVADO INTEGRAMENTE
           ===================================================================== */
        #modal-game-stage > div { max-width: 100% !important; width: 100% !important; }
        #modal-game-stage text, #modal-game-stage p, #modal-game-stage span, #modal-game-stage div,
        #modal-game-stage button, #modal-game-stage h4, #modal-game-stage li {
            font-weight: 800 !important;              
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif !important; 
            text-shadow: 0px 1px 2px rgba(0,0,0,0.8) !important; 
            letter-spacing: 0.02em !important; 
        }
        #modal-game-stage p.text-sm, #modal-game-stage p.text-base, #modal-game-stage .text-center p,
        #modal-game-stage .text-xl, #modal-game-stage .text-2xl, #modal-game-stage [class*="text-"] h3,
        #modal-game-stage .mb-6.bg-slate-800\/50, #modal-game-stage .text-lg.font-semibold {
            font-size: 1.75rem !important;      
            line-height: 1.5 !important;        
            height: auto !important;            
            min-height: max-content !important; 
            padding: 1.5rem !important;        
            color: #ffffff !important;         
            word-break: break-word !important;  
        }
        #modal-game-stage button.w-full.text-left, #modal-game-stage .space-y-3 button, #modal-game-stage [onclick*="selectAnswer"] {
            min-height: 75px !important;        
            height: auto !important;            
            font-size: 1.35rem !important;     
            line-height: 1.3 !important;
            padding: 1.25rem 1.75rem !important;   
            color: #ffffff !important;         
            border-radius: 0.75rem !important;    
            border: 2px solid #334155 !important; 
            margin-bottom: 0.75rem !important;  
            display: flex !important;           
            align-items: center !important;
        }
        #modal-game-stage button.w-full.text-left span:first-child, #modal-game-stage [onclick*="selectAnswer"] span {
            font-size: 1.4rem !important; margin-right: 1rem !important; flex-shrink: 0 !important;          
        }
        #modal-game-stage .grid-cols-10 > div, #modal-game-stage .grid-cols-12 > div, #modal-game-stage [class*="grid-cols"] > div[class*="aspect-square"], #modal-game-stage button[data-row][data-col] {
            min-height: auto !important; aspect-ratio: 1 / 1 !important; font-size: 1.4rem !important; padding: 0 !important; display: flex !important; align-items: center !important; justify-content: center !important; border-radius: 0.375rem !important; 
        }
        #modal-game-stage .grid-cols-4 > div[onclick], #modal-game-stage .grid-cols-3 > div[onclick], #modal-game-stage [id*="memory"] button, #modal-game-stage [id*="card"] {
            min-height: 160px !important; font-size: 1.4rem !important; padding: 1.5rem !important; color: #ffffff !important; border-radius: 1rem !important; display: flex !important; align-items: center !important; justify-content: center !important; text-align: center !important;
        }
        #modal-game-stage .grid-cols-7 > button, #modal-game-stage [id*="keyboard"] button, #modal-game-stage button[onclick*="guess"], #modal-game-stage button[onclick*="Letter"] {
            min-height: 60px !important; font-size: 1.35rem !important; padding: 0.5rem !important;
        }
        #modal-game-stage #hangman-word-slots span { font-size: 2.2rem !important; font-weight: 900 !important; color: #22c55e !important; margin: 0 0.25rem !important; }
        #modal-game-stage .relative.w-full.bg-slate-700, #modal-game-stage [id="integrity-bar"] { height: 14px !important; border-radius: 9999px !important; }
        #modal-game-stage span.text-\[10px\], #modal-game-stage div > span { font-size: 1.15rem !important; color: #f87171 !important; }
        #modal-game-stage .italic, #modal-game-stage .text-gray-600 { font-size: 1.05rem !important; color: #94a3b8 !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="app" class="h-full flex flex-col overflow-hidden">

                </button>

                    📘 Units 7-8
                </button>
                <button onclick="selectBlock('u9-10')" id="btn-u9-10" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 9-10
                </button>
                <button onclick="selectBlock('u11-12')" id="btn-u11-12" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 11-12
                </button>
                <button onclick="selectBlock('u13-14')" id="btn-u13-14" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 13-14
                </button>
                <button onclick="selectBlock('u15-16')" id="btn-u15-16" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 15-16

            </aside>

            <main class="flex-1 p-6 flex flex-col gap-6 overflow-y-auto">
                
                <div class="portal-card p-5 animate-fade-down shrink-0">
                    <span id="unit-badge" class="brand-color-bg text-white text-xs px-2.5 py-1 rounded-md font-bold uppercase shadow-sm">Units 1-2</span>

                </div>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 flex-1 items-start">
                    
                    <div class="portal-card portal-card-interactive p-6 flex flex-col justify-between h-[420px] animate-fade-up">
                        <div>
                            <div class="flex items-center gap-2 mb-4">
                                <span class="bg-amber-500/10 text-amber-500 text-xs px-2.5 py-1 rounded-md font-bold uppercase border border-amber-500/20">Warm-Up</span>
                            </div>
                            <p id="warmup-display" class="text-[var(--text-body)] text-base text-center font-medium my-12 px-4">
                                Click the button below to generate a real-world communication prompt!

                        </div>
                        <button onclick="generatePrompt()" class="w-full brand-color-button text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-comments"></i> GENERATE QUESTION

                    <div class="xl:col-span-2 portal-card p-6 h-[420px] flex flex-col animate-fade-up" style="animation-delay: 0.1s;">
                        <div class="flex items-center gap-2 mb-4 shrink-0">
                            <span class="bg-red-500/10 brand-color-text text-xs px-2.5 py-1 rounded-md font-bold uppercase border border-red-500/20">Interactive Challenges</span>
                        </div>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 flex-1 overflow-y-auto pr-1">
                            <button onclick="openGame('Flashcards')" class="bg-[#d97706] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-layer-group text-2xl"></i><span class="text-xs uppercase tracking-wide">Flashcards</span></button>
                            <button onclick="openGame('Quiz')" class="bg-[#dc2626] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-square-check text-2xl"></i><span class="text-xs uppercase tracking-wide">Quiz</span></button>
                            <button onclick="openGame('Fill Blanks')" class="bg-[#db2777] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-pen-to-square text-2xl"></i><span class="text-xs uppercase tracking-wide">Fill Blanks</span></button>
                            <button onclick="openGame('Word Search')" class="bg-[#2563eb] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-magnifying-glass text-2xl"></i><span class="text-xs uppercase tracking-wide">Word Search</span></button>
                            
                            <button onclick="openGame('Memory Match')" class="bg-[#9333ea] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-brain text-2xl"></i><span class="text-xs uppercase tracking-wide">Memory Match</span></button>
                            <button onclick="openGame('Category Sort')" class="bg-[#ca8a04] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-circle-nodes text-2xl"></i><span class="text-xs uppercase tracking-wide">Category Sort</span></button>
                            <button onclick="openGame('Hangman')" class="bg-[#c026d3] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-circle-question text-2xl"></i><span class="text-xs uppercase tracking-wide">Hangman</span></button>
                            <button onclick="openGame('Word Wheel')" class="bg-[#ea580c] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-ferris-wheel text-2xl"></i><span class="text-xs uppercase tracking-wide">Word Wheel</span></button>
                            
                            <button onclick="openGame('Tic-Tac-Toe')" class="bg-[#0d9488] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-table-cells text-2xl"></i><span class="text-xs uppercase tracking-wide">Tic-Tac-Toe</span></button>
                            <button onclick="openGame('Find Errors')" class="bg-[#e11d48] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-triangle-exclamation text-2xl"></i><span class="text-xs uppercase tracking-wide">Find Errors</span></button>
                            <button onclick="openGame('Reorder Steps')" class="bg-[#4f46e5] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-list-ol text-2xl"></i><span class="text-xs uppercase tracking-wide">Reorder Steps</span></button>
                            <button onclick="openGame('Jeopardy')" class="bg-[#16a34a] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-trophy text-2xl"></i><span class="text-xs uppercase tracking-wide">Jeopardy</span></button>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <div id="game-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-[var(--bg-card)] border-2 border-[var(--border-ui)] w-full max-w-5xl rounded-3xl p-8 shadow-2xl relative flex flex-col max-h-[92vh]">
            
            <button onclick="closeActiveGameModal()" class="absolute top-5 right-5 text-[var(--text-body)] hover:text-rose-500 text-2xl p-2 transition-all cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="flex items-center gap-4 mb-6 pb-4 border-b border-[var(--border-ui)] shrink-0">
                <span id="modal-game-badge" class="brand-color-bg text-white px-3 py-1.5 rounded-xl font-mono text-xs font-black uppercase tracking-widest shadow-sm">
                </span>
                <h3 id="modal-game-title" class="text-2xl font-mono font-black tracking-tight text-[var(--text-title)]">
                </h3>
            </div>
            
            <div id="modal-game-stage" class="flex-1 flex flex-col items-center justify-center min-h-[420px] overflow-y-auto pr-1">
            </div>
        </div>
    </div>

    <script>
        // --- THEME MANAGEMENT SYSTEM ---
        const ThemeEngine = {
            init() {
                const storedTheme = localStorage.getItem('inter_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', storedTheme);
                this.registerEvents();
            },
            registerEvents() {
                const btn = document.getElementById('themeSwitchBtn');
                if (btn) {
                    btn.addEventListener('click', () => {
                        const current = document.documentElement.getAttribute('data-theme');
                        const next = current === 'dark' ? 'light' : 'dark';
                        document.documentElement.setAttribute('data-theme', next);
                        localStorage.setItem('inter_theme', next);
                    });
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            ThemeEngine.init();
        });

        // Mock para las funciones globales de tus botones
        function selectBlock(blockId) {
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            const target = document.getElementById(`btn-${blockId}`);
            if(target) target.classList.add('active');
            console.log("Cambiando al bloque: " + blockId);
        }
        function generatePrompt() { console.log("Generando pregunta..."); }
        function openGame(gameName) {
            document.getElementById('modal-game-badge').innerText = "GAME";
            document.getElementById('modal-game-title').innerText = gameName.toUpperCase();
            document.getElementById('game-modal').classList.remove('hidden');
        }
        function closeActiveGameModal() {
            document.getElementById('game-modal').classList.add('hidden');
        }
    </script>
</body>
</html>

    <script>
        // Interceptor inteligente para limpiar y asegurar títulos al abrir juegos
        function openGame(gameType) {
            const modal = document.getElementById('game-modal');
            const badge = document.getElementById('modal-game-badge');
            const title = document.getElementById('modal-game-title');
            
            if (!modal || !badge || !title) return;

            // 1. Resetear estilos previos del badge y aplicar paleta según el juego
            badge.className = "px-3 py-1.5 rounded-xl font-mono text-xs font-black uppercase tracking-widest text-white shadow-md ";
            
            if (gameType === 'Hangman') {
                badge.classList.add('bg-purple-600');
                badge.innerText = "🚨 CORE SECURITY";
                title.innerText = "Lexical Hangman Decryption";
            } else if (gameType === 'Category Sort') {
                badge.classList.add('bg-amber-600');
                badge.innerText = "🗂️ CLASSIFIER";
                title.innerText = "Syntax Category Classifier";
            } else if (gameType === 'Memory Match') {
                badge.classList.add('bg-blue-600');
                badge.innerText = "🧠 SYNAPSE LAB";
                title.innerText = "Semantic Memory Match Arena";
            } else {
                badge.classList.add('brand-color-bg');
                badge.innerText = "🎮 CHALLENGE";
                title.innerText = gameType;
            }

            // 2. Mostrar el cascarón del modal expandido
            modal.classList.remove('hidden');

            // 3. Ejecutar de forma segura el motor del juego correspondiente
            if (gameType === 'Hangman' && typeof renderHangman === 'function') renderHangman();
            if (gameType === 'Category Sort' && typeof renderCategorySort === 'function') renderCategorySort();
            if (gameType === 'Memory Match' && typeof renderMemoryMatch === 'function') renderMemoryMatch();
            // ... añade aquí los desencadenadores de tus demás juegos ...
        }

        function closeActiveGameModal() {
            document.getElementById('game-modal').classList.add('hidden');
            // Opcional: Limpiar estados globales de los juegos al salir si es necesario
        }

        //DATA Cambia de aca en adelante dependiendo el libro, para la interfaz es arriba.
        const DATA = {
        "u1-2": {
    badge: "Units 1-2",
    title: "Personal Info, Occupations & Greetings",
    details: "Grammar: Wh-questions + statements with be (What/Where/Who/How), Yes/No questions + short answers with be, Subject pronouns + Possessive adjectives | Vocab: Occupations & Nationalities",
   
    // BANCO EXTENSO DE PROMPTS DE WARM-UP (Conversación guiada)
    prompts: [
        "What is your full name and where are you from originally?",
        "Are you a full-time student, or do you have a part-time job? Describe it.",
        "Think of your best friend. What is his or her occupation? Where is he/she right now?",
        "Introduce the classmate sitting next to you. Use subject pronouns (he/she) and possessive adjectives (his/her).",
        "Is English easy or difficult for you? Answer using a complete short answer with 'be' (e.g., Yes, it is / No, it isn't).",
        "Name five different occupations you can see in a typical hospital or school.",
        "How do you spell your last name? Practice with a partner.",
        "Imagine you are a famous celebrity. Who are you, where are you from, and what is your job?",
        "Are your parents from the same city as you? Answer using a short answer with 'be'.",
        "What is your email address and what is your phone number? Practice reading the numbers and symbols aloud."
    ],

    // VOCABULARIO EXTENSO (Para Flashcards, Word Search, Hangman, Word Wheel, Category Sort)
    vocabulary: [
        "accountant", "architect", "cashier", "chef", "doctor", "engineer", "flight attendant",

        "u15-16": {

            ],

            // REGLAS GRAMATICALES MAPEADAS (Para Fill Blanks, Find Errors, Reorder Steps, Flashcards de conceptos)
            grammarRules: [
                "Present Perfect Structure: Subject + have/has + past participle of the verb (e.g., 'I have seen that movie').",
                "Present Perfect Use: Used to describe life experiences at an indefinite time in the past.",
                "Adverb 'Ever' in Questions: Place 'ever' right before the past participle verb (e.g., 'Have you ever flown in a helicopter?').",
                "Adverb 'Never' for Negatives: Use 'never' with an affirmative verb to show zero experience (e.g., 'I have never eaten sushi').",
                "Adverb 'Already': Used to express that an action happened sooner than expected. Placed between have/has and the verb.",

                "Modals May and Might: Used to express a future possibility or uncertainty (e.g., 'It might rain later today').",
                "Modal Could for Possibility: Used to suggest realistic options or safe possibilities (e.g., 'You could take the express bus').",

        let currentBlock = "u1-2";

        let currentFlashcardIndex = 0;
        let currentQuizIndex = 0;
        let quizScore = 0;

            console.log("Portal A1 iniciado con éxito de forma segura.");
        }

        function selectBlock(blockKey) {
            currentBlock = blockKey;
            
            document.getElementById("unit-badge").innerText = DATA[blockKey].badge;
            document.getElementById("unit-title").innerText = DATA[blockKey].title;
            document.getElementById("warmup-display").innerText = "Click the button below to generate a real-world communication prompt!";

            document.querySelectorAll(".sidebar-btn").forEach(btn => {
                btn.classList.remove("active", "text-white");
                btn.classList.add("text-gray-400");
            });
            
            const activeBtn = document.getElementById(`btn-${blockKey}`);
            if (activeBtn) {
                activeBtn.classList.add("active", "text-white");
                activeBtn.classList.remove("text-gray-400");
            }

            // 🌟 EL ARREGLO MAESTRO: Forzamos a todos los juegos a vaciar su memoria caché
            // Así, la próxima vez que se abra cualquier juego, leerá obligatoriamente el nuevo 'currentBlock'

                window.quizGameState.questionsPool = [];
                window.quizGameState.currentQuestionIndex = 0;
                window.quizGameState.score = 0;
                window.quizGameState.isAnswered = false;
            }
            if (window.flashcardsGameState) {
                window.flashcardsGameState.itemsPool = [];
                window.flashcardsGameState.currentIndex = 0;
                window.flashcardsGameState.activeBlockRef = null;
            }
            if (window.fillBlanksState) {
                window.fillBlanksState.sentences = [];
                window.fillBlanksState.currentIndex = 0;
            }
            if (window.reorderGameState) {
                window.reorderGameState.itemsPool = [];
                window.reorderGameState.currentIndex = 0;
            }

            console.log(`🔄 [SaaS Sync] Unidad cambiada a: ${blockKey}. Memoria de juegos reiniciada.`);
        }

        function generatePrompt() {
            const prompts = DATA[currentBlock].prompts;
            const randomIndex = Math.floor(Math.random() * prompts.length);
            document.getElementById("warmup-display").innerText = prompts[randomIndex];
        }
       // =====================================================================
        // MOTOR DE EJECUCIÓN Y RENDERIZADO DE JUEGOS EN EL MODAL (DETECTOR TOTAL)
        // =====================================================================
        function openGame(gameName) {
            const gameType = gameName.toLowerCase().trim(); 
            
            const modal = document.getElementById("game-modal");
            const badge = document.getElementById("modal-game-badge");
            const title = document.getElementById("modal-game-title");
            const stage = document.getElementById("modal-game-stage");

            if (!stage || !modal) return; 
            
            stage.innerHTML = "";
            modal.classList.remove("hidden");

            // 🔍 DETECTOR UNIVERSAL POR ESCANEO DE TEXTO EN PANTALLA
            try {
                // Paso A: Intentar leer selectores comunes de tu app
                const anySelect = document.querySelector("select") || document.getElementById("unit-select");
                if (anySelect && anySelect.value && DATA[anySelect.value]) {
                    currentBlock = anySelect.value;
                } else {
                    // Paso B: Si falla el selector, escaneamos los textos visibles en el documento (H1, H2, Spans, Títulos)
                    const pageElements = document.querySelectorAll("h1, h2, h3, p, span, .active, .current");
                    for (let el of pageElements) {
                        const txt = el.innerText || "";
                        // Si el texto dice algo como "Unit 15" o "Unit 05"
                        if (/Unit\s*(\d+)/i.test(txt)) {
                            const match = txt.match(/Unit\s*(\d+)/i);
                            if (match && match[1]) {
                                const unitNum = parseInt(match[1]);
                                // Construimos la llave de tu base de datos (ej: "u1-2" o "unit-15" o "u15-16")
                                // Ajusta este string según cómo llamaste a las llaves en tu objeto DATA
                                const posiblesLlaves = [`unit-${unitNum}`, `u${unitNum}`, `u${unitNum}-${unitNum+1}`, `u${unitNum-1}-${unitNum}`];
                                
                                for (let llave of posiblesLlaves) {
                                    if (DATA[llave]) {
                                        currentBlock = llave;
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                console.log("Error en el radar de escaneo visual:", err);
            }

window.quizGameState = {

};

function renderQuiz() {
    const stage = document.getElementById("modal-game-stage");
    if (!stage) return;
    const state = window.quizGameState;

    // Forzar carga limpia si el pool está vacío o se reinició desde openGame
    if (state.questionsPool.length === 0 || (state.currentQuestionIndex === 0 && !state.isAnswered && state.score === 0)) {
        const activeKey = typeof currentBlock !== 'undefined' ? currentBlock : 'u1-2';
        const currentData = (typeof DATA !== 'undefined' && DATA[activeKey]) ? DATA[activeKey] : null;
        
        // Buscador flexible de colecciones en tu objeto DATA
        const rawQuestions = currentData ? (currentData.quizQuestions || currentData.questions || []) : [];

        if (rawQuestions.length === 0) {
            stage.innerHTML = `
                <div class="text-center p-6 bg-[#161b22] border border-[#30363d] rounded-2xl max-w-sm mx-auto font-mono text-xs text-gray-400">
                    ⚠️ No quiz items found for block: [${activeKey.toUpperCase()}]
                </div>
            `;
            return;
        }

        // 🕵️‍♂️ AGENTE ESPÍA EN CONSOLA
        console.log("%c=== DETECTIVE DE DATOS DEL QUIZ REPARADO ===", "color: #00ffaa; font-weight: bold;");
        console.log("Unidad activa detectada:", activeKey);

        // Mapeo inteligente con mezcla (shuffle) interna de opciones para romper el patrón de la primera opción
        state.questionsPool = rawQuestions.map(q => {
            let autoDiscoveredText = null;
            const possibleCorrect = (q.correctAnswer || q.answer || "").toString().trim().toLowerCase();

            for (let key in q) {
                if (typeof q[key] === 'string' && key !== 'correctAnswer' && key !== 'answer') {
                    const valLower = q[key].trim().toLowerCase();
                    if (valLower !== possibleCorrect) {
                        autoDiscoveredText = q[key];
                        break;
                    }
                }
            }

            const extractedQuestion = q.question || q.text || q.sentence || q.phrase || autoDiscoveredText || "Select the correct option:";
            
            // --- 🔀 ALGORITMO ANTIPATRONES: MEZCLA DE OPCIONES ---
            let rawOptions = Array.isArray(q.options) ? [...q.options] : [];
            // Mezclamos las opciones de forma interna para esta pregunta usando Fisher-Yates
            for (let i = rawOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rawOptions[i], rawOptions[j]] = [rawOptions[j], rawOptions[i]];
            }
            
            return {
                question: extractedQuestion,
                options: rawOptions, // Guardadas con un orden completamente aleatorio
                correctAnswer: q.correctAnswer || q.answer || ""
            };
        }).sort(() => 0.5 - Math.random()).slice(0, 10); // Asegura extraer el pool completo de 10 elementos
    }

    if (state.currentQuestionIndex >= state.questionsPool.length) {
        renderQuizResults();
        return;
    }

    const currentQ = state.questionsPool[state.currentQuestionIndex];
    const progressPercent = (state.currentQuestionIndex / state.questionsPool.length) * 100;

        let btnStyle = "bg-[#0d1117] border-[#30363d] hover:bg-[#1f242c] text-gray-300";

            if (isCorrect) {
                btnStyle = "bg-emerald-500/10 border-emerald-500 text-emerald-400 font-bold";
                statusIcon = `<i class="fa-solid fa-circle-check text-emerald-400 text-xs ml-auto"></i>`;

            }
        }

        optionsHtml += `
            <button onclick="evaluateQuizAnswer(${idx})" ${state.isAnswered ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-xl border text-xs flex items-center gap-3 cursor-pointer ${btnStyle}">

                <span class="truncate pr-2">${option}</span>
                ${statusIcon}
            </button>
        `;
    });

    stage.innerHTML = `
        <div class="flex flex-col gap-4 max-w-md w-full mx-auto animate-fade-in text-gray-200">
            <div class="flex items-center justify-between w-full text-[10px] font-mono text-gray-500 px-1">
                <span>QUESTION ${state.currentQuestionIndex + 1} OF ${state.questionsPool.length}</span>
                <span class="text-emerald-400 font-bold">SCORE: ${state.score} PTS</span>
            </div>
            <div class="w-full h-1.5 bg-[#161b22] rounded-full overflow-hidden border border-[#30363d]/50">
                <div class="h-full bg-gradient-to-r from-rose-500 to-amber-500 transition-all duration-300" style="width: ${progressPercent}%"></div>
            </div>
            <div class="bg-[#161b22] border border-[#30363d] rounded-2xl p-5 shadow-xl flex items-center min-h-[85px]">
                <p class="${qSizeClass}">${currentQ.question}</p>
            </div>

// 🏗️ MOTOR DE INYECCIÓN MATEMÁTICA Y COLISIONES H/V

function generateWordSearchGrid() {
    const state = window.wordSearchState;
    const size = state.gridSize;
    
    // Iniciar matriz vacía
    state.grid = Array(size).fill(null).map(() => Array(size).fill("-"));

    // Posicionar palabras en la matriz de manera aleatoria sin superposiciones erróneas
    state.wordsToFind.forEach(word => {
        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 100) {
            const direction = Math.random() > 0.5 ? "H" : "V"; 
            const row = Math.floor(Math.random() * size);
            const col = Math.floor(Math.random() * size);

            if (direction === "H" && col + word.length <= size) {
                let canPlace = true;
                for (let i = 0; i < word.length; i++) {
                    if (state.grid[row][col + i] !== "-" && state.grid[row][col + i] !== word[i]) {
                        canPlace = false;
                    }
                }
                if (canPlace) {
                    for (let i = 0; i < word.length; i++) {
                        state.grid[row][col + i] = word[i];
                    }
                    placed = true;
                }
            } else if (direction === "V" && row + word.length <= size) {
                let canPlace = true;
                for (let i = 0; i < word.length; i++) {
                    if (state.grid[row + i][col] !== "-" && state.grid[row + i][col] !== word[i]) {
                        canPlace = false;
                    }
                }
                if (canPlace) {
                    for (let i = 0; i < word.length; i++) {
                        state.grid[row + i][col] = word[i];
                    }
                    placed = true;
                }
            }
            attempts++;
        }
    });

    // Rellenar las celdas vacías de la sopa con letras aleatorias
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            if (state.grid[r][c] === "-") {
                state.grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
            }
        }
    }
}

function selectWordSearchCell(r, c) {
    const state = window.wordSearchState;
    if (!state) return;

    // Ignorar si la celda ya es parte de una palabra descubierta
    const alreadyFound = state.foundWords.some(fw => fw.coords.some(coord => coord.r === r && coord.c === c));
    if (alreadyFound) return;

    const index = state.selectedCells.findIndex(sc => sc.r === r && sc.c === c);
    if (index >= 0) {
        state.selectedCells.splice(index, 1); // Quitar selección si da doble clic
    } else {
        state.selectedCells.push({ r, c, letter: state.grid[r][c] });
    }

    // Comprobar combinaciones normales y en reversa
    const currentString = state.selectedCells.map(sc => sc.letter).join("");
    const reverseString = currentString.split("").reverse().join("");

    let matchFound = state.wordsToFind.find(w => 
        (w === currentString || w === reverseString) && !state.foundWords.some(fw => fw.word === w)
    );

    if (matchFound) {
        state.foundWords.push({
            word: matchFound,
            coords: [...state.selectedCells]
        });
        state.selectedCells = [];
    }

    renderWordSearch();
}

function clearWordSearchSelection() {

            cardsPool.push({

                pairId: index,
                text: cleanA,
                type: "concept",

                text: cleanB,

function flipMemoryCard(cardId) {
    const state = window.memoryState;
    if (!state || state.isLock || state.selectedCardIds.length >= 2) return;
    
    const card = state.cards.find(c => c.id === cardId);
    if (card.isFlipped || card.isMatched) return;

    card.isFlipped = true;
    state.selectedCardIds.push(cardId);
    renderMemoryMatch();

    if (state.selectedCardIds.length === 2) {
        state.isLock = true; 

        setTimeout(() => {
            const [id1, id2] = state.selectedCardIds;
            const c1 = state.cards.find(c => c.id === id1);
            const c2 = state.cards.find(c => c.id === id2);

            if (c1.pairId === c2.pairId && c1.type !== c2.type) {
                c1.isMatched = true;
                c2.isMatched = true;
            } else {
                c1.isFlipped = false;
                c2.isFlipped = false;
            }

            state.selectedCardIds = [];
            state.isLock = false; 
            renderMemoryMatch();
        }, 1200);
    }
}

function submitCategorySort(selectedCategory) {
    const state = window.categoryState;
    if (!state || !state.currentCard) return;

    const card = state.currentCard;

    // Verificar si la clasificación del estudiante es correcta
    if (card.category === selectedCategory) {
        state.feedback = "CORRECT";
        state.categories[selectedCategory].items.push(card);
        state.score.correct++;
    } else {
        state.feedback = "WRONG DIRECTION";
        // Si falla, devolvemos la tarjeta al final del mazo para que lo vuelvan a intentar
        state.pool.push(card);
    }

    // Remover la tarjeta procesada del frente del mazo
    state.pool.shift();
    state.currentCard = state.pool[0] || null;

    renderCategorySort();

    // Limpiar el texto flotante de feedback después de medio segundo
    setTimeout(() => {
        if (window.categoryState) {
            window.categoryState.feedback = null;
            renderCategorySort();
        }
    }, 600);
}

    if (!window.hangmanState || window.hangmanState.activeUnit !== activeKey || window.hangmanState.resetPending) {
        let wordObjects = [];

        if (currentData) {
            // Caso A: Vocabulario estructurado como objetos
            if (currentData.vocabulary && currentData.vocabulary.length > 0 && typeof currentData.vocabulary[0] === 'object') {
                currentData.vocabulary.forEach(v => {
                    let possibleWord = v.word || v.term || v.concept || "";
                    let possibleClue = v.definition || v.meaning || v.description || v.translation || "";
                    
                    if (possibleWord.trim()) {
                        wordObjects.push({
                            word: possibleWord.trim().toUpperCase(),
                            clue: possibleClue.trim()
                        });
                    }
                });
            }

            // Caso B: Vocabulario como strings planos
            if (wordObjects.length === 0 && currentData.vocabulary && currentData.vocabulary.length > 0) {
                currentData.vocabulary.forEach((v, index) => {
                    if (typeof v === 'string' && v.trim()) {
                        let uWord = v.trim().toUpperCase();

                        if (currentData.quizQuestions && currentData.quizQuestions.length > 0) {
                            let relatedQ = currentData.quizQuestions.find(q => {
                                let ans = q.answer || q.correctAnswer || "";
                                return ans.toUpperCase().trim() === uWord || q.q.toUpperCase().includes(uWord);
                            });
                            if (relatedQ) foundClue = relatedQ.q;
                        }

                        if (!foundClue && currentData.grammarRules && currentData.grammarRules[index]) {
                            foundClue = currentData.grammarRules[index];
                        }

                        if (!foundClue && currentData.prompts && currentData.prompts[index]) {

            let totalVocals = (targetWord.match(/[AEIOU]/g) || []).length;

            targetClue = `Key structural term in this block. Morphology: It has ${letterCount} letters, starts with '${firstLetter}', ends with '${lastLetter}', and contains ${totalVocals} vowels.`;

        // CONTROLADOR DE ACCIONES CON IA DEFENSIVA/OFENSIVA INTEGRADA
        function clickCellCustom(index) {
            if (!tttGameActive || tttBoard[index] !== "") return;

            // 1. Marcar la casilla del usuario (X)
            tttBoard[index] = tttCurrentTurn;

            // 2. Verificar si ganó el usuario
            if (checkPureWin(tttCurrentTurn)) {
                const winnerLabel = tttMode === "PVP" ? `Player ${tttCurrentTurn} is Victorious!` : "✓ Victory! Node layer successfully aligned.";
                endPureGame(winnerLabel, "text-teal-400");
                return;
            }

            // 3. Verificar empate
            if (!tttBoard.includes("")) {
                endPureGame("• Draw. All grid sectors are completely saturated.", "text-gray-400");
                return;
            }

            // 4. Manejo de Turnos
            if (tttMode === "PVP") {
                tttCurrentTurn = tttCurrentTurn === "X" ? "O" : "X";
                updateCustomPureTTTUI(`Player ${tttCurrentTurn} Turn. Claim an open block.`);

                tttCurrentTurn = "O";

                    // --- CEREBRO LOGÍSTICO DE LA PC ---
                    let aiChoice = null;
                    const emptyIndices = tttBoard.map((cell, idx) => cell === "" ? idx : null).filter(v => v !== null);

                    if (emptyIndices.length > 0) {
                        // REGLA 1: ¿La PC puede ganar en este movimiento? (Ofensiva)
                        for (let i of emptyIndices) {
                            tttBoard[i] = "O";
                            if (checkPureWin("O")) { aiChoice = i; tttBoard[i] = ""; break; }
                            tttBoard[i] = "";
                        }

                        // REGLA 2: ¿El usuario va a ganar en su próximo turno? ¡Bloquear! (Defensiva)
                        if (aiChoice === null) {
                            for (let i of emptyIndices) {
                                tttBoard[i] = "X";
                                if (checkPureWin("X")) { aiChoice = i; tttBoard[i] = ""; break; }
                                tttBoard[i] = "";
                            }
                        }

                        // REGLA 3: Posicionamiento táctico (Tomar el centro si está libre en 3x3)
                        if (aiChoice === null && tttSize === 3 && tttBoard[4] === "") {
                            aiChoice = 4;
                        }

                        if (aiChoice === null) {
                            aiChoice = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];

                        // Ejecutar la jugada final de la PC
                        tttBoard[aiChoice] = "O";

                        if (checkPureWin("O")) {
                            endPureGame("✗ Defeat. System routines successfully claimed the vector line.", "text-fuchsia-400");
                            return;
                        }

                        if (!tttBoard.includes("")) {
                            endPureGame("• Draw. All grid sectors are completely saturated.", "text-gray-400");
                            return;

                    // Devolver control al usuario humano

                }, 400); // Un poquitín más de delay simulando "pensamiento"
            }
        }

        // ALGORITMO COMPATIBLE CON TABLEROS VARIABLES
        function checkPureWin(player) {
            const targetLine = tttSize === 3 ? 3 : 4;

            // Filas
            for (let r = 0; r < tttSize; r++) {
                let count = 0;
                for (let c = 0; c < tttSize; c++) {
                    if (tttBoard[r * tttSize + c] === player) { count++; if (count === targetLine) return true; } else { count = 0; }
                }
            }
            // Columnas
            for (let c = 0; c < tttSize; c++) {
                let count = 0;
                for (let r = 0; r < tttSize; r++) {
                    if (tttBoard[r * tttSize + c] === player) { count++; if (count === targetLine) return true; } else { count = 0; }
                }
            }
            // Diagonales \
            for (let r = 0; r <= tttSize - targetLine; r++) {
                for (let c = 0; c <= tttSize - targetLine; c++) {
                    let match = true;
                    for (let i = 0; i < targetLine; i++) {
                        if (tttBoard[(r + i) * tttSize + (c + i)] !== player) { match = false; break; }
                    }
                    if (match) return true;
                }
            }
            // Diagonales /
            for (let r = targetLine - 1; r < tttSize; r++) {
                for (let c = 0; c <= tttSize - targetLine; c++) {
                    let match = true;
                    for (let i = 0; i < targetLine; i++) {
                        if (tttBoard[(r - i) * tttSize + (c + i)] !== player) { match = false; break; }
                    }
                    if (match) return true;
                }
            }
            return false;
        }

        // PROCESADOR DE VALIDACIÓN DE ERRORES
        function checkGrammarError() {
            const inputField = document.getElementById("fe-input");
            const feedback = document.getElementById("fe-feedback");
            if (!inputField || !feedback || !feCurrentChallenge) return;

            const userGuess = inputField.value.trim().toLowerCase();

            const targetCorrect = feCurrentChallenge.correct;

            feedback.classList.remove("hidden");

                feedback.className = "w-full py-2.5 rounded-xl font-bold text-xs bg-green-500/10 text-green-400 border border-green-500/20 leading-relaxed px-2 text-left flex items-start gap-2 animate-scale-up";

            }
        }

       // =====================================================================
        // JUEGO 11: REORDER STEPS (MONOLITO AUTOCONTENIDO A PRUEBA DE FALLOS)
        // =====================================================================
        
        // Estado del juego centralizado en un único objeto global de control
        window.reorderGameData = {
            originalWords: [],   // Frase correcta en orden
            shuffledPool: [],    // Palabras desordenadas abajo
            userSequence: [],    // Palabras puestas por el alumno arriba
            correctCount: 0,     // Meta: 10
            wrongCount: 0        // Límite: 6
        };

        function renderReorderSteps() {
            const stage = document.getElementById("modal-game-stage");
            if (!stage) return;

            // 1. Inicializar contadores si la sesión es nueva
            if (!window.reorderGameData.correctCount) window.reorderGameData.correctCount = 0;
            if (!window.reorderGameData.wrongCount) window.reorderGameData.wrongCount = 0;

            let extractedPool = [];

            // 2. Extractor seguro desde la DATA del quiz de la unidad activa
            try {
                if (typeof DATA !== 'undefined' && DATA[currentBlock]) {
                    const block = DATA[currentBlock];
                    const questions = block.quizQuestions || [];

                    questions.forEach(item => {
                        if (item && item.q && item.answer) {
                            if (item.q.includes("_______")) {
                                let fullSentence = item.q.replace("_______", item.answer);
                                
                                // Limpieza manual segura letra por letra sin RegEx peligrosas
                                let cleanStr = "";
                                const allowed = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' ";
                                for (let i = 0; i < fullSentence.length; i++) {
                                    if (allowed.includes(fullSentence[i])) cleanStr += fullSentence[i];
                                }

                                const words = cleanStr.split(" ").filter(w => w.trim().length > 0);
                                // Filtrar frases que tengan un tamaño divertido de ordenar (3 a 8 palabras)
                                if (words.length >= 3 && words.length <= 8) {
                                    extractedPool.push(words);
                                }
                            }
                        }
                    });
                }
            } catch (e) {
                console.log("Rastreador recuperado:", e);
            }

            // 3. Red de seguridad absoluta nivel A1/A2 (Garantiza que el juego jamás se quede en negro)
            if (extractedPool.length === 0) {
                extractedPool = [
                    ["I", "have", "already", "seen", "that", "movie"],
                    ["She", "has", "never", "flown", "in", "a", "helicopter"],
                    ["We", "have", "not", "finished", "our", "project", "yet"],
                    ["It", "might", "get", "very", "cold", "tonight"],
                    ["You", "could", "take", "the", "express", "bus", "tomorrow"]
                ];
            }

            // 4. Seleccionar un reto e inicializar el estado interno
            const targetSentence = extractedPool[Math.floor(Math.random() * extractedPool.length)];
            
            window.reorderGameData.originalWords = [...targetSentence];
            window.reorderGameData.userSequence = [];
            
            // Mezclar de forma segura
            window.reorderGameData.shuffledPool = [...targetSentence].sort(() => 0.5 - Math.random());
            if (JSON.stringify(window.reorderGameData.originalWords) === JSON.stringify(window.reorderGameData.shuffledPool) && targetSentence.length > 1) {
                window.reorderGameData.shuffledPool.reverse();
            }

            // 5. Renderizar directamente la interfaz
            drawReorderScreen();
        }

        // PINTOR VISUAL EMBEDIDO (Usa estrictamente el objeto global window.reorderGameData)
        function drawReorderScreen() {
            const stage = document.getElementById("modal-game-stage");
            if (!stage) return;

            const gData = window.reorderGameData;

            // Determinar layout dinámico según el tamaño de las palabras
            const isLong = gData.originalWords.some(w => w.length > 16);
            const assemblyClass = isLong ? "flex flex-col gap-2 w-full" : "flex flex-wrap justify-center gap-2 w-full";
            const poolClass = isLong ? "flex flex-col gap-2 w-full pt-3 border-t border-[#30363d]/50" : "flex flex-wrap justify-center gap-2 pt-3 border-t border-[#30363d]/50";
            const itemStyle = isLong ? "w-full text-left py-2 px-3 text-xs font-medium" : "py-1.5 px-3 text-sm text-center font-mono";

            stage.innerHTML = `
                <div class="w-full max-w-md mx-auto flex flex-col items-center gap-4 animate-fade-in">
                    
                    <!-- Marcador de Control -->
                    <div class="w-full flex justify-between items-center bg-[#161b22] px-3 py-1.5 border border-[#30363d] rounded-xl text-[10px] font-mono select-none">
                        <div class="text-indigo-400 font-bold">PROGRESS: <span class="text-white text-xs">${gData.correctCount}/10</span></div>
                        <div class="text-rose-400 font-bold">ERRORS: <span class="text-white text-xs">${gData.wrongCount}/6</span></div>
                    </div>

                    <p class="text-xs text-gray-400 text-center font-medium px-1">
                        Click the word blocks to assemble the perfect sentence structure:
                    </p>

                    <!-- Línea de Ensamblaje Superior -->
                    <div class="${assemblyClass} w-full bg-[#161b22] border border-[#30363d] rounded-2xl p-3.5 min-h-[75px] flex items-center justify-center shadow-inner">
                        ${gData.userSequence.length === 0 
                            ? `<span class="text-xs text-gray-600 italic select-none">Select tokens from below...</span>` 
                            : gData.userSequence.map((item, idx) => `
                                <button onclick="window.handleReorderAction('remove', ${idx})" class="bg-indigo-950/40 border border-indigo-500/30 hover:border-red-500/40 text-white rounded-xl cursor-pointer transition-all outline-none select-none animate-scale-up ${itemStyle}">
                                    ${isLong ? `<span class="text-indigo-400 font-bold font-mono mr-1.5">${idx + 1}.</span>` : ''}${item}
                                </button>
                            `).join('')
                        }
                    </div>

                    <!-- Banco de Palabras Inferior -->
                    <div class="${poolClass}">
                        ${gData.shuffledPool.map((item, idx) => `
                            <button onclick="window.handleReorderAction('add', ${idx})" class="bg-[#21262d] border border-[#30363d] hover:border-indigo-500 text-gray-300 rounded-xl cursor-pointer transition-all outline-none select-none ${itemStyle}">
                                ${item}
                            </button>
                        `).join('')}
                    </div>

                    <!-- Botonera Operativa Triple -->
                    <div class="grid grid-cols-3 gap-2 w-full mt-1">
                        <button onclick="window.handleReorderAction('reset')" class="bg-[#21262d] hover:bg-[#30363d] text-gray-400 font-bold py-2.5 rounded-xl text-[10px] uppercase tracking-wide border border-[#30363d] transition-all cursor-pointer">
                            Reset
                        </button>
                        <button onclick="window.handleReorderAction('skip')" class="bg-amber-600/10 hover:bg-amber-600/20 text-amber-400 font-bold py-2.5 rounded-xl text-[10px] uppercase tracking-wide border border-amber-500/20 transition-all cursor-pointer">
                            Skip
                        </button>
                        <button onclick="window.handleReorderAction('verify')" ${gData.shuffledPool.length > 0 ? 'disabled opacity-30' : ''} class="bg-indigo-600 hover:bg-indigo-700 disabled:bg-[#161b22] disabled:text-gray-600 disabled:border-[#30363d] disabled:cursor-not-allowed text-white font-bold py-2.5 rounded-xl text-[10px] uppercase tracking-wide transition-all shadow-lg cursor-pointer">
                            Verify
                        </button>
                    </div>

                    <div id="ro-feedback" class="hidden w-full py-2 rounded-xl font-bold text-xs border text-center animate-scale-up"></div>
                </div>
            `;
        }

        // CONTROLADOR GLOBAL INTERACTIVO (Evita colisiones de funciones en el Scope global)
        window.handleReorderAction = function(action, index) {
            const gData = window.reorderGameData;

            if (action === 'add') {
                gData.userSequence.push(gData.shuffledPool[index]);
                gData.shuffledPool.splice(index, 1);
                drawReorderScreen();
            } 
            else if (action === 'remove') {
                gData.shuffledPool.push(gData.userSequence[index]);
                gData.userSequence.splice(index, 1);
                drawReorderScreen();
            } 
            else if (action === 'reset') {
                gData.shuffledPool = [...gData.originalWords].sort(() => 0.5 - Math.random());
                gData.userSequence = [];
                drawReorderScreen();
            } 
            else if (action === 'skip') {
                renderReorderSteps();
            } 
            else if (action === 'verify') {
                const feedback = document.getElementById("ro-feedback");
                if (!feedback) return;

                feedback.classList.remove("hidden");
                const isCorrect = JSON.stringify(gData.originalWords) === JSON.stringify(gData.userSequence);

                if (isCorrect) {
                    gData.correctCount++;
                    
                    if (gData.correctCount >= 10) {
                        gData.correctCount = 0; gData.wrongCount = 0; // Reset definitivo
                        document.getElementById("modal-game-stage").innerHTML = `
                            <div class="text-center p-6 bg-[#161b22] border border-green-500/30 rounded-3xl max-w-sm mx-auto shadow-2xl animate-scale-up">
                                <i class="fa-solid fa-trophy text-5xl text-green-400 mb-3 animate-bounce"></i>
                                <h4 class="text-xl font-bold text-white">Grand Victory!</h4>
                                <p class="text-xs text-gray-400 mt-1 mb-5">You successfully solved 10 language sequence configurations.</p>
                                <button onclick="renderReorderSteps()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wide transition-all">New Session</button>
                            </div>
                        `;
                        return;
                    }

                    feedback.className = "w-full py-2 rounded-xl font-bold text-xs bg-green-500/10 text-green-400 border border-green-500/20";
                    feedback.innerHTML = "✓ Sequence Verified. Perfect structure!";
                    setTimeout(() => renderReorderSteps(), 1200);

                } else {
                    gData.wrongCount++;
                    
                    if (gData.wrongCount >= 6) {
                        gData.correctCount = 0; gData.wrongCount = 0; // Reset definitivo
                        document.getElementById("modal-game-stage").innerHTML = `
                            <div class="text-center p-6 bg-[#161b22] border border-rose-500/30 rounded-3xl max-w-sm mx-auto shadow-2xl animate-scale-up">
                                <i class="fa-solid fa-heart-crack text-5xl text-rose-500 mb-3 animate-pulse"></i>
                                <h4 class="text-xl font-bold text-white">Game Over</h4>
                                <p class="text-xs text-gray-400 mt-1 mb-5">System core overloaded with 6 syntax errors.</p>
                                <button onclick="renderReorderSteps()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wide transition-all">Try Again</button>
                            </div>
                        `;
                        return;
                    }

                    feedback.className = "w-full py-2 rounded-xl font-bold text-xs bg-red-500/10 text-red-400 border border-red-500/20";
                    feedback.innerHTML = `✗ Syntax Mismatch. (${gData.wrongCount}/6 Errors)`;
                }
            }
        };
        
        // =====================================================================
// JUEGO 12: JEOPARDY / MILLONARIO (SISTEMA DE PUNTOS ESCALONADO)
// =====================================================================

window.jeopardyGameState = {
    teams: [
        { id: 1, name: "Ranger Red", score: 0, color: "#ef4444", border: "#b91c1c" },
        { id: 2, name: "Ranger Blue", score: 0, color: "#3b82f6", border: "#1d4ed8" },
        { id: 3, name: "Ranger Green", score: 0, color: "#10b981", border: "#047857" },
        { id: 4, name: "Ranger Yellow", score: 0, color: "#eab308", border: "#a16207" },
        { id: 5, name: "Ranger Pink", score: 0, color: "#ec4899", border: "#be185d" },
        { id: 6, name: "Ranger Black", score: 0, color: "#6b7280", border: "#374151" }
    ],
    categories: [],
    grid: {}, // Formato: {"cat_0_100": { question, options, answer, used: false }}
    activeCard: null // Pregunta abierta actualmente
};

function renderJeopardy() {
    const stage = document.getElementById("modal-game-stage");
    if (!stage || !DATA[currentBlock]) return;

    const block = DATA[currentBlock];
    const state = window.jeopardyGameState;

    // 1. Definir 6 categorías lingüísticas basadas en el contenido real
    state.categories = [
        "Core Grammar",
        "Vocabulary Lexicon",
        "Context Structures",
        "Sentence Completion",
        "Expressions & Use",
        "Advanced Syntax"
    ];

    // 2. Extraer y clasificar preguntas por dificultad real (Longitud y complejidad)
    let allQuestions = [];
    
    // Recolectar del quiz nativo real (Evita lecturas estáticas)
    if (block.quizQuestions) {
        block.quizQuestions.forEach(q => {
            allQuestions.push({
                text: q.q || "Analyze the unit structure",
                options: q.options || ["True", "False"],
                answer: q.answer || "",
                length: (q.q || "").length
            });
        });
    }

    // ✨ COMPENSACIÓN DINÁMICA ANTI-BUCLE: Si faltan preguntas para las 30 celdas, usamos Grammar Rules reales
    if (allQuestions.length < 30) {
        const rules = block.grammarRules || [];
        
        if (rules.length > 0) {
            rules.forEach((rule) => {
                const parts = rule.split(":");
                const categoryName = parts[0] ? parts[0].trim() : "Rule Concept";
                const cleanRule = parts[1] ? parts[1].trim() : rule;
                
                allQuestions.push({
                    text: `According to ${categoryName} guidelines: What is the correct contextual layout for this rule? -> "${cleanRule}"`,
                    options: ["This statement is grammatically correct", "The structural order is inverted", "It requires a different tense/modal"],
                    answer: "This statement is grammatically correct",
                    length: cleanRule.length + 50
                });
            });
        }

        // Si aún así el pool es menor a 30, duplicamos y barajamos el pool existente de forma segura
        let securityCounter = 0;
        while (allQuestions.length < 36 && allQuestions.length > 0 && securityCounter < 50) {
            const randomExisting = allQuestions[Math.floor(Math.random() * allQuestions.length)];
            allQuestions.push({ ...randomExisting, length: randomExisting.length + Math.random() });
            securityCounter++;
        }
    }

    // Ordenar por longitud de caracteres (A más larga/compleja, simula más valor)
    allQuestions.sort((a, b) => a.length - b.length);

    // 3. Llenar la matriz de 6 Categorías x 5 Valores (100 a 500)
    const values = [100, 200, 300, 400, 500];
    state.grid = {};

    for (let c = 0; c < 6; c++) {
        values.forEach((val, vIdx) => {
            // Segmentar el pool en 5 zonas de dificultad de forma proporcional
            const chunkIndex = Math.floor((vIdx / 5) * allQuestions.length);
            const poolSlice = allQuestions.slice(chunkIndex, Math.floor(chunkIndex + (allQuestions.length / 5)) + 1);
            
            // Seleccionar pregunta aleatoria del segmento o fallback del pool general
            const selectedQ = poolSlice[Math.floor(Math.random() * poolSlice.length)] || allQuestions[Math.floor(Math.random() * allQuestions.length)];

            state.grid[`cat_${c}_${val}`] = {
                question: selectedQ.text,
                // Barajar las opciones en cada renderizado para evitar memorización de posiciones
                options: [...selectedQ.options].sort(() => 0.5 - Math.random()),
                answer: selectedQ.answer,
                value: val,
                categoryIdx: c,
                used: false
            };
        });
    }

    drawJeopardyBoard();
}

                                                    $${val}
                                                </button>

                                    }
                                }).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

// DESPLEGAR PREGUNTA INDIVIDUAL (Estilo Quién quiere ser millonario)

        <div class="w-full max-w-xl mx-auto bg-[#161b22] border border-[#30363d] p-5 rounded-3xl shadow-2xl animate-scale-up text-white">

                </span>
