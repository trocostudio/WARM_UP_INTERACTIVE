<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive English Portal - Level A1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- CSS ARCHITECTURE & RESET (ESTILO PORTAL) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        :root {
            --bg-base: #f1f5f9;
            --bg-card: #ffffff;
            --text-title: #0f172a;
            --text-body: #475569;
            --border-ui: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            
            /* Identidad Visual Exclusiva A1 */
            --accent-g: linear-gradient(135deg, #ef4444, #b91c1c);
            --accent-text: #ef4444;
        }

        [data-theme="dark"] {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --text-title: #f8fafc;
            --text-body: #94a3b8;
            --border-ui: #334155;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-body);
        }

        /* --- CONFIGURACIONES BOTÓN DE TEMA PORTAL --- */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1.5rem;
            background-color: var(--bg-card);
            border: 2px solid var(--border-ui);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            touch-action: manipulation;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* --- IDENTIDAD GRÁFICA UNIFICADA --- */
        .brand-color-text { color: var(--accent-text); }       
        .brand-color-bg { background: var(--accent-g); }     
        .brand-color-button { background: var(--accent-g); } 
        .brand-color-button:hover { filter: brightness(1.15); }
        
        .sidebar-btn.active { 
            background: var(--accent-g); 
            color: #ffffff !important; 
            border-color: transparent; 
            box-shadow: var(--shadow-lg);
        }

        /* Contenedores estilizados tipo Tarjeta Portal */
        .portal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--accent-g);
        }

        .portal-card-interactive:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        /* --- CONFIGURACIONES BOTÓN HOME --- */
        .home-btn {
            position: fixed;
            top: 1rem;
            left: 1.5rem;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 0.5rem 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.15rem;
            font-weight: 800;
            color: #94a3b8;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            touch-action: manipulation;
        }

        .home-btn:hover {
            transform: scale(1.05);
            color: #f8fafc;
            border-color: #475569;
        }
        
        @media (max-width: 640px) {
            .home-btn, .theme-toggle {
                position: absolute;
            }
        }

        /* --- ANIMACIONES DE ENTRADA --- */
        .animate-fade-down { animation: moveDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .animate-fade-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

        @keyframes moveDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilos obligatorios para la animación 3D de las Flashcards */
        .flashcard-scene { perspective: 1000px; }
        .flashcard-inner { transition: transform 0.6s; transform-style: preserve-3d; position: relative; width: 100%; height: 100%; }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { backface-visibility: hidden; position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .flashcard-back { transform: rotateY(180deg); }

        /* Anti-colapso */
        #modal-game-stage > div { max-width: 100% !important; width: 100% !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <a href="index.html" class="home-btn" aria-label="Go to home">
        <span>🏠</span> Home
    </a>

    <button class="theme-toggle" id="themeSwitchBtn" aria-label="Toggle structural theme">🌓</button>

    <div id="app" class="h-full flex flex-col overflow-hidden">

        <header class="w-full text-center py-4 bg-[var(--bg-card)] border-b border-[var(--border-ui)] shrink-0 shadow-sm z-10 relative">
            <h1 class="text-3xl font-extrabold tracking-tight text-[var(--text-title)]">
                Interactive <span class="brand-color-text">English Portal</span>
            </h1>
            <p class="text-xs text-[var(--text-body)] mt-1 uppercase tracking-widest font-semibold">A1 level - Warm-Ups & Practices</p>
        </header>

        <div class="flex flex-1 overflow-hidden">
            
            <aside class="w-64 bg-[var(--bg-card)] border-r border-[var(--border-ui)] p-4 flex flex-col gap-2 overflow-y-auto shrink-0">
                <h2 class="text-xs font-bold text-[var(--text-body)] uppercase tracking-wider mb-2 px-1">Select Unit Block:</h2>
                
                <button onclick="selectBlock('u1-2')" id="btn-u1-2" class="sidebar-btn active text-left px-4 py-3 rounded-xl text-sm font-semibold border transition-all">
                    📘 Units 1-2
                </button>
                <button onclick="selectBlock('u3-4')" id="btn-u3-4" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 3-4
                </button>
                <button onclick="selectBlock('u5-6')" id="btn-u5-6" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 5-6
                </button>
                <button onclick="selectBlock('u7-8')" id="btn-u7-8" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 7-8
                </button>
                <button onclick="selectBlock('u9-10')" id="btn-u9-10" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 9-10
                </button>
                <button onclick="selectBlock('u11-12')" id="btn-u11-12" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 11-12
                </button>
                <button onclick="selectBlock('u13-14')" id="btn-u13-14" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 13-14
                </button>
                <button onclick="selectBlock('u15-16')" id="btn-u15-16" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">
                    📘 Units 15-16
                </button>
            </aside>

            <main class="flex-1 p-6 flex flex-col gap-6 overflow-y-auto">
                
                <div class="portal-card p-5 animate-fade-down shrink-0">
                    <span id="unit-badge" class="brand-color-bg text-white text-xs px-2.5 py-1 rounded-md font-bold uppercase shadow-sm">Units 1-2</span>
                    <h2 id="unit-title" class="text-2xl font-bold text-[var(--text-title)] mt-2">Personal Info, Occupations & Greetings</h2>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 flex-1 items-start">
                    
                    <div class="portal-card portal-card-interactive p-6 flex flex-col justify-between h-[420px] animate-fade-up">
                        <div>
                            <div class="flex items-center gap-2 mb-4">
                                <span class="bg-amber-500/10 text-amber-500 text-xs px-2.5 py-1 rounded-md font-bold uppercase border border-amber-500/20">Warm-Up</span>
                            </div>
                            <p id="warmup-display" class="text-[var(--text-body)] text-base text-center font-medium my-12 px-4">
                                Click the button below to generate a real-world communication prompt!
                            </p>
                        </div>
                        <button onclick="generatePrompt()" class="w-full brand-color-button text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-comments"></i> GENERATE QUESTION
                        </button>
                    </div>

                    <div class="xl:col-span-2 portal-card p-6 h-[420px] flex flex-col animate-fade-up" style="animation-delay: 0.1s;">
                        <div class="flex items-center gap-2 mb-4 shrink-0">
                            <span class="bg-red-500/10 brand-color-text text-xs px-2.5 py-1 rounded-md font-bold uppercase border border-red-500/20">Interactive Challenges</span>
                        </div>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 flex-1 overflow-y-auto pr-1">
                            <button onclick="openGame('Flashcards')" class="bg-[#d97706] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-layer-group text-2xl"></i><span class="text-xs uppercase tracking-wide">Flashcards</span></button>
                            <button onclick="openGame('Quiz')" class="bg-[#dc2626] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-square-check text-2xl"></i><span class="text-xs uppercase tracking-wide">Quiz</span></button>
                            <button onclick="openGame('Fill Blanks')" class="bg-[#db2777] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-pen-to-square text-2xl"></i><span class="text-xs uppercase tracking-wide">Fill Blanks</span></button>
                            <button onclick="openGame('Word Search')" class="bg-[#2563eb] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-magnifying-glass text-2xl"></i><span class="text-xs uppercase tracking-wide">Word Search</span></button>
                            <button onclick="openGame('Memory Match')" class="bg-[#9333ea] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-brain text-2xl"></i><span class="text-xs uppercase tracking-wide">Memory Match</span></button>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- MODAL DE JUEGO MÁSTER -->
    <div id="game-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-[var(--bg-card)] border-2 border-[var(--border-ui)] w-full max-w-xl rounded-3xl p-6 shadow-2xl relative flex flex-col max-h-[90vh]">
            
            <button onclick="closeActiveGameModal()" class="absolute top-5 right-5 text-[var(--text-body)] hover:text-rose-500 text-2xl p-2 transition-all cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="flex items-center gap-4 mb-4 pb-3 border-b border-[var(--border-ui)] shrink-0">
                <span id="modal-game-badge" class="brand-color-bg text-white px-3 py-1 rounded-xl font-mono text-xs font-black uppercase tracking-widest shadow-sm"></span>
                <h3 id="modal-game-title" class="text-xl font-mono font-black tracking-tight text-[var(--text-title)]"></h3>
            </div>
            
            <div id="modal-game-stage" class="flex-1 flex flex-col items-center justify-center min-h-[350px] overflow-y-auto text-[var(--text-title)]">
                <!-- El contenido dinámico de los motores se renderiza aquí -->
            </div>
        </div>
    </div>

    <script>
        // --- DATA BASE COMPLETA EN INGLÉS A1 ---
        const DATA = {
            "u1-2": {
                badge: "Units 1-2",
                title: "Personal Info, Occupations & Greetings",
                prompts: [
                    "What is your full name and where are you from originally?",
                    "Are you a full-time student, or do you have a part-time job? Describe it.",
                    "Think of your best friend. What is his or her occupation? Where is he/she right now?",
                    "How do you spell your last name? Practice spelling it out loud."
                ],
                vocabulary: ["accountant", "architect", "cashier", "chef", "doctor", "engineer", "lawyer", "nurse", "pilot", "teacher"],
                grammarRules: [
                    "Subject Pronouns: I, you, he, she, it, we, they.",
                    "Possessive Adjectives: my, your, his, her, its, our, their.",
                    "Statements with Be: I am, you are, he/she/it is, we are, they are."
                ],
                quizQuestions: [
                    { q: "Where _______ your teacher from?", options: ["am", "is", "are"], answer: "is" },
                    { q: "Choose the correct adjective: 'He is a doctor. _______ name is Robert.'", options: ["His", "Her", "Your"], answer: "His" },
                    { q: "Are you and your friends from Madrid? No, _______ aren't.", options: ["we", "they", "you"], answer: "we" },
                    { q: "_______ is that man over there? - Oh, he is the new manager.", options: ["What", "Where", "Who"], answer: "Who" }
                ]
            },
            "u3-4": {
                badge: "Units 3-4",
                title: "Daily Routines, Shopping & Entertainment",
                prompts: [
                    "What time do you usually get up in the morning, and what is your first activity?",
                    "Do you prefer casual clothes like jeans and T-shirts, or formal outfits? Why?",
                    "What kind of entertainment do you like? Do you prefer going to the movies or concerts?"
                ],
                vocabulary: ["jacket", "sweater", "jeans", "pants", "dress", "suit", "sneakers", "concert", "museum", "expensive"],
                grammarRules: [
                    "Demonstratives: This/These (near), That/Those (far).",
                    "Adjective Comparison: Add '-er' to short words (cheaper, bigger).",
                    "Object Pronouns: Placed after verbs or prepositions (me, him, her, it, them)."
                ],
                quizQuestions: [
                    { q: "How much is _______ leather jacket over there on the hanger?", options: ["this", "that", "these"], answer: "that" },
                    { q: "I don't like the green socks. I prefer the white _______.", options: ["one", "ones", "it"], answer: "ones" },
                    { q: "This silk dress is _______ than the cotton one.", options: ["more expensive", "expensiver", "most expensive"], answer: "more expensive" }
                ]
            },
            "u5-6": {
                badge: "Units 5-6",
                title: "Family, Sports, Hobbies & Lifestyles",
                prompts: [
                    "What sport or exercise activity are you doing these days to stay healthy?",
                    "How often do you go to the gym, play soccer, or go running?",
                    "How well do you play video games or cook?"
                ],
                vocabulary: ["soccer", "basketball", "tennis", "swimming", "running", "always", "usually", "sometimes", "never", "mother"],
                grammarRules: [
                    "Present Continuous: Actions happening right now (Subject + be + verb-ing).",
                    "Adverbs of Frequency Position: Place them BEFORE the main verb (I always swim)."
                ],
                quizQuestions: [
                    { q: "Listen! My sister _______ the piano in her bedroom right now.", options: ["plays", "is playing", "are playing"], answer: "is playing" },
                    { q: "How _______ do you play soccer? - About twice a week.", options: ["often", "long", "well"], answer: "often" },
                    { q: "I _______ go to the gym on Sundays because it is closed.", options: ["always", "sometimes", "never"], answer: "never" }
                ]
            },
            "u7-8": {
                badge: "Units 7-8",
                title: "Vacations, Cities, Neighborhoods & Food",
                prompts: ["Where did you go on your last vacation?", "Describe your neighborhood. What places are there?"],
                vocabulary: ["vacation", "trip", "hotel", "beach", "museum", "supermarket", "restaurant", "pharmacy", "apple", "milk"],
                grammarRules: ["Simple Past with Be: Was (singular), Were (plural).", "Quantifiers: Use 'some' in affirmative and 'any' in negatives/questions."],
                quizQuestions: [
                    { q: "Where _______ you yesterday afternoon at 3:00 p.m.?", options: ["was", "were", "did"], answer: "were" },
                    { q: "Last summer, my family and I _______ to Cancun.", options: ["go", "goed", "went"], answer: "went" }
                ]
            },
            "u9-10": {
                badge: "Units 9-10",
                title: "Life Events, Geography, Weather & Future Plans",
                prompts: ["Where and when were you born?", "What are you going to do this coming weekend?"],
                vocabulary: ["born", "graduate", "mountain", "river", "desert", "sunny", "rainy", "cloudy", "tomorrow", "hotel"],
                grammarRules: ["Born in/on: 'in' for years/places, 'on' for specific dates.", "Future with Be going to: Expresses future plans or intentions."],
                quizQuestions: [
                    { q: "Where _______ you grow up when you were a child?", options: ["did", "were", "was"], answer: "did" },
                    { q: "My grandfather was born _______ October 24th, 1950.", options: ["in", "on", "at"], answer: "on" }
                ]
            },
            "u11-12": {
                badge: "Units 11-12",
                title: "Health, Body, Remedies & Food Service",
                prompts: ["What should you do when you have a terrible headache?", "How do you politely order food in a restaurant?"],
                vocabulary: ["headache", "fever", "cough", "medicine", "aspirin", "stomach", "throat", "menu", "order", "steak"],
                grammarRules: ["Modal Should: Used for giving advice.", "Possessive Pronouns: Mine, yours, his, hers, ours, theirs."],
                quizQuestions: [
                    { q: "I have a terrible toothache. - You _______ go to the dentist.", options: ["should", "shouldn't", "don't have to"], answer: "should" },
                    { q: "Is this water bottle yours? - No, it isn't _______. Mine is blue.", options: ["my", "mine", "me"], answer: "mine" }
                ]
            },
            "u13-14": {
                badge: "Units 13-14",
                title: "Agreements, Superlatives & Future Arrangements",
                prompts: ["Agree with: 'I love spicy food' using 'so' or 'too'.", "What are your definitive plans for this weekend?"],
                vocabulary: ["geography", "island", "ocean", "population", "distance", "spicy", "seafood", "neither", "either", "kilometers"],
                grammarRules: ["Agreements: So/Too for positive statements, Neither/Either for negative ones.", "How + Adjective: How far (distance), How long (length)."],
                quizQuestions: [
                    { q: "I am really looking forward to the vacation. - _______ am I!", options: ["So", "Too", "Neither"], answer: "So" },
                    { q: "I don't like eating sushi. - I don't _______.", options: ["too", "neither", "either"], answer: "either" }
                ]
            },
            "u15-16": {
                badge: "Units 15-16",
                title: "Life Experiences, Possibilities & Choices",
                prompts: ["Have you ever eaten something very unusual?", "What are your plans for tomorrow? (Use may/might if unsure)."],
                vocabulary: ["experience", "adventure", "skydiving", "ever", "never", "already", "yet", "might", "could", "recommendation"],
                grammarRules: ["Present Perfect: Subject + have/has + past participle.", "Already vs Yet: Already in affirmatives, Yet at the end of negatives/questions."],
                quizQuestions: [
                    { q: "Have you _______ ridden a camel in the desert?", options: ["ever", "never", "yet"], answer: "ever" },
                    { q: "We haven't finished our final English project _______.", options: ["already", "ever", "yet"], answer: "yet" }
                ]
            }
        };

        let currentBlock = "u1-2";

        // --- SISTEMA DE CAMBIO DE TEMA ---
        const ThemeEngine = {
            init() {
                const storedTheme = localStorage.getItem('inter_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', storedTheme);
                this.registerEvents();
            },
            registerEvents() {
                const btn = document.getElementById('themeSwitchBtn');
                if (btn) {
                    btn.addEventListener('click', () => {
                        const current = document.documentElement.getAttribute('data-theme');
                        const next = current === 'dark' ? 'light' : 'dark';
                        document.documentElement.setAttribute('data-theme', next);
                        localStorage.setItem('inter_theme', next);
                    });
                }
            }
        };
        document.addEventListener('DOMContentLoaded', () => ThemeEngine.init());

        // --- MANEJO DE SELECCIÓN DE UNIDADES ---
        function selectBlock(blockKey) {
            currentBlock = blockKey;
            document.getElementById("unit-badge").innerText = DATA[blockKey].badge;
            document.getElementById("unit-title").innerText = DATA[blockKey].title;
            document.getElementById("warmup-display").innerText = "Click the button below to generate a real-world communication prompt!";
            
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            const target = document.getElementById(`btn-${blockKey}`);
            if(target) target.classList.add('active');
        }

        function generatePrompt() {
            const prompts = DATA[currentBlock].prompts;
            const randomIndex = Math.floor(Math.random() * prompts.length);
            document.getElementById("warmup-display").innerText = prompts[randomIndex];
        }

        function closeActiveGameModal() {
            document.getElementById('game-modal').classList.add('hidden');
        }

        // =====================================================================
        // MOTORES DE JUEGOS DINÁMICOS INTEGRADOS
        // =====================================================================
        
        let flashcardIndex = 0;
        let quizIndex = 0;
        let score = 0;

        function openGame(gameName) {
            const gameType = gameName.toLowerCase().trim();
            const modal = document.getElementById("game-modal");
            const badge = document.getElementById("modal-game-badge");
            const title = document.getElementById("modal-game-title");
            const stage = document.getElementById("modal-game-stage");

            stage.innerHTML = "";
            modal.classList.remove("hidden");

            // Configurar estilos base de badges según el juego elegido
            if (gameType === "flashcards") {
                badge.className = "px-3 py-1 text-xs font-bold uppercase rounded-md text-white bg-[#d97706]";
                badge.innerText = "Flashcards";
                title.innerText = "Vocabulary & Grammar Concepts";
                flashcardIndex = 0;
                renderFlashcard();
            } else if (gameType === "quiz") {
                badge.className = "px-3 py-1 text-xs font-bold uppercase rounded-md text-white bg-[#dc2626]";
                badge.innerText = "Quiz";
                title.innerText = "Test your accuracy";
                quizIndex = 0;
                score = 0;
                renderQuiz();
            } else if (gameType === "fill blanks") {
                badge.className = "px-3 py-1 text-xs font-bold uppercase rounded-md text-white bg-[#db2777]";
                badge.innerText = "Fill Blanks";
                title.innerText = "Complete the sentences";
                quizIndex = 0;
                score = 0;
                renderFillBlanks();
            } else if (gameType === "word search") {
                badge.className = "px-3 py-1 text-xs font-bold uppercase rounded-md text-white bg-[#2563eb]";
                badge.innerText = "Word Search";
                title.innerText = "Find vocabulary terms";
                renderWordSearch();
            } else if (gameType === "memory match") {
                badge.className = "px-3 py-1 text-xs font-bold uppercase rounded-md text-white bg-[#9333ea]";
                badge.innerText = "Memory Match";
                title.innerText = "Match terms and definitions";
                renderMemoryMatch();
            }
        }

        // 1. MOTOR FLASHCARDS
        function renderFlashcard() {
            const stage = document.getElementById("modal-game-stage");
            const vocab = DATA[currentBlock].vocabulary;
            const grammar = DATA[currentBlock].grammarRules;
            const items = [
                ...vocab.map(v => ({ text: v, type: "Vocabulary" })),
                ...grammar.map(g => ({ text: g, type: "Grammar Concept" }))
            ];

            if (flashcardIndex >= items.length) flashcardIndex = 0;
            const currentItem = items[flashcardIndex];

            stage.innerHTML = `
                <div class="flex flex-col items-center gap-4 w-full max-w-sm mx-auto">
                    <div class="text-xs text-gray-400 font-mono">Card ${flashcardIndex + 1} of ${items.length}</div>
                    <div class="flashcard-scene w-full h-48 cursor-pointer" onclick="this.querySelector('.flashcard-inner').classList.toggle('flipped')">
                        <div class="flashcard-inner">
                            <div class="flashcard-front bg-[var(--bg-base)] border border-[var(--border-ui)] rounded-2xl flex flex-col justify-between p-5 text-center shadow-md">
                                <span class="text-[10px] self-center px-2 py-0.5 rounded-full font-bold bg-amber-500/10 text-amber-500 border border-amber-500/20">${currentItem.type}</span>
                                <h3 class="text-xl font-extrabold text-[var(--text-title)]">${currentItem.text}</h3>
                                <p class="text-[10px] text-gray-400 font-mono"><i class="fa-solid fa-sync"></i> Click to Flip</p>
                            </div>
                            <div class="flashcard-back bg-slate-800 border border-amber-500/30 rounded-2xl flex flex-col justify-center p-5 text-center shadow-md text-white">
                                <h4 class="text-xs font-bold text-amber-400 uppercase tracking-widest mb-2">Active Recall Challenge</h4>
                                <p class="text-sm font-medium">Use this item inside a complete, real-world English sentence out loud.</p>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 w-full">
                        <button onclick="flashcardIndex = (flashcardIndex - 1 + ${items.length}) % ${items.length}; renderFlashcard();" class="bg-[var(--bg-base)] text-[var(--text-body)] border border-[var(--border-ui)] py-2 rounded-xl text-xs font-bold uppercase"><i class="fa-solid fa-arrow-left"></i> Prev</button>
                        <button onclick="flashcardIndex = (flashcardIndex + 1) % ${items.length}; renderFlashcard();" class="bg-[var(--bg-base)] text-[var(--text-body)] border border-[var(--border-ui)] py-2 rounded-xl text-xs font-bold uppercase">Next <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            `;
        }

        // 2. MOTOR QUIZ
        function renderQuiz() {
            const stage = document.getElementById("modal-game-stage");
            const questions = DATA[currentBlock].quizQuestions;

            if (quizIndex >= questions.length) {
                stage.innerHTML = `
                    <div class="text-center p-6 flex flex-col items-center gap-3">
                        <div class="w-12 h-12 rounded-full bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-500 text-xl font-bold"><i class="fa-solid fa-trophy"></i></div>
                        <h4 class="font-bold text-lg text-[var(--text-title)]">Quiz Complete!</h4>
                        <p class="text-sm text-[var(--text-body)]">Your performance: <span class="font-bold text-emerald-500">${score} / ${questions.length * 10} points</span></p>
                        <button onclick="openGame('Quiz')" class="brand-color-button text-white text-xs font-bold px-4 py-2 rounded-lg uppercase mt-2 shadow">Retry</button>
                    </div>
                `;
                return;
            }

            const currentQ = questions[quizIndex];
            let optionsHtml = "";

            currentQ.options.forEach(opt => {
                optionsHtml += `
                    <button onclick="evaluateQuiz('${opt}', '${currentQ.answer}')" class="w-full text-left p-3 rounded-xl border border-[var(--border-ui)] bg-[var(--bg-base)] text-[var(--text-title)] font-semibold text-xs hover:bg-slate-100 dark:hover:bg-slate-700 flex justify-between items-center">
                        <span>${opt}</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-gray-400"></i>
                    </button>
                `;
            });

            stage.innerHTML = `
                <div class="flex flex-col gap-4 w-full max-w-sm mx-auto">
                    <div class="flex justify-between items-center text-xs text-gray-400 font-mono">
                        <span>QUESTION ${quizIndex + 1} OF ${questions.length}</span>
                        <span class="text-emerald-500 font-bold">SCORE: ${score}</span>
                    </div>
                    <div class="bg-[var(--bg-base)] border border-[var(--border-ui)] rounded-2xl p-4 font-bold text-sm text-[var(--text-title)] text-center shadow-sm">
                        ${currentQ.q}
                    </div>
                    <div class="flex flex-col gap-2">${optionsHtml}</div>
                </div>
            `;
        }

        function evaluateQuiz(selected, correct) {
            if (selected === correct) score += 10;
            quizIndex++;
            renderQuiz();
        }

        // 3. MOTOR FILL BLANKS
        function renderFillBlanks() {
            const stage = document.getElementById("modal-game-stage");
            const questions = DATA[currentBlock].quizQuestions;

            if (quizIndex >= questions.length) {
                stage.innerHTML = `
                    <div class="text-center p-6 flex flex-col items-center gap-3">
                        <div class="w-12 h-12 rounded-full bg-pink-500/10 border border-pink-500/20 flex items-center justify-center text-pink-500 text-xl font-bold"><i class="fa-solid fa-square-check"></i></div>
                        <h4 class="font-bold text-lg text-[var(--text-title)]">Exercises Completed!</h4>
                        <p class="text-sm text-[var(--text-body)]">Final score: <span class="font-bold text-pink-500">${score} / ${questions.length * 10} points</span></p>
                        <button onclick="openGame('Fill Blanks')" class="brand-color-button text-white text-xs font-bold px-4 py-2 rounded-lg uppercase mt-2 shadow">Retry</button>
                    </div>
                `;
                return;
            }

            const currentQ = questions[quizIndex];
            stage.innerHTML = `
                <div class="flex flex-col gap-4 w-full max-w-sm mx-auto">
                    <div class="flex justify-between items-center text-xs text-gray-400 font-mono">
                        <span>EXERCISE ${quizIndex + 1} OF ${questions.length}</span>
                        <span class="text-pink-500 font-bold">SCORE: ${score}</span>
                    </div>
                    <div class="bg-[var(--bg-base)] border border-[var(--border-ui)] rounded-2xl p-4 font-semibold text-sm text-[var(--text-title)] text-center shadow-sm">
                        ${currentQ.q}
                    </div>
                    <div class="flex flex-col gap-2">
                        <input type="text" id="blank-input" placeholder="Type the missing word..." class="w-full p-3 rounded-xl border border-[var(--border-ui)] bg-[var(--bg-card)] text-[var(--text-title)] font-bold text-sm text-center outline-none focus:border-pink-500">
                        <button onclick="checkBlank('${currentQ.answer}')" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition-all">Submit Answer</button>
                    </div>
                </div>
            `;
        }

        function checkBlank(correctAnswer) {
            const input = document.getElementById("blank-input").value.trim().toLowerCase();
            if (input === correctAnswer.toLowerCase()) {
                score += 10;
            }
            quizIndex++;
            renderFillBlanks();
        }

        // 4. MOTOR WORD SEARCH (SOPA DE LETRAS DIGITAL)
        function renderWordSearch() {
            const stage = document.getElementById("modal-game-stage");
            const vocab = DATA[currentBlock].vocabulary.slice(0, 4); // Elegir 4 palabras claves de la unidad activa
            const size = 8;
            let grid = Array(size).fill(null).map(() => Array(size).fill(''));

            // Insertar las palabras reales en la grilla
            vocab.forEach((word, index) => {
                let row = index * 2;
                for (let i = 0; i < Math.min(word.length, size); i++) {
                    grid[row][i] = word[i].toUpperCase();
                }
            });

            // Rellenar espacios vacíos aleatoriamente
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                    }
                }
            }

            let gridHtml = `<div class="grid grid-cols-8 gap-1.5 p-2 bg-[var(--bg-base)] border border-[var(--border-ui)] rounded-2xl shadow-inner max-w-[280px] mx-auto">`;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    gridHtml += `
                        <div onclick="this.classList.toggle('bg-blue-500'); this.classList.toggle('text-white');" class="aspect-square flex items-center justify-center font-mono font-black text-xs text-[var(--text-title)] bg-[var(--bg-card)] border border-[var(--border-ui)] rounded-md cursor-pointer select-none active:scale-95">
                            ${grid[r][c]}
                        </div>
                    `;
                }
            }
            gridHtml += `</div>`;

            stage.innerHTML = `
                <div class="flex flex-col gap-4 w-full">
                    <p class="text-center text-xs font-semibold text-[var(--text-body)] px-4">Find these <span class="text-blue-500 font-bold">${vocab.length} hidden words</span> from the unit grid:</p>
                    <div class="flex flex-wrap justify-center gap-2 max-w-sm mx-auto">
                        ${vocab.map(w => `<span class="bg-blue-500/10 text-blue-500 border border-blue-500/20 font-mono text-[10px] font-black uppercase px-2.5 py-0.5 rounded-md">${w}</span>`).join('')}
                    </div>
                    ${gridHtml}
                    <button onclick="openGame('Word Search')" class="mx-auto block text-[10px] font-mono font-bold uppercase text-gray-400 hover:text-[var(--text-title)] mt-1"><i class="fa-solid fa-redo"></i> Reset Board</button>
                </div>
            `;
        }

        // 5. MOTOR MEMORY MATCH (MEMORICE)
        function renderMemoryMatch() {
            const stage = document.getElementById("modal-game-stage");
            const vocab = DATA[currentBlock].vocabulary.slice(0, 4); // Tomar 4 palabras
            
            // Duplicar palabras para crear parejas
            let deck = [...vocab, ...vocab].map((word, idx) => ({
                id: idx,
                val: word,
                state: 'hidden' // hidden, flipped, matched
            })).sort(() => 0.5 - Math.random());

            let selectedCards = [];
            
            window.flipMemoryCard = function(id) {
                const card = deck.find(c => c.id === id);
                if (!card || card.state !== 'hidden' || selectedCards.length >= 2) return;

                card.state = 'flipped';
                selectedCards.push(card);
                updateMemoryView();

                if (selectedCards.length === 2) {
                    if (selectedCards[0].val === selectedCards[1].val) {
                        selectedCards[0].state = 'matched';
                        selectedCards[1].state = 'matched';
                        selectedCards = [];
                        updateMemoryView();
                    } else {
                        setTimeout(() => {
                            selectedCards[0].state = 'hidden';
                            selectedCards[1].state = 'hidden';
                            selectedCards = [];
                            updateMemoryView();
                        }, 1000);
                    }
                }
            };

            function updateMemoryView() {
                let gridHtml = `<div class="grid grid-cols-4 gap-2 w-full max-w-sm mx-auto">`;
                deck.forEach(card => {
                    if (card.state === 'matched') {
                        gridHtml += `<div class="h-16 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center font-bold text-[10px] text-emerald-500 uppercase tracking-wider text-center px-1">✓</div>`;
                    } else if (card.state === 'flipped') {
                        gridHtml += `<div class="h-16 rounded-xl bg-slate-700 border border-purple-500 text-white flex items-center justify-center font-bold text-[10px] text-center px-1 break-all uppercase tracking-tight">${card.val}</div>`;
                    } else {
                        gridHtml += `<div onclick="flipMemoryCard(${card.id})" class="h-16 rounded-xl bg-purple-600 hover:bg-purple-700 border border-purple-500 text-white flex items-center justify-center font-black font-mono text-lg cursor-pointer transition-all shadow-md active:scale-95">?</div>`;
                    }
                });
                gridHtml += `</div>`;

                const allMatched = deck.every(c => c.state === 'matched');
                stage.innerHTML = `
                    <div class="flex flex-col gap-4 w-full">
                        <p class="text-center text-xs font-semibold text-[var(--text-body)]">Match the identical vocabulary twins to win!</p>
                        ${gridHtml}
                        ${allMatched ? `
                            <div class="text-center mt-2 animate-fade-up">
                                <p class="text-xs font-bold text-emerald-500">🎉 Excellent Brain Training!</p>
                                <button onclick="openGame('Memory Match')" class="mt-2 bg-purple-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-xl uppercase shadow">Play Again</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            updateMemoryView();
        }
    </script>
</body>
</html>
