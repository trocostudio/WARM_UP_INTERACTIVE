<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive English Portal</title>

    <script src="https://unpkg.com/lucide@latest"></script>

        }

        .game-btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .game-btn:active {
            transform: translateY(4px);
            filter: brightness(0.9);

<body class="antialiased selection:bg-red-500/30 pb-12">

    <header class="w-full bg-[#1e293b]/90 backdrop-blur-md border-b border-slate-700/60 px-6 py-4 flex items-center justify-between mb-10">
        <div class="flex items-center gap-3">
            <a href="index.html" class="flex items-center gap-1.5 text-slate-300 font-bold text-sm tracking-tight hover:text-white transition-colors group">
                <span class="text-base group-hover:scale-110 transition-transform">🏡</span> 
                <span>Home</span>
            </a>
            <span class="text-slate-700 font-light">|</span>
            <span class="text-xs font-semibold text-slate-400 tracking-wide uppercase">English Interactive — Level A1</span>
        </div>
        <div></div>
    </header>

    <div id="app" class="max-w-6xl mx-auto px-4 md:px-8">
        
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-2 text-white">
                Interactive <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-rose-400 to-amber-400">English Portal</span>
            </h1>
            <p class="text-slate-400 font-bold text-xs tracking-wider uppercase">Select Learning Unit Module below to begin practicing</p>
        </header>

        <div class="mb-8 flex flex-col items-center md:items-start">
            <label for="unit-selector" class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-2">Select Unit Block:</label>
            <select id="unit-selector" onchange="switchUnit(this.value)" class="w-full md:w-80 p-4 bg-[#1e293b] border-2 border-slate-700 rounded-2xl font-black text-slate-200 shadow-md focus:outline-none focus:border-red-400 transition-all cursor-pointer">
                </select>
        </div>

        <div class="border-2 border-slate-700 rounded-3xl p-6 bg-[#1e293b] shadow-xl mb-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-red-500 to-rose-500"></div>
            
            <span id="unit-tag" class="bg-[#0f172a] text-red-400 font-black text-[10px] px-3 py-1 rounded-full uppercase tracking-widest inline-block mb-3 border border-slate-700">UNITS 1-2</span>
            <h2 id="unit-subtitle" class="text-2xl font-black text-white tracking-tight mb-1.5">Loading Title...</h2>
            <p id="unit-grammar" class="text-sm text-slate-400 font-bold leading-relaxed">Loading Grammar...</p>
            
            <div class="mt-5 bg-[#0f172a]/60 p-4 rounded-2xl border border-slate-700/40">
                <div class="flex justify-between text-xs font-black uppercase tracking-wider text-slate-400 mb-2">
                    <span>Your Progress</span>
                    <span class="text-red-400 font-black" id="progress-text">0%</span>
                </div>
                <div class="w-full bg-[#1e293b] h-3 rounded-full overflow-hidden p-[2px] border border-slate-700/40">
                    <div id="progress-bar" class="bg-gradient-to-r from-red-500 to-rose-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="md:col-span-1 bg-[#1e293b] border-2 border-slate-700 rounded-3xl p-6 text-slate-100 flex flex-col justify-between items-center text-center shadow-xl min-h-[380px] relative overflow-hidden">
                <div class="flex items-center gap-2 text-xs font-black uppercase tracking-widest text-orange-400 self-start bg-[#0f172a] px-3 py-1.5 rounded-full border border-slate-700">
                    <i data-lucide="flame" class="w-4 h-4 fill-orange-400 text-orange-400"></i> Warm-Up
                </div>
                <div class="my-6">
                    <p id="warmup-display" class="text-md font-bold text-slate-300 leading-relaxed px-2">Click the button below to generate a real-world communication prompt!</p>
                </div>
                <button onclick="generateWarmup()" class="w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 px-6 rounded-2xl shadow-lg border-b-4 border-red-800 transition-all flex items-center justify-center gap-2 cursor-pointer uppercase tracking-wider text-xs">
                    <i data-lucide="message-square" class="w-4 h-4"></i> Generate Question
                </button>
            </div>

            <div class="md:col-span-2 bg-[#1e293b] rounded-3xl p-6 border-2 border-slate-700 shadow-xl">
                <div class="flex items-center gap-2 text-xl font-black text-white tracking-tight mb-6">
                    <div class="w-9 h-9 bg-[#0f172a] text-red-400 rounded-xl flex items-center justify-center border border-slate-700">
                        <i data-lucide="gamepad-2" class="w-5 h-5 stroke-[2.5]"></i>
                    </div>
                    <span>Games & Practices</span>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    
                    <button onclick="launchGame('flashcards')" class="game-btn p-5 bg-[#e0984c] border-b-4 border-[#b5732e] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">🎴</span>
                        <span class="text-[11px] uppercase tracking-wider">Flashcards</span>
                    </button>

                    <button onclick="launchGame('quiz')" class="game-btn p-5 bg-[#db5864] border-b-4 border-[#ad3944] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">⚡</span>
                        <span class="text-[11px] uppercase tracking-wider">Kahoot Quiz</span>
                    </button>

                    <button onclick="launchGame('blanks')" class="game-btn p-5 bg-[#d4558f] border-b-4 border-[#a63366] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">✍️</span>
                        <span class="text-[11px] uppercase tracking-wider">Fill Blanks</span>
                    </button>

                    <button onclick="launchGame('words')" class="game-btn p-5 bg-[#4ea5d9] border-b-4 border-[#2f7ba8] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">🔍</span>
                        <span class="text-[11px] uppercase tracking-wider">Word Search</span>
                    </button>

                    <button onclick="launchGame('memory')" class="game-btn p-5 bg-[#8e6cd4] border-b-4 border-[#6848ab] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">🧠</span>
                        <span class="text-[11px] uppercase tracking-wider">Memory Match</span>
                    </button>

                    <button onclick="launchGame('sort')" class="game-btn p-5 bg-[#dca842] border-b-4 border-[#b08025] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">📁</span>
                        <span class="text-[11px] uppercase tracking-wider">Drag & Sort</span>
                    </button>

                    <button onclick="launchGame('hangman')" class="game-btn p-5 bg-[#cc52ab] border-b-4 border-[#a13382] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">💀</span>
                        <span class="text-[11px] uppercase tracking-wider">Hangman</span>
                    </button>

                    <button onclick="wheelGame('wheel')" class="game-btn p-5 bg-[#dd6b43] border-b-4 border-[#b34822] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">🎡</span>
                        <span class="text-[11px] uppercase tracking-wider">Wheel Game</span>
                    </button>

                    <button onclick="launchGame('tictactoe')" class="game-btn p-5 bg-[#40b0cf] border-b-4 border-[#258a9e] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">❌</span>
                        <span class="text-[11px] uppercase tracking-wider">Tic-Tac-Toe</span>
                    </button>

                </div>
            </div>

        </div>
    </div>

                    b.disabled = true;

                });
                
                const feedback = document.getElementById('quiz-feedback');
                feedback.classList.remove('hidden');
                
                if (opt === correctText) {
                    feedback.className = "p-3 rounded-xl text-xs font-bold text-center mb-4 bg-green-100 text-green-800";
                    feedback.textContent = "Correct! " + (q.e || "");

                nextBtn.classList.remove('hidden');
                nextBtn.onclick = () => { currentIdx++; render(); };

            optsContainer.appendChild(btn);
        });

    render();
}

// 4️⃣ WORD SEARCH EXPRESO - INTERACTIVO Y REPARADO
function loadWordsGame(words) {
    const body = document.getElementById('modal-game-body');
    
    // Forzar mayúsculas y limpiar la lista de palabras de la unidad
    const wordList = words && words.length > 0 ? words.map(w => w.toUpperCase()) : ["TEACHER", "DOCTOR", "SHOWER", "ENGINEER"];
    const shuffledWords = [...wordList].sort(() => Math.random() - 0.5);
    
    // Configuración exacta de la rejilla (6 filas por 8 columnas)
    const rows = 6;
    const cols = 8;
    let matrix = Array(rows).fill(null).map(() => Array(cols).fill(''));
    
    // Posicionar palabras reales de tu vocabulario en horizontal
    shuffledWords.slice(0, 3).forEach((word, wIdx) => {
        let r = Math.min(wIdx * 2, rows - 1); // Distribuye en filas alternas (0, 2, 4)
        for(let i = 0; i < Math.min(word.length, cols); i++) {
            matrix[r][i] = word[i];
        }
    });
    
    // Rellenar el resto de los espacios con letras aleatorias
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for(let r = 0; r < rows; r++) {
        for(let c = 0; c < cols; c++) {
            if(matrix[r][c] === '') {
                matrix[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
            }
        }
    }

    // Inyectar la estructura visual usando tus colores oscuros
    body.className = "w-full flex flex-col items-center gap-4 text-slate-200";
    body.innerHTML = `
        <p class="text-xs font-bold text-slate-400 text-center uppercase tracking-wide">
            Find these hidden words in the search grid:
        </p>
        
        <div class="flex flex-wrap gap-2 justify-center max-w-sm mb-1">
            ${shuffledWords.map(w => `<span class="bg-[#0f2040] text-[#bfdbfe] border border-[#1e3a8a] text-[11px] font-black px-3 py-1 rounded-full uppercase tracking-wider shadow-sm">${w}</span>`).join('')}
        </div>
        
        <div id="wordsearch-grid" class="grid grid-cols-8 gap-2 p-4 bg-[#0a1628] rounded-2xl border border-[#1e3a8a] shadow-xl max-w-sm mx-auto select-none"></div>
        
        <div id="words-feedback" class="text-xs font-black text-[#3b82f6] h-7 uppercase tracking-widest bg-[#0f2040]/40 px-4 py-1.5 rounded-full border border-[#1e3a8a]/40 flex items-center justify-center min-w-[160px]">
            Selection: None
        </div>
        
        <button id="reset-grid-btn" class="text-[10px] uppercase font-black text-slate-500 hover:text-[#3b82f6] transition-colors cursor-pointer mt-1 tracking-wider">
            🔄 Reset Grid
        </button>
    `;

    // Adjuntar evento de reinicio al botón
    document.getElementById('reset-grid-btn').onclick = () => loadWordsGame(words);

    const gridContainer = document.getElementById('wordsearch-grid');
    let activeSelection = ""; 

    // Generar físicamente los botones interactivos celda por celda
    matrix.forEach((row) => {
        row.forEach((letter) => {
            const cellBtn = document.createElement('button');
            cellBtn.type = "button";
            cellBtn.innerText = letter;
            
            // Tus estilos nativos oscuros por defecto
            cellBtn.className = "w-9 h-9 flex items-center justify-center font-black text-sm rounded-xl bg-[#0f2040] text-slate-300 border border-[#1e3a8a] shadow-md hover:bg-[#3b82f6] hover:text-white transition-all cursor-pointer active:scale-90 select-none tracking-normal";
            
            cellBtn.onclick = function() {
                // Si la celda ya tiene el fondo azul fuerte (#2563eb), se desmarca
                if (cellBtn.classList.contains('bg-[#2563eb]')) {
                    cellBtn.className = "w-9 h-9 flex items-center justify-center font-black text-sm rounded-xl bg-[#0f2040] text-slate-300 border border-[#1e3a8a] shadow-md hover:bg-[#3b82f6] hover:text-white transition-all cursor-pointer active:scale-90 select-none tracking-normal";
                    activeSelection = activeSelection.replace(letter, '');
                } else {
                    // Si no, la pintamos con tu color de acento primario fuerte (#2563eb)
                    cellBtn.className = "w-9 h-9 flex items-center justify-center font-black text-sm rounded-xl bg-[#2563eb] text-white border border-blue-400 shadow-md transition-all cursor-pointer select-none tracking-normal scale-95";
                    activeSelection += letter;
                    
                    document.getElementById('words-feedback').innerText = `Selection: ${activeSelection}`;
                    
                    // Validar si lo que ha clickeado forma una palabra válida del vocabulario
                    if (shuffledWords.includes(activeSelection)) {
                        const feedback = document.getElementById('words-feedback');
                        feedback.className = "text-xs font-black text-emerald-400 h-7 uppercase tracking-widest bg-emerald-950/50 px-4 py-1.5 rounded-full border border-emerald-500/40 flex items-center justify-center min-w-[160px]";
                        feedback.innerText = `🎉 Found: ${activeSelection}!`;
                        
                        activeSelection = ""; // Reseteamos la selección para la siguiente
                        if (typeof updateProgress === "function") updateProgress(25);
                    }
                }
            };
            gridContainer.appendChild(cellBtn);
        });
    });
}

            item.textContent = "❓";
            
            item.onclick = () => {
                if (memoryChosenCards.length >= 2 || item.classList.contains('matched') || memoryChosenCards.some(c => c.index === index)) return;
                item.textContent = card.text;
                item.className = "h-16 bg-white border-2 border-purple-600 rounded-xl flex items-center justify-center p-1 text-center font-black text-[10px] text-purple-950 shadow-sm";
                memoryChosenCards.push({ element: item, card: card, index: index });

                if (memoryChosenCards.length === 2) {
                    const [first, second] = memoryChosenCards;
                    if (first.card.pairId === second.card.pairId) {
                        first.element.classList.add('matched', 'opacity-40');
                        second.element.classList.add('matched', 'opacity-40');
                        memoryMatchesFound++;
                        memoryChosenCards = [];
                        if (memoryMatchesFound === pairs.length) {
                            setTimeout(() => {
                                body.innerHTML = `
                                    <div class="text-center py-4">
                                        <p class="text-4xl mb-2">🧠</p>
                                        <p class="text-purple-700 font-black text-xl">Perfect Memory Match!</p>
                                        <p class="text-xs text-gray-500 mt-1 mb-6">Great concentration skills.</p>
                                        <button id="memory-restart-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-6 rounded-xl text-sm shadow transition cursor-pointer">
                                            Play Again ↻
                                        </button>
                                    </div>
                                `;
                                document.getElementById('memory-restart-btn').onclick = startSetup;
                            }, 600);
                        }
                    } else {
                        setTimeout(() => {
                            first.element.textContent = "❓";
                            first.element.className = "h-16 bg-purple-100 border-2 border-purple-300 rounded-xl flex items-center justify-center p-1 text-center font-bold text-[10px] text-purple-900 cursor-pointer";
                            second.element.textContent = "❓";
                            second.element.className = "h-16 bg-purple-100 border-2 border-purple-300 rounded-xl flex items-center justify-center p-1 text-center font-bold text-[10px] text-purple-900 cursor-pointer";
                            memoryChosenCards = [];
                        }, 1000);
                    }
                }
            };
            grid.appendChild(item);
        });
    }
    startSetup();
}

                    <p class="text-xl font-black text-green-600">Sorting Complete!</p>

                    </button>
                </div>
            `;

        }

        body.innerHTML = `

            btn.textContent = catName;

                if (catIdx === currentItem.c) {
                    feedback.className = "text-center text-xs font-bold mt-4 text-green-600";

// 7️⃣ HANGMAN (AHORCADO) - REPARADO CON REINICIO DE ERRORES LIMPIO
function loadHangmanGame(items) {
    const body = document.getElementById('modal-game-body');
    let gamePool = [...items].sort(() => Math.random() - 0.5);
    let poolIdx = 0;
    let mistakes = 0; 

    function startNewMatch() {
        if (poolIdx >= gamePool.length) {
            gamePool = [...items].sort(() => Math.random() - 0.5);
            poolIdx = 0;
        }
        
        const item = gamePool[poolIdx];
        activeHangmanWord = item.w.toUpperCase();
        hangmanGuessed = [];
        mistakes = 0; 

        function render() {
            let displayWord = activeHangmanWord.split('').map(l => hangmanGuessed.includes(l) ? l : '_').join(' ');
            
            // Pantalla de Victoria
            if (!displayWord.includes('_')) {
                body.className = "w-full flex flex-col items-center justify-center text-center py-4";
                body.innerHTML = `
                    <p class="text-4xl mb-3">🎉</p>
                    <p class="text-2xl font-black text-emerald-600 animate-bounce">You Won!</p>
                    <p class="text-sm font-bold text-slate-600 mt-2 mb-6">The word was: <span class="text-indigo-950 font-black tracking-wider">${activeHangmanWord}</span></p>
                    <button id="hangman-next-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3 px-6 rounded-2xl text-xs uppercase tracking-wider shadow-md transition cursor-pointer">
                        Next Word ➔
                    </button>
                `;
                document.getElementById('hangman-next-btn').onclick = () => { poolIdx++; startNewMatch(); };
                return;
            }
            
            // Pantalla de Derrota
            if (mistakes >= 6) {
                body.className = "w-full flex flex-col items-center justify-center text-center py-4";
                body.innerHTML = `
                    <p class="text-4xl mb-3">💀</p>
                    <p class="text-2xl font-black text-red-500">Game Over</p>
                    <p class="text-sm font-bold text-slate-600 mt-2 mb-6">The word was: <span class="text-indigo-950 font-black tracking-wider">${activeHangmanWord}</span></p>
                    <button id="hangman-loss-btn" class="bg-red-500 hover:bg-red-600 text-white font-black py-3 px-6 rounded-2xl text-xs uppercase tracking-wider shadow-md transition cursor-pointer">
                        Try Another ↻
                    </button>
                `;
                document.getElementById('hangman-loss-btn').onclick = () => { poolIdx++; startNewMatch(); };
                return;
            }
            
            // Interfaz de juego activa
            body.className = "w-full flex flex-col items-center";
            body.innerHTML = `
                <p class="text-xs font-bold text-slate-500 bg-slate-50 border p-3 rounded-xl mb-4 text-center w-full border-slate-200 shadow-inner">💡 Hint: ${item.h}</p>
                <p class="text-3xl font-black tracking-widest text-indigo-950 mb-6 select-none">${displayWord}</p>
                <p class="text-xs font-black text-red-500 mb-4 uppercase tracking-wider">Mistakes: ${mistakes} / 6</p>
                <div class="grid grid-cols-7 gap-1.5 max-w-sm justify-center" id="keyboard"></div>
            `;
            
            const keyboard = document.getElementById('keyboard');
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
                const btn = document.createElement('button');
                btn.textContent = l;
                
                const hasBeenGuessed = hangmanGuessed.includes(l);
                btn.className = `w-9 h-9 text-xs font-black rounded-xl border transition-all ${hasBeenGuessed ? 'bg-slate-200 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-white hover:bg-indigo-500 hover:text-white border-slate-200 text-slate-700 cursor-pointer active:scale-95'}`;
                btn.disabled = hasBeenGuessed;
                
                btn.onclick = () => {
                    hangmanGuessed.push(l);
                    if (!activeHangmanWord.includes(l)) mistakes++;
                    render();
                };
                keyboard.appendChild(btn);
            });
        }
        render();
    }
    startNewMatch();
}

// 8️⃣ WHEEL QUESTION - ANIMACIÓN CORREGIDA (DEJA DE GIRAR AL DETENERSE)

        }, 1400);
    };
}

// 9️⃣ TIC-TAC-TOE - PEDAGÓGICO CON VOCABULARIO ACTIVO INYECTADO
function loadTicTacToeGame(words) {
    const body = document.getElementById('modal-game-body');
    body.className = "w-full flex flex-col items-center";
    let board = Array(9).fill(null);
    let isXNext = true;
    
    const fallbackList = ["Hello", "Goodbye", "Please", "Thank you", "Welcome", "Friend", "Family", "School", "English"];
    const gameWords = words && words.length >= 9 ? [...words] : fallbackList;
    const shuffledWords = gameWords.sort(() => Math.random() - 0.5);

    function render() {
        body.innerHTML = `
            <p class="text-[10px] font-bold text-slate-400 mb-4 text-center uppercase tracking-wider">Review Area: Read the word out loud to lock your sector!</p>
            <div class="grid grid-cols-3 gap-2 w-56 h-56 bg-slate-100 border border-slate-200 p-2 rounded-2xl shadow-inner animate-fade-in" id="ttt-grid"></div>
            <p class="text-xs font-black text-indigo-950 mt-5 uppercase tracking-widest bg-slate-50 border px-4 py-2 rounded-full shadow-sm" id="ttt-status">Turn: <span class="${isXNext ? 'text-blue-600':'text-rose-500'}">${isXNext ? 'Player X' : 'Player O'}</span></p>
        `;
        
        const grid = document.getElementById('ttt-grid');
        board.forEach((val, idx) => {
            const cell = document.createElement('button');
            
            if (val === 'X') {
                cell.className = "w-full h-full bg-blue-50 border-2 border-blue-400 rounded-xl flex items-center justify-center font-black text-xl text-blue-600 shadow-sm";
                cell.textContent = "X";
            } else if (val === 'O') {
                cell.className = "w-full h-full bg-rose-50 border-2 border-rose-400 rounded-xl flex items-center justify-center font-black text-xl text-rose-500 shadow-sm";
                cell.textContent = "O";
            } else {
                // Introduce el vocabulario dentro de las casillas vacías
                cell.className = "w-full h-full bg-white border border-slate-200 rounded-xl flex items-center justify-center font-black text-[9px] text-slate-600 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition-all cursor-pointer p-1 text-center uppercase select-none tracking-tight break-all";
                cell.textContent = shuffledWords[idx];
            }
            
            cell.onclick = () => {
                if (board[idx] || calculateWinner(board)) return;
                board[idx] = isXNext ? 'X' : 'O';
                isXNext = !isXNext;
                
                const winner = calculateWinner(board);
                render();
                
                if (winner) {
                    const status = document.getElementById('ttt-status');
                    status.className = "text-sm font-black text-emerald-600 mt-5 uppercase tracking-widest bg-emerald-50 border-2 border-emerald-400 px-5 py-2 rounded-full animate-bounce";
                    status.textContent = `Player ${winner} wins! 🏆`;
                    if (typeof updateProgress === "function") updateProgress(100);
                } else if (!board.includes(null)) {
                    const status = document.getElementById('ttt-status');
                    status.className = "text-sm font-black text-slate-500 mt-5 uppercase tracking-widest bg-slate-100 border px-5 py-2 rounded-full";
                    status.textContent = "Tie Game! 🤝";
                }
            };
            grid.appendChild(cell);
        });
    }
    
    function calculateWinner(squares) {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for(let i=0; i<lines.length; i++) {
            const [a,b,c] = lines[i];
            if(squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) return squares[a];
        }
        return null;
    }
    render();
}
