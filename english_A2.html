<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive English Portal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        body { 
            font-family: 'Fredoka', system-ui, -apple-system, sans-serif; 
        }

        /* Paleta Slate Oscura Premium unificada */
        html.dark body {
            background-color: #0f172a !important; /* Slate 900 exacto */
            color: #f8fafc !important; 
        }

        /* Botón de juego con efecto hundido 3D suave original */
        .game-btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .game-btn:active {
            transform: translateY(4px);
            filter: brightness(0.9);
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-500/30 pb-12">

    <header class="w-full bg-[#1e293b]/90 backdrop-blur-md border-b border-slate-700/60 px-6 py-4 flex items-center justify-between mb-10">
        <div class="flex items-center gap-3">
            <a href="index.html" class="flex items-center gap-1.5 text-slate-300 font-bold text-sm tracking-tight hover:text-white transition-colors group">
                <span class="text-base group-hover:scale-110 transition-transform">🏡</span> 
                <span>Home</span>
            </a>
            <span class="text-slate-700 font-light">|</span>
            <span class="text-xs font-semibold text-blue-400 tracking-wide uppercase">English Interactive — Level A2</span>
        </div>
        <div></div>
    </header>

    <div id="app" class="max-w-6xl mx-auto px-4 md:px-8">
        
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-2 text-white">
                Interactive <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-blue-400 to-cyan-400">English Portal</span>
            </h1>
            <p class="text-slate-400 font-bold text-xs tracking-wider uppercase">Select Learning Unit Module below to begin practicing</p>
        </header>

        <div class="mb-8 flex flex-col items-center md:items-start">
            <label for="unit-selector" class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-2">Select Unit Block:</label>
            <select id="unit-selector" onchange="switchUnit(this.value)" class="w-full md:w-80 p-4 bg-[#1e293b] border-2 border-slate-700 rounded-2xl font-black text-slate-200 shadow-md focus:outline-none focus:border-blue-400 transition-all cursor-pointer">
                </select>
        </div>

        <div class="border-2 border-slate-700 rounded-3xl p-6 bg-[#1e293b] shadow-xl mb-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-500 to-cyan-500"></div>
            
            <span id="unit-tag" class="bg-[#0f172a] text-blue-400 font-black text-[10px] px-3 py-1 rounded-full uppercase tracking-widest inline-block mb-3 border border-slate-700">UNITS 1-2</span>
            <h2 id="unit-subtitle" class="text-2xl font-black text-white tracking-tight mb-1.5">Loading Title...</h2>
            <p id="unit-grammar" class="text-sm text-slate-400 font-bold leading-relaxed">Loading Grammar...</p>
            
            <div class="mt-5 bg-[#0f172a]/60 p-4 rounded-2xl border border-slate-700/40">
                <div class="flex justify-between text-xs font-black uppercase tracking-wider text-slate-400 mb-2">
                    <span>Your Progress</span>
                    <span class="text-blue-400 font-black" id="progress-text">0%</span>
                </div>
                <div class="w-full bg-[#1e293b] h-3 rounded-full overflow-hidden p-[2px] border border-slate-700/40">
                    <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-cyan-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="md:col-span-1 bg-[#1e293b] border-2 border-slate-700 rounded-3xl p-6 text-slate-100 flex flex-col justify-between items-center text-center shadow-xl min-h-[380px] relative overflow-hidden">
                <div class="flex items-center gap-2 text-xs font-black uppercase tracking-widest text-blue-400 self-start bg-[#0f172a] px-3 py-1.5 rounded-full border border-slate-700">
                    <i data-lucide="flame" class="w-4 h-4 fill-blue-400 text-blue-400"></i> Warm-Up
                </div>
                <div class="my-6">
                    <p id="warmup-display" class="text-md font-bold text-slate-300 leading-relaxed px-2">Click the button below to generate a real-world communication prompt!</p>
                </div>
                <button onclick="generateWarmup()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 px-6 rounded-2xl shadow-lg border-b-4 border-blue-800 transition-all flex items-center justify-center gap-2 cursor-pointer uppercase tracking-wider text-xs">
                    <i data-lucide="message-square" class="w-4 h-4"></i> Generate Question
                </button>
            </div>

            <div class="md:col-span-2 bg-[#1e293b] rounded-3xl p-6 border-2 border-slate-700 shadow-xl">
                <div class="flex items-center gap-2 text-xl font-black text-white tracking-tight mb-6">
                    <div class="w-9 h-9 bg-[#0f172a] text-blue-400 rounded-xl flex items-center justify-center border border-slate-700">
                        <i data-lucide="gamepad-2" class="w-5 h-5 stroke-[2.5]"></i>
                    </div>
                    <span>Games & Practices</span>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    
                    <button onclick="launchGame('flashcards')" class="game-btn p-5 bg-[#e0984c] border-b-4 border-[#b5732e] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">🎴</span>
                        <span class="text-[11px] uppercase tracking-wider">Flashcards</span>
                    </button>

                    <button onclick="launchGame('quiz')" class="game-btn p-5 bg-[#db5864] border-b-4 border-[#ad3944] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">⚡</span>
                        <span class="text-[11px] uppercase tracking-wider">Kahoot Quiz</span>
                    </button>

                    <button onclick="launchGame('blanks')" class="game-btn p-5 bg-[#d4558f] border-b-4 border-[#a63366] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">✍️</span>
                        <span class="text-[11px] uppercase tracking-wider">Fill Blanks</span>
                    </button>

                    <button onclick="launchGame('words')" class="game-btn p-5 bg-[#4ea5d9] border-b-4 border-[#2f7ba8] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">🔍</span>
                        <span class="text-[11px] uppercase tracking-wider">Word Search</span>
                    </button>

                    <button onclick="launchGame('memory')" class="game-btn p-5 bg-[#8e6cd4] border-b-4 border-[#6848ab] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">🧠</span>
                        <span class="text-[11px] uppercase tracking-wider">Memory Match</span>
                    </button>

                    <button onclick="launchGame('sort')" class="game-btn p-5 bg-[#dca842] border-b-4 border-[#b08025] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">📁</span>
                        <span class="text-[11px] uppercase tracking-wider">Drag & Sort</span>
                    </button>

                    <button onclick="launchGame('hangman')" class="game-btn p-5 bg-[#cc52ab] border-b-4 border-[#a13382] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">💀</span>
                        <span class="text-[11px] uppercase tracking-wider">Hangman</span>
                    </button>

                    <button onclick="wheelGame('wheel')" class="game-btn p-5 bg-[#dd6b43] border-b-4 border-[#b34822] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">🎡</span>
                        <span class="text-[11px] uppercase tracking-wider">Wheel Game</span>
                    </button>

                    <button onclick="launchGame('tictactoe')" class="game-btn p-5 bg-[#40b0cf] border-b-4 border-[#258a9e] text-white font-black rounded-2xl shadow-md flex flex-col items-center justify-center gap-2 text-center cursor-pointer">
                        <span class="text-2xl">❌</span>
                        <span class="text-[11px] uppercase tracking-wider">Tic-Tac-Toe</span>
                    </button>

                </div>
            </div>

        </div>
    </div>

    <div id="game-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50 animate-fade-in">
        <div class="bg-[#1e293b] border-2 border-slate-700 rounded-3xl w-full max-w-lg p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-black text-xl cursor-pointer">✕</button>
            <div id="modal-game-body" class="mt-4"></div>
        </div>
    </div>

    "u7-8": {
    "id": "u7-8",
    "title": "UNITS 7-8",
    "subtitle": "Technology & Celebrations",
    "grammar": "Infinitives and Gerunds for uses and purposes • Imperatives and Infinitives for giving suggestions • Relative clauses of time • Adverbial clauses (when, after, before) • Clauses with because",
    "warmups": [
      "What do you use your smartphone charger for? (Practice infinitives of purpose).",
      "What is the best thing to do when you suffer a sudden computer crash?",
      "Can you describe a special celebration or holiday when your whole family gets together?",
      "What should a person do before they visit a traditional wedding or festival in your country?",
      "Why do you think hackers try to steal private data from computers? (Use 'because')",
      "What do you do online after you finish your English homework or work tasks?",
      "Is it a good idea to watch videos on your phone when it is connected to the charger?"
    ],
    "flashcards": [
      // --- Technology ---
      { "front": "Computer crash", "back": "A sudden failure where a computer stops working or its screen freezes completely." },
      { "front": "Hacker", "back": "A person who uses computers to gain unauthorized, illegal access to private data." },
      { "front": "Charger", "back": "A piece of equipment used to put electricity or power into a phone or laptop battery." },
      { "front": "Send a file", "back": "To transmit digital documents, photos, or data to another person via internet." },
      { "front": "Watch videos", "back": "The popular activity of viewing streaming digital content or movies on a device." },
      
      // --- Celebrations related ---
      { "front": "Give a gift", "back": "To hand over a present to someone during a special celebration or birthday party." },
      { "front": "Go to a festival", "back": "To visit a public celebration that usually has music, traditional food, and games." },
      { "front": "Visit relatives", "back": "The action of traveling to see your grandparents, uncles, aunts, or cousins." },
      { "front": "Holiday", "back": "A special day of celebration when most people do not have to go to work or school." }
    ],
    "quiz": [
      { 
        "q": "I use my portable charger ______ my smartphone battery when I am traveling.", 
        "o": ["for charge", "to charge", "charging", "for to charge"], 
        "a": 1, 
        "e": "We use an infinitive ('to + verb') to express the use, purpose, or reason why we use an object." 
      },
      { 
        "q": "If your computer screens freezes, ______ the power button to restart the system.", 
        "o": ["press", "to press", "pressing", "you pressed"], 
        "a": 0, 
        "e": "Use the imperative form (base verb 'press') when giving a direct suggestion or technical instruction." 
      },
      { 
        "q": "New Year's Eve is a special night ______ people stay up late and watch beautiful fireworks.", 
        "o": ["before", "after", "when", "because"], 
        "a": 2, 
        "e": "'When' is used as a relative pronoun of time to link a specific period or date to an action." 
      },
      { 
        "q": "Always save your document ______ a dangerous hacker tries to attack your system.", 
        "o": ["after", "before", "when", "then"], 
        "a": 1, 
        "e": "The time adverb 'before' indicates that the safety action needs to happen prior to the danger." 
      },
      { 
        "q": "I couldn't send you the email attachment ______ my internet connection died suddenly.", 
        "o": ["because", "when", "before", "to"], 
        "a": 0, 
        "e": "We introduce a clause that explains the cause or reason of a situation using the conjunction 'because'." 
      },
      { 
        "q": "Smartphones are great ______ text messages and taking digital photos quickly.", 
        "o": ["to send", "for sending", "send", "for to send"], 
        "a": 1, 
        "e": "We can express purpose or function by using 'for + gerund' (verb + -ing)." 
      }
    ],
    "blanks": [
      { "s": "Don't click on strange links; a dangerous _ might steal your password.", "c": "hacker" },
      { "s": "I always buy a colorful box when I want to _ to my mother.", "c": "give a gift" },
      { "s": "My phone is at 2% battery! Can I borrow your _ for twenty minutes?", "c": "charger" },
      { "s": "A wedding is a happy event _ family members dress up and dance together.", "c": "when" },
      { "s": "I lost all my unsaved school work due to a sudden _.", "c": "computer crash" },
      { "s": "We should buy the party decorations _ the guests arrive at the house.", "c": "before" }
    ],
    "words": ["CHARGER", "HACKER", "FESTIVAL", "CRASH", "VIDEOS", "CELEBRATION"],
    "memory": [

      { "a": "Computer crash", "b": "System failure where a screen freezes" },
      { "a": "To + Verb", "b": "Infinitive used to show purpose" },
      { "a": "Because", "b": "Used to give a reason" },
      { "a": "When", "b": "Relative clause for a specific time" },
      { "a": "Give a gift", "b": "Hand over a present" },
      { "a": "Visit relatives", "b": "See family members at a holiday" }
    ],
    "sort": {
      "cats": ["Technology & Uses", "Celebrations & Time"],
      "items": [
        { "t": "Computer crash", "c": 0 }, { "t": "Give a gift", "c": 1 },
        { "t": "Phone charger", "c": 0 }, { "t": "Go to a festival", "c": 1 },

        { "t": "Send a file", "c": 0 }, { "t": "Birthday party", "c": 1 },
        { "t": "To block hackers", "c": 0 }, { "t": "When midnight comes", "c": 1 }

  "u9-10": {
    "id": "u9-10",
    "title": "UNITS 9-10",
    "subtitle": "Life Choices & Personality Traits",
    "grammar": "Conditional Sentences with If Clauses (Real/Zero-First variant for A2) • Gerunds as Subjects and Objects • Short Responses (So / Too / Neither / Either) • Time Contrasts",
    "warmups": [
      "If you feel stressed after a hard day, what activities do you do to relax?",
      "Are you a creative person? What hobbies or items do you like to make?",
      "I don't like spending too much money on clothes. (Respond using 'Neither' or 'Either').",
      "Is it easy for an impatient person to work as a school teacher? Why or why not?",
      "Think about your schedule: Do you have less free time now than you did in the past?",
      "If you get in shape this year, how will your daily lifestyle change?",
      "How do you deal with a moody or critical coworker or classmate?"
    ],
    "flashcards": [
      // --- Collocations ---
      { "front": "Spend money", "back": "To use coins or bills to pay for things like services, goods, or rent." },
      { "front": "Get in shape", "back": "To improve your physical health and fitness through exercise and good nutrition." },
      { "front": "Feel stressed", "back": "Feeling worried, tense, and anxious because of difficult situations or hard work." },
      
      // --- Personality traits ---
      { "front": "Creative", "back": "Good at thinking of new ideas or producing beautiful things like art or stories." },
      { "front": "Impatient", "back": "Easily annoyed or upset because you hate waiting for things or people." },
      { "front": "Hardworking", "back": "Putting a lot of effort and dedication into your job, tasks, or studies." },
      { "front": "Moody", "back": "Changing your emotions quickly; being happy one minute and angry or sad the next." },
      { "front": "Critical", "back": "Giving negative opinions; quickly finding fault or mistakes in other people." }
    ],
    "quiz": [
      { 
        "q": "If I ______ a lot of money on expensive electronics, I won't have enough for rent.", 
        "o": ["spend", "will spend", "spent", "spending"], 
        "a": 0, 
        "e": "In first conditional structures, the clause starting with 'If' uses the Present Simple tense." 
      },
      { 
        "q": "______ daily exercise is the best way to get in shape and clear your mind.", 
        "o": ["Do", "To doing", "Doing", "Did"], 
        "a": 2, 
        "e": "When an action functions as the subject of a sentence, we must use its gerund form (verb + -ing)." 
      },
      { 
        "q": "A: 'I am feeling very stressed about the final exams.' - B: '______.'", 
        "o": ["So am I", "Neither am I", "I don't either", "So do I"], 
        "a": 0, 
        "e": "To agree with a positive statement containing the verb 'to be' ('I am'), use the short response 'So am I'." 
      },
      { 
        "q": "A: 'I don't like working with critical people.' - B: '______.'", 
        "o": ["So do I", "I don't neither", "Neither do I", "I am too"], 
        "a": 2, 
        "e": "To agree with a negative statement in the Present Simple ('I don't'), use 'Neither do I'." 
      },
      { 
        "q": "Our boss is very ______; he works twelve hours a day and never stops.", 
        "o": ["impatient", "hardworking", "moody", "critical"], 
        "a": 1, 
        "e": "'Hardworking' describes a person who dedicates immense time and energy to their professional tasks." 
      },
      { 
        "q": "In the past, I didn't care about my health, but now I try ______ every morning.", 
        "o": ["get in shape", "to get in shape", "got in shape", "for getting shape"], 
        "a": 1, 
        "e": "This shows a time contrast. The verb 'try' is typically followed by an infinitive ('to get') to show an effort." 
      }
    ],
    "blanks": [
      { "s": "If you are too _, you will hate standing in long supermarket lines.", "c": "impatient" },
      { "s": "I don't want to _ on luxurious items this month; I need to save.", "c": "spend money" },
      { "s": "She is so _; you never know if she will be smiling or shouting.", "c": "moody" },
      { "s": "My brother is incredibly _; he can paint beautiful pictures from memory.", "c": "creative" },
      { "s": "Going for a run in the evening helps me when I _ after work.", "c": "feel stressed" },
      { "s": "Please don't be so _ of my mistakes; I am still learning English.", "c": "critical" }
    ],
    "words": ["CREATIVE", "IMPATIENT", "MOODY", "STRESSED", "CRITICAL", "SHAPE"],
    "memory": [
      { "a": "Spend money", "b": "Pay for goods or services" },
      { "a": "Get in shape", "b": "Improve physical fitness" },
      { "a": "Feel stressed", "b": "Worry due to hard situations" },
      { "a": "Creative", "b": "Has original, artistic ideas" },
      { "a": "Impatient", "b": "Hates waiting for results" },
      { "a": "Hardworking", "b": "Puts great effort into work" },
      { "a": "Moody", "b": "Changes mood unpredictable" },
      { "a": "So do I", "b": "Agree with a positive action" }
    ],
    "sort": {
      "cats": ["Collocations & Choices", "Personality Traits"],
      "items": [
        { "t": "Spend money", "c": 0 }, { "t": "Creative artist", "c": 1 },
        { "t": "Get in shape", "c": 0 }, { "t": "Impatient driver", "c": 1 },
        { "t": "Feel stressed", "c": 0 }, { "t": "Hardworking student", "c": 1 },
        { "t": "Saving cash", "c": 0 }, { "t": "Moody teenager", "c": 1 },
        { "t": "Eating healthy", "c": 0 }, { "t": "Critical reviewer", "c": 1 }
      ]
    },
    "hangman": [
      { "w": "HARDWORKING", "h": "An adjective for a person who works with energy, care, and absolute commitment." },
      { "w": "IMPATIENT", "h": "The opposite of patient; someone who wants everything to happen instantly." },

    "u11-12": {
    "id": "u11-12",
    "title": "UNITS 11-12",
    "subtitle": "Global Facts & Storytelling",
    "grammar": "Passive voice with 'by' (Simple Past) • Passive voice without 'by' (Simple Present) • Past Continuous vs. Simple Past",
    "warmups": [
      "What is the main language spoken in your country? Is it used in business too?",
      "Think about your cell phone: Do you know where it was manufactured?",
      "What were you doing yesterday when it strangely started to rain?",
      "Luckily, have you ever found something valuable while you were walking on the street?",
      "What crops or food products are grown or raised in your hometown area?",
      "Tell me about a sudden interruption: Who called you while you were watching a movie last night?"
    ],
    "flashcards": [
      // --- Country facts (Nouns & Adjectives) ---
      { "front": "Currency", "back": "The official system of money, bills, and coins used by a specific nation." },
      { "front": "Language", "back": "The system of communication in speech and writing that is used by the people of a country." },
      { "front": "Food crops", "back": "Plants or agricultural products grown on a large scale for human consumption." },
      { "front": "Electronics", "back": "Microchips, computers, and digital devices that are manufactured in technological industries." },
      
      // --- Country facts (Verbs) ---
      { "front": "Grow", "back": "To cultivate plants, fruits, or vegetables from the ground for food production." },
      { "front": "Manufacture", "back": "To produce or make industrial goods or electronics in large numbers using factories." },
      { "front": "Raise", "back": "To take care of animals, like cattle or sheep, on a farm until they are fully grown." },
      { "front": "Speak", "back": "To use a particular language or vocal words to communicate with other citizens." },
      
      // --- Adverbs of Attitude ---
      { "front": "Luckily", "back": "An adverb used to indicate that something good happened because of good fortune or luck." },
      { "front": "Strangely", "back": "In an unusual, surprising, or mysterious way that is difficult to explain." },
      { "front": "Fortunately", "back": "Happening because of good luck; a synonym for luckily that introduces positive news." },
      { "front": "Unfortunately", "back": "An adverb used to introduce bad news, regrets, or an unfavorable situation." }
    ],
    "quiz": [
      { 
        "q": "Many famous electronic devices ______ in Asian factories every single day.", 
        "o": ["are manufactured", "were manufactured", "manufacture", "are manufacturing"], 
        "a": 0, 
        "e": "We use the Present Passive ('are + past participle') for general facts or regular actions happening now without focusing on who does it." 
      },
      { 
        "q": "The beautiful monument ______ by a famous architect back in 1920.", 
        "o": ["was designed", "is designed", "designed", "was designing"], 
        "a": 0, 
        "e": "For completed historical actions where we mention the agent using 'by', we use the Past Passive ('was/were + past participle')." 
      },
      { 
        "q": "While the farmers ______ the cattle, a terrible storm began completely out of nowhere.", 
        "o": ["were raising", "raised", "are raising", "was raise"], 
        "a": 0, 
        "e": "We use the Past Continuous to describe a long, ongoing action in the past that gets interrupted by another event." 
      },
      { 
        "q": "______, the car crash didn't injure anyone because everybody was wearing a seatbelt.", 
        "o": ["Fortunately", "Strangely", "Luckily than", "Badly"], 
        "a": 0, 
        "e": "'Fortunately' is an attitude adverb used at the beginning of a sentence to show a positive outcome."

// 1️⃣ FLASHCARDS - ALEATORIO
function loadFlashcardsGame(items) {
    let randomizedItems = [...items].sort(() => Math.random() - 0.5);
    let currentIdx = 0;
    const body = document.getElementById('modal-game-body');
    
    function render() {
        body.innerHTML = `
            <div onclick="this.querySelector('.card-inner').classList.toggle('[transform:rotateY(180deg)]')" class="w-64 h-40 [perspective:1000px] cursor-pointer mb-6 mx-auto">
                <div class="card-inner relative w-full h-full transition-transform duration-500 [transform-style:preserve-3d]">
                    <div class="absolute inset-0 bg-amber-50 border-2 border-amber-300 rounded-xl flex items-center justify-center p-4 [backface-visibility:hidden]">
                        <p class="text-2xl font-black text-amber-700 text-center">${randomizedItems[currentIdx].front}</p>
                    </div>
                    <div class="absolute inset-0 bg-indigo-950 border-2 border-indigo-700 rounded-xl flex items-center justify-center p-4 [transform:rotateY(180deg)] [backface-visibility:hidden]">
                        <p class="text-xl font-bold text-white text-center">${randomizedItems[currentIdx].back}</p>
                    </div>
                </div>
            </div>
            <div class="flex gap-4 w-full justify-between items-center px-4">
                <button id="prev-card" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-xl text-sm cursor-pointer">Previous</button>
                <span class="text-xs font-bold text-gray-500">${currentIdx + 1} / ${randomizedItems.length}</span>
                <button id="next-card" class="bg-red-400 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-xl text-sm cursor-pointer">Next</button>
            </div>
        `;
        document.getElementById('prev-card').disabled = currentIdx === 0;
        document.getElementById('next-card').disabled = currentIdx === randomizedItems.length - 1;
        document.getElementById('prev-card').onclick = () => { currentIdx--; render(); };
        document.getElementById('next-card').onclick = () => { currentIdx++; render(); };
    }
    render();
}

// 2️⃣ KAHOOT QUIZ - PREGUNTAS Y BOTONES ALEATORIOS
function loadQuizGame(questions) {

// 4️⃣ WORD SEARCH EXPRESO - INTERACTIVO Y REPARADO
function loadWordsGame(words) {
    const body = document.getElementById('modal-game-body');
    
    // Forzar mayúsculas y limpiar la lista de palabras de la unidad
    const wordList = words && words.length > 0 ? words.map(w => w.toUpperCase()) : ["TEACHER", "DOCTOR", "SHOWER", "ENGINEER"];
    const shuffledWords = [...wordList].sort(() => Math.random() - 0.5);
    
    // Configuración exacta de la rejilla (6 filas por 8 columnas)
    const rows = 6;
    const cols = 8;
    let matrix = Array(rows).fill(null).map(() => Array(cols).fill(''));
    
    // Posicionar palabras reales de tu vocabulario en horizontal
    shuffledWords.slice(0, 3).forEach((word, wIdx) => {
        let r = Math.min(wIdx * 2, rows - 1); // Distribuye en filas alternas (0, 2, 4)
        for(let i = 0; i < Math.min(word.length, cols); i++) {
            matrix[r][i] = word[i];
        }
    });
    
    // Rellenar el resto de los espacios con letras aleatorias
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for(let r = 0; r < rows; r++) {
        for(let c = 0; c < cols; c++) {
            if(matrix[r][c] === '') {
                matrix[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
            }
        }
    }

    // Inyectar la estructura visual usando tus colores oscuros
    body.className = "w-full flex flex-col items-center gap-4 text-slate-200";
    body.innerHTML = `
        <p class="text-xs font-bold text-slate-400 text-center uppercase tracking-wide">
            Find these hidden words in the search grid:
        </p>
        
        <div class="flex flex-wrap gap-2 justify-center max-w-sm mb-1">
            ${shuffledWords.map(w => `<span class="bg-[#0f2040] text-[#bfdbfe] border border-[#1e3a8a] text-[11px] font-black px-3 py-1 rounded-full uppercase tracking-wider shadow-sm">${w}</span>`).join('')}
        </div>
        
        <div id="wordsearch-grid" class="grid grid-cols-8 gap-2 p-4 bg-[#0a1628] rounded-2xl border border-[#1e3a8a] shadow-xl max-w-sm mx-auto select-none"></div>
        
        <div id="words-feedback" class="text-xs font-black text-[#3b82f6] h-7 uppercase tracking-widest bg-[#0f2040]/40 px-4 py-1.5 rounded-full border border-[#1e3a8a]/40 flex items-center justify-center min-w-[160px]">
            Selection: None
        </div>
        
        <button id="reset-grid-btn" class="text-[10px] uppercase font-black text-slate-500 hover:text-[#3b82f6] transition-colors cursor-pointer mt-1 tracking-wider">
            🔄 Reset Grid
        </button>
    `;

    // Adjuntar evento de reinicio al botón
    document.getElementById('reset-grid-btn').onclick = () => loadWordsGame(words);

    const gridContainer = document.getElementById('wordsearch-grid');
    let activeSelection = ""; 

    // Generar físicamente los botones interactivos celda por celda
    matrix.forEach((row) => {
        row.forEach((letter) => {
            const cellBtn = document.createElement('button');
            cellBtn.type = "button";
            cellBtn.innerText = letter;
            
            // Tus estilos nativos oscuros por defecto
            cellBtn.className = "w-9 h-9 flex items-center justify-center font-black text-sm rounded-xl bg-[#0f2040] text-slate-300 border border-[#1e3a8a] shadow-md hover:bg-[#3b82f6] hover:text-white transition-all cursor-pointer active:scale-90 select-none tracking-normal";
            
            cellBtn.onclick = function() {
                // Si la celda ya tiene el fondo azul fuerte (#2563eb), se desmarca
                if (cellBtn.classList.contains('bg-[#2563eb]')) {
                    cellBtn.className = "w-9 h-9 flex items-center justify-center font-black text-sm rounded-xl bg-[#0f2040] text-slate-300 border border-[#1e3a8a] shadow-md hover:bg-[#3b82f6] hover:text-white transition-all cursor-pointer active:scale-90 select-none tracking-normal";
                    activeSelection = activeSelection.replace(letter, '');
                } else {
                    // Si no, la pintamos con tu color de acento primario fuerte (#2563eb)
                    cellBtn.className = "w-9 h-9 flex items-center justify-center font-black text-sm rounded-xl bg-[#2563eb] text-white border border-blue-400 shadow-md transition-all cursor-pointer select-none tracking-normal scale-95";
                    activeSelection += letter;
                    
                    document.getElementById('words-feedback').innerText = `Selection: ${activeSelection}`;
                    
                    // Validar si lo que ha clickeado forma una palabra válida del vocabulario
                    if (shuffledWords.includes(activeSelection)) {
                        const feedback = document.getElementById('words-feedback');
                        feedback.className = "text-xs font-black text-emerald-400 h-7 uppercase tracking-widest bg-emerald-950/50 px-4 py-1.5 rounded-full border border-emerald-500/40 flex items-center justify-center min-w-[160px]";
                        feedback.innerText = `🎉 Found: ${activeSelection}!`;
                        
                        activeSelection = ""; // Reseteamos la selección para la siguiente
                        if (typeof updateProgress === "function") updateProgress(25);
                    }
                }
            };
            gridContainer.appendChild(cellBtn);
        });
    });
}

// 5️⃣ MEMORY MATCH - REINICIABLE Y MEZCLADO
function loadMemoryGame(pairs) {
    const body = document.getElementById('modal-game-body');
    
    function startSetup() {
        body.className = "w-full flex flex-col items-center";
        memoryChosenCards = [];
        memoryMatchesFound = 0;
        
        let cards = [];
        pairs.forEach((p, idx) => {
            cards.push({ text: p.a, pairId: idx, type: 'a' });
            cards.push({ text: p.b, pairId: idx, type: 'b' });
        });
        cards.sort(() => Math.random() - 0.5);

        body.innerHTML = `<div class="grid grid-cols-4 gap-2 w-full max-w-sm mb-2" id="memory-grid"></div>`;
        const grid = document.getElementById('memory-grid');

        cards.forEach((card, index) => {
            const item = document.createElement('button');
            item.dataset.index = index;
            item.className = "h-16 bg-purple-100 hover:bg-purple-200 border-2 border-purple-300 rounded-xl flex items-center justify-center p-1 text-center font-bold text-[10px] text-purple-900 transition cursor-pointer select-none";
            item.textContent = "❓";
            
            item.onclick = () => {
                if (memoryChosenCards.length >= 2 || item.classList.contains('matched') || memoryChosenCards.some(c => c.index === index)) return;
                item.textContent = card.text;
                item.className = "h-16 bg-white border-2 border-purple-600 rounded-xl flex items-center justify-center p-1 text-center font-black text-[10px] text-purple-950 shadow-sm";
                memoryChosenCards.push({ element: item, card: card, index: index });

                if (memoryChosenCards.length === 2) {
                    const [first, second] = memoryChosenCards;
                    if (first.card.pairId === second.card.pairId) {
                        first.element.classList.add('matched', 'opacity-40');
                        second.element.classList.add('matched', 'opacity-40');
                        memoryMatchesFound++;
                        memoryChosenCards = [];
                        if (memoryMatchesFound === pairs.length) {
                            setTimeout(() => {
                                body.innerHTML = `
                                    <div class="text-center py-4">
                                        <p class="text-4xl mb-2">🧠</p>
                                        <p class="text-purple-700 font-black text-xl">Perfect Memory Match!</p>
                                        <p class="text-xs text-gray-500 mt-1 mb-6">Great concentration skills.</p>
                                        <button id="memory-restart-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-6 rounded-xl text-sm shadow transition cursor-pointer">
                                            Play Again ↻
                                        </button>
                                    </div>
                                `;
                                document.getElementById('memory-restart-btn').onclick = startSetup;
                            }, 600);
                        }
                    } else {
                        setTimeout(() => {
                            first.element.textContent = "❓";
                            first.element.className = "h-16 bg-purple-100 border-2 border-purple-300 rounded-xl flex items-center justify-center p-1 text-center font-bold text-[10px] text-purple-900 cursor-pointer";
                            second.element.textContent = "❓";
                            second.element.className = "h-16 bg-purple-100 border-2 border-purple-300 rounded-xl flex items-center justify-center p-1 text-center font-bold text-[10px] text-purple-900 cursor-pointer";
                            memoryChosenCards = [];
                        }, 1000);
                    }
                }
            };
            grid.appendChild(item);
        });
    }
    startSetup();
}

// 7️⃣ HANGMAN (AHORCADO) - REPARADO CON REINICIO DE ERRORES LIMPIO
function loadHangmanGame(items) {
    const body = document.getElementById('modal-game-body');
    let gamePool = [...items].sort(() => Math.random() - 0.5);
    let poolIdx = 0;
    let mistakes = 0; 

    function startNewMatch() {
        if (poolIdx >= gamePool.length) {
            gamePool = [...items].sort(() => Math.random() - 0.5);
            poolIdx = 0;
        }
        
        const item = gamePool[poolIdx];
        activeHangmanWord = item.w.toUpperCase();
        hangmanGuessed = [];
        mistakes = 0; 

        function render() {
            let displayWord = activeHangmanWord.split('').map(l => hangmanGuessed.includes(l) ? l : '_').join(' ');
            
            // Pantalla de Victoria
            if (!displayWord.includes('_')) {
                body.className = "w-full flex flex-col items-center justify-center text-center py-4";
                body.innerHTML = `
                    <p class="text-4xl mb-3">🎉</p>
                    <p class="text-2xl font-black text-emerald-600 animate-bounce">You Won!</p>
                    <p class="text-sm font-bold text-slate-600 mt-2 mb-6">The word was: <span class="text-indigo-950 font-black tracking-wider">${activeHangmanWord}</span></p>
                    <button id="hangman-next-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3 px-6 rounded-2xl text-xs uppercase tracking-wider shadow-md transition cursor-pointer">
                        Next Word ➔
                    </button>
                `;
                document.getElementById('hangman-next-btn').onclick = () => { poolIdx++; startNewMatch(); };
                return;
            }
            
            // Pantalla de Derrota
            if (mistakes >= 6) {
                body.className = "w-full flex flex-col items-center justify-center text-center py-4";
                body.innerHTML = `
                    <p class="text-4xl mb-3">💀</p>
                    <p class="text-2xl font-black text-red-500">Game Over</p>
                    <p class="text-sm font-bold text-slate-600 mt-2 mb-6">The word was: <span class="text-indigo-950 font-black tracking-wider">${activeHangmanWord}</span></p>
                    <button id="hangman-loss-btn" class="bg-red-500 hover:bg-red-600 text-white font-black py-3 px-6 rounded-2xl text-xs uppercase tracking-wider shadow-md transition cursor-pointer">
                        Try Another ↻
                    </button>
                `;
                document.getElementById('hangman-loss-btn').onclick = () => { poolIdx++; startNewMatch(); };
                return;
            }
            
            // Interfaz de juego activa
            body.className = "w-full flex flex-col items-center";
            body.innerHTML = `
                <p class="text-xs font-bold text-slate-500 bg-slate-50 border p-3 rounded-xl mb-4 text-center w-full border-slate-200 shadow-inner">💡 Hint: ${item.h}</p>
                <p class="text-3xl font-black tracking-widest text-indigo-950 mb-6 select-none">${displayWord}</p>
                <p class="text-xs font-black text-red-500 mb-4 uppercase tracking-wider">Mistakes: ${mistakes} / 6</p>
                <div class="grid grid-cols-7 gap-1.5 max-w-sm justify-center" id="keyboard"></div>
            `;
            
            const keyboard = document.getElementById('keyboard');
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
                const btn = document.createElement('button');
                btn.textContent = l;
                
                const hasBeenGuessed = hangmanGuessed.includes(l);
                btn.className = `w-9 h-9 text-xs font-black rounded-xl border transition-all ${hasBeenGuessed ? 'bg-slate-200 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-white hover:bg-indigo-500 hover:text-white border-slate-200 text-slate-700 cursor-pointer active:scale-95'}`;
                btn.disabled = hasBeenGuessed;
                
                btn.onclick = () => {
                    hangmanGuessed.push(l);
                    if (!activeHangmanWord.includes(l)) mistakes++;
                    render();
                };
                keyboard.appendChild(btn);
            });
        }
        render();
    }
    startNewMatch();
}

// 9️⃣ TIC-TAC-TOE - PEDAGÓGICO CON VOCABULARIO ACTIVO INYECTADO
function loadTicTacToeGame(words) {
    const body = document.getElementById('modal-game-body');
    body.className = "w-full flex flex-col items-center";
    let board = Array(9).fill(null);
    let isXNext = true;
    
    const fallbackList = ["Hello", "Goodbye", "Please", "Thank you", "Welcome", "Friend", "Family", "School", "English"];
    const gameWords = words && words.length >= 9 ? [...words] : fallbackList;
    const shuffledWords = gameWords.sort(() => Math.random() - 0.5);

    function render() {
        body.innerHTML = `
            <p class="text-[10px] font-bold text-slate-400 mb-4 text-center uppercase tracking-wider">Review Area: Read the word out loud to lock your sector!</p>
            <div class="grid grid-cols-3 gap-2 w-56 h-56 bg-slate-100 border border-slate-200 p-2 rounded-2xl shadow-inner animate-fade-in" id="ttt-grid"></div>
            <p class="text-xs font-black text-indigo-950 mt-5 uppercase tracking-widest bg-slate-50 border px-4 py-2 rounded-full shadow-sm" id="ttt-status">Turn: <span class="${isXNext ? 'text-blue-600':'text-rose-500'}">${isXNext ? 'Player X' : 'Player O'}</span></p>
        `;
        
        const grid = document.getElementById('ttt-grid');
        board.forEach((val, idx) => {
            const cell = document.createElement('button');
            
            if (val === 'X') {
                cell.className = "w-full h-full bg-blue-50 border-2 border-blue-400 rounded-xl flex items-center justify-center font-black text-xl text-blue-600 shadow-sm";
                cell.textContent = "X";
            } else if (val === 'O') {
                cell.className = "w-full h-full bg-rose-50 border-2 border-rose-400 rounded-xl flex items-center justify-center font-black text-xl text-rose-500 shadow-sm";
                cell.textContent = "O";
            } else {
                // Introduce el vocabulario dentro de las casillas vacías
                cell.className = "w-full h-full bg-white border border-slate-200 rounded-xl flex items-center justify-center font-black text-[9px] text-slate-600 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition-all cursor-pointer p-1 text-center uppercase select-none tracking-tight break-all";
                cell.textContent = shuffledWords[idx];
            }
            
            cell.onclick = () => {
                if (board[idx] || calculateWinner(board)) return;
                board[idx] = isXNext ? 'X' : 'O';
                isXNext = !isXNext;
                
                const winner = calculateWinner(board);
                render();
                
                if (winner) {
                    const status = document.getElementById('ttt-status');
                    status.className = "text-sm font-black text-emerald-600 mt-5 uppercase tracking-widest bg-emerald-50 border-2 border-emerald-400 px-5 py-2 rounded-full animate-bounce";
                    status.textContent = `Player ${winner} wins! 🏆`;
                    if (typeof updateProgress === "function") updateProgress(100);
                } else if (!board.includes(null)) {
                    const status = document.getElementById('ttt-status');
                    status.className = "text-sm font-black text-slate-500 mt-5 uppercase tracking-widest bg-slate-100 border px-5 py-2 rounded-full";
                    status.textContent = "Tie Game! 🤝";
                }
            };
            grid.appendChild(cell);
        });
    }
    
    function calculateWinner(squares) {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for(let i=0; i<lines.length; i++) {
            const [a,b,c] = lines[i];
            if(squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) return squares[a];
        }
        return null;
    }
    render();
}

// 9️⃣ TIC-TAC-TOE - PEDAGÓGICO CON VOCABULARIO ACTIVO INYECTADO
function loadTicTacToeGame(words) {
    const body = document.getElementById('modal-game-body');
    body.className = "w-full flex flex-col items-center";
    let board = Array(9).fill(null);
    let isXNext = true;
    
    // Obtenemos una lista fresca de palabras de la unidad para el tablero educativo
    const fallbackList = ["Hello", "Goodbye", "Please", "Thank you", "Welcome", "Friend", "Family", "School", "English"];
    const gameWords = words && words.length >= 9 ? [...words] : fallbackList;
    const shuffledWords = gameWords.sort(() => Math.random() - 0.5);

    function render() {
        body.innerHTML = `
            <p class="text-[10px] font-bold text-slate-400 mb-4 text-center uppercase tracking-wider">Review Area: Read the word out loud to lock your sector!</p>
            <div class="grid grid-cols-3 gap-2 w-56 h-56 bg-slate-100 border border-slate-200 p-2 rounded-2xl shadow-inner animate-fade-in" id="ttt-grid"></div>
            <p class="text-xs font-black text-indigo-950 mt-5 uppercase tracking-widest bg-slate-50 border px-4 py-2 rounded-full shadow-sm" id="ttt-status">Turn: <span class="${isXNext ? 'text-blue-600':'text-rose-500'}">${isXNext ? 'Player X' : 'Player O'}</span></p>
        `;
        
        const grid = document.getElementById('ttt-grid');
        board.forEach((val, idx) => {
            const cell = document.createElement('button');
            
            if (val === 'X') {
                cell.className = "w-full h-full bg-blue-50 border-2 border-blue-400 rounded-xl flex items-center justify-center font-black text-xl text-blue-600 shadow-sm";
                cell.textContent = "X";
            } else if (val === 'O') {
                cell.className = "w-full h-full bg-rose-50 border-2 border-rose-400 rounded-xl flex items-center justify-center font-black text-xl text-rose-500 shadow-sm";
                cell.textContent = "O";
            } else {
                // Muestra palabras reales en inglés de la unidad dentro de los cuadrantes vacíos
                cell.className = "w-full h-full bg-white border border-slate-200 rounded-xl flex items-center justify-center font-black text-[9px] text-slate-600 hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition-all cursor-pointer p-1 text-center uppercase select-none tracking-tight break-all";
                cell.textContent = shuffledWords[idx];
            }
            
            cell.onclick = () => {
                if (board[idx] || calculateWinner(board)) return;
                board[idx] = isXNext ? 'X' : 'O';
                isXNext = !isXNext;
                
                const winner = calculateWinner(board);
                render();
                
                if (winner) {
                    const status = document.getElementById('ttt-status');
                    status.className = "text-sm font-black text-emerald-600 mt-5 uppercase tracking-widest bg-emerald-50 border-2 border-emerald-400 px-5 py-2 rounded-full animate-bounce";
                    status.textContent = `Player ${winner} wins! 🏆`;
                    updateProgress(100);
                } else if (!board.includes(null)) {
                    const status = document.getElementById('ttt-status');
                    status.className = "text-sm font-black text-slate-500 mt-5 uppercase tracking-widest bg-slate-100 border px-5 py-2 rounded-full";
                    status.textContent = "Tie Game! 🤝";
                }
            };
            grid.appendChild(cell);
        });
    }
    
    function calculateWinner(squares) {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for(let i=0; i<lines.length; i++) {
            const [a,b,c] = lines[i];
            if(squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) return squares[a];
        }
        return null;
    }
    render();
}

setInterval(() => {
    const firma = document.getElementById('firma-seguridad');

    }
}, 1000);
