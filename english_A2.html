<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive English Portal - Level A2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- CSS ARCHITECTURE & RESET (ESTILO PORTAL ORIGINAL) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        :root {
            --bg-base: #f1f5f9;
            --bg-card: #ffffff;
            --text-title: #0f172a;
            --text-body: #475569;
            --border-ui: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            
            /* Identidad Visual Exclusiva A2 */
            --accent-g: linear-gradient(135deg, #38bdf8, #0284c7);
            --accent-text: #0284c7;
        }

        [data-theme="dark"] {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --text-title: #f8fafc;
            --text-body: #94a3b8;
            --border-ui: #334155;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-body);
        }

        /* --- CONFIGURACIONES BOTÓN DE TEMA PORTAL --- */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1.5rem;
            background-color: var(--bg-card);
            border: 2px solid var(--border-ui);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            touch-action: manipulation;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* --- IDENTIDAD GRÁFICA UNIFICADA --- */
        .brand-color-text { color: var(--accent-text); }       
        .brand-color-bg { background: var(--accent-g); }     
        .brand-color-button { background: var(--accent-g); } 
        .brand-color-button:hover { filter: brightness(1.15); }
        
        .sidebar-btn.active { 
            background: var(--accent-g); 
            color: #ffffff !important; 
            border-color: transparent; 
            box-shadow: var(--shadow-lg);
        }

        /* Contenedores estilizados tipo Tarjeta Portal */
        .portal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--accent-g);
        }

        .portal-card-interactive:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        /* --- CONFIGURACIONES BOTÓN HOME --- */
        .home-btn {
            position: fixed;
            top: 1rem;
            left: 1.5rem;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 0.5rem 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.15rem;
            font-weight: 800;
            color: #94a3b8;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            touch-action: manipulation;
        }

        .home-btn:hover {
            transform: scale(1.05);
            color: #f8fafc;
            border-color: #475569;
        }
        
        @media (max-width: 640px) {
            .home-btn, .theme-toggle {
                position: absolute;
            }
        }

        /* --- ANIMACIONES DE ENTRADA --- */
        .animate-fade-down { animation: moveDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .animate-fade-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

        @keyframes moveDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animación 3D para Flashcards */
        .flashcard-scene { perspective: 1000px; }
        .flashcard-inner { transition: transform 0.6s; transform-style: preserve-3d; position: relative; width: 100%; height: 100%; }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { backface-visibility: hidden; position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .flashcard-back { transform: rotateY(180deg); }

        /* =====================================================================
           🚀 PROTECCIÓN ANTI-COLAPSO ONESCREEN (PRESERVADO INTACTO)
           ===================================================================== */
        #modal-game-stage > div { max-width: 100% !important; width: 100% !important; }
        #modal-game-stage text, #modal-game-stage p, #modal-game-stage span, #modal-game-stage div,
        #modal-game-stage button, #modal-game-stage h4, #modal-game-stage li {
            font-weight: 800 !important;              
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif !important; 
            text-shadow: 0px 1px 2px rgba(0,0,0,0.8) !important; 
            letter-spacing: 0.02em !important; 
        }
        #modal-game-stage p.text-sm, #modal-game-stage p.text-base, #modal-game-stage .text-center p,
        #modal-game-stage .text-xl, #modal-game-stage .text-2xl, #modal-game-stage [class*="text-"] h3,
        #modal-game-stage .mb-6.bg-slate-800\/50, #modal-game-stage .text-lg.font-semibold {
            font-size: 1.75rem !important;      
            line-height: 1.5 !important;        
            height: auto !important;            
            min-height: max-content !important; 
            padding: 1.5rem !important;        
            color: #ffffff !important;         
            word-break: break-word !important;  
        }
        #modal-game-stage button.w-full.text-left, #modal-game-stage .space-y-3 button, #modal-game-stage [onclick*="selectAnswer"] {
            min-height: 75px !important;        
            height: auto !important;            
            font-size: 1.35rem !important;     
            line-height: 1.3 !important;
            padding: 1.25rem 1.75rem !important;   
            color: #ffffff !important;         
            border-radius: 0.75rem !important;    
            border: 2px solid #334155 !important; 
            margin-bottom: 0.75rem !important;  
            display: flex !important;           
            align-items: center !important;
        }
        #modal-game-stage button.w-full.text-left span:first-child, #modal-game-stage [onclick*="selectAnswer"] span {
            font-size: 1.4rem !important; margin-right: 1rem !important; flex-shrink: 0 !important;          
        }
        #modal-game-stage .grid-cols-10 > div, #modal-game-stage .grid-cols-12 > div, #modal-game-stage [class*="grid-cols"] > div[class*="aspect-square"], #modal-game-stage button[data-row][data-col] {
            min-height: auto !important; aspect-ratio: 1 / 1 !important; font-size: 1.4rem !important; padding: 0 !important; display: flex !important; align-items: center !important; justify-content: center !important; border-radius: 0.375rem !important; 
        }
        #modal-game-stage .grid-cols-4 > div[onclick], #modal-game-stage .grid-cols-3 > div[onclick], #modal-game-stage [id*="memory"] button, #modal-game-stage [id*="card"] {
            min-height: 160px !important; font-size: 1.4rem !important; padding: 1.5rem !important; color: #ffffff !important; border-radius: 1rem !important; display: flex !important; align-items: center !important; justify-content: center !important; text-align: center !important;
        }
        #modal-game-stage .grid-cols-7 > button, #modal-game-stage [id*="keyboard"] button, #modal-game-stage button[onclick*="guess"], #modal-game-stage button[onclick*="Letter"] {
            min-height: 60px !important; font-size: 1.35rem !important; padding: 0.5rem !important;
        }
        #modal-game-stage #hangman-word-slots span { font-size: 2.2rem !important; font-weight: 900 !important; color: #22c55e !important; margin: 0 0.25rem !important; }
        #modal-game-stage .relative.w-full.bg-slate-700, #modal-game-stage [id="integrity-bar"] { height: 14px !important; border-radius: 9999px !important; }
        #modal-game-stage span.text-\[10px\], #modal-game-stage div > span { font-size: 1.15rem !important; color: #f87171 !important; }
        #modal-game-stage .italic, #modal-game-stage .text-gray-600 { font-size: 1.05rem !important; color: #94a3b8 !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <a href="index.html" class="home-btn" aria-label="Go to home">
        <span>🏠</span> Home
    </a>

    <button class="theme-toggle" id="themeSwitchBtn" aria-label="Toggle structural theme">🌓</button>

    <div id="app" class="h-full flex flex-col overflow-hidden">

        <header class="w-full text-center py-4 bg-[var(--bg-card)] border-b border-[var(--border-ui)] shrink-0 shadow-sm z-10 relative">
            <h1 class="text-3xl font-extrabold tracking-tight text-[var(--text-title)]">

        <div class="flex flex-1 overflow-hidden">
            
            <aside class="w-64 bg-[var(--bg-card)] border-r border-[var(--border-ui)] p-4 flex flex-col gap-2 overflow-y-auto shrink-0">
                <h2 class="text-xs font-bold text-[var(--text-body)] uppercase tracking-wider mb-2 px-1">Select Unit Block:</h2>
                <button onclick="selectBlock('u1-2')" id="btn-u1-2" class="sidebar-btn active text-left px-4 py-3 rounded-xl text-sm font-semibold border transition-all">📘 Units 1-2</button>
                <button onclick="selectBlock('u3-4')" id="btn-u3-4" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 3-4</button>
                <button onclick="selectBlock('u5-6')" id="btn-u5-6" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 5-6</button>
                <button onclick="selectBlock('u7-8')" id="btn-u7-8" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 7-8</button>
                <button onclick="selectBlock('u9-10')" id="btn-u9-10" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 9-10</button>
                <button onclick="selectBlock('u11-12')" id="btn-u11-12" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 11-12</button>
                <button onclick="selectBlock('u13-14')" id="btn-u13-14" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 13-14</button>
                <button onclick="selectBlock('u15-16')" id="btn-u15-16" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 15-16</button>
            </aside>

            <main class="flex-1 p-6 flex flex-col gap-6 overflow-y-auto">
                
                <div class="portal-card p-5 animate-fade-down shrink-0">
                    <span id="unit-badge" class="brand-color-bg text-white text-xs px-2.5 py-1 rounded-md font-bold uppercase shadow-sm">Units 1-2</span>
                    <h2 id="unit-title" class="text-2xl font-bold text-[var(--text-title)] mt-2">Welcome & Personal Information</h2>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 flex-1 items-start">
                    
                    <div class="portal-card portal-card-interactive p-6 flex flex-col justify-between h-[420px] animate-fade-up">
                        <div>
                            <div class="flex items-center gap-2 mb-4">
                                <span class="bg-amber-500/10 text-amber-500 text-xs px-2.5 py-1 rounded-md font-bold uppercase border border-amber-500/20">Warm-Up</span>
                            </div>
                            <p id="warmup-display" class="text-[var(--text-body)] text-base text-center font-medium my-12 px-4">
                                Click the button below to generate a real-world communication prompt!
                            </p>
                        </div>
                        <button onclick="generatePrompt()" class="w-full brand-color-button text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-comments"></i> GENERATE QUESTION
                        </button>
                    </div>

                    <div class="xl:col-span-2 portal-card p-6 h-[420px] flex flex-col animate-fade-up" style="animation-delay: 0.1s;">
                        <div class="flex items-center gap-2 mb-4 shrink-0">
                            <span class="bg-red-500/10 brand-color-text text-xs px-2.5 py-1 rounded-md font-bold uppercase border border-red-500/20">Interactive Challenges</span>
                        </div>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 flex-1 overflow-y-auto pr-1">
                            <button onclick="openGame('Flashcards')" class="bg-[#d97706] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-layer-group text-2xl"></i><span class="text-xs uppercase tracking-wide">Flashcards</span></button>
                            <button onclick="openGame('Quiz')" class="bg-[#dc2626] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-square-check text-2xl"></i><span class="text-xs uppercase tracking-wide">Quiz</span></button>
                            <button onclick="openGame('Fill Blanks')" class="bg-[#db2777] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-pen-to-square text-2xl"></i><span class="text-xs uppercase tracking-wide">Fill Blanks</span></button>
                            <button onclick="openGame('Word Search')" class="bg-[#2563eb] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-magnifying-glass text-2xl"></i><span class="text-xs uppercase tracking-wide">Word Search</span></button>
                            
                            <button onclick="openGame('Memory Match')" class="bg-[#9333ea] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-brain text-2xl"></i><span class="text-xs uppercase tracking-wide">Memory Match</span></button>
                            <button onclick="openGame('Category Sort')" class="bg-[#ca8a04] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-circle-nodes text-2xl"></i><span class="text-xs uppercase tracking-wide">Category Sort</span></button>
                            <button onclick="openGame('Hangman')" class="bg-[#c026d3] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-circle-question text-2xl"></i><span class="text-xs uppercase tracking-wide">Hangman</span></button>
                            <button onclick="openGame('Word Wheel')" class="bg-[#ea580c] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-ferris-wheel text-2xl"></i><span class="text-xs uppercase tracking-wide">Word Wheel</span></button>
                            
                            <button onclick="openGame('Tic-Tac-Toe')" class="bg-[#0d9488] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-table-cells text-2xl"></i><span class="text-xs uppercase tracking-wide">Tic-Tac-Toe</span></button>
                            <button onclick="openGame('Find Errors')" class="bg-[#e11d48] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-triangle-exclamation text-2xl"></i><span class="text-xs uppercase tracking-wide">Find Errors</span></button>
                            <button onclick="openGame('Reorder Steps')" class="bg-[#4f46e5] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-list-ol text-2xl"></i><span class="text-xs uppercase tracking-wide">Reorder Steps</span></button>
                            <button onclick="openGame('Jeopardy')" class="bg-[#16a34a] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-trophy text-2xl"></i><span class="text-xs uppercase tracking-wide">Jeopardy</span></button>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <div id="game-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-[var(--bg-card)] border-2 border-[var(--border-ui)] w-full max-w-5xl rounded-3xl p-8 shadow-2xl relative flex flex-col max-h-[92vh]">
            
            <button onclick="closeActiveGameModal()" class="absolute top-5 right-5 text-[var(--text-body)] hover:text-rose-500 text-2xl p-2 transition-all cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="flex items-center gap-4 mb-6 pb-4 border-b border-[var(--border-ui)] shrink-0">
                <span id="modal-game-badge" class="brand-color-bg text-white px-3 py-1.5 rounded-xl font-mono text-xs font-black uppercase tracking-widest shadow-sm"></span>
                <h3 id="modal-game-title" class="text-2xl font-mono font-black tracking-tight text-[var(--text-title)]"></h3>
            </div>
            
            <div id="modal-game-stage" class="flex-1 flex flex-col items-center justify-center min-h-[420px] overflow-y-auto pr-1">
                </div>
        </div>
    </div>
	<script>
        /* =====================================================================
           🎨 PORTAL STRUCTURAL THEME CONTROLLER & GLOBAL STATE
           ===================================================================== */
        const themeBtn = document.getElementById('themeSwitchBtn');
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
        });

        // Estado del portal activo
        let currentBlockId = 'u1-2';
        let activeGameType = null;

        /* =====================================================================
           📦 MASTER DATA OBJECT: UNITS 1 TO 16 (PEDAGOGICAL DATA COMPLETE)
           ===================================================================== */
        const DATA = {
            "u1-2": {
    badge: "Units 1-2",
    title: "Childhood Memories & City Life",
    details: "Grammar: Past tense with Used to (Habitual Actions) | Indirect Questions (Wh- & Yes/No) | Quantity Expressions (too many/much, fewer, less, not enough)",
    
    prompts: [
        "What is a specific game or hobby you used to play during your childhood every single day?",
        "Did you use to have any pets when you were younger? Describe them.",
        "Think of a beautiful place in your childhood neighborhood. Where was it and why did you like it?",
        "Structure an polite indirect question asking a stranger where the nearest subway station is.",
        "Could you tell me how much a bus ticket costs in your city? Practice the indirect structure.",
        "Does your current city have too much traffic or too many traffic jams during rush hour?",
        "Are there enough parks and green spaces in your neighborhood, or do you need more?",
        "Compare the pollution or noise levels in your city using 'less' or 'fewer'.",
        "What used to be your most valuable possession when you were a young student?",
        "How has your daily routine changed? What did you use to do that you don't do anymore?"
    ],

    vocabulary: [
        { word: "childhood", translation: "The period of your life when you are a young child." },
        { word: "neighborhood", translation: "The area or region around the place where a person lives." },
        { word: "possession", translation: "An item or thing that belongs to you or that you own." },
        { word: "hobby", translation: "An activity that you enjoy doing in your free or leisure time." },
        { word: "traffic jam", translation: "A long line of vehicles on a road that cannot move or moves very slowly." },
        { word: "street light", translation: "A tall post with a light at the top that illuminates a road at night." },
        { word: "subway", translation: "An underground electric railroad system inside a metropolitan city." },
        { word: "crowded", translation: "A space full of too many people or objects." },
        { word: "pollution", translation: "Damage caused to water, air, or land by harmful substances or waste." },
        { word: "fewer", translation: "A smaller number of individual units; used exclusively with plural count nouns." },
        { word: "scary", translation: "Something frightening that causes you to feel fear or anxiety." },
        { word: "already", translation: "An adverb used to show that something happened sooner than expected." },
        { word: "memories", translation: "People, places, or events that you remember from the past." },
        { word: "playground", translation: "An outdoor area where children can play on slides, swings, and structures." },
        { word: "bicycle", translation: "A light vehicle with two wheels that you ride by pushing foot pedals." },
        { word: "hometown", translation: "The city or town where you were born and spent your early childhood years." },
        { word: "building", translation: "A permanent structure with walls and a roof, such as a house or factory." },
        { word: "transportation", translation: "A system of vehicles, like buses and trains, used for moving people around." },
        { word: "sidewalk", translation: "A paved path at the side of a street where pedestrians can walk safely." },
        { word: "commute", translation: "The regular daily journey you make to travel to work or school and back." }
    ],

    grammar: [
        {
            rules: "Past Habitual Actions: Use 'used to + base verb' to talk about regular habits or states in the past that are no longer true today.",
            examples: ["I used to ride my bicycle around the neighborhood park.", "He used to have a pet dog."]
        },
        {
            rules: "Negative Used To: Formed using 'didn't use to'. Remember to drop the final '-d' from 'used' because of the past auxiliary.",
            examples: ["I didn't use to like eating vegetables when I was seven.", "They didn't use to live here."]
        },
        {
            rules: "Questions with Used To: Formed with 'Did + subject + use to + verb?'. Drop the final '-d' from 'used' due to the auxiliary 'Did'.",
            examples: ["Did you use to have any pets when you were younger?", "What did he use to play?"]
        },
        {
            rules: "Count Quantifiers (Plural Nouns): Use 'too many' for excessive quantities and 'fewer' for smaller numbers of countable units.",
            examples: ["There are too many cars on the avenue.", "Because of the subway, there are fewer vehicles today."]
        },
        {
            rules: "Noncount Quantifiers (Uncountable Masses): Use 'too much' for excessive mass and 'less' for smaller amounts of noncount concepts.",
            examples: ["There is too much traffic during rush hour.", "We have less space in this tiny apartment."]
        },
        {
            rules: "Sufficiency Expressions: Use 'not enough' before nouns to state that you need a larger or more satisfactory quantity of something.",
            examples: ["There are not enough street lights in this sector.", "We don't have enough green parks."]
        },
        {
            rules: "Indirect Wh- Questions: Polite inquiries embedded inside phrases like 'Do you know...'. Do not invert the final subject and verb layout.",
            examples: ["Do you know where the nearest bus stop is?", "I want to know what time the museum opens."]
        },
        {
            rules: "Indirect Yes/No Questions: Polite yes/no structures embedded using the conjunctions 'if' or 'whether'. Do not use auxiliary verbs 'do/does/did' in the embedded clause.",
            examples: ["Could you tell me if this train goes to the central station?", "I wonder if the subway is open."]

            "u3-4": {

    title: "Housing, Evaluations & Life Milestones",
    details: "Grammar: Evaluations & Comparisons with Adjectives/Nouns | Wishes (I wish + simple past) | Simple Past vs. Present Perfect | Sequence Adverbs",
    
    prompts: [

    vocabulary: [

        { word: "first", translation: "A sequence adverb used to introduce the very beginning step of a process." },
        { word: "then", translation: "A transition word used to show what happens immediately after the previous step." },
        { word: "next", translation: "A sequence word used to advance to the subsequent action in a list." },
        { word: "after that", translation: "A connective phrase used to sequence another event after a prior one." },
        { word: "finally", translation: "The final sequence adverb used to introduce the last step of a process." },
        { word: "wish", translation: "A strong desire for something that is different from your current reality." },

        { word: "apartment", translation: "A suite of rooms forming a separate residence within a larger building." }
    ],

    grammar: [
        {
            rules: "Adjective Evaluation: Use 'too + adjective' to express an excessive, problematic condition, and 'not + adjective + enough' to express insufficiency.",
            examples: ["My new apartment is too small.", "This neighborhood is not quiet enough for a baby."]
        },
        {
            rules: "Adjective Comparison: Use 'not as + adjective + as' to demonstrate that two entities or living spaces are not equal in a specific quality.",
            examples: ["Our current house is not as modern as the one online."]
        },
        {
            rules: "Noun Evaluation & Comparison: Quantify nouns using 'too many/much' and 'not enough'. For comparisons, use 'not as many/much + noun + as'.",
            examples: ["My bedroom doesn't have enough closet space.", "The old house didn't have as many rooms as this one."]
        },
        {
            rules: "Present Wishes: Express a desire to change a current uncomfortable reality by using 'I wish + Simple Past' (or 'were/could' for abilities/states).",
            examples: ["I wish my town had more modern shopping malls.", "I wish I could speak English perfectly right now.", "I wish my family lived closer."]
        },
        {
            rules: "Simple Past vs Present Perfect: Use Simple Past for actions completed at a definite time. Use Present Perfect for indefinite life experiences.",
            examples: ["She left her keys on the kitchen table two hours ago.", "I have been to London three times in my life."]
        },
        {
            rules: "Sequence Adverbs: Transition smoothly between structural steps using 'First' at the beginning, followed by 'Then / Next / After that', and concluding with 'Finally'.",
            examples: ["First, chop the fresh vegetables.", "Next, boil the water; after that, add elements; and finally, serve it hot."]
        }
    ],

    quiz: [
        { q: "My new apartment is _______ small; I can barely fit my bed inside the room.", a: ["too", "enough", "as"], c: "too" },
        { q: "This neighborhood is not quiet _______ for a family with a newborn baby.", a: ["enough", "too", "as"], c: "enough" },
        { q: "Our current house is not _______ modern as the one we saw on the internet yesterday.", a: ["as", "too", "enough"], c: "as" },
        { q: "I love my town, but I wish it _______ more modern shopping malls.", a: ["had", "has", "have"], c: "had" },
        { q: "I wish my bedroom _______ windows to let in some beautiful natural light.", a: ["were larger and had", "has", "is having"], c: "were larger and had" },
        { q: "I _______ to London three times in my life, but I don't remember the street names.", a: ["have been", "went", "go"], c: "have been" },
        { q: "She _______ her keys on the kitchen table two hours ago, and now she can't find them.", a: ["left", "has left", "leaves"], c: "left" },
        { q: "To make a good soup, _______, chop the fresh vegetables into small pieces.", a: ["first", "then", "finally"], c: "first" },
        { q: "Next, boil the water; after that, add the ingredients; and _______, serve it hot.", a: ["finally", "then", "first"], c: "finally" },
        { q: "We haven't found a convenient apartment _______, but we are still looking.", a: ["yet", "already", "last week"], c: "yet" },
        { q: "My bedroom doesn't have _______ closet space for all my clothes and jackets.", a: ["enough", "too much", "as"], c: "enough" },
        { q: "I wish I _______ speak English perfectly right now; it would make traveling easier.", a: ["could", "can", "will"], c: "could" },
        { q: "Have you _______ tried traditional French food during your European vacation?", a: ["ever", "yet", "ago"], c: "ever" },
        { q: "They _______ a beautiful new house last month near the beach area.", a: ["bought", "have bought", "buy"], c: "bought" },
        { q: "The old house was terrible because it didn't have as _______ rooms as this one.", a: ["many", "much", "too"], c: "many" },
        { q: "I wish my family _______ closer to my current workplace downtown.", a: ["lived", "lives", "has lived"], c: "lived" },
        { q: "He has _______ finished his homework, so he can go out and play soccer.", a: ["already", "yet", "two days ago"], c: "already" },
        { q: "Which cooking method involves preparing food in hot oil? To _______ the chicken.", a: ["fry", "bake", "boil"], c: "fry" },
        { q: "This apartment is perfect because it is very _______ to the metro station.", a: ["convenient", "crowded", "scary"], c: "convenient" },
        { q: "I wish I _______ to worry about paying the monthly rent of this studio.", a: ["didn't have", "don't have", "haven't"], c: "didn't have" }
    ]

            "u5-6": {

    title: "Travel Plans & Social Obligations",
    details: "Grammar: Future with be going to and will | Modals for Necessity (must, need to, have to) and Suggestion (ought to, had better, should) | Phrasal Verbs | Requests",
    
    prompts: [

    vocabulary: [
        { word: "credit card", translation: "A small plastic card that allows you to buy things electronically and pay later." },

    ],

    grammar: [
        {
            rules: "Future Intentions vs. Instant Decisions: Use 'be going to + verb' for firm, pre-established plans. Use 'will' for sudden, spontaneous choices or offers of assistance.",
            examples: ["I am going to travel around Europe next summer.", "The phone is ringing! I will answer it immediately."]
        },
        {
            rules: "Modals of Necessity & Obligation: Use 'must', 'have to', and 'need to' for rigid requirements. Use 'must not' for strict prohibitions, and 'don't have to' for optional tasks.",

        {

            examples: ["You should bring a jacket because it might rain.", "You ought to visit the historic castle.", "You had better pack your bags tonight."]
        },
        {
            rules: "Separable Two-Part Verbs (Phrasal Verbs): When using a pronoun object (it, them), it MUST sit directly in the middle of the verb and the particle.",

        {
            rules: "Polite Requests: Form soft commands using 'Can you / Could you + base verb'. For an elevated level of politeness, implement 'Would you mind + gerund (-ing)'.",

    quiz: [

        { q: "The living room is a complete mess. Could you please _______ the garbage?", a: ["take out", "take out it", "taking out"], c: "take out" },
        { q: "Would you mind _______ down the volume of the television? I am trying to study.", a: ["turning", "turn", "to turn"], c: "turning" },
        { q: "You _______ better pack your bags tonight, or you will miss your early flight tomorrow.", a: ["had", "should", "must"], c: "had" },
        { q: "Tomorrow is Sunday, so I _______ wake up early. I can stay in bed all morning.", a: ["don't have to", "must not", "ought not to"], c: "don't have to" },
        { q: "You _______ touch that button! It will completely shut down the airplane system.", a: ["must not", "don't have to", "should"], c: "must not" },

        { q: "If you don't have a _______, you won't be able to pay for things electronically abroad.", a: ["credit card", "garbage", "mess"], c: "credit card" },
        { q: "You _______ visit the historic castle when you go to Edinburgh; it is absolutely stunning.", a: ["ought to", "must to", "had"], c: "ought to" },
        { q: "Please turn the radio _______ before you go to sleep; it wastes electricity.", a: ["off", "on", "up"], c: "off" },
        { q: "I promise I _______ call you as soon as my flight lands at the airport.", a: ["will", "am going to", "must"], c: "will" },
        { q: "Could you _______ the lights? The room is too dark and I cannot see anything.", a: ["turn on", "turning on", "turn on them"], c: "turn on" },

            "u7-8": {
    badge: "Units 7-8",
    title: "Technology & Cultural Celebrations",
    details: "Grammar: Infinitives and Gerunds for uses and purposes | Imperatives and Infinitives for suggestions | Relative Clauses of time | Adverbial Clauses (when, after, before)",
    
    prompts: [
        "What do you use your smartphone for? Answer using a gerund for purpose.",
        "Why do people buy high-tech laptops? Structure your answer with an infinitive.",
        "What should you do if an aggressive hacker steals your social media account?",

        "What is your favorite cultural celebration or holiday during the year?",

    ],

    vocabulary: [
        { word: "hacker", translation: "A person who uses computers to gain unauthorized access to data or networks." },

        { word: "present", translation: "A gift given to someone voluntarily without payment to show affection or celebrate." },
        { word: "send", translation: "To cause an email, message, text, or parcel to go from one destination to another." },
        { word: "watch", translation: "To look at or observe an event, movie, or public display attentively over time." },
        { word: "take", translation: "To capture an image with a camera, or to move something from one location to another." },
        { word: "give", translation: "To hand over or present something to another person as a gesture of kindness." },
        { word: "visit", translation: "To go to see a person or spend time in a specific place for social reasons." },
        { word: "when", translation: "A conjunction used to refer to the specific time or moment an event takes place." },
        { word: "before", translation: "An adverb or conjunction indicating that an event happens prior to a specific point." },
        { word: "after", translation: "An adverb or conjunction indicating that an event occurs subsequent to a prior action." },

        { word: "tradition", translation: "A long-established custom or belief passed down through generations within a culture." }
    ],

    grammar: [
        {
            rules: "Infinitive of Purpose: Use the structural layout 'to + base verb' to express the explicit reason or motive why an individual performs an action.",
            examples: ["I bought a new portable charger to keep my phone alive.", "Many people use social media apps to stay in touch."]
        },
        {
            rules: "Gerund of Purpose: Implement the syntax 'for + verb-ing' exclusively to define the intrinsic design, primary function, or intended utility of an item.",

            rules: "Imperatives and Infinitives for Advice: Issue direct technical advice starting with base verbs (Imperatives) or embed them within structured infinitive targets.",

        {
            rules: "Relative and Adverbial Clauses of Time: Organize historical, habitual, or seasonal events using 'when', 'before', and 'after'. Apply a mandatory comma if the time clause initiates the sentence sequence.",

        { q: "To protect your personal data from a dangerous _______, change your passwords.", a: ["hacker", "charger", "festival"], c: "hacker" },
        { q: "If your computer system happens to _______, try restarting it immediately.", a: ["crash", "send", "give"], c: "crash" },

        { q: "To secure your home wireless network, _______ install an unverified software program.", a: ["don't", "never to", "not"], c: "don't" },
        { q: "New Year's Eve is a special time _______ families gather together to have dinner.", a: ["when", "before", "after"], c: "when" },
        { q: "_______ you go to a massive cultural celebration, make sure to book a hotel room.", a: ["Before", "After that", "When is"], c: "Before" },
        { q: "I always send thank-you text messages immediately _______ I receive a birthday present.", a: ["after", "before", "when is"], c: "after" },
        { q: "Many people use specialized social media apps _______ touch with old classmates.", a: ["to stay", "for stay", "staying"], c: "to stay" },
        { q: "A smartphone is an incredible device _______ high-definition digital photographs.", a: ["for taking", "to taking", "for take"], c: "for taking" },
        { q: "To improve your device's overall speed, _______ delete large temporary files.", a: ["make sure to", "sure to", "making sure"], c: "make sure to" },
        { q: "_______ open suspicious email links if you don't know the sender's address.", a: ["Never", "To never", "Not"], c: "Never" },
        { q: "Thanksgiving is a national holiday _______ people eat turkey and give thanks.", a: ["when", "which", "before"], c: "when" },
        { q: "We usually watch the city fireworks display right _______ the clock strikes midnight.", a: ["after", "before long", "when that"], c: "after" },
        { q: "What do you use this specific digital cable _______? - For connecting the monitor.", a: ["for", "to", "with"], c: "for" },
        { q: "Before you _______ your old cell phone, make sure to erase all your accounts.", a: ["sell", "sold", "have sold"], c: "sell" },
        { q: "My father uses his tablet primarily _______ digital newspapers every morning.", a: ["for reading", "to reading", "read"], c: "for reading" },
        { q: "To keep your files completely safe, remember _______ them in the cloud system.", a: ["to back up", "backing up", "back up"], c: "to back up" },
        { q: "When spring _______, people in Japan celebrate the beautiful cherry blossom festival.", a: ["arrives", "arrive", "arrived"], c: "arrives" }
    ]

            "u9-10": {

    title: "Lifestyles, Habits & Human Personalities",
    details: "Grammar: Real Conditionals (If clauses) | Clauses with because | Gerunds as Subjects and Objects | Short Responses (So do I, Neither do I, Either)",
    
    prompts: [

        "What happens if you spend too much money over the weekend on clothes?",
        "Are you a hardworking person or do you consider yourself a bit impatient?",

    ],

    vocabulary: [
        { word: "creative", translation: "Having the ability to produce original ideas or make something artistic and new." },
        { word: "impatient", translation: "Feeling easily annoyed because you have to wait for something or someone." },
        { word: "hardworking", translation: "Putting a lot of effort, time, and care into doing a job or a task." },
        { word: "moody", translation: "Having unpredictable changes in mood, becoming suddenly angry or unhappy." },
        { word: "critical", translation: "Expressing disapproving comments or finding faults in people or things." },
        { word: "anxious", translation: "Feeling worried, nervous, or uneasy about something with an uncertain outcome." },
        { word: "stressed", translation: "Experiencing mental or emotional pressure and tension from daily difficulties." },
        { word: "shape", translation: "The condition of a person's physical health and fitness level." },
        { word: "money", translation: "The official coins and banknotes used to pay for goods, services, or property." },
        { word: "because", translation: "A subordinating conjunction used to introduce a reason or an explicit cause." },
        { word: "so", translation: "An adverb used in short responses to express agreement with an affirmative statement." },
        { word: "neither", translation: "An adverb used in short responses to show agreement with a negative statement." },
        { word: "either", translation: "An adverb used at the end of a clause to show agreement with a negative statement." },
        { word: "gym", translation: "A dedicated room or building equipped with machines and weights for physical exercise." },
        { word: "habit", translation: "A settled or regular tendency or practice that is hard to give up." },
        { word: "lifestyle", translation: "The typical way of life, habits, and conditions of an individual or a group." },
