<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Interactive — Nivel A2</title>
    <style>
        :root {
            --bg-primary: #F0F4FF;
            --bg-card: #FFFFFF;
            --text-main: #0D47A1;
            --text-muted: #3A609E;
            --color-primary: #1565C0;
            --color-accent: #42A5F5;
            --color-danger: #D32F2F;
            --color-success: #2E7D32;
            --border-radius-card: 16px;
            --border-radius-modal: 24px;
            --shadow-main: 0 8px 32px rgba(21, 101, 192, 0.15);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #070D1A;
            --bg-card: #0D1B35;
            --text-main: #E3F2FD;
            --text-muted: #90CAF9;
            --color-primary: #0D47A1;
            --color-accent: #42A5F5;
            --color-danger: #EF5350;
            --color-success: #81C784;
            --shadow-main: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: var(--transition-smooth);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #theme-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: var(--bg-card);
            border: 2px solid var(--color-primary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: var(--shadow-main);
            touch-action: manipulation;
        }

        header {
            background: var(--bg-card);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-main);
            border-bottom: 3px solid var(--color-primary);
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            min-height: 48px;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background-color: var(--color-primary);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-accent {
            background-color: var(--color-accent);
            color: #000000;
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--color-primary);
            color: var(--text-main);
        }

        .grid-units {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        @media(min-width: 600px) {
            .grid-units { grid-template-columns: 1fr 1fr; }
        }

        .card-unit {
            background: var(--bg-card);
            border-radius: var(--border-radius-card);
            padding: 20px;
            box-shadow: var(--shadow-main);
            border: 1px solid rgba(21, 101, 192, 0.1);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .card-unit:hover {
            transform: translateY(-4px);
            border-color: var(--color-accent);
        }

        .card-unit h3 {
            margin-bottom: 8px;
            color: var(--color-primary);
        }

        .card-unit p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .workspace-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media(min-width: 768px) {
            .workspace-layout { grid-template-columns: 1fr 1.2fr; }
        }

        .panel-column {
            background: var(--bg-card);
            border-radius: var(--border-radius-card);
            padding: 20px;
            box-shadow: var(--shadow-main);
        }

        .grid-games {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .instruction-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-style: italic;
        }

        /* Flashcards Styling */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 240px;
            margin: 20px 0;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--border-radius-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-main);
        }

        .card-front {
            background: var(--color-primary);
            color: white;
        }

        .card-back {
            background: var(--bg-card);
            border: 3px solid var(--color-primary);
            color: var(--text-main);
            transform: rotateY(180deg);
        }

        /* Quiz Choices Layout */
        .quiz-option {
            background: var(--bg-card);
            border: 2px solid var(--text-muted);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-size: 1rem;
            color: var(--text-main);
            transition: var(--transition-smooth);
            min-height: 48px;
        }

        .quiz-option.correct {
            background: var(--color-success);
            color: white;
            border-color: var(--color-success);
        }

        .quiz-option.incorrect {
            background: var(--color-danger);
            color: white;
            border-color: var(--color-danger);
        }

        /* Word Games Elements */
        .word-display {
            font-size: 2rem;
            letter-spacing: 0.4rem;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 15px;
        }

        .key-btn {
            min-height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--color-primary);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-main);
        }

        .key-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Word Search Matrix */
        .wordsearch-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin: 15px auto;
            max-width: 320px;
        }

        .ws-cell {
            aspect-ratio: 1;
            background: var(--bg-card);
            border: 1px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
        }

        .ws-cell.selected {
            background: var(--color-accent);
            color: black;
        }

        .ws-cell.found {
            background: var(--color-success);
            color: white;
        }

        /* Memory Elements */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .memory-card {
            aspect-ratio: 1;
            background: var(--color-primary);
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            padding: 4px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            word-break: break-word;
        }

        .memory-card.flipped {
            background: var(--bg-card);
            border: 2px solid var(--color-primary);
            color: var(--text-main);
        }

        .memory-card.matched {
            background: var(--color-success);
            color: white;
            opacity: 0.6;
        }

        /* Roulette Object */
        .roulette-container {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 20px auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid var(--color-primary);
            position: relative;
            overflow: hidden;
            transition: transform 3s cubic-bezier(0.1, 0.8, 0.1, 1);
            background: conic-gradient(
                var(--color-primary) 0deg 45deg,
                var(--color-accent) 45deg 90deg,
                var(--color-primary) 90deg 135deg,
                var(--color-accent) 135deg 180deg,
                var(--color-primary) 180deg 225deg,
                var(--color-accent) 225deg 270deg,
                var(--color-primary) 270deg 315deg,
                var(--color-accent) 315deg 360deg
            );
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: calc(50% - 15px);
            width: 30px;
            height: 30px;
            background: var(--color-danger);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
        }

        .feedback-message {
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--color-accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .app-footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <button id="theme-toggle" aria-label="Toggle structural theme">🌓</button>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" class="btn-back-nav" style="
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 0 16px;
                height: 42px;
                border-radius: 12px;
                background: var(--border-color);
                color: var(--primary-color);
                text-decoration: none;
                font-size: 0.95rem;
                font-weight: bold;
                transition: background 0.3s ease, transform 0.2s ease;
                border: none;
                cursor: pointer;
            " onmouseover="this.style.background='#FFCDD2'; this.style.transform='scale(1.03)';" onmouseout="this.style.background='var(--border-color)'; this.style.transform='scale(1)';">
                🏠 Home
            </a>
            <div class="header-logo">English Interactive — Level A2</div>
        </div>
    </header>

    <main id="app">
        <div id="screen-units" class="screen active">
            <h2 style="margin-bottom:10px; text-align:center;">Select Learning Unit Module</h2>
            <div class="grid-units" id="units-list"></div>
        </div>

        <div id="screen-dashboard" class="screen">
            <button class="btn btn-outline" id="dash-back-btn">⬅️ Back to All Units</button>
            <h2 id="dash-title" style="margin: 15px 0 5px 0; color: var(--color-primary);"></h2>
            <p id="dash-grammar" style="font-size:0.95rem; margin-bottom:20px; color: var(--text-muted);"></p>
            
            <div class="workspace-layout">
                <div class="panel-column">
                    <h3 style="margin-bottom:10px;">💬 Section: Warm-Up</h3>
                    <p class="instruction-text">Answer the prompts aloud to practice conversation.</p>
                    <div id="warmup-prompts-container"></div>
                </div>

                <div class="panel-column">
                    <h3 style="margin-bottom:15px;">🎮 Section: Learning Games</h3>
                    <div class="grid-games" id="games-hub-buttons">
                        <button class="btn" data-game="1">🃏 Flashcards Game</button>
                        <button class="btn" data-game="2">⚡ Kahoot-Style Quiz</button>
                        <button class="btn" data-game="3">✏️ Fill in the Blanks</button>
                        <button class="btn" data-game="4">🔍 Word Search</button>
                        <button class="btn" data-game="5">🧠 Memory Pairs Match</button>
                        <button class="btn" data-game="6">📦 Drag & Sort Categories</button>
                        <button class="btn" data-game="7">💀 Digital Hangman</button>
                        <button class="btn" data-game="8">🎡 Wheel of Questions</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-game" class="screen">
            <button class="btn btn-outline" id="game-back-btn">📋 Return to Workspace</button>
            <div id="game-container-zone"></div>
        </div>
    </main>

    <footer class="app-footer">
        English Interactive Platform &bull; Level A2 Elementary
    </footer>

    <div id="firma-seguridad" style="position:fixed;bottom:20px;left:30px;font-family:Georgia, 'Times New Roman', serif;font-style:italic;font-size:14px;opacity:0.7;z-index:9999;pointer-events:none;">Creado por Tony Salas & German Peña</div>

    <script>

                        { q: "Children have ___ free time nowadays than in the past.", options: ["less", "fewer", "many", "too much"], correct: 0 },

            init() {
                this.renderModulesSelector();
                this.bindGlobalActions();
                this.applySavedTheme();
            },

            renderModulesSelector() {
                const container = document.getElementById('units-list');
                container.innerHTML = '';
                DATA.modules.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'card-unit';
                    card.innerHTML = `
                        <h3>${m.title}</h3>
                        <p>${m.grammar}</p>
                        <button class="btn btn-accent" style="margin:0; width:auto; font-size:0.85rem; padding:6px 12px; min-height:36px;">Enter Workspace</button>
                    `;
                    card.addEventListener('click', () => this.openDashboardWorkspace(m));
                    container.appendChild(card);
                });
            },

            bindGlobalActions() {
                document.getElementById('theme-toggle').addEventListener('click', () => {
                    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('englishA2_theme', theme);
                });

                document.getElementById('dash-back-btn').addEventListener('click', () => {
                    this.toggleScreen('screen-units');
                });

                document.getElementById('game-back-btn').addEventListener('click', () => {
                    this.toggleScreen('screen-dashboard');
                });

                const gameButtons = document.querySelectorAll('#games-hub-buttons .btn');
                gameButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = parseInt(e.currentTarget.getAttribute('data-game'));
                        this.launchGameArea(id);
                    });
                });
            },

            applySavedTheme() {
                const theme = localStorage.getItem('englishA2_theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            },

            toggleScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                window.scrollTo(0, 0);
            },

            openDashboardWorkspace(mod) {
                STATE.currentModule = mod;
                document.getElementById('dash-title').innerText = mod.title;
                document.getElementById('dash-grammar').innerText = mod.grammar;

                // Build Warmup Elements lists cleanly
                const container = document.getElementById('warmup-prompts-container');
                container.innerHTML = '';
                mod.warmup.forEach((q, idx) => {
                    const item = document.createElement('div');
                    item.style.cssText = 'padding:12px; border-bottom:1px solid rgba(21,101,192,0.1); font-size:0.95rem; line-height:1.4;';
                    item.innerHTML = `<strong>${idx + 1}.</strong> ${q}`;
                    container.appendChild(item);
                });

                this.toggleScreen('screen-dashboard');
            },

            launchGameArea(gameId) {
                STATE.currentGameId = gameId;
                const zone = document.getElementById('game-container-zone');
                zone.innerHTML = ''; // Wipe playground frame

                switch(gameId) {
                    case 1: GamesEngine.playFlashcards(zone); break;
                    case 2: GamesEngine.playQuiz(zone); break;
                    case 3: GamesEngine.playFillBlanks(zone); break;
                    case 4: GamesEngine.playWordSearch(zone); break;
                    case 5: GamesEngine.playMemory(zone); break;
                    case 6: GamesEngine.playDragSort(zone); break;
                    case 7: GamesEngine.playHangman(zone); break;
                    case 8: GamesEngine.playRoulette(zone); break;
                }
                this.toggleScreen('screen-game');
            }
        };

        // GAMES ENGINE CORE CONTROLLER
        const GamesEngine = {

            // JUEGO 1: FLASHCARDS TÁCTILES
            playFlashcards(target) {
                const cards = STATE.currentModule.flashcards;
                let idx = 0;

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>🃏 Flashcards Game</h2>
                    <p class="instruction-text">Tap the card to flip between grammar structures and conceptual analysis descriptions.</p>
                    <div class="flashcard-wrapper">
                        <div class="flashcard" id="fc-card-obj">
                            <div class="card-face card-front"><h3 id="fc-f-txt" style="font-size:1.3rem;"></h3><span style="font-size:0.75rem; margin-top:25px; opacity:0.7;">[Tap To Flip Card]</span></div>
                            <div class="card-face card-back"><p id="fc-b-txt" style="font-size:1.1rem; font-weight:600;"></p><span style="font-size:0.75rem; margin-top:25px; opacity:0.7;">[Tap To See Structure]</span></div>
                        </div>
                    </div>
                    <button class="btn" id="fc-next-trigger">Next Card ➡️</button>
                `;
                target.appendChild(view);

                const cardObj = document.getElementById('fc-card-obj');
                cardObj.addEventListener('click', () => cardObj.classList.toggle('flipped'));

                const refreshFC = () => {
                    cardObj.classList.remove('flipped');
                    setTimeout(() => {
                        document.getElementById('fc-f-txt').innerText = cards[idx].front;
                        document.getElementById('fc-b-txt').innerText = cards[idx].back;
                    }, 150);
                };

                document.getElementById('fc-next-trigger').addEventListener('click', () => {
                    idx++;
                    if(idx < cards.length) {
                        refreshFC();
                    } else {
                        view.innerHTML = `<h2 style="text-align:center; color:var(--color-success);">🎉 Deck Complete!</h2><p style="text-align:center; margin:15px 0;">Excellent! You have successfully reviewed all cards in this block.</p>`;
                    }
                });

                refreshFC();
            },

            // JUEGO 2: QUIZ KAHOOT-STYLE
            playQuiz(target) {
                const questions = STATE.currentModule.quiz;
                let idx = 0;
                let score = 0;

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>⚡ Kahoot-Style Quiz</h2>
                    <p class="instruction-text">Analyze syntax rules and choose the single structurally accurate option block.</p>
                    <div class="progress-bar-container"><div class="progress-bar" id="qz-pb"></div></div>
                    <h3 id="qz-prompt-string" style="margin:20px 0; min-height:60px;"></h3>
                    <div id="qz-choices-stack"></div>
                    <div id="qz-alert-box" class="feedback-message"></div>
                `;
                target.appendChild(view);

                const renderQuestion = () => {
                    document.getElementById('qz-alert-box').style.display = 'none';
                    document.getElementById('qz-pb').style.width = `${((idx) / questions.length) * 100}%`;

                    const currentQ = questions[idx];
                    document.getElementById('qz-prompt-string').innerText = `${idx + 1}. ${currentQ.q}`;

                    const stack = document.getElementById('qz-choices-stack');
                    stack.innerHTML = '';

                    // Safe structural randomization mapping layout array
                    let indices = currentQ.options.map((_, i) => i);
                    indices.sort(() => Math.random() - 0.5);

                    indices.forEach(oIdx => {
                        const optBtn = document.createElement('button');
                        optBtn.className = 'quiz-option';
                        optBtn.innerText = currentQ.options[oIdx];
                        optBtn.addEventListener('click', () => verifySelection(oIdx, optBtn));
                        stack.appendChild(optBtn);
                    });
                };

                const verifySelection = (chosenIdx, btn) => {
                    const correct = questions[idx].correct;
                    const options = document.querySelectorAll('.quiz-option');
                    options.forEach(b => b.disabled = true);

                    const alertBox = document.getElementById('qz-alert-box');
                    alertBox.style.display = 'block';

                    if(chosenIdx === correct) {
                        btn.classList.add('correct');
                        alertBox.innerText = "¡Correcto! Outstanding syntax recognition.";
                        alertBox.style.cssText = "background: rgba(46,125,50,0.15); color: var(--color-success); display:block;";
                        score++;
                    } else {
                        btn.classList.add('incorrect');
                        alertBox.innerText = "¡Incorrecto! Study the structural architecture definitions.";
                        alertBox.style.cssText = "background: rgba(211,47,47,0.15); color: var(--color-danger); display:block;";
                        
                        // Find and highlight correct answer
                        options.forEach(b => {
                            if(b.innerText === questions[idx].options[correct]) b.classList.add('correct');
                        });
                    }

                    setTimeout(() => {
                        idx++;
                        if(idx < questions.length) {
                            renderQuestion();
                        } else {
                            view.innerHTML = `
                                <h2 style="text-align:center; color:var(--color-primary);">Quiz Finished</h2>
                                <p style="text-align:center; font-size:1.6rem; margin:20px 0; font-weight:bold;">Final Score: ${score} / ${questions.length}</p>
                                <p style="text-align:center; color:var(--text-muted);">Evaluation block sequence fully finalized.</p>
                            `;
                        }
                    }, 2000);
                };

                renderQuestion();
            },

            // JUEGO 3: FILL IN THE BLANKS
            playFillBlanks(target) {
                const sentences = STATE.currentModule.fillblanks;
                let idx = 0;

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>✏️ Fill in the Blanks</h2>
                    <p class="instruction-text">Type down the precise missing grammar term key to establish contextual validation alignment.</p>
                    <h3 id="fb-string" style="margin:30px 0; line-height:1.6;"></h3>
                    <div style="display:flex; gap:12px;">
                        <input type="text" id="fb-user-input" style="flex:1; padding:12px; font-size:1rem; border-radius:10px; border:2px solid var(--color-primary); background:var(--bg-card); color:var(--text-main);" placeholder="Write missing string here...">
                        <button class="btn btn-accent" id="fb-check-btn" style="margin:0; width:auto;">Check</button>
                    </div>
                    <div id="fb-msg" class="feedback-message"></div>
                `;
                target.appendChild(view);

                const setupBlank = () => {
                    document.getElementById('fb-msg').style.display = 'none';
                    document.getElementById('fb-user-input').value = '';
                    const exercise = sentences[idx];
                    document.getElementById('fb-string').innerText = exercise.text.replace(/\[.*?\]/g, "_______");
                };

                document.getElementById('fb-check-btn').addEventListener('click', () => {
                    const input = document.getElementById('fb-user-input').value.trim().toLowerCase();
                    const correct = sentences[idx].answer.toLowerCase();
                    const msg = document.getElementById('fb-msg');
                    msg.style.display = 'block';

                    if(input === correct) {
                        msg.innerText = "¡Correcto! Flawless term application.";
                        msg.style.cssText = "background: rgba(46,125,50,0.15); color: var(--color-success); display:block;";
                        
                        setTimeout(() => {
                            idx++;
                            if(idx < sentences.length) setupBlank();
                            else view.innerHTML = `<h2 style="text-align:center; color:var(--color-success);">🎉 Blanks Finished!</h2><p style="text-align:center; margin-top:10px;">All contextual fill challenges resolved successfully.</p>`;
                        }, 1800);
                    } else {
                        msg.innerText = "¡Incorrecto! Analyze the word context constraints carefully.";
                        msg.style.cssText = "background: rgba(211,47,47,0.15); color: var(--color-danger); display:block;";
                    }
                });

                setupBlank();
            },

            // JUEGO 4: WORD SEARCH
            playWordSearch(target) {
                const words = STATE.currentModule.wordsearch;
                const size = 8;
                let grid = Array(size).fill(null).map(() => Array(size).fill(''));
                let selected = [];
                let found = [];

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>🔍 Word Search</h2>
                    <p class="instruction-text">Click individual cell matrix keys to isolate the expected list targets vocabulary keys.</p>
                    <div style="margin-bottom:12px; font-weight:bold;">Find words: <span id="ws-keys-pool" style="color:var(--color-primary);"></span></div>
                    <div class="wordsearch-grid" id="ws-matrix"></div>
                    <button class="btn btn-accent" id="ws-evaluate-trigger">Submit Combination</button>
                `;
                target.appendChild(view);

                // Basic grid filler logic loop
                words.forEach(w => {
                    let placed = false;
                    while(!placed) {
                        let r = Math.floor(Math.random() * size);
                        let c = Math.floor(Math.random() * (size - w.length));
                        let clean = true;
                        for(let i=0; i<w.length; i++) {
                            if(grid[r][c+i] !== '') clean = false;
                        }
                        if(clean) {
                            for(let i=0; i<w.length; i++) grid[r][c+i] = w[i];
                            placed = true;
                        }
                    }
                });

                const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                for(let r=0; r<size; r++) {
                    for(let c=0; c<size; c++) {
                        if(grid[r][c] === '') grid[r][c] = letters[Math.floor(Math.random() * 26)];
                    }
                }

                const printGrid = () => {
                    const mEl = document.getElementById('ws-matrix');
                    mEl.innerHTML = '';
                    document.getElementById('ws-keys-pool').innerText = words.filter(item => !found.includes(item)).join(", ");

                    for(let r=0; r<size; r++) {
                        for(let c=0; c<size; c++) {
                            const cell = document.createElement('div');
                            cell.className = 'ws-cell';
                            cell.innerText = grid[r][c];
                            cell.setAttribute('data-coord', `${r}-${c}`);
                            
                            cell.addEventListener('click', () => {
                                cell.classList.toggle('selected');
                                toggleSelectionState(`${r}-${c}`);
                            });
                            mEl.appendChild(cell);
                        }
                    }
                };

                const toggleSelectionState = (coord) => {
                    const index = selected.indexOf(coord);
                    if(index > -1) selected.splice(index, 1);
                    else selected.push(coord);
                };

                document.getElementById('ws-evaluate-trigger').addEventListener('click', () => {
                    let collectedStr = selected.map(coord => {
                        const [r, c] = coord.split("-").map(Number);
                        return grid[r][c];
                    }).join("");

                    let reversedStr = collectedStr.split("").reverse().join("");
                    let match = words.find(w => (w === collectedStr || w === reversedStr) && !found.includes(w));

                    if(match) {
                        found.push(match);
                        selected.forEach(coord => {
                            const matchedCell = document.querySelector(`[data-coord="${coord}"]`);
                            if(matchedCell) {
                                matchedCell.classList.remove('selected');
                                matchedCell.classList.add('found');
                            }
                        });
                        selected = [];
                        if(found.length === words.length) {
                            alert("¡Ganaste! Entire matrix grid parameters fully extracted.");
                        } else {
                            document.getElementById('ws-keys-pool').innerText = words.filter(item => !found.includes(item)).join(", ");
                        }
                    } else {
                        alert("Selection does not correspond to an undetected targets term list component.");
                    }
                });

                printGrid();
            },

            // JUEGO 5: MEMORY (PAREJAS)
            playMemory(target) {
                const pairs = STATE.currentModule.memory;
                let deck = [];
                pairs.forEach((p, index) => {
                    deck.push({ text: p.a, matchId: index, uid: Math.random() });
                    deck.push({ text: p.b, matchId: index, uid: Math.random() });
                });
                deck.sort(() => Math.random() - 0.5);

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>🧠 Memory Pairs Match</h2>
                    <p class="instruction-text">Reveal hidden entities pairwise to bridge relational grammar links.</p>
                    <div class="memory-grid" id="mm-board"></div>
                `;
                target.appendChild(view);

                let flippedCards = [];
                let lockBoard = false;
                let pairsFound = 0;

                const board = document.getElementById('mm-board');
                deck.forEach((cardData, idx) => {
                    const cNode = document.createElement('div');
                    cNode.className = 'memory-card';
                    cNode.innerText = cardData.text;
                    cNode.setAttribute('data-id', idx);
                    
                    cNode.addEventListener('click', () => {
                        if(lockBoard || cNode.classList.contains('flipped') || cNode.classList.contains('matched')) return;
                        
                        cNode.classList.add('flipped');
                        flippedCards.push({ data: cardData, node: cNode });

                        if(flippedCards.length === 2) {
                            lockBoard = true;
                            if(flippedCards[0].data.matchId === flippedCards[1].data.matchId) {
                                flippedCards[0].node.classList.add('matched');
                                flippedCards[1].node.classList.add('matched');
                                pairsFound++;
                                flippedCards = [];
                                lockBoard = false;
                                if(pairsFound === pairs.length) {
                                    setTimeout(() => alert("¡Ganaste! Complete cognitive network synchronized successfully."), 300);
                                }
                            } else {
                                setTimeout(() => {
                                    flippedCards[0].node.classList.remove('flipped');
                                    flippedCards[1].node.classList.remove('flipped');
                                    flippedCards = [];
                                    lockBoard = false;
                                }, 1200);
                            }
                        }
                    });
                    board.appendChild(cNode);
                });
            },

            // JUEGO 6: DRAG & SORT (Using drop-down selectors for rock-solid smartphone execution)
            playDragSort(target) {
                const config = STATE.currentModule.dragsort;

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>📦 Drag & Sort Categories</h2>
                    <p class="instruction-text">Map each grammatical segment card to its correct taxonomy box folder destination.</p>
                    <div id="ds-stack-area" style="display:flex; flex-direction:column; gap:10px; margin:20px 0;"></div>
                    <button class="btn btn-accent" id="ds-evaluate-btn">Verify Category Sorting</button>
                `;
                target.appendChild(view);

                const stack = document.getElementById('ds-stack-area');
                config.items.forEach((item, index) => {
                    const elementRow = document.createElement('div');
                    elementRow.className = 'quiz-option';
                    elementRow.style.cssText = 'display:flex; align-items:center; justify-content:space-between; cursor:default; margin-bottom:6px;';
                    
                    let selectorOptions = config.categories.map(catName => `<option value="${catName}">${catName}</option>`).join("");
                    
                    elementRow.innerHTML = `
                        <span style="font-weight:600;">"${item.text}"</span>
                        <select id="ds-opt-sel-${index}" style="padding:8px; border-radius:6px; background:var(--bg-primary); color:var(--text-main); font-weight:bold; border:1px solid var(--color-primary);">
                            ${selectorOptions}
                        </select>
                    `;
                    stack.appendChild(elementRow);
                });

                document.getElementById('ds-evaluate-btn').addEventListener('click', () => {
                    let totalItems = config.items.length;
                    let matchesCount = 0;

                    config.items.forEach((item, index) => {
                        const alignedSelection = document.getElementById(`ds-opt-sel-${index}`).value;
                        if(alignedSelection === item.cat) matchesCount++;
                    });

                    alert(`Evaluation completed: ${matchesCount} out of ${totalItems} categories aligned correctly.`);
                });
            },

            // JUEGO 7: DIGITAL HANGMAN
            playHangman(target) {
                const itemsPool = STATE.currentModule.hangman;
                const activeSession = itemsPool[Math.floor(Math.random() * itemsPool.length)];
                let pickedLetters = [];
                let structuralLifelines = 6;

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>💀 Digital Hangman</h2>
                    <p class="instruction-text">Deduce target lexical strings before exhausting systemic life tolerances.</p>
                    <p style="font-weight:bold; color:var(--color-primary); margin-bottom:8px;">HINT CLAUSE: "${activeSession.hint}"</p>
                    <p style="font-size:1rem; font-weight:bold; margin-bottom:12px;">Remaining Lifelines: <span id="hm-life-span" style="color:var(--color-danger);">${structuralLifelines}</span> 🩸</p>
                    <div class="word-display" id="hm-crypt-display"></div>
                    <div class="keyboard-grid" id="hm-onscreen-keyboard"></div>
                `;
                target.appendChild(view);

                const refreshCryptString = () => {
                    let currentString = "";
                    let completeSuccess = true;

                    for(let letterChar of activeSession.word) {
                        if(pickedLetters.includes(letterChar)) {
                            currentString += letterChar + " ";
                        } else {
                            currentString += "_ ";
                            completeSuccess = false;
                        }
                    }
                    document.getElementById('hm-crypt-display').innerText = currentString.trim();

                    if(completeSuccess) {
                        terminateSession(true);
                    } else if(structuralLifelines <= 0) {
                        terminateSession(false);
                    }
                };

                const terminateSession = (wonFlag) => {
                    document.getElementById('hm-onscreen-keyboard').innerHTML = wonFlag ? 
                        `<h3 style="grid-column: span 7; text-align:center; color:var(--color-success); padding:10px;">¡Ganaste! Core vocabulary sequence resolved perfectly.</h3>` :
                        `<h3 style="grid-column: span 7; text-align:center; color:var(--color-danger); padding:10px;">¡Incorrecto! Target sequence resolved: ${activeSession.word}</h3>`;
                };

                const alphabetList = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
                const keyboardNode = document.getElementById('hm-onscreen-keyboard');
                alphabetList.forEach(letter => {
                    const keyButton = document.createElement('button');
                    keyButton.className = 'key-btn';
                    keyButton.innerText = letter;
                    keyButton.addEventListener('click', () => {
                        keyButton.disabled = true;
                        pickedLetters.push(letter);
                        if(!activeSession.word.includes(letter)) {
                            structuralLifelines--;
                            document.getElementById('hm-life-span').innerText = structuralLifelines;
                        }
                        refreshCryptString();
                    });
                    keyboardNode.appendChild(keyButton);
                });

                refreshCryptString();
            },

            // JUEGO 8: RULETA DE PREGUNTAS
            playRoulette(target) {
                const promptPool = STATE.currentModule.roulette;

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>🎡 Wheel of Questions</h2>
                    <p class="instruction-text">Spin the active radial wheel to select an existential conversation prompt statement.</p>
                    <div class="roulette-container">
                        <div class="wheel-pointer"></div>
                        <div class="wheel" id="ui-wheel-object"></div>
                    </div>
                    <button class="btn btn-accent" id="wheel-spin-trigger">Spin Radial Wheel</button>
                    <h3 id="wheel-output-panel" style="text-align:center; min-height:45px; margin-top:20px; color:var(--color-primary); padding:10px; line-height:1.4;"></h3>
                `;
                target.appendChild(view);

                let wheelSpinningState = false;
                document.getElementById('wheel-spin-trigger').addEventListener('click', () => {
                    if(wheelSpinningState) return;
                    wheelSpinningState = true;
                    document.getElementById('wheel-output-panel').innerText = "";

                    const rotationDegreesTarget = Math.floor(Math.random() * 360) + 1440; // min 4 full radial sweeps
                    const wheelNode = document.getElementById('ui-wheel-object');
                    wheelNode.style.transform = `rotate(${rotationDegreesTarget}deg)`;

                    setTimeout(() => {
                        wheelSpinningState = false;
                        const finalSelectedPrompt = promptPool[Math.floor(Math.random() * promptPool.length)];
                        document.getElementById('wheel-output-panel').innerText = `🎯 Selected Prompt: "${finalSelectedPrompt}"`;
                        
                        // Reset rotation transform properties safely without visual stutter
                        wheelNode.style.transition = 'none';
                        wheelNode.style.transform = `rotate(${rotationDegreesTarget % 360}deg)`;
                        setTimeout(() => { wheelNode.style.transition = 'transform 3s cubic-bezier(0.1, 0.8, 0.1, 1)'; }, 40);
                    }, 3050);
                });
            }
        };

        // RUN INIT ROUTINE ON LOAD
        document.addEventListener('DOMContentLoaded', () => UI.init());

        // MANDATORY RUNTIME SECURITY INTERVAL COMPLIANCE VERIFICATION CHECK
        setInterval(() => {
            const firma = document.getElementById('firma-seguridad');
            const app = document.getElementById('app');
            const bloqueado = document.getElementById('acceso-denegado');
            if (!firma || firma.textContent.trim() !== 'Creado por Tony Salas & German Peña' ||
                getComputedStyle(firma).display === 'none' ||
                getComputedStyle(firma).opacity === '0' ||
                getComputedStyle(firma).visibility === 'hidden') {
                if (app) app.style.display = 'none';
                if (!bloqueado) {
                    const div = document.createElement('div');
                    div.id = 'acceso-denegado';
                    div.style.cssText = 'position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;';
                    div.innerHTML = '<p style="color:red;font-size:2rem;text-align:center;padding:2rem;">⚠️ ACCESO DENEGADO ⚠️<br><span style="font-size:1rem;">El código de seguridad y la firma han sido alterados. CREA TU VERGA TU, CARA E MONDA.</span></p>';
                    document.body.appendChild(div);
                }
            }
        }, 1000);
    </script>
