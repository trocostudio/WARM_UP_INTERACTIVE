        { word: "spend", translation: "To pay out money for purchasing goods or services, or to pass time in a place." },
        { word: "exercise", translation: "Physical activity that you do to make your body strong and stay healthy." },
        { word: "collocation", translation: "The habitual combination of specific words that frequently occur together in language." }
    ],

    grammar: [
        {
            rules: "Real Conditionals (Zero/First): Use 'If + Present Tense, Present Tense' to talk about general scientific facts, automated rules, or habitual real outcomes.",
            examples: ["If I drink too much coffee in the evening, I cannot sleep at night.", "If you feel stressed out, remember to take deep breaths."]
        },
        {
            rules: "Reason Clauses with Because: Implement the conjunction 'because' to provide a logical cause, justification, or clarification for an action.",
            examples: ["I joined the local gym because I wanted to improve my health.", "I feel stressed today because I have three difficult exams tomorrow."]
        },
        {
            rules: "Gerunds as Subjects: When an action acts as the primary subject noun of a sentence clause, it MUST use the gerund (-ing) format.",
            examples: ["Spending money on useless items is a terrible financial habit.", "Arriving late for university classes makes our professor feel annoyed."]
        },
        {
            rules: "Gerunds as Objects: Certain psychological preference verbs (like enjoy, hate, love, avoid, dislike) take a gerund syntax layout directly behind them.",
            examples: ["I enjoy spending time with creative individuals.", "He hates waking up early in the morning."]
        },
        {
            rules: "Short Affirmative Agreements: Agree with affirmative clauses using 'So + auxiliary/be + I' or 'I + auxiliary/be + too'. Match the original tense.",
            examples: ["I am a very hardworking student. - So do I. (Incorrect, should match 'be': So am I) | Note standard layout: I love sports. - So do I."]
        },
        {
            rules: "Short Negative Agreements: Agree with negative clauses using 'Neither + auxiliary/be + I' or 'I + auxiliary/be + not + either'.",
            examples: ["I don't like dealing with critical coworkers. - Neither do I.", "I can't stand being around impatient people. - I can't either."]
        }
    ],

    quiz: [
        { q: "If I _______ too much coffee in the evening, I cannot sleep at night.", a: ["drink", "will drink", "drank"], c: "drink" },
        { q: "If you want to get in shape, you _______ to exercise on a regular basis.", a: ["need", "will need to", "needed"], c: "need" },
        { q: "I decided to join the local gym _______ I wanted to improve my physical health.", a: ["because", "if", "so"], c: "because" },
        { q: "_______ money on useless items is a terrible financial habit for young people.", a: ["Spending", "To spend", "Spend"], c: "Spending" },
        { q: "I enjoy _______ time with creative individuals who have positive artistic habits.", a: ["spending", "to spend", "spend"], c: "spending" },
        { q: "I am a very hardworking student. - _______ do I. I study every single night.", a: ["So", "Neither", "Either"], c: "So" },
        { q: "I don't like dealing with moody or critical coworkers. - _______ do I.", a: ["Neither", "So", "Either"], c: "Neither" },
        { q: "I can't stand being around impatient people. - I can't _______.", a: ["either", "neither", "so"], c: "either" },
        { q: "Our new design manager is incredibly _______; she always has brilliant ideas.", a: ["creative", "impatient", "critical"], c: "creative" },
        { q: "If he gets stuck in a long traffic line, he becomes highly _______ and starts complaining.", a: ["impatient", "hardworking", "moody"], c: "impatient" },
        { q: "_______ late for university classes makes our professor feel very annoyed.", a: ["Arriving", "Arrive", "To arrive"], c: "Arriving" },
        { q: "I feel incredibly stressed today _______ I have three difficult exams tomorrow.", a: ["because", "if", "neither"], c: "because" },
        { q: "I don't spend a lot of money on clothing items. - _______ do I.", a: ["Neither", "So", "Either"], c: "Neither" },
        { q: "I love practicing outdoor sports. - So _______ I. It keeps me completely healthy.", a: ["do", "am", "have"], c: "do" },
        { q: "She is a very _______ worker; she stays at the office until 9:00 PM every day.", a: ["hardworking", "moody", "anxious"], c: "hardworking" },
        { q: "My sister is quite _______; one minute she is happy, and the next she is furious.", a: ["moody", "creative", "impatient"], c: "moody" },
        { q: "If you _______ stressed out, remember to take deep breaths and rest.", a: ["feel", "feels", "will feel"], c: "feel" },
        { q: "_______ healthy meals is crucial if you want to maintain an excellent lifestyle.", a: ["Eating", "Eat", "Eaten"], c: "Eating" },
        { q: "I am not anxious about the final English presentation. - I'm not _______.", a: ["either", "neither", "so"], c: "either" },
        { q: "He hates _______ early in the morning because he is a night owl.", a: ["waking up", "wake up", "to waking up"], c: "waking up" }
    ]
},
            "u11-12": {
    badge: "Units 11-12",
    title: "Global Facts, Passive Voice & Emotions",
    details: "Grammar: Passive Voice with by (Simple Past) | Passive Voice without by (Simple Present) | Past Continuous vs. Simple Past | Participles as Adjectives (-ing vs -ed)",
    
    prompts: [
        "Name a major product that is manufactured in your country. Use the Simple Present Passive.",
        "What language is spoken by the majority of people in Brazil?",
        "Who was the telephone invented by? Answer using the Simple Past Passive.",
        "What were you doing yesterday when the lights suddenly went out at home?",
        "Describe an exciting travel experience you had using the adjective 'exciting'.",
        "How do you feel when you have to speak in public? Are you bored or embarrassed?",
        "What crops or foods are raised or grown in the agricultural parts of your region?",
        "Luckily, what happened to you during a difficult situation in the past?",
        "Was the internet developed in the 20th century? Structure a passive statement.",
        "Tell me about a confusing grammar topic. Why was it confusing to you?"
    ],

    vocabulary: [
        { word: "language", translation: "A system of communication used by a particular country or community." },
        { word: "currency", translation: "The system of money in general use in a particular country." },
        { word: "manufacture", translation: "To make goods on a large scale using machinery and factory processes." },
        { word: "grow", translation: "To cultivate plants or food items in soil as part of an agricultural process." },
        { word: "raise", translation: "To breed or keep animals or crops for food and economic production." },
        { word: "speak", translation: "To utter words or articulate a specific language to communicate thoughts." },
        { word: "invent", translation: "To create or design a new machine, device, or process for the first time." },
        { word: "luckily", translation: "An adverb used to express that something good happened by chance or fortune." },
        { word: "boring", translation: "An adjective describing a situation or activity that is dull and uninteresting." },
        { word: "bored", translation: "An adjective describing the internal feeling of someone who lacks interest." },
        { word: "exciting", translation: "An adjective describing an event or situation that causes great enthusiasm." },
        { word: "excited", translation: "An adjective describing the feeling of someone looking forward to something." },
        { word: "confusing", translation: "An adjective describing something unclear that makes people feel bewildered." },
        { word: "confused", translation: "An adjective describing the internal feeling of someone who cannot understand." },
        { word: "embarrassed", translation: "An adjective describing the feeling of shame or awkwardness in public." },
        { word: "annoyed", translation: "An adjective describing the feeling of being slightly angry or irritated." },
        { word: "amazed", translation: "An adjective describing the feeling of being very surprised or impressed." },
        { word: "terrible", translation: "An adjective describing something extremely bad or unpleasant." },
        { word: "amusing", translation: "An adjective describing something funny or entertaining." },
        { word: "passive", translation: "A grammatical structure where the subject receives the action instead of doing it." },
        { word: "fact", translation: "A piece of information used as evidence or as part of a report about reality." }
    ],

    grammar: [
        {
            rules: "Simple Present Passive: Use 'am/is/are + past participle' for general truths, industrial processes, or recurring facts.",
            examples: ["Cars are manufactured in factories.", "Spanish is spoken in many countries."]
        },
        {
            rules: "Simple Past Passive: Use 'was/were + past participle' for completed historical events. Add 'by' to identify the agent.",
            examples: ["The telephone was invented by Bell.", "These sculptures were discovered by a farmer."]
        },
        {
            rules: "Past Continuous & Interruption: Use 'was/were + verb-ing' for background actions in the past. Use Simple Past for short interruptions (when/while).",
            examples: ["I was eating dinner when the power failed.", "While they were walking, they saw a bear."]
        },
        {
            rules: "Participle Adjectives: Use '-ing' adjectives for the CAUSE of the feeling (the situation). Use '-ed' adjectives for the PERSON'S FEELING.",
            examples: ["The lecture was boring; I felt bored.", "The instructions were confusing; I felt confused."]
        }
    ],

    quiz: [
        { q: "Thousands of high-tech cars _______ in Japan every single day by robotic factories.", a: ["are manufactured", "manufactured", "is manufactured"], c: "are manufactured" },
        { q: "The famous play Romeo and Juliet _______ written by William Shakespeare in the 16th century.", a: ["was", "is", "were"], c: "was" },
        { q: "Coffee beans _______ in large quantities in the tropical mountains of Colombia.", a: ["are grown", "grow", "is grown"], c: "are grown" },
        { q: "I _______ my dinner when the power grid suddenly failed completely across the city.", a: ["was eating", "ate", "have eaten"], c: "was eating" },
        { q: "While they _______ through the national park, they saw a massive wild bear.", a: ["were walking", "walked", "are walking"], c: "were walking" },
        { q: "The long grammar lecture was incredibly _______; half the students fell asleep.", a: ["boring", "bored", "boredom"], c: "boring" },
        { q: "I felt so _______ because I forgot my presentation notes during the business meeting.", a: ["embarrassed", "embarrassing", "embarrass"], c: "embarrassed" },
        { q: "The official _______ of the United States is the dollar.", a: ["currency", "language", "fact"], c: "currency" },
        { q: "Strangely, the missing museum paintings _______ found inside an old abandoned vehicle.", a: ["were", "was", "are"], c: "were" },
        { q: "The tourist map was highly _______, so we got completely lost within ten minutes.", a: ["confusing", "confused", "confuse"], c: "confusing" },
        { q: "Spanish _______ spoken by hundreds of millions of citizens throughout Latin America.", a: ["is", "are", "was"], c: "is" },
        { q: "The telephone was _______ by Alexander Graham Bell in the year 1876.", a: ["invented", "invent", "inventing"], c: "invented" },
        { q: "I am extremely _______ to visit the historical ruins of Machu Picchu next week.", a: ["excited", "exciting", "excite"], c: "excited" },
        { q: "We were sleeping peacefully when a loud alarm _______ ringing across the hallway.", a: ["started", "was starting", "starts"], c: "started" },
        { q: "Rice is _______ in flooded fields in many agricultural regions of Asia.", a: ["grown", "grew", "growed"], c: "grown" },
        { q: "The science museum display was absolutely _______; the kids loved it.", a: ["amazing", "amazed", "amaze"], c: "amazing" },
        { q: "I was completely _______ by the complicated instructions on the tax form.", a: ["confused", "confusing", "confuse"], c: "confused" },
        { q: "_______, no one was injured during the intense storm that hit the coastline yesterday.", a: ["Luckily", "Strangely", "Terrible"], c: "Luckily" },
        { q: "The movie was so _______ that my mother could not stop laughing out loud.", a: ["amusing", "amused", "amusement"], c: "amusing" },
        { q: "These ancient sculptures _______ discovered by a local farmer three decades ago.", a: ["were", "was", "are discovered"], c: "were" }
    ]
},
            "u13-14": {
    badge: "Units 13-14",
    title: "Relative Clauses, Modals & Social Rules",
    details: "Grammar: Relative Pronouns (who, which, that) | Modals & Adverbs for Certainty (might, may, could, must, maybe) | Permission, Obligation & Prohibition",
    
    prompts: [
        "Describe a person who has had a massive positive influence on your education.",
        "What is a popular electronic gadget that you absolutely cannot live without?",
        "Look at the dark clouds outside. What might happen later this afternoon?",
        "What is a strict rule in your school or workplace? Use a modal of obligation.",
        "Are you allowed to park your car anywhere you want in downtown areas?",
        "What is something that is completely prohibited inside an international airport?",
        "Perhaps you will travel next year. Express this possibility using 'may'.",
        "Define a dictionary: 'It is a book which contains...'. Practice relative pronouns.",
        "What must a citizen do before they can legally drive a vehicle on public roads?",
        "Where is a place that you probably won't go this weekend? Explain why."
    ],

    vocabulary: [
        { word: "who", translation: "A relative pronoun used to introduce information about people." },
        { word: "which", translation: "A relative pronoun used to introduce information about objects or things." },
        { word: "that", translation: "A relative pronoun used for both people and things in defining clauses." },
        { word: "might", translation: "A modal verb expressing a weak possibility in the present or future." },
        { word: "may", translation: "A modal verb expressing a possibility or asking for permission." },
        { word: "could", translation: "A modal verb indicating a possibility or a past ability." },
        { word: "must", translation: "A modal verb indicating strong necessity or a logical deduction." },
        { word: "maybe", translation: "An adverb meaning 'perhaps' or 'possibly', usually placed at the start." },
        { word: "perhaps", translation: "An adverb used to express uncertainty or possibility." },
        { word: "probably", translation: "An adverb used to indicate that something is very likely to happen." },
        { word: "permission", translation: "The act of allowing someone to do something; formal consent." },
        { word: "obligation", translation: "A requirement or duty to perform a specific action." },
        { word: "prohibition", translation: "The act of forbidding something or stating it is against the rules." },
        { word: "rule", translation: "An explicit instruction or regulation governing conduct or action." },
        { word: "gadget", translation: "A small, innovative electronic tool or device designed for a specific task." },
        { word: "citizen", translation: "A legally recognized subject or national of a state or commonwealth." },
        { word: "prohibited", translation: "Strictly forbidden by law, regulation, or authority." },
        { word: "allowed", translation: "Given permission to do something; permitted." },
        { word: "accept", translation: "To consent to receive or undertake something offered." },
        { word: "refuse", translation: "To indicate that one is not willing to do or accept something." },
        { word: "forget", translation: "To fail to remember or to have lost from one's memory." },
        { word: "remember", translation: "To have in or be able to bring to one's mind an awareness of the past." },
        { word: "opposite", translation: "Having a position on the other side or being completely different." }
    ],

    grammar: [
        {
            rules: "Relative Pronouns: Use 'who' for people and 'which/that' for objects to add descriptive definitions to nouns.",
            examples: ["The teacher who teaches chemistry is smart.", "I want a laptop that has a long battery."]
        },
        {
            rules: "Certainty & Possibility: Use 'must' for near-certainty based on evidence. Use 'might/may/could' for weak possibility.",
            examples: ["He must be driving now. (Evidence)", "It might rain later today. (Possibility)"]
        },
        {
            rules: "Adverbs of Possibility: 'Maybe/Perhaps' start the sentence. 'Probably' follows 'be' or precedes main verbs.",
            examples: ["Perhaps we will move.", "She probably goes to the gym."]
        },
        {
            rules: "Permission, Obligation, Prohibition: Use 'must/have to' for mandatory duties, 'must not/can't' for forbidden actions, and 'can/be allowed to' for permission.",
            examples: ["You must wear a seatbelt.", "You can't use phones during exams.", "Visitors are allowed to enter."]
        }
    ],

    quiz: [
        { q: "The teacher _______ teaches the advanced chemistry class is incredibly smart.", a: ["who", "which", "whose"], c: "who" },
        { q: "I want to buy a new laptop _______ has a much longer battery life for trips.", a: ["which", "who", "whom"], c: "which" },
        { q: "He is not answering his phone. He _______ be driving his car right now.", a: ["must", "can't not", "probably"], c: "must" },
        { q: "Take an umbrella with you; the sky is gray and it _______ rain later today.", a: ["might", "must", "maybe"], c: "might" },
        { q: "_______ we will move to a different apartment next year, but we aren't sure yet.", a: ["Perhaps", "Might", "Probably"], c: "Perhaps" },
        { q: "You _______ smoke inside the hospital building; it is strictly prohibited by law.", a: ["must not", "can", "don't have to"], c: "must not" },
        { q: "Visitors _______ allowed to take photos inside this historical art museum.", a: ["are not", "must not", "can't"], c: "are not" },
        { q: "A lawyer is a professional person _______ assists citizens with legal matters.", a: ["who", "which", "where"], c: "who" },
        { q: "This is the identical book _______ I borrowed from the public library last week.", a: ["that", "who", "whom"], c: "that" },
        { q: "She _______ goes to the local gym after work, but today she is feeling sick.", a: ["probably", "maybe", "might"], c: "probably" },
        { q: "You _______ wear a seatbelt at all times while driving a vehicle on the highway.", a: ["must", "may", "could"], c: "must" },
        { q: "Students _______ use their cell phones during the final English examination.", a: ["can't", "must to", "are allowed"], c: "can't" },
        { q: "I am not sure where my keys are. They _______ be inside my office desk.", a: ["could", "must", "probably"], c: "could" },
        { q: "The company _______ manufactures these high-tech devices is located in Seoul.", a: ["which", "who", "where"], c: "which" },
        { q: "You _______ pay a fee if you want to enter this private recreation park.", a: ["have to", "may", "might"], c: "have to" },
        { q: "What is the opposite of the verb 'remember'? It is to _______.", a: ["forget", "accept", "refuse"], c: "forget" },
        { q: "If you want to park here, you must get special _______ from the building manager.", a: ["permission", "obligation", "prohibition"], c: "permission" },
        { q: "He _______ sign the work contract today because he doesn't agree with the salary.", a: ["may not", "must", "probably"], c: "may not" },
        { q: "The restaurant _______ serves the best Italian pasta is just around the corner.", a: ["that", "who", "where"], c: "that" },
        { q: "We are _______ going to stay home tonight because we are completely exhausted.", a: ["probably", "maybe", "perhaps"], c: "probably" }
    ]
},
            "u15-16": {
    badge: "Units 15-16",
    title: "Unreal Situations & Reported Speech",
    details: "Grammar: Unreal Conditional Sentences (If + past, would + base) | Past Modals (should/could/would have) | Reported Speech (Requests and Statements)",
    
    prompts: [
        "If you won a million dollars in a global lottery, what would you buy first?",
        "If you could travel anywhere in the world tonight, which country would you visit?",
        "Think of a past mistake. What should you have done differently to avoid it?",
        "Imagine a friend asked you for a favor: 'Please help me move.' Report their request.",
        "Your boss said: 'I am busy today.' Report what he said using indirect speech.",
        "What would you do if you saw a famous Hollywood celebrity walking down the street?",
        "Report this specific command: 'Don't open the door.' The police officer told me...",
        "What could you have accomplished last year if you had studied more English?",
        "If you were the president of your country, what major law would you change?",
        "Report what your teacher told the class yesterday about the final grading project."
    ],

    vocabulary: [
        { word: "unreal", translation: "Imaginary or hypothetical, describing situations that are not currently real." },
        { word: "conditional", translation: "A grammatical structure indicating a condition and its likely or hypothetical result." },
        { word: "would", translation: "A modal auxiliary used to express the result of an unreal or imaginary condition." },
        { word: "should have", translation: "A past modal used to express regret or criticism about a past action that didn't occur." },
        { word: "could have", translation: "A past modal expressing a possibility or ability in the past that was not utilized." },
        { word: "would have", translation: "A past modal used to talk about a past hypothetical outcome that did not happen." },
        { word: "request", translation: "An act of asking someone to do something in a polite or formal manner." },
        { word: "statement", translation: "A clear expression or declaration of something in speech or writing." },
        { word: "apology", translation: "An expression of regret or remorse for having made a mistake or caused offense." },
        { word: "collocation", translation: "Words that naturally go together in a specific context." },
        { word: "story", translation: "An account of imaginary or real people and events told for entertainment." },
        { word: "say", translation: "To utter words; used in reported speech to convey information without a direct object." },
        { word: "tell", translation: "To give information to a person; requires an indirect object (e.g., 'told me')." },
        { word: "report", translation: "To give a spoken or written account of something that one has observed or heard." },
        { word: "mistake", translation: "An action or judgment that is misguided or wrong." },
        { word: "lottery", translation: "A game of chance where people buy tickets to win a large prize." },
        { word: "celebrity", translation: "A famous or well-known person, often in entertainment or public life." },
        { word: "favor", translation: "An act of kindness beyond what is due or usual." },
        { word: "advice", translation: "Guidance or recommendations offered with regard to prudent future action." },
        { word: "contrasts", translation: "The state of being strikingly different from something else." }
    ],

    grammar: [
        {
            rules: "Second Conditional: Use 'If + Simple Past, would + base verb' for hypothetical situations. Note: Always use 'were' for 'to be' (e.g., 'If I were you').",
            examples: ["If I won the lottery, I would buy a house.", "If she were here, she would help us."]
        },
        {
            rules: "Past Modals (Regret/Possibility): Use 'should have/could have + past participle' to discuss past actions that could have happened differently.",
            examples: ["I should have studied more.", "We could have arrived on time."]
        },
        {
            rules: "Reported Statements: Move verb tenses back one step (Present -> Past, Will -> Would) and update pronouns to match the current perspective.",
            examples: ["'I am tired' -> He said he was tired.", "'I will call' -> He said he would call."]
        },
        {
            rules: "Reported Requests/Commands: Use 'asked/told + person + (not) to + base verb' to report requests and orders.",
            examples: ["'Please help me' -> He asked me to help him.", "'Don't talk' -> She told them not to talk."]
        }
    ],

    quiz: [
        { q: "If I _______ a million dollars, I would immediately buy a massive mansion by the sea.", a: ["won", "win", "would win"], c: "won" },
        { q: "If he _______ the president of the nation, he would reduce taxes for all citizens.", a: ["were", "was", "is"], c: "were" },
        { q: "I failed the English exam. I should have _______ harder during the weekend.", a: ["studied", "study", "studying"], c: "studied" },
        { q: "The traffic was terrible. We could have _______ on time if we had taken the subway.", a: ["arrived", "arrive", "arriving"], c: "arrived" },
        { q: "Mary said, 'I am very tired.' - Mary reported that she _______ very tired.", a: ["was", "is", "were"], c: "was" },
        { q: "John told me, 'I will call you tomorrow.' - John said that he _______ call me the next day.", a: ["would", "will", "going to"], c: "would" },
        { q: "The doctor told me, 'Please quit smoking.' - The doctor asked me _______ smoking.", a: ["to quit", "quit", "not to quit"], c: "to quit" },
        { q: "The teacher told the students, 'Don't talk during the test.' - She told them _______ during the test.", a: ["not to talk", "to not talk", "don't talk"], c: "not to talk" },
        { q: "If I _______ you, I would accept their apology and move forward.", a: ["were", "am", "had been"], c: "were" },
        { q: "I lost my phone. I shouldn't have _______ it on the restaurant table.", a: ["left", "leave", "leaving"], c: "left" },
        { q: "If they _______ more free time, they would definitely join an artistic hobby class.", a: ["had", "have", "would have"], c: "had" },
        { q: "He said, 'I don't like fast food.' - He stated that he _______ fast food.", a: ["didn't like", "doesn't like", "not liked"], c: "didn't like" },
        { q: "My father asked me _______ up the groceries from the kitchen counter.", a: ["to pick", "pick", "picking"], c: "to pick" },
        { q: "If it _______ tomorrow, we would have to cancel our outdoor sports match.", a: ["snowed", "snows", "will snow"], c: "snowed" },
        { q: "You should have _______ your password to protect your social media account from hackers.", a: ["changed", "change", "changing"], c: "changed" },
        { q: "She told us, 'I have already finished.' - She said that she _______ already finished.", a: ["had", "has", "was"], c: "had" },
        { q: "The policeman told the driver, 'Don't park here.' - He told him _______ there.", a: ["not to park", "to not park", "don't park"], c: "not to park" },
        { q: "If we moved to a crowded city, we _______ have to sell our large family car.", a: ["would", "will", "did"], c: "would" },
        { q: "I could have _______ to the concert, but I didn't have enough money for the ticket.", a: ["gone", "go", "went"], c: "gone" },
        { q: "To complete a successful conversation, you should always make a request and accept an _______.", a: ["apology", "story", "favor"], c: "apology" }
    ]
}
        };

        /* =====================================================================
           ⚙️ ACTIONS DE NAVEGACIÓN Y CONFIGURACIÓN INICIAL DEL PORTAL
           ===================================================================== */
        function selectBlock(blockId) {
            currentBlockId = blockId;
            
            // Actualizar botones de la barra lateral
            document.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-[var(--accent-g)]', 'text-white');
                btn.classList.add('bg-[var(--bg-base)]', 'text-[var(--text-body)]');
            });
            
            const selectedBtn = document.getElementById(`btn-${blockId}`);
            if (selectedBtn) {
                selectedBtn.classList.add('active');
                selectedBtn.classList.remove('bg-[var(--bg-base)]', 'text-[var(--text-body)]');
            }

            // Actualizar textos informativos principales
            document.getElementById('unit-badge').innerText = DATA[blockId].badge;
            document.getElementById('unit-title').innerText = DATA[blockId].title;

            // Resetear el visor de Warm-Up con texto base elegante
            document.getElementById('warmup-display').innerText = "Click the button below to generate a real-world communication prompt!";
            
            // Si hay un minijuego abierto, actualizarlo en caliente con los nuevos datos
            if (activeGameType) {
                openGame(activeGameType);
            }
        }

        function generatePrompt() {
            const prompts = DATA[currentBlockId].prompts;
            const randomIndex = Math.floor(Math.random() * prompts.length);
            document.getElementById('warmup-display').innerHTML = `
                <span class="text-xs font-bold text-amber-500 block mb-2 tracking-widest uppercase">💬 Discussion Prompt:</span>
                <span class="text-xl font-bold tracking-tight text-[var(--text-title)]">${prompts[randomIndex]}</span>
            `;
        }

        // Inicialización automática al cargar el portal
        window.addEventListener('DOMContentLoaded', () => {
            selectBlock('u1-2');
        });
		/* =====================================================================
           🎯 GESTOR DE MODALES Y INTERCEPTORES MULTIJUEGOS (ONESCREEN EFFECT)
           ===================================================================== */
        function openGame(gameType) {
            activeGameType = gameType;
            const blockData = DATA[currentBlockId];
            
            document.getElementById('modal-game-badge').innerText = blockData.badge;
            document.getElementById('modal-game-title').innerText = `${gameType.toUpperCase()} CHALLENGE`;
            
            const stage = document.getElementById('modal-game-stage');
            stage.innerHTML = ""; // Limpieza de flujo
            
            document.getElementById('game-modal').classList.remove('hidden');
            
            // Enrutador Maestro de Motores Interactivos
            switch(gameType) {
                case 'Flashcards': buildFlashcardsEngine(stage, blockData.vocabulary); break;
                case 'Quiz': buildQuizEngine(stage, blockData.quiz); break;
                case 'Fill Blanks': buildFillBlanksEngine(stage, blockData.quiz); break;
                case 'Word Search': buildWordSearchEngine(stage, blockData.vocabulary); break;
                case 'Memory Match': buildMemoryMatchEngine(stage, blockData.vocabulary); break;
                case 'Category Sort': buildCategorySortEngine(stage, blockData); break;
                case 'Hangman': buildHangmanEngine(stage, blockData.vocabulary); break;
                case 'Word Wheel': buildWordWheelEngine(stage, blockData.vocabulary); break;
                case 'Tic-Tac-Toe': buildTicTacToeEngine(stage, blockData.quiz); break;
                case 'Find Errors': buildFindErrorsEngine(stage, blockData.quiz); break;
                case 'Reorder Steps': buildReorderStepsEngine(stage, blockData.grammar); break;
                case 'Jeopardy': buildJeopardyEngine(stage, blockData); break;
            }
        }

        function closeActiveGameModal() {
            document.getElementById('game-modal').classList.add('hidden');
            activeGameType = null;
        }

        /* =====================================================================
   🛠️ COMPILACIÓN DE LOS 12 MOTORES DE JUEGO (ESTÁNDAR ANTI-COLAPSO) - PARTE 1
   ===================================================================== */

// 1. ENGINE: FLASHCARDS
function buildFlashcardsEngine(stage, vocab) {
    if (!vocab || vocab.length === 0) {
        stage.innerHTML = `<div class="text-center text-slate-400">No vocabulary data available.</div>`;
        return;
    }
    let index = 0;

    function render() {
        stage.innerHTML = `
            <div class="w-full max-w-md flex flex-col items-center gap-6">
                <div class="flashcard-scene w-full h-64 cursor-pointer">
                    <div class="flashcard-inner w-full h-full text-white font-black rounded-2xl shadow-xl transition-transform duration-500 relative style-3d">
                        <div class="flashcard-front absolute inset-0 bg-slate-800 border-2 border-slate-700 flex flex-col items-center justify-center p-6 rounded-2xl backface-hidden">
                            <span class="text-xs text-amber-400 tracking-widest uppercase mb-2">English Word</span>
                            <p class="text-3xl text-center">${vocab[index].word}</p>
                            <span class="text-xs text-slate-400 mt-8"><i class="fa-solid fa-rotate"></i> Click to flip</span>
                        </div>
                        <div class="flashcard-back absolute inset-0 bg-emerald-700 border-2 border-emerald-600 flex flex-col items-center justify-center p-6 rounded-2xl backface-hidden rotate-y-180">
                            <span class="text-xs text-emerald-200 tracking-widest uppercase mb-2">CLUE / TRANSLATION</span>
                            <p class="text-xl text-center font-medium">${vocab[index].translation}</p>
                            <span class="text-xs text-emerald-300 mt-8"><i class="fa-solid fa-rotate"></i> Click to see front</span>
                        </div>
                    </div>
                </div>
                <div class="flex gap-4 w-full">
                    <button id="card-prev" class="flex-1 bg-slate-700 text-white p-4 rounded-xl font-bold hover:bg-slate-600 disabled:opacity-30 disabled:pointer-events-none">PREVIOUS</button>
                    <button id="card-next" class="flex-1 bg-slate-700 text-white p-4 rounded-xl font-bold hover:bg-slate-600 disabled:opacity-30 disabled:pointer-events-none">NEXT</button>
                </div>
                <p class="text-sm font-bold text-slate-400">Card ${index + 1} of ${vocab.length}</p>
            </div>
        `;

        const scene = stage.querySelector('.flashcard-scene');
        const inner = stage.querySelector('.flashcard-inner');
        scene.onclick = () => inner.classList.toggle('flipped');

        const prevBtn = stage.querySelector('#card-prev');
        const nextBtn = stage.querySelector('#card-next');

        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === vocab.length - 1;

        prevBtn.onclick = (e) => { e.stopPropagation(); index--; render(); };
        nextBtn.onclick = (e) => { e.stopPropagation(); index++; render(); };
    }
    render();
}

// 2. ENGINE: QUIZ
function buildQuizEngine(stage, quizData) {
    if (!quizData || quizData.length === 0) {
        stage.innerHTML = `<div class="text-center text-slate-400">No quiz data available.</div>`;
        return;
    }
    let index = 0;

    function render() {
        const item = quizData[index];
        stage.innerHTML = `
            <div class="w-full max-w-2xl flex flex-col gap-4">
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl text-center">
                    <p class="text-xs text-red-400 tracking-wider uppercase mb-2 font-mono">Question ${index + 1} of ${quizData.length}</p>
                    <p class="text-white font-bold text-lg">${item.q}</p>
                </div>
                <div class="quiz-options space-y-3">
                    ${item.a.map((opt, oIdx) => `
                        <button data-opt="${opt}" class="w-full text-left bg-slate-700 hover:bg-slate-600 p-4 rounded-xl text-white font-semibold flex items-center gap-3 border border-slate-600 transition-all">
                            <span class="bg-slate-800 text-xs px-2.5 py-1 rounded font-bold">${String.fromCharCode(65 + oIdx)}</span>
                            <span>${opt}</span>
                        </button>
                    `).join('')}
                </div>
                <div id="quiz-nav" class="hidden mt-4">
                    <button id="quiz-next-btn" class="w-full bg-emerald-600 text-white p-4 rounded-xl font-bold hover:bg-emerald-500 tracking-wide">CONTINUE</button>
                </div>
            </div>
        `;

        const buttons = stage.querySelectorAll('.quiz-options button');
        buttons.forEach(btn => {
            btn.onclick = () => {
                buttons.forEach(b => b.disabled = true);
                const selected = btn.getAttribute('data-opt');
                
                if (selected === item.c) {
                    btn.classList.add('bg-emerald-600', 'border-emerald-400');
                } else {
                    btn.classList.add('bg-rose-600', 'border-rose-400');
                    buttons.forEach(b => {
                        if (b.getAttribute('data-opt') === item.c) {
                            b.classList.add('bg-emerald-600', 'border-emerald-400');
                        }
                    });
                }
                
                const navDiv = stage.querySelector('#quiz-nav');
                navDiv.classList.remove('hidden');
                stage.querySelector('#quiz-next-btn').onclick = () => {
                    index++;
                    if (index < quizData.length) render();
                    else stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500 py-8"><i class="fa-solid fa-circle-check text-6xl block mb-4 animate-bounce"></i>CHALLENGE COMPLETED!</div>`;
                };
            };
        });
    }
    render();
}

// 3. ENGINE: FILL BLANKS (Modificado para Input de Texto)
function buildFillBlanksEngine(stage, quizData) {
    if (!quizData || quizData.length === 0) {
        stage.innerHTML = `<div class="text-center text-slate-400">No data available.</div>`;
        return;
    }
    let index = 0;

    function render() {
        const item = quizData[index];
        // Reemplazamos los "___" por un campo de entrada
        const parts = item.q.split("___");
        const sentenceHtml = parts.join(`<input type="text" id="blank-input" class="bg-transparent border-b-2 border-indigo-400 text-indigo-300 focus:outline-none focus:border-indigo-200 text-center w-32 px-2" placeholder="...">`);

        stage.innerHTML = `
            <div class="w-full max-w-2xl flex flex-col gap-6">
                <div class="bg-slate-800 border border-slate-700 p-8 rounded-xl text-center">
                    <p class="text-2xl text-white font-bold tracking-wide leading-relaxed">${sentenceHtml}</p>
                </div>
                
                <div id="blank-action" class="flex flex-col gap-4">
                    <button id="check-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-4 rounded-xl text-lg transition-all">CHECK ANSWER</button>
                </div>

                <div id="blank-nav" class="hidden">
                    <button id="blank-next-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white p-4 rounded-xl font-bold text-lg">NEXT QUESTION</button>
                </div>
            </div>
        `;

        const input = stage.querySelector('#blank-input');
        const checkBtn = stage.querySelector('#check-btn');
        const nav = stage.querySelector('#blank-nav');

        checkBtn.onclick = () => {
            const userAnswer = input.value.trim().toLowerCase();
            const correctAnswer = item.c.toLowerCase();
            
            input.disabled = true;
            checkBtn.classList.add('hidden');
            nav.classList.remove('hidden');

            if (userAnswer === correctAnswer) {
                input.className = "bg-transparent border-b-2 border-emerald-500 text-emerald-400 focus:outline-none text-center w-32 px-2 font-bold";
            } else {
                input.className = "bg-transparent border-b-2 border-rose-500 text-rose-400 focus:outline-none text-center w-32 px-2 font-bold";
                input.value = item.c; // Muestra la correcta
            }
        };

        stage.querySelector('#blank-next-btn').onclick = () => {
            index++;
            if (index < quizData.length) render();
            else stage.innerHTML = `<div class="text-center text-2xl font-black text-indigo-500 py-8"><i class="fa-solid fa-trophy text-6xl block mb-4 text-amber-400 animate-pulse"></i>PERFECT JOB!</div>`;
        };
    }
    render();
}

// 4. ENGINE: WORD SEARCH
function buildWordSearchEngine(stage, vocab) {
    if (!vocab || vocab.length === 0) return;
    const targetWords = vocab.map(v => v.word.toUpperCase().replace(/\s+/g, '')).slice(0, 4);
    const size = 10;
    let grid = Array(size).fill(null).map(() => Array(size).fill(''));
    
    targetWords.forEach((word, idx) => {
        let row = idx * 2; 
        let startCol = Math.floor(Math.random() * (size - word.length + 1));
        for (let i = 0; i < word.length; i++) {
            grid[row][startCol + i] = word[i];
        }
    });
    
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            if (grid[r][c] === '') grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
        }
    }

    let foundWords = [];
    let selectedCoords = []; // [{r, c, letter, btn}]

    function updateUI() {
        const currentString = selectedCoords.map(coord => coord.letter).join('');
        stage.querySelector('#ws-current').innerText = currentString;

        if (targetWords.includes(currentString) && !foundWords.includes(currentString)) {
            foundWords.push(currentString);
            const wordBadge = stage.querySelector(`#ws-${currentString}`);
            if (wordBadge) wordBadge.className = "bg-emerald-900 border border-emerald-700 p-3 rounded-xl text-center font-bold text-emerald-400 line-through animate-pulse";
            
            selectedCoords.forEach(coord => {
                coord.btn.className = "w-10 h-10 bg-emerald-600 text-white font-black text-sm rounded flex items-center justify-center exact-match";
                coord.btn.disabled = true;
            });
            clearSelection();

            if (foundWords.length === targetWords.length) {
                stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500 py-8"><i class="fa-solid fa-face-smile text-6xl block mb-4 animate-bounce"></i>FANTASTIC! ALL WORDS FOUND!</div>`;
            }
        }
    }

    function clearSelection() {
        selectedCoords.forEach(coord => {
            if (!coord.btn.classList.contains('exact-match')) {
                coord.btn.className = "w-10 h-10 aspect-square bg-slate-700 text-white font-black text-sm rounded flex items-center justify-center hover:bg-slate-600";
            }
        });
        selectedCoords = [];
        stage.querySelector('#ws-current').innerText = "";
    }

    stage.innerHTML = `
        <div class="flex flex-col md:flex-row gap-8 items-center w-full max-w-4xl">
            <div class="ws-grid grid grid-cols-10 gap-1 bg-slate-800 p-3 rounded-xl border border-slate-700 w-full md:w-auto">
                ${grid.map((row, rIdx) => row.map((letter, cIdx) => `
                    <button data-row="${rIdx}" data-col="${cIdx}" data-letter="${letter}" class="w-10 h-10 aspect-square bg-slate-700 text-white font-black text-sm rounded flex items-center justify-center hover:bg-slate-600 transition-colors">${letter}</button>
                `).join('')).join('')}
            </div>
            <div class="flex-1 flex flex-col gap-4 w-full">
                <h4 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Words to find:</h4>
                <div class="grid grid-cols-2 gap-2">
                    ${targetWords.map(w => `<div id="ws-${w}" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-center font-bold text-slate-400">${w}</div>`).join('')}
                </div>
                <div class="mt-4 p-3 bg-slate-800/50 border border-slate-700 rounded-xl">
                    <p class="text-xs text-slate-400">Current Selection: <span id="ws-current" class="text-base font-black text-amber-500 ml-2"></span></p>
                </div>
                <button id="ws-clear-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl tracking-wide">CLEAR SELECTION</button>
            </div>
        </div>
    `;

    stage.querySelectorAll('.ws-grid button').forEach(btn => {
        btn.onclick = () => {
            const r = parseInt(btn.getAttribute('data-row'));
            const c = parseInt(btn.getAttribute('data-col'));
            const letter = btn.getAttribute('data-letter');

            const index = selectedCoords.findIndex(coord => coord.r === r && coord.c === c);
            if (index > -1) {
                btn.className = "w-10 h-10 aspect-square bg-slate-700 text-white font-black text-sm rounded flex items-center justify-center hover:bg-slate-600";
                selectedCoords.splice(index, 1);
            } else {
                btn.className = "w-10 h-10 aspect-square bg-amber-500 text-slate-900 font-black text-sm rounded flex items-center justify-center";
                selectedCoords.push({ r, c, letter, btn });
            }
            updateUI();
        };
    });

    stage.querySelector('#ws-clear-btn').onclick = clearSelection;
}

// 5. ENGINE: MEMORY MATCH
function buildMemoryMatchEngine(stage, vocab) {
    if (!vocab || vocab.length === 0) return;
    let selectedItems = vocab.slice(0, 4);
    let deck = [];
    selectedItems.forEach((item, idx) => {
        deck.push({ text: item.word, type: 'eng', pairId: idx });
        deck.push({ text: item.translation, type: 'esp', pairId: idx });
    });
    deck.sort(() => Math.random() - 0.5);

    stage.innerHTML = `
        <div id="memory-board" class="grid grid-cols-4 gap-4 w-full max-w-3xl">
            ${deck.map((card, index) => `
                <button data-idx="${index}" class="h-28 bg-slate-800 border-2 border-slate-700 font-bold rounded-xl flex items-center justify-center p-3 text-sm transition-all overflow-hidden">
                    <span class="hidden text-white font-black text-sm text-center card-text">${card.text}</span>
                    <span class="card-back-mark text-slate-500 text-2xl font-black">?</span>
                </button>
            `).join('')}
        </div>
    `;

    let firstCard = null;
    let pairsFound = 0;
    let lockBoard = false;
    const buttons = stage.querySelectorAll('#memory-board button');

    buttons.forEach(btn => {
        btn.onclick = () => {
            if (lockBoard || btn.classList.contains('matched') || btn === firstCard?.btn) return;

            const idx = parseInt(btn.getAttribute('data-idx'));
            btn.querySelector('.card-back-mark').classList.add('hidden');
            btn.querySelector('.card-text').classList.remove('hidden');
            btn.classList.add('bg-indigo-600', 'border-indigo-400');

            if (!firstCard) {
                firstCard = { btn, data: deck[idx] };
            } else {
                lockBoard = true;
                const secondCardData = deck[idx];

                if (firstCard.data.pairId === secondCardData.pairId && firstCard.data.type !== secondCardData.type) {
                    setTimeout(() => {
                        firstCard.btn.className = "h-28 bg-emerald-950 border-2 border-emerald-500 text-emerald-400 font-black rounded-xl flex items-center justify-center p-3 text-sm matched animate-pulse";
                        btn.className = "h-28 bg-emerald-950 border-2 border-emerald-500 text-emerald-400 font-black rounded-xl flex items-center justify-center p-3 text-sm matched animate-pulse";
                        
                        firstCard = null;
                        pairsFound++;
                        lockBoard = false;

                        if (pairsFound === selectedItems.length) {
                            stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500 py-8"><i class="fa-solid fa-medal text-6xl block mb-4 text-amber-400"></i>EXCELLENT MEMORY SHARPENED!</div>`;
                        }
                    }, 500);
                } else {
                    setTimeout(() => {
                        firstCard.btn.className = "h-28 bg-slate-800 border-2 border-slate-700 font-bold rounded-xl flex items-center justify-center p-3 text-sm";
                        firstCard.btn.querySelector('.card-back-mark').classList.remove('hidden');
                        firstCard.btn.querySelector('.card-text').classList.add('hidden');

                        btn.className = "h-28 bg-slate-800 border-2 border-slate-700 font-bold rounded-xl flex items-center justify-center p-3 text-sm";
                        btn.querySelector('.card-back-mark').classList.remove('hidden');
                        btn.querySelector('.card-text').classList.add('hidden');

                        firstCard = null;
                        lockBoard = false;
                    }, 1000);
                }
            }
        };
    });
}

// 6. ENGINE: CATEGORY SORT
function buildCategorySortEngine(stage, blockData) {
    if (!blockData || !blockData.vocabulary || !blockData.grammar) return;
    const categories = ["Vocabulary Words", "Grammar Elements"];
    let items = [];
    blockData.vocabulary.slice(0, 3).forEach(v => items.push({ text: v.word, cat: "Vocabulary Words" }));
    
    const examples = blockData.grammar.examples || (blockData.grammar[0] ? blockData.grammar[0].examples : []);
    examples.slice(0, 2).forEach(g => items.push({ text: g, cat: "Grammar Elements" }));
    
    items.sort(() => Math.random() - 0.5);
    let index = 0;

    function render() {
        if (index >= items.length) {
            stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500 py-8"><i class="fa-solid fa-circle-check text-6xl block mb-4"></i>ALL CATEGORIES SORTED WELL!</div>`;
            return;
        }
        const current = items[index];
        stage.innerHTML = `
            <div class="w-full max-w-xl flex flex-col gap-6 text-center">
                <span class="text-xs font-mono font-bold text-slate-400 tracking-widest uppercase">Classify item ${index + 1} of ${items.length}</span>
                <div class="bg-slate-800 border-2 border-slate-700 p-8 rounded-2xl shadow-inner">
                    <p class="text-xl font-black text-white tracking-wide">${current.text}</p>
                </div>
                <div class="sort-actions flex flex-col sm:flex-row gap-4">
                    ${categories.map(cat => `
                        <button data-cat="${cat}" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold p-4 rounded-xl border border-slate-600 transition-all">${cat}</button>
                    `).join('')}
                </div>
            </div>
        `;

        const buttons = stage.querySelectorAll('.sort-actions button');
        buttons.forEach(btn => {
            btn.onclick = () => {
                buttons.forEach(b => b.disabled = true); // Bloqueo anti-click masivo
                const selectedCat = btn.getAttribute('data-cat');

                if (selectedCat === current.cat) {
                    btn.className = "flex-1 bg-emerald-600 text-white font-bold p-4 rounded-xl border border-emerald-400";
                } else {
                    btn.className = "flex-1 bg-rose-600 text-white font-bold p-4 rounded-xl border border-rose-400";
                    buttons.forEach(b => {
                        if (b.getAttribute('data-cat') === current.cat) b.className = "flex-1 bg-emerald-600 text-white font-bold p-4 rounded-xl border border-emerald-400";
                    });
                }
                setTimeout(() => { index++; render(); }, 1200);
            };
        });
    }
    render();
}

// 7. ENGINE: HANGMAN
function buildHangmanEngine(stage, vocab) {
    if (!vocab || vocab.length === 0) return;
    const item = vocab[Math.floor(Math.random() * vocab.length)];
    const targetWord = item.word.toUpperCase().replace(/[^A-Z]/g, '');
    let guessedLetters = [];
    let failures = 0;
    const maxFailures = 5;

    function render() {
        let displayStr = "";
        for (let char of targetWord) {
            if (guessedLetters.includes(char)) {
                displayStr += `<span class="mx-1 border-b-4 border-emerald-500 px-1 text-2xl font-black text-white">${char}</span>`;
            } else {
                displayStr += `<span class="mx-1 border-b-4 border-slate-600 px-1 text-2xl font-black text-slate-500">_</span>`;
            }
        }

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        stage.innerHTML = `
            <div class="w-full max-w-2xl flex flex-col items-center gap-6">
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl w-full text-center">
                    <span class="text-xs text-amber-500 font-bold uppercase tracking-widest block mb-1">Clue / Meaning:</span>
                    <p class="text-lg font-medium text-slate-200">"${item.translation}"</p>
                </div>
                <div id="hangman-word-slots" class="flex justify-center my-6 py-2 overflow-x-auto max-w-full">
                    ${displayStr}
                </div>
                <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden relative">
                    <div class="bg-rose-500 h-full transition-all duration-300" style="width: ${(failures / maxFailures) * 100}%"></div>
                </div>
                <p class="text-xs font-mono font-bold text-slate-400 uppercase tracking-widest">Integrity Counter: ${maxFailures - failures} attempts remaining</p>
                <div class="hangman-keyboard grid grid-cols-7 gap-1.5 w-full mt-4">
                    ${alphabet.map(letter => {
                        const used = guessedLetters.includes(letter);
                        return `<button data-letter="${letter}" ${used ? 'disabled' : ''} class="p-2 font-bold rounded text-sm transition-all ${used ? 'bg-slate-800 text-slate-600 pointer-events-none' : 'bg-slate-700 text-white hover:bg-slate-600'}">${letter}</button>`;
                    }).join('')}
                </div>
            </div>
        `;

        stage.querySelectorAll('.hangman-keyboard button').forEach(btn => {
            btn.onclick = () => {
                const letter = btn.getAttribute('data-letter');
                guessedLetters.push(letter);
                
                if (!targetWord.includes(letter)) failures++;

                const won = targetWord.split("").every(l => guessedLetters.includes(l));
                if (won) {
                    stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500 py-8"><i class="fa-solid fa-trophy text-6xl block mb-4 text-amber-400 animate-bounce"></i>CRACKED IT! THE WORD WAS "${targetWord}"</div>`;
                } else if (failures >= maxFailures) {
                    stage.innerHTML = `<div class="text-center text-2xl font-black text-rose-500 py-8"><i class="fa-solid fa-skull-crossbones text-6xl block mb-4 animate-pulse"></i>GAME OVER!<br><span class="text-base text-slate-400 font-normal">Correct word was:</span> <span class="text-white">${targetWord}</span></div>`;
                } else {
                    render();
                }
            };
        });
    }
    render();
}

function buildWordWheelEngine(stage, vocab) {

            <div class="w-full max-w-lg flex flex-col items-center gap-6">
                <div id="wheel-display" class="bg-slate-800 border-4 border-amber-500 p-8 rounded-full w-64 h-64 flex flex-col items-center justify-center text-center shadow-[0_0_30px_rgba(245,158,11,0.3)]">

                </button>
            </div>
        `;
        bindEvents();
    }

    function spin() {
        if (isSpinning) return;
        isSpinning = true;
        
        let counter = 0;
        const speed = 100; // Velocidad de cambio de palabras
        const totalSpins = 15; // Cuántas veces cambiará la palabra

            const randomEntry = vocab[Math.floor(Math.random() * vocab.length)];

            if (counter >= totalSpins) {
                clearInterval(interval);
                isSpinning = false;

        }, speed);
    }

    function showStoryPrompt(finalEntry) {

// 9. ENGINE: TIC-TAC-TOE (PVP STUDENT MODE)
function buildTicTacToeEngine(stage, quizData) {
    let board = Array(9).fill('');
    let questionPool = [...quizData];
    let currentTurn = 'X'; // El estudiante 1 empieza siendo 'X'

    function checkWin(player) {
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8], // Rows
            [0,3,6], [1,4,7], [2,5,8], // Columns
            [0,4,8], [2,4,6]           // Diagonals
        ];
        return winPatterns.some(pattern => pattern.every(idx => board[idx] === player));
    }

    function renderBoard() {
        stage.innerHTML = `
            <div class="w-full max-w-md flex flex-col items-center gap-4">
                <!-- Indicador de turno dinámico -->
                <div class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-full text-center shadow-lg">
                    <p class="text-sm font-semibold text-slate-200">
                        Current Turn: <span class="font-black text-xl ${currentTurn === 'X' ? 'text-sky-400' : 'text-amber-400'}">${currentTurn}</span>
                    </p>
                </div>
                
                <p class="text-xs font-bold text-slate-400 tracking-wider text-center uppercase">
                    Player ${currentTurn}, click any cell to answer and place your mark
                </p>

                <div class="grid grid-cols-3 gap-2 bg-slate-800 p-3 rounded-xl border border-slate-700 w-full aspect-square" id="tic-grid">
                    ${board.map((cell, idx) => {
                        // Color dinámico según la marca del estudiante
                        let colorClass = "text-white";
                        if (cell === 'X') colorClass = "text-sky-400";
                        if (cell === 'O') colorClass = "text-amber-400";

                        return `
                            <button data-idx="${idx}" class="bg-slate-700 ${colorClass} text-4xl font-black rounded-xl flex items-center justify-center hover:bg-slate-600 transition-colors min-h-[80px]">
                                ${cell}
                            </button>
                        `;
                    }).join('')}
                </div>
            </div>
        `;

        stage.querySelectorAll('#tic-grid button').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.idx);
                if(board[idx] !== '') return;
                triggerQuestion(idx);
            });
        });
    }

    function triggerQuestion(idx) {
        if(questionPool.length === 0) questionPool = [...quizData];
        const item = questionPool[Math.floor(Math.random() * questionPool.length)];
        
        stage.innerHTML = `
            <div class="w-full max-w-xl flex flex-col gap-4">
                <!-- Alerta de quién está respondiendo -->
                <div class="text-center">
                    <span class="px-3 py-1 text-xs font-bold tracking-widest uppercase rounded-md bg-slate-700 text-slate-300">
                        Question for Player ${currentTurn}
                    </span>
                </div>

                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 text-center shadow-md">
                    <p class="text-white font-bold text-lg">${item.q}</p>
                </div>
                <div class="space-y-2" id="tic-options">
                    ${item.a.map(opt => `
                        <button data-opt="${opt}" class="w-full bg-slate-700 text-white p-4 rounded-xl font-medium text-left border border-slate-600 hover:bg-slate-600 transition-all">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
            </div>
        `;

        stage.querySelectorAll('#tic-options button').forEach(btn => {
            btn.addEventListener('click', () => {
                resolveTurn(idx, btn.dataset.opt, item.c);
            });
        });
    }

    function resolveTurn(idx, selected, correct) {
        if(selected === correct) {
            // El estudiante actual responde bien: se le asigna la casilla
            board[idx] = currentTurn;
            
            // Verificar si el estudiante actual ganó
            if(checkWin(currentTurn)) {
                stage.innerHTML = `
                    <div class="text-center p-8 bg-slate-800 rounded-2xl border border-slate-700 shadow-xl max-w-sm mx-auto">
                        <i class="fa-solid fa-trophy text-6xl block mb-4 ${currentTurn === 'X' ? 'text-sky-400' : 'text-amber-400'} animate-bounce"></i>
                        <div class="text-2xl font-black text-white">PLAYER ${currentTurn} WINS THE MATCH!</div>
                    </div>
                `;
                return;
            }
        } else {
            // Regla pedagógica: Si responde mal, pierde el turno y no se marca nada.
            alert(`Wrong answer! Player ${currentTurn} missed the chance.`);
        }

        // Verificar si el tablero está lleno (Empate)
        if(board.filter(c => c === '').length === 0) {
            stage.innerHTML = `
                <div class="text-center p-8 bg-slate-800 rounded-2xl border border-slate-700 shadow-xl max-w-sm mx-auto">
                    <i class="fa-solid fa-handshake text-5xl block mb-4 text-indigo-400"></i>
                    <div class="text-2xl font-black text-indigo-400">DRAW GAME!</div>
                    <p class="text-slate-400 text-sm mt-2">The board is full.</p>
                </div>
            `;
            return;
        }

        // Cambiar el turno de forma alterna para la siguiente ronda
        currentTurn = (currentTurn === 'X') ? 'O' : 'X';
        renderBoard();
    }

    renderBoard();
}

// 11. ENGINE: REORDER STEPS (Soporte Multi-Ejemplo con Banco Seguro de 15 Oraciones)
function buildReorderStepsEngine(stage, grammarData) {
    // Obtenemos la lista completa de ejemplos de la unidad si existen
    const sentencesPool = grammarData?.examples || [];
    
    // Si no hay ejemplos en la unidad, se activa el banco de datos seguro de 15 oraciones
    if (sentencesPool.length === 0) {
        sentencesPool.push(
            "I am a student and I work too",
"She is studying English today",
"They started working here two years ago",
"We want to go to London next summer",
"He does not understand the new grammar rules",
"What time does the English class start tomorrow",
"You need to practice speaking English every day",
"My friend bought a new motorcycle last week",
"They were watching a movie when I called them",
"She finished her homework early today",
"If it rains tomorrow, we will stay at home",
"Where did you go for your last vacation",
"I can speak three languages very well",
"This simulator was made with JavaScript",
"Learning a new language helps you get a good job"
        );
    }

    let currentIndex = 0;
    let trueTokens = [];
    let shuffledPool = [];
    let selection = [];

    // Inicializa o cambia la oración actual basados en el índice
    function initSentence() {
        selection = [];
        let rawStr = sentencesPool[currentIndex];
        
        // Limpieza de signos comunes sin romper contracciones
        let cleanStr = rawStr.replace(/[.,\/#!$%\^&\*;:{}=\_`~()?]/g, "").replace(/\s+/g, " ").trim();
        trueTokens = cleanStr.split(" ").filter(token => token.length > 0);
        
        // Creamos la bolsa mezclada
        shuffledPool = trueTokens.map((word, originalIndex) => ({ word, originalIndex }));
        shuffledPool.sort(() => Math.random() - 0.5);
    }

    function render() {
        if (currentIndex >= sentencesPool.length) {
            stage.innerHTML = `
                <div class="text-center text-2xl font-black text-emerald-500 py-6">
                    <i class="fa-solid fa-graduation-cap text-5xl block mb-4"></i>
                    ALL SENTENCES REORDERED SUCCESSFULLY!
                </div>`;
            return;
        }

        stage.innerHTML = `
            <div class="w-full max-w-2xl flex flex-col gap-6">
                <div class="flex justify-between items-center px-2">
                    <span class="text-xs font-mono font-bold text-slate-400 uppercase tracking-widest">Arrange words in sequence</span>
                    <span class="text-xs font-mono font-bold bg-slate-800 text-amber-500 px-3 py-1 rounded-full border border-slate-700">Sentence ${currentIndex + 1} of ${sentencesPool.length}</span>
                </div>
                
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 min-h-[80px] flex items-center justify-center gap-2 flex-wrap" id="reorder-selection-zone">
                    ${selection.map((token, idx) => `
                        <button data-idx="${idx}" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2.5 rounded-lg border border-indigo-400 shadow-sm transition-all transform active:scale-95">${token.word}</button>
                    `).join('')}
                </div>

                <div class="flex items-center justify-center gap-2 flex-wrap bg-slate-900/40 p-4 rounded-xl border border-slate-800" id="reorder-pool-zone">
                    ${shuffledPool.map((token) => {
                        const isChosen = selection.some(s => s.originalIndex === token.originalIndex);
                        return `
                            <button data-orig-idx="${token.originalIndex}" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 py-2.5 rounded-lg border border-slate-600 transition-all ${isChosen ? 'invisible pointer-events-none' : ''}">${token.word}</button>
                        `;
                    }).join('')}
                </div>

                <div class="flex gap-2">
                    <button id="reorder-btn-reset" class="flex-1 bg-slate-800 text-slate-400 font-bold py-3 rounded-xl border border-slate-700 hover:bg-slate-700/60 transition-colors">RESET BOARD</button>
                    <button id="reorder-btn-validate" class="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-500 transition-colors">VALIDATE SYNTAX</button>
                </div>
            </div>
        `;
        bindEvents();
    }

    function bindEvents() {
        // Añadir palabra a la selección
        stage.querySelectorAll('#reorder-pool-zone button').forEach(btn => {
            btn.addEventListener('click', () => {
                const origIdx = parseInt(btn.dataset.origIdx);
                const token = shuffledPool.find(t => t.originalIndex === origIdx);
                if (token && !selection.some(s => s.originalIndex === origIdx)) {
                    selection.push(token);
                    render();
                }
            });
        });

        // Retirar palabra de la selección de forma individual
        stage.querySelectorAll('#reorder-selection-zone button').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetIdx = parseInt(btn.dataset.idx);
                selection.splice(targetIdx, 1);
                render();
            });
        });

        // Botón Resetear tablero actual
        stage.querySelector('#reorder-btn-reset').addEventListener('click', () => {
            selection = [];
            render();
        });

        // Botón Validar sintaxis
        stage.querySelector('#reorder-btn-validate').addEventListener('click', () => {
            const resultStr = selection.map(s => s.word).join(' ');
            const targetStr = trueTokens.join(' ');

            if (resultStr.toLowerCase() === targetStr.toLowerCase()) {
                alert("Excellent sequence alignment!");
                currentIndex++; // Avanza al siguiente ejemplo
                if (currentIndex < sentencesPool.length) {
                    initSentence(); // Regenera los tokens con la nueva oración
                }
                render();
            } else {
                alert("Sentence sequence invalid. Review structure rules!");
                selection = [];
                render();
            }
        });
    }

    // Inicialización del juego
    initSentence();
    render();
}

// 12. ENGINE: JEOPARDY (Versión Blindada y Tolerante)

            ${examplesArray.length > 0 ? `
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 text-left">
                <p class="text-xs font-bold text-amber-500 tracking-wider uppercase mb-2">Example Target Reference Pattern:</p>
                <ul class="text-xs text-slate-400 space-y-2 list-none pl-0">
                    ${examplesArray.map(ex => `<li class="flex items-start gap-2"><span>•</span><span>${ex}</span></li>`).join('')}
                </ul>
            </div>
            ` : ''}
            
            <button id="jeopardy-btn-close" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl mt-2 hover:bg-emerald-500 transition-colors">I HAVE REVIEWED IT</button>
        </div>
    `;

    // Handler seguro usando addEventListener nativo
    const closeBtn = stage.querySelector('#jeopardy-btn-close');
    if (closeBtn) {
        closeBtn.addEventListener('click', () => {
            if (typeof window.closeActiveGameModal === 'function') {
                window.closeActiveGameModal();
            } else {
                stage.innerHTML = `
                    <div class="text-center p-6 bg-slate-800 rounded-xl border border-slate-700">
                        <i class="fa-solid fa-circle-check text-emerald-500 text-4xl mb-2 block"></i>
                        <p class="text-lg font-bold text-white">Review complete.</p>
                        <p class="text-xs text-slate-400 mt-1">Assessment loaded successfully.</p>
                    </div>`;
            }
        });
    }
}
    </script>
</body>
</html>
