function renderJeopardy() {
    const stage = document.getElementById("modal-game-stage");
    if (!stage || !DATA[currentBlock]) return;

    const block = DATA[currentBlock];
    const state = window.jeopardyGameState;

    // 1. Definir 6 categorías lingüísticas basadas en el contenido real
    state.categories = [
        "Core Grammar",
        "Vocabulary Lexicon",
        "Context Structures",
        "Sentence Completion",
        "Expressions & Use",
        "Advanced Syntax"
    ];

    // 2. Extraer y clasificar preguntas por dificultad real (Longitud y complejidad)
    let allQuestions = [];
    
    // Recolectar del quiz nativo real (Evita lecturas estáticas)
    if (block.quizQuestions) {
        block.quizQuestions.forEach(q => {
            allQuestions.push({
                text: q.q || "Analyze the unit structure",
                options: q.options || ["True", "False"],
                answer: q.answer || "",
                length: (q.q || "").length
            });
        });
    }

    // ✨ COMPENSACIÓN DINÁMICA ANTI-BUCLE: Si faltan preguntas para las 30 celdas, usamos Grammar Rules reales
    if (allQuestions.length < 30) {
        const rules = block.grammarRules || [];
        
        if (rules.length > 0) {
            rules.forEach((rule) => {
                const parts = rule.split(":");
                const categoryName = parts[0] ? parts[0].trim() : "Rule Concept";
                const cleanRule = parts[1] ? parts[1].trim() : rule;
                
                allQuestions.push({
                    text: `According to ${categoryName} guidelines: What is the correct contextual layout for this rule? -> "${cleanRule}"`,
                    options: ["This statement is grammatically correct", "The structural order is inverted", "It requires a different tense/modal"],
                    answer: "This statement is grammatically correct",
                    length: cleanRule.length + 50
                });
            });
        }

        // Si aún así el pool es menor a 30, duplicamos y barajamos el pool existente de forma segura
        let securityCounter = 0;
        while (allQuestions.length < 36 && allQuestions.length > 0 && securityCounter < 50) {
            const randomExisting = allQuestions[Math.floor(Math.random() * allQuestions.length)];
            allQuestions.push({ ...randomExisting, length: randomExisting.length + Math.random() });
            securityCounter++;
        }
    }

    // Ordenar por longitud de caracteres (A más larga/compleja, simula más valor)
    allQuestions.sort((a, b) => a.length - b.length);

    // 3. Llenar la matriz de 6 Categorías x 5 Valores (100 a 500)
    const values = [100, 200, 300, 400, 500];
    state.grid = {};

    for (let c = 0; c < 6; c++) {
        values.forEach((val, vIdx) => {
            // Segmentar el pool en 5 zonas de dificultad de forma proporcional
            const chunkIndex = Math.floor((vIdx / 5) * allQuestions.length);
            const poolSlice = allQuestions.slice(chunkIndex, Math.floor(chunkIndex + (allQuestions.length / 5)) + 1);
            
            // Seleccionar pregunta aleatoria del segmento o fallback del pool general
            const selectedQ = poolSlice[Math.floor(Math.random() * poolSlice.length)] || allQuestions[Math.floor(Math.random() * allQuestions.length)];

            state.grid[`cat_${c}_${val}`] = {
                question: selectedQ.text,
                // Barajar las opciones en cada renderizado para evitar memorización de posiciones
                options: [...selectedQ.options].sort(() => 0.5 - Math.random()),
                answer: selectedQ.answer,
                value: val,
                categoryIdx: c,
                used: false
            };
        });
    }

    drawJeopardyBoard();
}

function verifyJeopardyAnswer() {
    const card = window.jeopardyGameState.activeCard;
    const feedback = document.getElementById("j-feedback");
    const rewardZone = document.getElementById("j-reward-zone");
    if (!feedback || !card) return;

    feedback.classList.remove("hidden");

    if (!card.selectedAnswer) {
        feedback.className = "w-full py-2 rounded-xl font-bold text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 text-center";
        feedback.innerHTML = "⚠️ Please choose an option before verification.";

    }

    const isCorrect = card.selectedAnswer === card.answer;

    if (isCorrect) {
        feedback.className = "w-full py-2 rounded-xl font-bold text-xs bg-green-500/10 text-green-400 border border-green-500/20 text-center";

function awardJeopardyPoints(teamId) {
    const state = window.jeopardyGameState;
    const card = state.activeCard;

    if (card) {
        const team = state.teams.find(t => t.id === teamId);
        if (team) {
            team.score += card.value;
        }
        state.grid[card.key].used = true;
    }

    closeJeopardyCard(true);
}

function closeJeopardyCard(shouldMarkUsed) {
    const state = window.jeopardyGameState;
    if (shouldMarkUsed && state.activeCard) {
        state.grid[state.activeCard.key].used = true;
    }
    state.activeCard = null;
    drawJeopardyBoard();
}

        <div class="w-full max-w-md bg-[#161b22] border border-[#30363d] rounded-2xl p-5 shadow-2xl flex flex-col mx-auto">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs text-gray-400 font-bold uppercase">Question ${currentQuizIndex + 1}/${Math.min(questions.length, 20)}</span>
                <span class="text-xs font-black text-red-400">Score: ${quizScore}</span>
            </div>
            <div class="text-base text-white font-semibold mb-5 text-center leading-relaxed">${questionText}</div>
            
            <div id="quiz-options-container" class="flex flex-col gap-2.5 mb-4">
                ${optionsList.map((opt, idx) => `
                    <button data-idx="${idx}" class="quiz-opt-btn w-full text-left bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] rounded-xl p-3 text-sm text-gray-200 font-medium transition-all flex items-center justify-between group">
                        <span>${opt}</span>
                        <i class="fa-regular fa-circle text-gray-500 group-hover:text-gray-400"></i>
                    </button>
                `).join('')}
            </div>
            
            <div id="quiz-feedback" class="hidden text-center py-2.5 rounded-xl font-bold text-xs border mb-1"></div>
        </div>
    `;

    const optionButtons = stage.querySelectorAll(".quiz-opt-btn");
    optionButtons.forEach(btn => {
        btn.addEventListener("click", function() {
            const selectedIdx = parseInt(this.getAttribute("data-idx"));
            const correctIdx = optionsList.indexOf(correctAnswer);
            const feedback = document.getElementById("quiz-feedback");

            optionButtons.forEach(b => b.disabled = true);
            feedback.classList.remove("hidden");

            if (selectedIdx === correctIdx && correctIdx !== -1) {
                quizScore++;
                this.className = "w-full text-left bg-green-950/40 border-2 border-green-500 rounded-xl p-3 text-sm text-green-400 font-bold flex items-center justify-between";
                this.querySelector("i").className = "fa-solid fa-circle-check text-green-400";
                
                feedback.className = "text-center py-2.5 rounded-xl font-bold text-xs bg-green-500/10 text-green-400 border border-green-500/20 mb-1";
                feedback.innerHTML = "✓ Excellent! Correct Answer.";
            } else {
                this.className = "w-full text-left bg-red-950/40 border-2 border-red-500 rounded-xl p-3 text-sm text-red-400 font-bold flex items-center justify-between";
                this.querySelector("i").className = "fa-solid fa-circle-xmark text-red-400";
                
                if (optionButtons[correctIdx]) {
                    optionButtons[correctIdx].className = "w-full text-left bg-green-950/20 border border-green-600/50 rounded-xl p-3 text-sm text-green-400 font-medium flex items-center justify-between";
                }

                feedback.className = "text-center py-2.5 rounded-xl font-bold text-xs bg-rose-500/10 text-rose-400 border border-rose-500/20 mb-1";
                feedback.innerHTML = `✗ Incorrect. Answer: ${correctAnswer}`;
            }

            setTimeout(() => {
                currentQuizIndex++;
                renderQuizQuestion();
            }, 2000);
        });
    });
}

        // --- MANIPULADORES DE INTERFAZ DEL MODAL GLOBAL ---
        function closeGameModal() {
            const modal = document.getElementById("game-modal");
            const stage = document.getElementById("modal-game-stage");
            if (modal) modal.classList.add("hidden");
            if (stage) stage.innerHTML = ""; 
        }

        document.addEventListener("DOMContentLoaded", () => {
            initApp();
            selectBlock(currentBlock);

            const modalOverlay = document.getElementById("game-modal");
            if (modalOverlay) {
                modalOverlay.addEventListener("click", (e) => {
                    if (e.target === modalOverlay) {
                        closeGameModal();
                    }
                });
            }
        });

        // ==========================================================
        // SISTEMA DE SELECCIÓN DE UNIDADES DINÁMICAS
        // ==========================================================
        function selectBlock(blockId) {
            // 1. Validar que el bloque exista en nuestro banco de datos (DATA)
            if (!DATA[blockId]) {
                console.error("El bloque " + blockId + " no existe en DATA.");
                return;
            }

            // 2. Actualizar el contenido principal dinámicamente con los datos del bloque seleccionado
            document.getElementById("unit-badge").innerText = DATA[blockId].badge;
            document.getElementById("unit-title").innerText = DATA[blockId].title;
            
            // Resetear el visor de Warm-Up para invitar al usuario a interactuar
            document.getElementById("warmup-display").innerText = "Click the button below to generate a real-world communication prompt!";

            // 3. Efecto visual de carga en la barra de progreso
            const progress = document.getElementById("progress-bar");
            if (progress) {
                progress.style.width = "0%";
                setTimeout(() => { progress.style.width = "100%"; }, 50);
            }

            // 4. Actualizar los estilos visuales de los botones en la barra lateral
            document.querySelectorAll(".sidebar-btn").forEach(btn => {
                const currentBtnId = btn.id.replace("btn-", "");
                if (currentBtnId === blockId) {
                    // Estilo del botón ACTIVO (Mantiene tu clase CSS activa)
                    btn.className = "sidebar-btn active text-left px-4 py-3 rounded-xl text-sm font-semibold border";
                } else {
                    // Estilo del botón INACTIVO
                    btn.className = "sidebar-btn text-left px-4 py-3 rounded-xl bg-[#21262d] text-gray-400 hover:bg-[#30363d] transition-all text-sm font-semibold border border-transparent";
                }
            });

            // 5. Guardar la selección en una variable global para que los juegos sepan qué unidad usar
            window.currentBlock = blockId;

            // 6. Re-renderizar secciones de contenido si existen funciones de renderizado global
            if (typeof renderVocabulary === "function") renderVocabulary();
            if (typeof renderGrammar === "function") renderGrammar();
        }

        // Asegurar la carga inicial correcta apuntando al primer bloque real ('u1-2')
        document.addEventListener("DOMContentLoaded", () => {
            selectBlock('u1-2'); 
        });

        // ==========================================================
        // VISUALIZACIÓN DE LA FIRMA INTEGRADA DE SEGURIDAD
        // ==========================================================
        document.write(`
            <footer class="w-full text-center py-6 mt-12 bg-white/5 border-t border-gray-800 backdrop-blur-xs shrink-0 select-none">
                <p id="firma-seguridad" class="text-xs font-bold text-gray-400 tracking-wide">
                    Creado por Tony Salas & German Peña
                </p>
            </footer>
        `);

        // EL CENTINELA DE GERMÁN y TONY (Monitor de protección activa en tiempo real)
        setInterval(() => {
            const firma = document.getElementById('firma-seguridad');
            const app = document.getElementById('app');
            const bloqueado = document.getElementById('acceso-denegado');
            
            if (!firma || firma.textContent.trim() !== 'Creado por Tony Salas & German Peña' ||
                getComputedStyle(firma).display === 'none' ||
                getComputedStyle(firma).opacity === '0' ||
                getComputedStyle(firma).visibility === 'hidden') {
                
                if (app) app.style.display = 'none';
                if (!bloqueado) {
                    const div = document.createElement('div');
                    div.id = 'acceso-denegado';
                    div.style.cssText = 'position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;';
                    div.innerHTML = '<p style="color:red;font-size:2rem;text-align:center;padding:2rem;font-family:sans-serif;font-weight:bold;">⚠️ ACCESO DENEGADO ⚠️<br><span style="font-size:1rem;color:#888;">El código de seguridad y la firma han sido alterados. CREA TU VERGA TU, CARA E MONDA.</span></p>';
                    document.body.appendChild(div);
                }
            }
        }, 1000);
    </script>
</body>
</html>
