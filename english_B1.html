<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive English Portal - Level B1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- CSS ARCHITECTURE & RESET (ESTILO PORTAL ORIGINAL) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        :root {
            --bg-base: #f1f5f9;
            --bg-card: #ffffff;
            --text-title: #0f172a;
            --text-body: #475569;
            --border-ui: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            
            /* Identidad Visual Exclusiva B1 */
            --accent-g: linear-gradient(135deg, #4ade80, #15803d); /* Transición de verde lima brillante a verde bosque profundo */
--accent-text: #166534; /* Verde esmeralda oscuro para una lectura clara y profesional */
        }

        [data-theme="dark"] {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --text-title: #f8fafc;
            --text-body: #94a3b8;
            --border-ui: #334155;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-body);
        }

        /* --- CONFIGURACIONES BOTÓN DE TEMA PORTAL --- */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1.5rem;
            background-color: var(--bg-card);
            border: 2px solid var(--border-ui);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            touch-action: manipulation;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* --- IDENTIDAD GRÁFICA UNIFICADA --- */
        .brand-color-text { color: var(--accent-text); }       
        .brand-color-bg { background: var(--accent-g); }     
        .brand-color-button { background: var(--accent-g); } 
        .brand-color-button:hover { filter: brightness(1.15); }
        
        .sidebar-btn.active { 
            background: var(--accent-g); 
            color: #ffffff !important; 
            border-color: transparent; 
            box-shadow: var(--shadow-lg);
        }

        /* Contenedores estilizados tipo Tarjeta Portal */
        .portal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--accent-g);
        }

        .portal-card-interactive:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        /* --- CONFIGURACIONES BOTÓN HOME --- */
        .home-btn {
            position: fixed;
            top: 1rem;
            left: 1.5rem;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 0.5rem 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.15rem;
            font-weight: 800;
            color: #94a3b8;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            touch-action: manipulation;
        }

        .home-btn:hover {
            transform: scale(1.05);
            color: #f8fafc;
            border-color: #475569;
        }
        
        @media (max-width: 640px) {
            .home-btn, .theme-toggle {
                position: absolute;
            }
        }

        /* --- ANIMACIONES DE ENTRADA --- */
        .animate-fade-down { animation: moveDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .animate-fade-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

        @keyframes moveDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animación 3D para Flashcards */
        .flashcard-scene { perspective: 1000px; }
        .flashcard-inner { transition: transform 0.6s; transform-style: preserve-3d; position: relative; width: 100%; height: 100%; }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { backface-visibility: hidden; position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .flashcard-back { transform: rotateY(180deg); }

        /* =====================================================================
           🚀 PROTECCIÓN ANTI-COLAPSO ONESCREEN (PRESERVADO INTACTO)
           ===================================================================== */
        #modal-game-stage > div { max-width: 100% !important; width: 100% !important; }
        #modal-game-stage text, #modal-game-stage p, #modal-game-stage span, #modal-game-stage div,
        #modal-game-stage button, #modal-game-stage h4, #modal-game-stage li {
            font-weight: 800 !important;              
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif !important; 
            text-shadow: 0px 1px 2px rgba(0,0,0,0.8) !important; 
            letter-spacing: 0.02em !important; 
        }
        #modal-game-stage p.text-sm, #modal-game-stage p.text-base, #modal-game-stage .text-center p,
        #modal-game-stage .text-xl, #modal-game-stage .text-2xl, #modal-game-stage [class*="text-"] h3,
        #modal-game-stage .mb-6.bg-slate-800\/50, #modal-game-stage .text-lg.font-semibold {
            font-size: 1.75rem !important;      
            line-height: 1.5 !important;        
            height: auto !important;            
            min-height: max-content !important; 
            padding: 1.5rem !important;        
            color: #ffffff !important;         
            word-break: break-word !important;  
        }
        #modal-game-stage button.w-full.text-left, #modal-game-stage .space-y-3 button, #modal-game-stage [onclick*="selectAnswer"] {
            min-height: 75px !important;        
            height: auto !important;            
            font-size: 1.35rem !important;     
            line-height: 1.3 !important;
            padding: 1.25rem 1.75rem !important;   
            color: #ffffff !important;         
            border-radius: 0.75rem !important;    
            border: 2px solid #334155 !important; 
            margin-bottom: 0.75rem !important;  
            display: flex !important;           
            align-items: center !important;
        }
        #modal-game-stage button.w-full.text-left span:first-child, #modal-game-stage [onclick*="selectAnswer"] span {
            font-size: 1.4rem !important; margin-right: 1rem !important; flex-shrink: 0 !important;          
        }
        #modal-game-stage .grid-cols-10 > div, #modal-game-stage .grid-cols-12 > div, #modal-game-stage [class*="grid-cols"] > div[class*="aspect-square"], #modal-game-stage button[data-row][data-col] {
            min-height: auto !important; aspect-ratio: 1 / 1 !important; font-size: 1.4rem !important; padding: 0 !important; display: flex !important; align-items: center !important; justify-content: center !important; border-radius: 0.375rem !important; 
        }
        #modal-game-stage .grid-cols-4 > div[onclick], #modal-game-stage .grid-cols-3 > div[onclick], #modal-game-stage [id*="memory"] button, #modal-game-stage [id*="card"] {
            min-height: 160px !important; font-size: 1.4rem !important; padding: 1.5rem !important; color: #ffffff !important; border-radius: 1rem !important; display: flex !important; align-items: center !important; justify-content: center !important; text-align: center !important;
        }
        #modal-game-stage .grid-cols-7 > button, #modal-game-stage [id*="keyboard"] button, #modal-game-stage button[onclick*="guess"], #modal-game-stage button[onclick*="Letter"] {
            min-height: 60px !important; font-size: 1.35rem !important; padding: 0.5rem !important;
        }
        #modal-game-stage #hangman-word-slots span { font-size: 2.2rem !important; font-weight: 900 !important; color: #22c55e !important; margin: 0 0.25rem !important; }
        #modal-game-stage .relative.w-full.bg-slate-700, #modal-game-stage [id="integrity-bar"] { height: 14px !important; border-radius: 9999px !important; }
        #modal-game-stage span.text-\[10px\], #modal-game-stage div > span { font-size: 1.15rem !important; color: #f87171 !important; }
        #modal-game-stage .italic, #modal-game-stage .text-gray-600 { font-size: 1.05rem !important; color: #94a3b8 !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <a href="index.html" class="home-btn" aria-label="Go to home">
        <span>🏠</span> Home
    </a>

    <button class="theme-toggle" id="themeSwitchBtn" aria-label="Toggle structural theme">🌓</button>

    <div id="app" class="h-full flex flex-col overflow-hidden">

        <header class="w-full text-center py-4 bg-[var(--bg-card)] border-b border-[var(--border-ui)] shrink-0 shadow-sm z-10 relative">
            <h1 class="text-3xl font-extrabold tracking-tight text-[var(--text-title)]">
                Interactive <span class="brand-color-text">English Portal</span>
            </h1>
            <p class="text-xs text-[var(--text-body)] mt-1 uppercase tracking-widest font-semibold">B1 level - Warm-Ups & Practices</p>
        </header>

        <div class="flex flex-1 overflow-hidden">
            
            <aside class="w-64 bg-[var(--bg-card)] border-r border-[var(--border-ui)] p-4 flex flex-col gap-2 overflow-y-auto shrink-0">
                <h2 class="text-xs font-bold text-[var(--text-body)] uppercase tracking-wider mb-2 px-1">Select Unit Block:</h2>
                <button onclick="selectBlock('u1-2')" id="btn-u1-2" class="sidebar-btn active text-left px-4 py-3 rounded-xl text-sm font-semibold border transition-all">📘 Units 1-2</button>
                <button onclick="selectBlock('u3-4')" id="btn-u3-4" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 3-4</button>
                <button onclick="selectBlock('u5-6')" id="btn-u5-6" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 5-6</button>
                <button onclick="selectBlock('u7-8')" id="btn-u7-8" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 7-8</button>
                <button onclick="selectBlock('u9-10')" id="btn-u9-10" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 9-10</button>
                <button onclick="selectBlock('u11-12')" id="btn-u11-12" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 11-12</button>
                <button onclick="selectBlock('u13-14')" id="btn-u13-14" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 13-14</button>
                <button onclick="selectBlock('u15-16')" id="btn-u15-16" class="sidebar-btn text-left px-4 py-3 rounded-xl bg-[var(--bg-base)] text-[var(--text-body)] hover:brightness-95 border border-[var(--border-ui)] transition-all text-sm font-semibold">📘 Units 15-16</button>
            </aside>

            <main class="flex-1 p-6 flex flex-col gap-6 overflow-y-auto">
                
                <div class="portal-card p-5 animate-fade-down shrink-0">
                    <span id="unit-badge" class="brand-color-bg text-white text-xs px-2.5 py-1 rounded-md font-bold uppercase shadow-sm">Units 1-2</span>
                    <h2 id="unit-title" class="text-2xl font-bold text-[var(--text-title)] mt-2">Welcome & Personal Information</h2>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 flex-1 items-start">
                    
                    <div class="portal-card portal-card-interactive p-6 flex flex-col justify-between h-[420px] animate-fade-up">
                        <div>
                            <div class="flex items-center gap-2 mb-4">
                                <span class="bg-amber-500/10 text-amber-500 text-xs px-2.5 py-1 rounded-md font-bold uppercase border border-amber-500/20">Warm-Up</span>
                            </div>
                            <p id="warmup-display" class="text-[var(--text-body)] text-base text-center font-medium my-12 px-4">
                                Click the button below to generate a real-world communication prompt!
                            </p>
                        </div>
                        <button onclick="generatePrompt()" class="w-full brand-color-button text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-comments"></i> GENERATE QUESTION
                        </button>
                    </div>

                    <div class="xl:col-span-2 portal-card p-6 h-[420px] flex flex-col animate-fade-up" style="animation-delay: 0.1s;">
                        <div class="flex items-center gap-2 mb-4 shrink-0">
                            <span class="bg-red-500/10 brand-color-text text-xs px-2.5 py-1 rounded-md font-bold uppercase border border-red-500/20">Interactive Challenges</span>
                        </div>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 flex-1 overflow-y-auto pr-1">
                            <button onclick="openGame('Flashcards')" class="bg-[#d97706] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-layer-group text-2xl"></i><span class="text-xs uppercase tracking-wide">Flashcards</span></button>
                            <button onclick="openGame('Quiz')" class="bg-[#dc2626] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-square-check text-2xl"></i><span class="text-xs uppercase tracking-wide">Quiz</span></button>
                            <button onclick="openGame('Fill Blanks')" class="bg-[#db2777] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-pen-to-square text-2xl"></i><span class="text-xs uppercase tracking-wide">Fill Blanks</span></button>
                            <button onclick="openGame('Word Search')" class="bg-[#2563eb] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-magnifying-glass text-2xl"></i><span class="text-xs uppercase tracking-wide">Word Search</span></button>
                            
                            <button onclick="openGame('Memory Match')" class="bg-[#9333ea] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-brain text-2xl"></i><span class="text-xs uppercase tracking-wide">Memory Match</span></button>
                            <button onclick="openGame('Category Sort')" class="bg-[#ca8a04] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-circle-nodes text-2xl"></i><span class="text-xs uppercase tracking-wide">Category Sort</span></button>
                            <button onclick="openGame('Hangman')" class="bg-[#c026d3] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-circle-question text-2xl"></i><span class="text-xs uppercase tracking-wide">Hangman</span></button>
                            <button onclick="openGame('Word Wheel')" class="bg-[#ea580c] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-ferris-wheel text-2xl"></i><span class="text-xs uppercase tracking-wide">Word Wheel</span></button>
                            
                            <button onclick="openGame('Tic-Tac-Toe')" class="bg-[#0d9488] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-table-cells text-2xl"></i><span class="text-xs uppercase tracking-wide">Tic-Tac-Toe</span></button>
                            <button onclick="openGame('Find Errors')" class="bg-[#e11d48] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-triangle-exclamation text-2xl"></i><span class="text-xs uppercase tracking-wide">Find Errors</span></button>
                            <button onclick="openGame('Reorder Steps')" class="bg-[#4f46e5] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-list-ol text-2xl"></i><span class="text-xs uppercase tracking-wide">Reorder Steps</span></button>
                            <button onclick="openGame('Jeopardy')" class="bg-[#16a34a] hover:brightness-110 text-white font-bold rounded-2xl flex flex-col items-center justify-center gap-2 p-4 shadow-sm hover:scale-105"><i class="fa-solid fa-trophy text-2xl"></i><span class="text-xs uppercase tracking-wide">Jeopardy</span></button>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <div id="game-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-[var(--bg-card)] border-2 border-[var(--border-ui)] w-full max-w-5xl rounded-3xl p-8 shadow-2xl relative flex flex-col max-h-[92vh]">
            
            <button onclick="closeActiveGameModal()" class="absolute top-5 right-5 text-[var(--text-body)] hover:text-rose-500 text-2xl p-2 transition-all cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="flex items-center gap-4 mb-6 pb-4 border-b border-[var(--border-ui)] shrink-0">
                <span id="modal-game-badge" class="brand-color-bg text-white px-3 py-1.5 rounded-xl font-mono text-xs font-black uppercase tracking-widest shadow-sm"></span>
                <h3 id="modal-game-title" class="text-2xl font-mono font-black tracking-tight text-[var(--text-title)]"></h3>
            </div>
            
            <div id="modal-game-stage" class="flex-1 flex flex-col items-center justify-center min-h-[420px] overflow-y-auto pr-1">
                </div>
        </div>
    </div>
	<script>
        /* =====================================================================
           🎨 PORTAL STRUCTURAL THEME CONTROLLER & GLOBAL STATE
           ===================================================================== */
        const themeBtn = document.getElementById('themeSwitchBtn');
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
        });

        // Estado del portal activo
        let currentBlockId = 'u1-2';
        let activeGameType = null;

        /* =====================================================================
           📦 MASTER DATA OBJECT: UNITS 1 TO 16 (PEDAGOGICAL DATA COMPLETE)
           ===================================================================== */
        const DATA = {
            "u1-2": {
    badge: "Units 1-2 (B1)",
    title: "Relationships & City Life",
    details: "Grammar: Relative pronouns (subject/object), It clauses + adverbial clauses with when, Gerund phrases as subjects/objects | Vocab: Personality traits, City life expressions",
    
    prompts: [
        "What kind of people do you prefer to hang out with? Use a relative pronoun as a subject (e.g., 'I like friends who are...').",
        "Describe an ideal partner or classmate using a relative pronoun as an object (e.g., 'The type of person I look for is someone I can...').",
        "How do you feel about rainy days? Complete this: 'I love it when...' or 'I hate it when...'",
        "Is it easy or difficult for you to make new friends online? Start your answer with a gerund phrase (e.g., 'Meeting people online is...').",
        "Think about an inflexible or moody person you know. How do you handle their personality traits?",
        "What is something you enjoy doing on weekends? Use a gerund phrase as an object (e.g., 'I really enjoy going to...').",
        "Complete the sentence and explain why: 'I don't mind it when a friend...'",
        "Describe a supportive friend you have. What makes them so reliable?",
        "Is being modest an important quality in a boss, or do you prefer someone more ambitious?",
        "What annoys you the most about public transport or city traffic? Use an 'It clause + when' structure."
    ],

    vocabulary: [
        { word: "easygoing", translation: "Relaxed and tolerant in approach or manner." },
        { word: "inflexible", translation: "Unwilling to change or compromise one's opinions or plans." },
        { word: "modest", translation: "Unassuming in the estimation of one's abilities or achievements." },
        { word: "supportive", translation: "Providing encouragement or emotional help." },
        { word: "moody", translation: "Given to unpredictable changes of mood." },
        { word: "reliable", translation: "Consistently good in quality or performance; able to be trusted." },
        { word: "arrogant", translation: "Having an exaggerated sense of one's own importance or abilities." },
        { word: "it bothers me", translation: "Expression used when something causes annoyance or worry." },
        { word: "it annoys me", translation: "Expression used when something makes one feel slightly angry." },
        { word: "I love it", translation: "Expression used to show strong enjoyment of a specific situation." },
        { word: "I don't mind it", translation: "Expression used to show that something does not bother or upset you." },
        { word: "when", translation: "Adverbial conjunction used to introduce a situation or condition." },
        { word: "meeting people", translation: "Gerund phrase referring to the act of social interaction." },
        { word: "living alone", translation: "Gerund phrase referring to a solitary lifestyle." },
        { word: "sharing a flat", translation: "Gerund phrase referring to cohabitation." }
    ],

    grammar: [
        {
            rules: "Relative Pronouns: Use 'who' (people) or 'which' (things) as subjects before verbs. Use them as objects before [subject + verb].",
            examples: ["I like friends who are kind.", "The book [that] I read was great."]
        },
        {
            rules: "It Clauses + When: Use 'it' as a dummy subject to react to a situation, followed by 'when'.",
            examples: ["I hate it when people are late."]
        },
        {
            rules: "Gerund Phrases: Use -ing as the subject (singular verb) or as the object after specific verbs like enjoy/mind.",
            examples: ["Learning English is fun.", "I enjoy living in the city."]
        }
    ],

    quiz: [
        { q: "I prefer to have a boss _______ supports my creative decisions at work.", a: ["who", "which", "whom"], c: "who" },
        { q: "I absolutely love _______ when my friends bring me unexpected birthday gifts.", a: ["it", "that", "this"], c: "it" },
        { q: "_______ in a big, noisy city can be quite stressful for introverted people.", a: ["Living", "Live", "Lived"], c: "Living" },

            "u7-8": {

    title: "Passives, Causes & Suggestions",
    details: "Grammar: Passive (Present Continuous/Perfect), Prepositions of cause, Infinitive clauses, Would rather/prefer, By + gerund | Vocab: Global challenges, Life skills, Phrasal verbs",

        { word: "get in shape", translation: "To become physically fit." }

    grammar: [
        {
            rules: "Passive Voice: Use 'is being + V3' for ongoing actions. Use 'have/has been + V3' for finished actions where the result matters.",
            examples: ["The bridge is being built.", "The goal has been achieved."]

        {
            rules: "Prepositions of Cause: 'Due to', 'because of', and 'as a result of' must be followed by a noun, not a full sentence.",

        { q: "The local problem of youth unemployment has risen sharply _______ the corporate factory closures.", a: ["because of", "due", "as a result"], c: "because of" },
        { q: "We are really looking forward to _______ our international clients next month.", a: ["meeting", "meet", "to meet"], c: "meeting" },
        { q: "All the structural errors in the blueprint _______ successfully resolved by the engineers.", a: ["have been", "is being", "has been"], c: "have been" },
        { q: "The brilliant marketing team managed to come up _______ an innovative ad strategy.", a: ["with", "to", "for"], c: "with" },

        { q: "_______ reduce global warming, many nations are investing heavily in green energy fields.", a: ["To", "For", "By"], c: "To" },

        { q: "By _______ with local charities, our company helped reduce extreme poverty.", a: ["collaborating", "collaborate", "collaborated"], c: "collaborating" },

        function selectBlock(blockId) {
            currentBlockId = blockId;
            
            // Actualizar botones de la barra lateral
            document.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-[var(--accent-g)]', 'text-white');
                btn.classList.add('bg-[var(--bg-base)]', 'text-[var(--text-body)]');
            });
            
            const selectedBtn = document.getElementById(`btn-${blockId}`);
            if (selectedBtn) {
                selectedBtn.classList.add('active');
                selectedBtn.classList.remove('bg-[var(--bg-base)]', 'text-[var(--text-body)]');
            }

            // Actualizar textos informativos principales
            document.getElementById('unit-badge').innerText = DATA[blockId].badge;
            document.getElementById('unit-title').innerText = DATA[blockId].title;

            // Resetear el visor de Warm-Up con texto base elegante
            document.getElementById('warmup-display').innerText = "Click the button below to generate a real-world communication prompt!";
            
            // Si hay un minijuego abierto, actualizarlo en caliente con los nuevos datos
            if (activeGameType) {
                openGame(activeGameType);
            }
        }

                <span class="text-xl font-bold tracking-tight text-[var(--text-title)]">${prompts[randomIndex]}</span>
            `;
        }

        // Inicialización automática al cargar el portal
        window.addEventListener('DOMContentLoaded', () => {
            selectBlock('u1-2');
        });

        function openGame(gameType) {
            activeGameType = gameType;
            const blockData = DATA[currentBlockId];
            
            document.getElementById('modal-game-badge').innerText = blockData.badge;

// 1. ENGINE: FLASHCARDS
function buildFlashcardsEngine(stage, vocab) {
    if (!vocab || vocab.length === 0) {
        stage.innerHTML = `<div class="text-center text-slate-400">No vocabulary data available.</div>`;
        return;
    }
    let index = 0;

    function render() {
        stage.innerHTML = `
            <div class="w-full max-w-md flex flex-col items-center gap-6">
                <div class="flashcard-scene w-full h-64 cursor-pointer">
                    <div class="flashcard-inner w-full h-full text-white font-black rounded-2xl shadow-xl transition-transform duration-500 relative style-3d">
                        <div class="flashcard-front absolute inset-0 bg-slate-800 border-2 border-slate-700 flex flex-col items-center justify-center p-6 rounded-2xl backface-hidden">
                            <span class="text-xs text-amber-400 tracking-widest uppercase mb-2">English Word</span>
                            <p class="text-3xl text-center">${vocab[index].word}</p>
                            <span class="text-xs text-slate-400 mt-8"><i class="fa-solid fa-rotate"></i> Click to flip</span>
                        </div>
                        <div class="flashcard-back absolute inset-0 bg-emerald-700 border-2 border-emerald-600 flex flex-col items-center justify-center p-6 rounded-2xl backface-hidden rotate-y-180">
                            <span class="text-xs text-emerald-200 tracking-widest uppercase mb-2">CLUE / TRANSLATION</span>
                            <p class="text-xl text-center font-medium">${vocab[index].translation}</p>
                            <span class="text-xs text-emerald-300 mt-8"><i class="fa-solid fa-rotate"></i> Click to see front</span>
                        </div>
                    </div>
                </div>
                <div class="flex gap-4 w-full">
                    <button id="card-prev" class="flex-1 bg-slate-700 text-white p-4 rounded-xl font-bold hover:bg-slate-600 disabled:opacity-30 disabled:pointer-events-none">PREVIOUS</button>
                    <button id="card-next" class="flex-1 bg-slate-700 text-white p-4 rounded-xl font-bold hover:bg-slate-600 disabled:opacity-30 disabled:pointer-events-none">NEXT</button>
                </div>
                <p class="text-sm font-bold text-slate-400">Card ${index + 1} of ${vocab.length}</p>
            </div>
        `;

        const scene = stage.querySelector('.flashcard-scene');
        const inner = stage.querySelector('.flashcard-inner');
        scene.onclick = () => inner.classList.toggle('flipped');

        const prevBtn = stage.querySelector('#card-prev');
        const nextBtn = stage.querySelector('#card-next');

        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === vocab.length - 1;

        prevBtn.onclick = (e) => { e.stopPropagation(); index--; render(); };
        nextBtn.onclick = (e) => { e.stopPropagation(); index++; render(); };
    }
    render();
}

// 2. ENGINE: QUIZ
function buildQuizEngine(stage, quizData) {
    if (!quizData || quizData.length === 0) {
        stage.innerHTML = `<div class="text-center text-slate-400">No quiz data available.</div>`;
        return;
    }
    let index = 0;

    function render() {
        const item = quizData[index];
        stage.innerHTML = `
            <div class="w-full max-w-2xl flex flex-col gap-4">
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl text-center">
                    <p class="text-xs text-red-400 tracking-wider uppercase mb-2 font-mono">Question ${index + 1} of ${quizData.length}</p>
                    <p class="text-white font-bold text-lg">${item.q}</p>
                </div>
                <div class="quiz-options space-y-3">
                    ${item.a.map((opt, oIdx) => `
                        <button data-opt="${opt}" class="w-full text-left bg-slate-700 hover:bg-slate-600 p-4 rounded-xl text-white font-semibold flex items-center gap-3 border border-slate-600 transition-all">
                            <span class="bg-slate-800 text-xs px-2.5 py-1 rounded font-bold">${String.fromCharCode(65 + oIdx)}</span>
                            <span>${opt}</span>
                        </button>
                    `).join('')}
                </div>
                <div id="quiz-nav" class="hidden mt-4">
                    <button id="quiz-next-btn" class="w-full bg-emerald-600 text-white p-4 rounded-xl font-bold hover:bg-emerald-500 tracking-wide">CONTINUE</button>
                </div>
            </div>
        `;

        const buttons = stage.querySelectorAll('.quiz-options button');
        buttons.forEach(btn => {
            btn.onclick = () => {
                buttons.forEach(b => b.disabled = true);
                const selected = btn.getAttribute('data-opt');
                
                if (selected === item.c) {
                    btn.classList.add('bg-emerald-600', 'border-emerald-400');
                } else {
                    btn.classList.add('bg-rose-600', 'border-rose-400');
                    buttons.forEach(b => {
                        if (b.getAttribute('data-opt') === item.c) {
                            b.classList.add('bg-emerald-600', 'border-emerald-400');
                        }
                    });
                }
                
                const navDiv = stage.querySelector('#quiz-nav');
                navDiv.classList.remove('hidden');
                stage.querySelector('#quiz-next-btn').onclick = () => {
                    index++;
                    if (index < quizData.length) render();
                    else stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500 py-8"><i class="fa-solid fa-circle-check text-6xl block mb-4 animate-bounce"></i>CHALLENGE COMPLETED!</div>`;
                };
            };
        });
    }
    render();
}

// 3. ENGINE: FILL BLANKS
function buildFillBlanksEngine(stage, quizData) {
    if (!quizData || quizData.length === 0) {
        stage.innerHTML = `<div class="text-center text-slate-400">No data available.</div>`;
        return;
    }
    let index = 0;

    function render() {
        const item = quizData[index];
        const blankSentence = item.q.includes("___") ? item.q.replace("___", "_______") : item.q;
        stage.innerHTML = `
            <div class="w-full max-w-2xl flex flex-col gap-6">
                <div class="bg-slate-800 border border-slate-700 p-8 rounded-xl text-center">
                    <p class="text-2xl text-white font-bold tracking-wide">${blankSentence}</p>
                </div>
                <div class="blanks-options grid grid-cols-2 gap-4">
                    ${item.a.map(opt => `
                        <button data-opt="${opt}" class="bg-slate-700 hover:bg-slate-600 text-white font-bold p-5 rounded-xl border border-slate-600 text-lg transition-all">${opt}</button>
                    `).join('')}
                </div>
                <div id="blank-nav" class="hidden">
                    <button id="blank-next-btn" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold text-lg hover:bg-indigo-500">NEXT QUESTION</button>
                </div>
            </div>
        `;

        const buttons = stage.querySelectorAll('.blanks-options button');
        buttons.forEach(btn => {
            btn.onclick = () => {
                buttons.forEach(b => b.disabled = true);
                const selected = btn.getAttribute('data-opt');

                if (selected === item.c) {
                    btn.className = "bg-emerald-600 text-white font-bold p-5 rounded-xl text-lg border border-emerald-400";
                } else {
                    btn.className = "bg-rose-600 text-white font-bold p-5 rounded-xl text-lg border border-rose-400";
                    buttons.forEach(b => {
                        if (b.getAttribute('data-opt') === item.c) b.className = "bg-emerald-600 text-white font-bold p-5 rounded-xl text-lg border border-emerald-400";
                    });
                }

                stage.querySelector('#blank-nav').classList.remove('hidden');
                stage.querySelector('#blank-next-btn').onclick = () => {
                    index++;
                    if (index < quizData.length) render();
                    else stage.innerHTML = `<div class="text-center text-2xl font-black text-indigo-500 py-8"><i class="fa-solid fa-trophy text-6xl block mb-4 text-amber-400 animate-pulse"></i>PERFECT JOB!</div>`;
                };
            };
        });
    }
    render();
}

// 4. ENGINE: WORD SEARCH
function buildWordSearchEngine(stage, vocab) {
    if (!vocab || vocab.length === 0) return;
    const targetWords = vocab.map(v => v.word.toUpperCase().replace(/\s+/g, '')).slice(0, 4);
    const size = 10;
    let grid = Array(size).fill(null).map(() => Array(size).fill(''));
    
    targetWords.forEach((word, idx) => {
        let row = idx * 2; 
        let startCol = Math.floor(Math.random() * (size - word.length + 1));
        for (let i = 0; i < word.length; i++) {
            grid[row][startCol + i] = word[i];
        }
    });
    
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            if (grid[r][c] === '') grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
        }
    }

    let foundWords = [];
    let selectedCoords = []; // [{r, c, letter, btn}]

    function updateUI() {
        const currentString = selectedCoords.map(coord => coord.letter).join('');
        stage.querySelector('#ws-current').innerText = currentString;

        if (targetWords.includes(currentString) && !foundWords.includes(currentString)) {
            foundWords.push(currentString);
            const wordBadge = stage.querySelector(`#ws-${currentString}`);
            if (wordBadge) wordBadge.className = "bg-emerald-900 border border-emerald-700 p-3 rounded-xl text-center font-bold text-emerald-400 line-through animate-pulse";
            
            selectedCoords.forEach(coord => {
                coord.btn.className = "w-10 h-10 bg-emerald-600 text-white font-black text-sm rounded flex items-center justify-center exact-match";
                coord.btn.disabled = true;
            });
            clearSelection();

            if (foundWords.length === targetWords.length) {
                stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500 py-8"><i class="fa-solid fa-face-smile text-6xl block mb-4 animate-bounce"></i>FANTASTIC! ALL WORDS FOUND!</div>`;
            }
        }
    }

    function clearSelection() {
        selectedCoords.forEach(coord => {
            if (!coord.btn.classList.contains('exact-match')) {
                coord.btn.className = "w-10 h-10 aspect-square bg-slate-700 text-white font-black text-sm rounded flex items-center justify-center hover:bg-slate-600";
            }
        });
        selectedCoords = [];
        stage.querySelector('#ws-current').innerText = "";
    }

    stage.innerHTML = `
        <div class="flex flex-col md:flex-row gap-8 items-center w-full max-w-4xl">
            <div class="ws-grid grid grid-cols-10 gap-1 bg-slate-800 p-3 rounded-xl border border-slate-700 w-full md:w-auto">
                ${grid.map((row, rIdx) => row.map((letter, cIdx) => `
                    <button data-row="${rIdx}" data-col="${cIdx}" data-letter="${letter}" class="w-10 h-10 aspect-square bg-slate-700 text-white font-black text-sm rounded flex items-center justify-center hover:bg-slate-600 transition-colors">${letter}</button>
                `).join('')).join('')}
            </div>
            <div class="flex-1 flex flex-col gap-4 w-full">
                <h4 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Words to find:</h4>
                <div class="grid grid-cols-2 gap-2">
                    ${targetWords.map(w => `<div id="ws-${w}" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-center font-bold text-slate-400">${w}</div>`).join('')}
                </div>
                <div class="mt-4 p-3 bg-slate-800/50 border border-slate-700 rounded-xl">
                    <p class="text-xs text-slate-400">Current Selection: <span id="ws-current" class="text-base font-black text-amber-500 ml-2"></span></p>
                </div>
                <button id="ws-clear-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl tracking-wide">CLEAR SELECTION</button>
            </div>
        </div>
    `;

    stage.querySelectorAll('.ws-grid button').forEach(btn => {
        btn.onclick = () => {
            const r = parseInt(btn.getAttribute('data-row'));
            const c = parseInt(btn.getAttribute('data-col'));
            const letter = btn.getAttribute('data-letter');

            const index = selectedCoords.findIndex(coord => coord.r === r && coord.c === c);
            if (index > -1) {
                btn.className = "w-10 h-10 aspect-square bg-slate-700 text-white font-black text-sm rounded flex items-center justify-center hover:bg-slate-600";
                selectedCoords.splice(index, 1);
            } else {
                btn.className = "w-10 h-10 aspect-square bg-amber-500 text-slate-900 font-black text-sm rounded flex items-center justify-center";
                selectedCoords.push({ r, c, letter, btn });
            }
            updateUI();
        };
    });

    stage.querySelector('#ws-clear-btn').onclick = clearSelection;
}

// 5. ENGINE: MEMORY MATCH
function buildMemoryMatchEngine(stage, vocab) {
    if (!vocab || vocab.length === 0) return;
    let selectedItems = vocab.slice(0, 4);
    let deck = [];
    selectedItems.forEach((item, idx) => {
        deck.push({ text: item.word, type: 'eng', pairId: idx });
        deck.push({ text: item.translation, type: 'esp', pairId: idx });
    });
    deck.sort(() => Math.random() - 0.5);

    stage.innerHTML = `
        <div id="memory-board" class="grid grid-cols-4 gap-4 w-full max-w-3xl">
            ${deck.map((card, index) => `
                <button data-idx="${index}" class="h-28 bg-slate-800 border-2 border-slate-700 font-bold rounded-xl flex items-center justify-center p-3 text-sm transition-all overflow-hidden">
                    <span class="hidden text-white font-black text-sm text-center card-text">${card.text}</span>
                    <span class="card-back-mark text-slate-500 text-2xl font-black">?</span>
                </button>
            `).join('')}
        </div>
    `;

    let firstCard = null;
    let pairsFound = 0;
    let lockBoard = false;
    const buttons = stage.querySelectorAll('#memory-board button');

    buttons.forEach(btn => {
        btn.onclick = () => {
            if (lockBoard || btn.classList.contains('matched') || btn === firstCard?.btn) return;

            const idx = parseInt(btn.getAttribute('data-idx'));
            btn.querySelector('.card-back-mark').classList.add('hidden');
            btn.querySelector('.card-text').classList.remove('hidden');
            btn.classList.add('bg-indigo-600', 'border-indigo-400');

            if (!firstCard) {
                firstCard = { btn, data: deck[idx] };
            } else {
                lockBoard = true;
                const secondCardData = deck[idx];

                if (firstCard.data.pairId === secondCardData.pairId && firstCard.data.type !== secondCardData.type) {
                    setTimeout(() => {
                        firstCard.btn.className = "h-28 bg-emerald-950 border-2 border-emerald-500 text-emerald-400 font-black rounded-xl flex items-center justify-center p-3 text-sm matched animate-pulse";
                        btn.className = "h-28 bg-emerald-950 border-2 border-emerald-500 text-emerald-400 font-black rounded-xl flex items-center justify-center p-3 text-sm matched animate-pulse";
                        
                        firstCard = null;
                        pairsFound++;
                        lockBoard = false;

                        if (pairsFound === selectedItems.length) {
                            stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500 py-8"><i class="fa-solid fa-medal text-6xl block mb-4 text-amber-400"></i>EXCELLENT MEMORY SHARPENED!</div>`;
                        }
                    }, 500);
                } else {
                    setTimeout(() => {
                        firstCard.btn.className = "h-28 bg-slate-800 border-2 border-slate-700 font-bold rounded-xl flex items-center justify-center p-3 text-sm";
                        firstCard.btn.querySelector('.card-back-mark').classList.remove('hidden');
                        firstCard.btn.querySelector('.card-text').classList.add('hidden');

                        btn.className = "h-28 bg-slate-800 border-2 border-slate-700 font-bold rounded-xl flex items-center justify-center p-3 text-sm";
                        btn.querySelector('.card-back-mark').classList.remove('hidden');
                        btn.querySelector('.card-text').classList.add('hidden');

                        firstCard = null;
                        lockBoard = false;
                    }, 1000);
                }
            }
        };
    });
}

// 6. ENGINE: CATEGORY SORT
function buildCategorySortEngine(stage, blockData) {
    if (!blockData || !blockData.vocabulary || !blockData.grammar) return;
    const categories = ["Vocabulary Words", "Grammar Elements"];
    let items = [];
    blockData.vocabulary.slice(0, 3).forEach(v => items.push({ text: v.word, cat: "Vocabulary Words" }));
    
    const examples = blockData.grammar.examples || (blockData.grammar[0] ? blockData.grammar[0].examples : []);
    examples.slice(0, 2).forEach(g => items.push({ text: g, cat: "Grammar Elements" }));
    
    items.sort(() => Math.random() - 0.5);
    let index = 0;

    function render() {
        if (index >= items.length) {
            stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500 py-8"><i class="fa-solid fa-circle-check text-6xl block mb-4"></i>ALL CATEGORIES SORTED WELL!</div>`;
            return;
        }
        const current = items[index];
        stage.innerHTML = `
            <div class="w-full max-w-xl flex flex-col gap-6 text-center">
                <span class="text-xs font-mono font-bold text-slate-400 tracking-widest uppercase">Classify item ${index + 1} of ${items.length}</span>
                <div class="bg-slate-800 border-2 border-slate-700 p-8 rounded-2xl shadow-inner">
                    <p class="text-xl font-black text-white tracking-wide">${current.text}</p>
                </div>
                <div class="sort-actions flex flex-col sm:flex-row gap-4">
                    ${categories.map(cat => `
                        <button data-cat="${cat}" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold p-4 rounded-xl border border-slate-600 transition-all">${cat}</button>
                    `).join('')}
                </div>
            </div>
        `;

        const buttons = stage.querySelectorAll('.sort-actions button');
        buttons.forEach(btn => {
            btn.onclick = () => {
                buttons.forEach(b => b.disabled = true); // Bloqueo anti-click masivo
                const selectedCat = btn.getAttribute('data-cat');

                if (selectedCat === current.cat) {
                    btn.className = "flex-1 bg-emerald-600 text-white font-bold p-4 rounded-xl border border-emerald-400";
                } else {
                    btn.className = "flex-1 bg-rose-600 text-white font-bold p-4 rounded-xl border border-rose-400";
                    buttons.forEach(b => {
                        if (b.getAttribute('data-cat') === current.cat) b.className = "flex-1 bg-emerald-600 text-white font-bold p-4 rounded-xl border border-emerald-400";
                    });
                }
                setTimeout(() => { index++; render(); }, 1200);
            };
        });
    }
    render();
}

// 7. ENGINE: HANGMAN
function buildHangmanEngine(stage, vocab) {
    if (!vocab || vocab.length === 0) return;
    const item = vocab[Math.floor(Math.random() * vocab.length)];
    const targetWord = item.word.toUpperCase().replace(/[^A-Z]/g, '');
    let guessedLetters = [];
    let failures = 0;
    const maxFailures = 5;

    function render() {
        let displayStr = "";
        for (let char of targetWord) {
            if (guessedLetters.includes(char)) {
                displayStr += `<span class="mx-1 border-b-4 border-emerald-500 px-1 text-2xl font-black text-white">${char}</span>`;
            } else {
                displayStr += `<span class="mx-1 border-b-4 border-slate-600 px-1 text-2xl font-black text-slate-500">_</span>`;
            }
        }

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        stage.innerHTML = `
            <div class="w-full max-w-2xl flex flex-col items-center gap-6">
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl w-full text-center">
                    <span class="text-xs text-amber-500 font-bold uppercase tracking-widest block mb-1">Clue / Meaning:</span>
                    <p class="text-lg font-medium text-slate-200">"${item.translation}"</p>
                </div>
                <div id="hangman-word-slots" class="flex justify-center my-6 py-2 overflow-x-auto max-w-full">
                    ${displayStr}
                </div>
                <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden relative">
                    <div class="bg-rose-500 h-full transition-all duration-300" style="width: ${(failures / maxFailures) * 100}%"></div>
                </div>
                <p class="text-xs font-mono font-bold text-slate-400 uppercase tracking-widest">Integrity Counter: ${maxFailures - failures} attempts remaining</p>
                <div class="hangman-keyboard grid grid-cols-7 gap-1.5 w-full mt-4">
                    ${alphabet.map(letter => {
                        const used = guessedLetters.includes(letter);
                        return `<button data-letter="${letter}" ${used ? 'disabled' : ''} class="p-2 font-bold rounded text-sm transition-all ${used ? 'bg-slate-800 text-slate-600 pointer-events-none' : 'bg-slate-700 text-white hover:bg-slate-600'}">${letter}</button>`;
                    }).join('')}
                </div>
            </div>
        `;

        stage.querySelectorAll('.hangman-keyboard button').forEach(btn => {
            btn.onclick = () => {
                const letter = btn.getAttribute('data-letter');
                guessedLetters.push(letter);
                
                if (!targetWord.includes(letter)) failures++;

                const won = targetWord.split("").every(l => guessedLetters.includes(l));
                if (won) {
                    stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500 py-8"><i class="fa-solid fa-trophy text-6xl block mb-4 text-amber-400 animate-bounce"></i>CRACKED IT! THE WORD WAS "${targetWord}"</div>`;
                } else if (failures >= maxFailures) {
                    stage.innerHTML = `<div class="text-center text-2xl font-black text-rose-500 py-8"><i class="fa-solid fa-skull-crossbones text-6xl block mb-4 animate-pulse"></i>GAME OVER!<br><span class="text-base text-slate-400 font-normal">Correct word was:</span> <span class="text-white">${targetWord}</span></div>`;
                } else {
                    render();
                }
            };
        });
    }
    render();
}

        // 8. ENGINE: WORD WHEEL
function buildWordWheelEngine(stage, vocab) {
    const validWords = vocab.map(v => v.word.toUpperCase());
    const letters = ["A", "E", "O", "T", "R", "S", "I", "N", "C", "L"];
    let userBuild = "";

    function render() {
        stage.innerHTML = `
            <div class="w-full max-w-md flex flex-col items-center gap-6">
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl w-full text-center">
                    <span class="text-xs text-slate-400 font-bold block mb-1">Constructed String:</span>
                    <p id="wheel-string" class="text-3xl font-black tracking-widest text-amber-500 min-h-[36px]">${userBuild}</p>
                </div>
                <div class="grid grid-cols-4 gap-3 w-full" id="wheel-letters-grid">
                    ${letters.map(l => `<button data-letter="${l}" class="bg-slate-700 hover:bg-slate-600 text-white font-black text-lg p-4 rounded-xl border border-slate-600">${l}</button>`).join('')}
                </div>
                <div class="flex gap-2 w-full mt-2">
                    <button id="wheel-btn-clear" class="flex-1 bg-slate-800 border border-slate-700 text-rose-400 font-bold p-3 rounded-xl">CLEAR</button>
                    <button id="wheel-btn-submit" class="flex-1 bg-emerald-600 text-white font-bold p-3 rounded-xl hover:bg-emerald-500">SUBMIT VALUE</button>
                </div>
                <div class="w-full text-left bg-slate-800/40 p-3 rounded-xl border border-slate-700">
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">Target suggestions match length:</p>
                    <p class="text-xs text-slate-500">Try creating words matching vocabulary strings.</p>
                </div>
            </div>
        `;
        bindEvents();
    }

    function bindEvents() {
        stage.querySelectorAll('#wheel-letters-grid button').forEach(btn => {
            btn.addEventListener('click', () => {
                userBuild += btn.dataset.letter;
                stage.querySelector('#wheel-string').innerText = userBuild;
            });
        });

        stage.querySelector('#wheel-btn-clear').addEventListener('click', () => {
            userBuild = "";
            stage.querySelector('#wheel-string').innerText = "";
        });

        stage.querySelector('#wheel-btn-submit').addEventListener('click', () => {
            let match = validWords.some(w => w === userBuild) && userBuild.length >= 2;
            if(match) {
                stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500"><i class="fa-solid fa-circle-check text-5xl block mb-4"></i>VALID CHAIN DISCOVERED!</div>`;
            } else {
                alert("String does not match block combinations. Try again!");
                userBuild = "";
                stage.querySelector('#wheel-string').innerText = "";
            }
        });
    }
    render();
}

// 9. ENGINE: TIC-TAC-TOE
function buildTicTacToeEngine(stage, quizData) {
    let board = Array(9).fill('');
    let questionPool = [...quizData];

    function checkWin(player) {
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8], // Rows
            [0,3,6], [1,4,7], [2,5,8], // Columns
            [0,4,8], [2,4,6]           // Diagonals
        ];
        return winPatterns.some(pattern => pattern.every(idx => board[idx] === player));
    }

    function renderBoard() {
        stage.innerHTML = `
            <div class="w-full max-w-md flex flex-col items-center gap-4">
                <p class="text-xs font-bold text-slate-400 tracking-wider text-center uppercase">Click any cell to answer a question and place your mark (X)</p>
                <div class="grid grid-cols-3 gap-2 bg-slate-800 p-3 rounded-xl border border-slate-700 w-full aspect-square" id="tic-grid">
                    ${board.map((cell, idx) => `
                        <button data-idx="${idx}" class="bg-slate-700 text-white text-3xl font-black rounded-xl flex items-center justify-center hover:bg-slate-600 min-h-[80px]">${cell}</button>
                    `).join('')}
                </div>
            </div>
        `;

        stage.querySelectorAll('#tic-grid button').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.idx);
                if(board[idx] !== '') return;
                triggerQuestion(idx);
            });
        });
    }

    function triggerQuestion(idx) {
        if(questionPool.length === 0) questionPool = [...quizData];
        const item = questionPool[Math.floor(Math.random() * questionPool.length)];
        
        stage.innerHTML = `
            <div class="w-full max-w-xl flex flex-col gap-4">
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 text-center">
                    <p class="text-white font-bold">${item.q}</p>
                </div>
                <div class="space-y-2" id="tic-options">
                    ${item.a.map(opt => `<button data-opt="${opt}" class="w-full bg-slate-700 text-white p-4 rounded-xl font-medium text-left border border-slate-600 hover:bg-slate-600">${opt}</button>`).join('')}
                </div>
            </div>
        `;

        stage.querySelectorAll('#tic-options button').forEach(btn => {
            btn.addEventListener('click', () => {
                resolveTurn(idx, btn.dataset.opt, item.c);
            });
        });
    }

    function resolveTurn(idx, selected, correct) {
        if(selected === correct) {
            board[idx] = 'X';
            if(checkWin('X')) {
                stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500"><i class="fa-solid fa-trophy text-5xl block mb-4"></i>YOU WIN THE MATCH!</div>`;
                return;
            }
        } else {
            alert("Wrong answer! Turn skipped.");
        }

        // AI opponent turn execution
        let empties = board.map((c, i) => c === '' ? i : null).filter(v => v !== null);
        if(empties.length > 0) {
            let aiChoice = empties[Math.floor(Math.random() * empties.length)];
            board[aiChoice] = 'O';
            if(checkWin('O')) {
                stage.innerHTML = `<div class="text-center text-2xl font-black text-rose-500"><i class="fa-solid fa-robot text-5xl block mb-4"></i>AI WINS THE MATCH!</div>`;
                return;
            }
        }
        
        if(board.filter(c => c === '').length === 0) {
            stage.innerHTML = `<div class="text-center text-2xl font-black text-indigo-500"><i class="fa-solid fa-flag text-5xl block mb-4"></i>BOARD COMPLETE! DRAW GAME.</div>`;
        } else {
            renderBoard();
        }
    }
    renderBoard();
}

// 10. ENGINE: FIND ERRORS (Versión tolerante a fallos y multipropiedad)
function buildFindErrorsEngine(stage, quizData) {
    
    // Fallback seguro por si viene vacío
    let rawItems = (quizData && quizData.length > 0) ? quizData : [
        { broken: "She live in London with her family.", patch: "lives", hint: "Third person singular -s missing." }
    ];

    // Mapeamos los datos dinámicamente para soportar tanto {broken, patch} como {q, c}
    let errorItems = rawItems.map(item => {
        return {
            // Si no existe item.broken, busca en item.q (pregunta habitual)
            broken: item.broken || item.q || "Missing sentence string",
            // Si no existe item.patch, busca en item.c (respuesta correcta habitual)
            patch: item.patch || item.c || "",
            // Si no hay hint, dejamos un string vacío para que no pinche undefined
            hint: item.hint || item.clue || "Look closely at the grammar structure."
        };
    });

    let index = 0;

    function render() {
        if(index >= errorItems.length) {
            stage.innerHTML = `<div class="text-center text-2xl font-black text-emerald-500"><i class="fa-solid fa-shield-halved text-5xl block mb-4"></i>ALL STATEMENTS SECURED!</div>`;
            return;
        }
        
        const item = errorItems[index];
        
        stage.innerHTML = `
            <div class="w-full max-w-xl flex flex-col gap-4">
                <span class="text-xs text-rose-400 font-mono font-bold tracking-widest uppercase text-center">Locate the broken element</span>
                <div class="bg-slate-800 p-6 rounded-xl border-2 border-rose-900/50 text-center">
                    <p class="text-xl text-white font-bold italic">"${item.broken}"</p>
                </div>
                <div class="p-2 bg-slate-800 rounded-xl border border-slate-700">
                    <input type="text" id="error-input" placeholder="Type the correct word here..." class="w-full bg-slate-900 text-white p-4 rounded-lg text-center font-bold text-lg border border-slate-600 focus:outline-none focus:border-amber-500">
                </div>
                <button id="error-btn-validate" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl">VALIDATE REPAIR</button>
                <p class="text-xs text-slate-500 text-center mt-2">Clue: ${item.hint}</p>
            </div>
        `;
        
        stage.querySelector('#error-btn-validate').addEventListener('click', () => {
            const userVal = stage.querySelector('#error-input').value.trim().toLowerCase();
            if(userVal === item.patch.toLowerCase()) {
                alert("Excellent correction!");
                index++;
                render();
            } else {
                alert(`Incorrect fix. Look closely at the grammatical rules!`);
            }
        });
    }
    render();
}

// 11. ENGINE: REORDER STEPS (Soporte Multi-Ejemplo con Banco Seguro de 15 Oraciones)
function buildReorderStepsEngine(stage, grammarData) {
    // Obtenemos la lista completa de ejemplos de la unidad si existen
    const sentencesPool = grammarData?.examples || [];
    
    // Si no hay ejemplos en la unidad, se activa el banco de datos seguro de 15 oraciones
    if (sentencesPool.length === 0) {
        sentencesPool.push(
            "I am a working student",
            "She is learning english today",
            "They have been working here for two years",
            "We are going to visit London next summer",
            "He does not understand the new grammar rules",
            "What time does the english class start tomorrow",
            "You should practice your speaking skills every day",
            "My friend bought a new motorcycle last week",
            "They were watching a movie when I called",
            "She has already finished her homework",
            "If it rains tomorrow we will stay home",
            "Where did you go for your last vacation",
            "I can speak three languages fluently",
            "This interactive simulator was built with javascript",
            "Learning a new language opens many professional doors"
        );
    }

    let currentIndex = 0;
    let trueTokens = [];
    let shuffledPool = [];
    let selection = [];

    // Inicializa o cambia la oración actual basados en el índice
    function initSentence() {
        selection = [];
        let rawStr = sentencesPool[currentIndex];
        
        // Limpieza de signos comunes sin romper contracciones
        let cleanStr = rawStr.replace(/[.,\/#!$%\^&\*;:{}=\_`~()?]/g, "").replace(/\s+/g, " ").trim();
        trueTokens = cleanStr.split(" ").filter(token => token.length > 0);
        
        // Creamos la bolsa mezclada
        shuffledPool = trueTokens.map((word, originalIndex) => ({ word, originalIndex }));
        shuffledPool.sort(() => Math.random() - 0.5);
    }

    function render() {
        if (currentIndex >= sentencesPool.length) {
            stage.innerHTML = `
                <div class="text-center text-2xl font-black text-emerald-500 py-6">
                    <i class="fa-solid fa-graduation-cap text-5xl block mb-4"></i>
                    ALL SENTENCES REORDERED SUCCESSFULLY!
                </div>`;
            return;
        }

        stage.innerHTML = `
            <div class="w-full max-w-2xl flex flex-col gap-6">
                <div class="flex justify-between items-center px-2">
                    <span class="text-xs font-mono font-bold text-slate-400 uppercase tracking-widest">Arrange words in sequence</span>
                    <span class="text-xs font-mono font-bold bg-slate-800 text-amber-500 px-3 py-1 rounded-full border border-slate-700">Sentence ${currentIndex + 1} of ${sentencesPool.length}</span>
                </div>
                
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 min-h-[80px] flex items-center justify-center gap-2 flex-wrap" id="reorder-selection-zone">
                    ${selection.map((token, idx) => `
                        <button data-idx="${idx}" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2.5 rounded-lg border border-indigo-400 shadow-sm transition-all transform active:scale-95">${token.word}</button>
                    `).join('')}
                </div>

                <div class="flex items-center justify-center gap-2 flex-wrap bg-slate-900/40 p-4 rounded-xl border border-slate-800" id="reorder-pool-zone">
                    ${shuffledPool.map((token) => {
                        const isChosen = selection.some(s => s.originalIndex === token.originalIndex);
                        return `
                            <button data-orig-idx="${token.originalIndex}" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 py-2.5 rounded-lg border border-slate-600 transition-all ${isChosen ? 'invisible pointer-events-none' : ''}">${token.word}</button>
                        `;
                    }).join('')}
                </div>

                <div class="flex gap-2">
                    <button id="reorder-btn-reset" class="flex-1 bg-slate-800 text-slate-400 font-bold py-3 rounded-xl border border-slate-700 hover:bg-slate-700/60 transition-colors">RESET BOARD</button>
                    <button id="reorder-btn-validate" class="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-500 transition-colors">VALIDATE SYNTAX</button>
                </div>
            </div>
        `;
        bindEvents();
    }

    function bindEvents() {
        // Añadir palabra a la selección
        stage.querySelectorAll('#reorder-pool-zone button').forEach(btn => {
            btn.addEventListener('click', () => {
                const origIdx = parseInt(btn.dataset.origIdx);
                const token = shuffledPool.find(t => t.originalIndex === origIdx);
                if (token && !selection.some(s => s.originalIndex === origIdx)) {
                    selection.push(token);
                    render();
                }
            });
        });

        // Retirar palabra de la selección de forma individual
        stage.querySelectorAll('#reorder-selection-zone button').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetIdx = parseInt(btn.dataset.idx);
                selection.splice(targetIdx, 1);
                render();
            });
        });

        // Botón Resetear tablero actual
        stage.querySelector('#reorder-btn-reset').addEventListener('click', () => {
            selection = [];
            render();
        });

        // Botón Validar sintaxis
        stage.querySelector('#reorder-btn-validate').addEventListener('click', () => {
            const resultStr = selection.map(s => s.word).join(' ');
            const targetStr = trueTokens.join(' ');

            if (resultStr.toLowerCase() === targetStr.toLowerCase()) {
                alert("Excellent sequence alignment!");
                currentIndex++; // Avanza al siguiente ejemplo
                if (currentIndex < sentencesPool.length) {
                    initSentence(); // Regenera los tokens con la nueva oración
                }
                render();
            } else {
                alert("Sentence sequence invalid. Review structure rules!");
                selection = [];
                render();
            }
        });
    }

    // Inicialización del juego
    initSentence();
    render();
}

// 12. ENGINE: JEOPARDY (Versión Blindada y Tolerante)
function buildJeopardyEngine(stage, blockData) {
    // Extraemos de forma segura previniendo errores si faltan subpropiedades
    const rulesText = blockData?.grammar?.rules || "No direct rules specified for this module. Review general structures.";
    const examplesArray = blockData?.grammar?.examples || blockData?.examples || [];

    stage.innerHTML = `
        <div class="w-full max-w-xl flex flex-col gap-4 text-center">
            <span class="text-xs text-emerald-400 font-mono tracking-widest uppercase font-black">Final Master Assessment</span>
            <h4 class="text-xl font-bold text-white mb-2">Review current structure rules to uncover answers:</h4>
            
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-left space-y-2">
                <p class="text-xs font-bold text-slate-400 tracking-wider uppercase">Active Grammar Core Guidelines:</p>
                <p class="text-sm font-medium text-slate-300 leading-relaxed italic">"${rulesText}"</p>
            </div>
            
            ${examplesArray.length > 0 ? `
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 text-left">
                <p class="text-xs font-bold text-amber-500 tracking-wider uppercase mb-2">Example Target Reference Pattern:</p>
                <ul class="text-xs text-slate-400 space-y-2 list-none pl-0">
                    ${examplesArray.map(ex => `<li class="flex items-start gap-2"><span>•</span><span>${ex}</span></li>`).join('')}
                </ul>
            </div>
            ` : ''}
            
            <button id="jeopardy-btn-close" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl mt-2 hover:bg-emerald-500 transition-colors">I HAVE REVIEWED IT</button>
        </div>
    `;

    // Handler seguro usando addEventListener nativo
    const closeBtn = stage.querySelector('#jeopardy-btn-close');
    if (closeBtn) {
        closeBtn.addEventListener('click', () => {
            if (typeof window.closeActiveGameModal === 'function') {
                window.closeActiveGameModal();
            } else {
                stage.innerHTML = `
                    <div class="text-center p-6 bg-slate-800 rounded-xl border border-slate-700">
                        <i class="fa-solid fa-circle-check text-emerald-500 text-4xl mb-2 block"></i>
                        <p class="text-lg font-bold text-white">Review complete.</p>
                        <p class="text-xs text-slate-400 mt-1">Assessment loaded successfully.</p>
                    </div>`;
            }
        });
    }
}
    </script>
