<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Interactive — Nivel B1</title>
    <style>
        :root {
            --bg-primary: #F1F8F1;
            --bg-card: #FFFFFF;
            --text-main: #1B5E20;
            --text-muted: #4F7E51;
            --color-primary: #2E7D32;
            --color-accent: #66BB6A;
            --color-danger: #D32F2F;
            --color-success: #2E7D32;
            --border-radius-card: 16px;
            --border-radius-modal: 24px;
            --shadow-main: 0 8px 32px rgba(46, 125, 50, 0.15);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #071007;
            --bg-card: #0F2010;
            --text-main: #E8F5E9;
            --text-muted: #A5D6A7;
            --color-primary: #1B5E20;
            --color-accent: #66BB6A;
            --color-danger: #EF5350;
            --color-success: #81C784;
            --shadow-main: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: var(--transition-smooth);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Fixed elements */
        #theme-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: var(--bg-card);
            border: 2px solid var(--color-primary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: var(--shadow-main);
            touch-action: manipulation;
        }

        header {
            background: var(--bg-card);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-main);
            border-bottom: 3px solid var(--color-primary);
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Standard Buttons */
        .btn {
            min-height: 48px;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background-color: var(--color-primary);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-accent {
            background-color: var(--color-accent);
            color: #000000;
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--color-primary);
            color: var(--text-main);
        }

        /* Unit Selector Screen */
        .grid-units {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        @media(min-width: 600px) {
            .grid-units { grid-template-columns: 1fr 1fr; }
        }

        .card-unit {
            background: var(--bg-card);
            border-radius: var(--border-radius-card);
            padding: 20px;
            box-shadow: var(--shadow-main);
            border: 1px solid rgba(46, 125, 50, 0.1);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .card-unit:hover {
            transform: translateY(-4px);
            border-color: var(--color-accent);
        }

        .card-unit h3 {
            margin-bottom: 8px;
            color: var(--color-primary);
        }

        .card-unit p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Dashboard Game Selector Grid */
        .grid-games {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        @media(min-width: 600px) {
            .grid-games { grid-template-columns: 1fr 1fr; }
        }

        /* Game containers common styling */
        .game-box {
            background: var(--bg-card);
            border-radius: var(--border-radius-card);
            padding: 20px;
            box-shadow: var(--shadow-main);
            margin-top: 15px;
        }

        .instruction-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-style: italic;
        }

        /* Flashcards Styling */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 220px;
            margin: 20px 0;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--border-radius-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-main);
        }

        .card-front {
            background: var(--color-primary);
            color: white;
        }

        .card-back {
            background: var(--bg-card);
            border: 3px solid var(--color-primary);
            color: var(--text-main);
            transform: rotateY(180deg);
        }

        /* Quiz Choices Layout */
        .quiz-option {
            background: var(--bg-card);
            border: 2px solid var(--text-muted);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-size: 1rem;
            color: var(--text-main);
            transition: var(--transition-smooth);
            min-height: 48px;
        }

        .quiz-option.correct {
            background: var(--color-success);
            color: white;
            border-color: var(--color-success);
        }

        .quiz-option.incorrect {
            background: var(--color-danger);
            color: white;
            border-color: var(--color-danger);
        }

        /* Word Games Common Elements */
        .word-display {
            font-size: 2rem;
            letter-spacing: 0.5rem;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 15px;
        }

        .key-btn {
            min-height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--color-primary);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-main);
        }

        .key-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Word Search Matrix Grid */
        .wordsearch-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin: 15px auto;
            max-width: 360px;
        }

        .ws-cell {
            aspect-ratio: 1;
            background: var(--bg-card);
            border: 1px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
        }

        .ws-cell.selected {
            background: var(--color-accent);
            color: black;
        }

        .ws-cell.found {
            background: var(--color-success);
            color: white;
        }

        /* Drag & Sort Layout */
        .drag-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .drag-item {
            padding: 12px;
            background: var(--bg-card);
            border: 2px dashed var(--color-primary);
            border-radius: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
            min-height: 48px;
        }

        /* Roulette Spinning Object */
        .roulette-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 20px auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid var(--color-primary);
            position: relative;
            overflow: hidden;
            transition: transform 3s cubic-bezier(0.1, 0.8, 0.1, 1);
            background: conic-gradient(
                var(--color-primary) 0deg 45deg,
                var(--color-accent) 45deg 90deg,
                var(--color-primary) 90deg 135deg,
                var(--color-accent) 135deg 180deg,
                var(--color-primary) 180deg 225deg,
                var(--color-accent) 225deg 270deg,
                var(--color-primary) 270deg 315deg,
                var(--color-accent) 315deg 360deg
            );
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: calc(50% - 15px);
            width: 30px;
            height: 30px;
            background: var(--color-danger);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
        }

        /* Memory Matrix Board */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .memory-card {
            aspect-ratio: 1;
            background: var(--color-primary);
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            padding: 4px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            word-break: break-word;
        }

        .memory-card.flipped {
            background: var(--bg-card);
            border: 2px solid var(--color-primary);
            color: var(--text-main);
        }

        .memory-card.matched {
            background: var(--color-success);
            color: white;
            visibility: visible;
            opacity: 0.6;
        }

        /* Story Sorting Layout vertical block */
        .story-block {
            padding: 12px;
            background: var(--bg-card);
            border: 2px solid var(--color-primary);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: move;
            touch-action: none;
        }

        .story-block.correct-pos {
            border-color: var(--color-success);
            background: rgba(46, 125, 50, 0.1);
        }

        .story-block.incorrect-pos {
            border-color: var(--color-danger);
            background: rgba(211, 47, 47, 0.1);
        }

        /* Feedback overlays & modules */
        .feedback-message {
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--color-accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .app-footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <button id="theme-toggle" aria-label="Toggle structural theme">🌓</button>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" class="btn-back-nav" style="
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 0 16px;
                height: 42px;
                border-radius: 12px;
                background: var(--border-color);
                color: var(--primary-color);
                text-decoration: none;
                font-size: 0.95rem;
                font-weight: bold;
                transition: background 0.3s ease, transform 0.2s ease;
                border: none;
                cursor: pointer;
            " onmouseover="this.style.background='#FFCDD2'; this.style.transform='scale(1.03)';" onmouseout="this.style.background='var(--border-color)'; this.style.transform='scale(1)';">

            </a>
            <div class="header-logo">English Interactive — Level B1</div>
        </div>

    <main id="app">
        <div id="screen-units" class="screen active">
            <h2 style="margin-bottom:10px; text-align:center;">Select Learning Module</h2>
            <div class="grid-units" id="units-list"></div>
        </div>

        <div id="screen-dashboard" class="screen">
            <button class="btn btn-outline" id="dash-back-btn">⬅️ Back to Modules</button>
            <h2 id="dash-title" style="margin: 15px 0 5px 0; color: var(--color-primary);"></h2>
            <p id="dash-grammar" style="font-size:0.95rem; margin-bottom:20px; color: var(--text-muted);"></p>
            
            <div class="grid-games">
                <button class="btn" data-game="1">💬 Warm-Up Questions</button>
                <button class="btn" data-game="2">🎴 Study Flashcards</button>
                <button class="btn" data-game="3">🧠 Grammatical Quiz</button>
                <button class="btn" data-game="4">🪓 Interactive Hangman</button>
                <button class="btn" data-game="5">🔍 Word Search</button>
                <button class="btn" data-game="6">📝 Fill in the Blanks</button>
                <button class="btn" data-game="7">🗂️ Drag & Sort Categories</button>
                <button class="btn" data-game="8">🎡 Wheel of Questions</button>
                <button class="btn" data-game="9">📖 Reorder the Story</button>
            </div>
        </div>

        <div id="screen-game" class="screen">
            <button class="btn btn-outline" id="game-back-btn">📋 Return to Dashboard</button>
            <div id="game-container-zone"></div>
        </div>
    </main>

    <footer class="app-footer">
        English Interactive Platform &bull; Level B1 Module View
    </footer>

    <div id="firma-seguridad" style="position:fixed;bottom:20px;left:30px;font-family:Georgia, 'Times New Roman', serif;font-style:italic;font-size:14px;opacity:0.7;z-index:9999;pointer-events:none;">Creado por Tony Salas & German Peña</div>

            init() {

            renderModules() {
                const container = document.getElementById('units-list');
                container.innerHTML = '';
                DATA.modules.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'card-unit';
                    card.innerHTML = `
                        <h3>${m.title}</h3>
                        <p>${m.grammar}</p>
                        <button class="btn btn-accent" style="margin:0; width:auto; font-size:0.85rem; padding:6px 12px; min-height:36px;">Enter Module</button>
                    `;
                    card.addEventListener('click', () => this.openModule(m));
                    container.appendChild(card);
                });
            },

            setupGlobalEvents() {
                document.getElementById('theme-toggle').addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', nextTheme);
                    localStorage.setItem('englishB1_theme', nextTheme);
                });

                document.getElementById('dash-back-btn').addEventListener('click', () => {
                    this.switchScreen('screen-units');
                });

                document.getElementById('game-back-btn').addEventListener('click', () => {
                    this.switchScreen('screen-dashboard');
                });

                // Dashboard game buttons
                const gameButtons = document.querySelectorAll('.grid-games .btn');
                gameButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const gameId = parseInt(e.currentTarget.getAttribute('data-game'));
                        this.launchGame(gameId);
                    });
                });
            },

            applyTheme() {
                const savedTheme = localStorage.getItem('englishB1_theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            },

            switchScreen(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
                window.scrollTo(0,0);
            },

            openModule(mod) {
                STATE.currentModule = mod;
                document.getElementById('dash-title').innerText = mod.title;
                document.getElementById('dash-grammar').innerText = mod.grammar;
                this.switchScreen('screen-dashboard');
            },

            launchGame(gameId) {
                STATE.currentGameId = gameId;
                const container = document.getElementById('game-container-zone');
                container.innerHTML = ''; // Reset frame
                
                // Route dynamic instantiation
                switch(gameId) {
                    case 1: GamesEngine.initWarmup(container); break;
                    case 2: GamesEngine.initFlashcards(container); break;
                    case 3: GamesEngine.initQuiz(container); break;
                    case 4: GamesEngine.initHangman(container); break;
                    case 5: GamesEngine.initWordSearch(container); break;
                    case 6: GamesEngine.initFillBlanks(container); break;
                    case 7: GamesEngine.initDragSort(container); break;
                    case 8: GamesEngine.initRoulette(container); break;
                    case 9: GamesEngine.initStorySort(container); break;
                }
                this.switchScreen('screen-game');
            }

                    <p class="instruction-text">Deduce the complete dynamic keyword sequence prior to exhausting structural lifelines.</p>
                    <p style="font-weight:bold; color:var(--color-primary); margin-bottom:10px;">HINT: "${session.hint}"</p>
                    <p style="font-size:1.1rem; font-weight:bold; margin-bottom:10px;">Remaining Lives: <span id="hm-lives" style="color:var(--color-danger);">${lives}</span> 🩸</p>
                    <div class="word-display" id="hm-display"></div>
                    <div class="keyboard-grid" id="hm-keys"></div>
                `;
                target.appendChild(view);

                const updateDisplay = () => {
                    let displayStr = "";
                    let won = true;
                    for(let char of session.word) {
                        if(guessed.includes(char)) {
                            displayStr += char + " ";
                        } else {
                            displayStr += "_ ";
                            won = false;
                        }
                    }
                    document.getElementById('hm-display').innerText = displayStr.trim();

                    if(won) {
                        endGame(true);
                    } else if(lives <= 0) {
                        endGame(false);
                    }
                };

                const endGame = (isWin) => {
                    document.getElementById('hm-keys').innerHTML = isWin ? 
                        `<h3 style="grid-column: span 7; text-align:center; color:var(--color-success);">¡Ganaste! Flawless lexicon retrieval.</h3>` :
                        `<h3 style="grid-column: span 7; text-align:center; color:var(--color-danger);">¡Incorrecto! Answer key was: ${session.word}</h3>`;
                };

                const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
                const kb = document.getElementById('hm-keys');
                abc.forEach(l => {
                    const b = document.createElement('button');
                    b.className = 'key-btn';
                    b.innerText = l;
                    b.addEventListener('click', () => {
                        b.disabled = true;
                        guessed.push(l);
                        if(!session.word.includes(l)) {
                            lives--;
                            document.getElementById('hm-lives').innerText = lives;
                        }
                        updateDisplay();
                    });
                    kb.appendChild(b);
                });

                updateDisplay();
            },

            // GAME 5: WORD SEARCH MATRIX
            initWordSearch(target) {
                const words = STATE.currentModule.wordsearch;
                const size = 8;
                let grid = Array(size).fill(null).map(() => Array(size).fill(''));
                let foundWords = [];
                let selectedCells = [];

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>🔍 Word Search</h2>
                    <p class="instruction-text">Locate and press individual cell elements to compose targeted structural keywords.</p>
                    <div style="margin-bottom:10px; font-weight:bold;">Find: <span id="ws-targets" style="color:var(--color-primary);"></span></div>
                    <div class="wordsearch-grid" id="ws-grid-element"></div>
                    <button class="btn btn-accent" id="ws-check-btn" style="margin-top:10px;">Validate Selection</button>
                `;
                target.appendChild(view);

                // Simple generation script
                words.forEach(w => {
                    let placed = false;
                    while(!placed) {
                        let row = Math.floor(Math.random() * size);
                        let col = Math.floor(Math.random() * (size - w.length));
                        let fits = true;
                        for(let i=0; i<w.length; i++) {
                            if(grid[row][col+i] !== '') fits = false;
                        }
                        if(fits) {
                            for(let i=0; i<w.length; i++) grid[row][col+i] = w[i];
                            placed = true;
                        }
                    }
                });

                const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                for(let r=0; r<size; r++) {
                    for(let c=0; c<size; c++) {
                        if(grid[r][c] === '') grid[r][c] = abc[Math.floor(Math.random()*26)];
                    }
                }

                const renderGrid = () => {
                    const gEl = document.getElementById('ws-grid-element');
                    gEl.innerHTML = '';
                    document.getElementById('ws-targets').innerText = words.filter(w => !foundWords.includes(w)).join(", ");

                    for(let r=0; r<size; r++) {
                        for(let c=0; c<size; c++) {
                            const cell = document.createElement('div');
                            cell.className = 'ws-cell';
                            cell.innerText = grid[r][c];
                            cell.setAttribute('data-rc', `${r}-${c}`);
                            
                            cell.addEventListener('click', () => {
                                cell.classList.toggle('selected');
                                updateSelectionList(`${r}-${c}`);
                            });
                            gEl.appendChild(cell);
                        }
                    }
                };

                const updateSelectionList = (rc) => {
                    const idx = selectedCells.indexOf(rc);
                    if(idx > -1) selectedCells.splice(idx, 1);
                    else selectedCells.push(rc);
                };

                document.getElementById('ws-check-btn').addEventListener('click', () => {
                    let builtString = selectedCells.map(rc => {
                        const [r, c] = rc.split("-").map(Number);
                        return grid[r][c];
                    }).join("");

                    let reversedStr = builtString.split("").reverse().join("");

                    let matchingWord = words.find(w => w === builtString || w === reversedStr);

                    if(matchingWord && !foundWords.includes(matchingWord)) {
                        foundWords.push(matchingWord);
                        selectedCells.forEach(rc => {
                            const targetCell = document.querySelector(`[data-rc="${rc}"]`);
                            if(targetCell) {
                                targetCell.classList.remove('selected');
                                targetCell.classList.add('found');
                            }
                        });
                        selectedCells = [];
                        if(foundWords.length === words.length) {
                            alert("¡Ganaste! Full programmatic terminal puzzle discovery.");
                        } else {
                            document.getElementById('ws-targets').innerText = words.filter(w => !foundWords.includes(w)).join(", ");
                        }
                    } else {
                        alert("No valid undetected vocabulary matches selected sequence parameters.");
                    }
                });

                renderGrid();
            },

            // GAME 6: FILL IN THE BLANKS
            initFillBlanks(target) {
                const exercises = STATE.currentModule.fillblanks;
                let idx = 0;

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>📝 Fill in the Blanks</h2>
                    <p class="instruction-text">Synthesize sentences accurately by specifying the optimal isolated matching keyword.</p>
                    <div style="margin:25px 0;">
                        <h3 id="fb-sentence-string" style="line-height:2rem;"></h3>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="fb-input" style="flex:1; padding:12px; font-size:1rem; border-radius:8px; border:2px solid var(--color-primary);" placeholder="Type answer keys...">
                        <button class="btn btn-accent" id="fb-verify" style="margin:0; width:auto;">Verify</button>
                    </div>
                    <div id="fb-message" class="feedback-message"></div>
                `;
                target.appendChild(view);

                const loadFB = () => {
                    document.getElementById('fb-message').style.display = 'none';
                    document.getElementById('fb-input').value = '';
                    const rawText = exercises[idx].text;
                    document.getElementById('fb-sentence-string').innerText = rawText.replace(/\[.*?\]/g, "_______");
                };

                document.getElementById('fb-verify').addEventListener('click', () => {
                    const userVal = document.getElementById('fb-input').value.trim().toLowerCase();
                    const correctVal = exercises[idx].answer.toLowerCase();
                    const fbm = document.getElementById('fb-message');
                    fbm.style.display = 'block';

                    if(userVal === correctVal) {
                        fbm.innerText = "¡Correcto! Syntactic target achieved perfectly.";
                        fbm.style.background = "rgba(46,125,50,0.2)";
                        fbm.style.color = "var(--color-success)";
                        
                        setTimeout(() => {
                            idx++;
                            if(idx < exercises.length) loadFB();
                            else view.innerHTML = `<h2 style="text-align:center; color:var(--color-success);">🎉 Activity Finalized!</h2>`;
                        }, 2000);
                    } else {
                        fbm.innerText = "¡Incorrecto! Revise the target structure syntax rules.";
                        fbm.style.background = "rgba(211,47,47,0.2)";
                        fbm.style.color = "var(--color-danger)";
                    }
                });

                loadFB();
            },

            // GAME 7: DRAG & SORT CATEGORIES (Using fallback inputs for reliable smartphone execution)
            initDragSort(target) {
                const config = STATE.currentModule.dragsort;

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>🗂️ Drag & Sort Categories</h2>
                    <p class="instruction-text">Map each grammatical snippet phrase to its appropriate structural designation criteria taxonomy.</p>
                    <div id="ds-container" class="drag-container"></div>
                    <button class="btn btn-accent" id="ds-submit-btn" style="margin-top:15px;">Evaluate Mapping</button>
                `;
                target.appendChild(view);

                const container = document.getElementById('ds-container');
                config.items.forEach((item, index) => {
                    const row = document.createElement('div');
                    row.className = 'drag-item';
                    
                    let selectorOptions = config.categories.map(c => `<option value="${c}">${c}</option>`).join("");
                    
                    row.innerHTML = `
                        <span style="flex:1;">"${item.text}"</span>
                        <select id="ds-sel-${index}" style="padding:8px; border-radius:6px; background:var(--bg-primary); color:var(--text-main); font-weight:bold;">
                            ${selectorOptions}
                        </select>
                    `;
                    container.appendChild(row);
                });

                document.getElementById('ds-submit-btn').addEventListener('click', () => {
                    let total = config.items.length;
                    let validCount = 0;

                    config.items.forEach((item, index) => {
                        const chosen = document.getElementById(`ds-sel-${index}`).value;
                        if(chosen === item.cat) validCount++;
                    });

                    alert(`Evaluation completed: ${validCount} / ${total} alignments match targeted criteria.`);
                });
            },

            // GAME 8: WHEEL OF QUESTIONS
            initRoulette(target) {
                const questions = STATE.currentModule.roulette;

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>🎡 Wheel of Questions</h2>
                    <p class="instruction-text">Initiate rotation mechanics to claim a structural situational prompt challenge scenario.</p>
                    <div class="roulette-container">
                        <div class="wheel-pointer"></div>
                        <div class="wheel" id="roulette-wheel-obj"></div>
                    </div>
                    <button class="btn btn-accent" id="spin-trigger-btn">Spin Wheel</button>
                    <h3 id="roulette-out-card" style="text-align:center; min-height:40px; margin-top:20px; color:var(--color-primary);"></h3>
                `;
                target.appendChild(view);

                let spinning = false;
                document.getElementById('spin-trigger-btn').addEventListener('click', () => {
                    if(spinning) return;
                    spinning = true;
                    document.getElementById('roulette-out-card').innerText = "";

                    const randomDegrees = Math.floor(Math.random() * 360) + 1440; // min 4 complete rotations
                    const wheel = document.getElementById('roulette-wheel-obj');
                    wheel.style.transform = `rotate(${randomDegrees}deg)`;

                    setTimeout(() => {
                        spinning = false;
                        const finalChoice = questions[Math.floor(Math.random() * questions.length)];
                        document.getElementById('roulette-out-card').innerText = `🎯 prompt challenge: "${finalChoice}"`;
                        wheel.style.transition = 'none';
                        wheel.style.transform = `rotate(${randomDegrees % 360}deg)`;
                        setTimeout(() => { wheel.style.transition = 'transform 3s cubic-bezier(0.1, 0.8, 0.1, 1)'; }, 50);
                    }, 3050);
                });
            },

            // GAME 9: REORDER THE STORY (Vertical arrangement mapping via manual sequence modifiers)
            initStorySort(target) {
                const originalBlocks = STATE.currentModule.story;
                // Generate deep copied structure with positions
                let workingArray = originalBlocks.map((text, idx) => ({ text, originalIdx: idx }));
                
                // Shuffle system implementation
                for (let i = workingArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [workingArray[i], workingArray[j]] = [workingArray[j], workingArray[i]];
                }

                const view = document.createElement('div');
                view.className = 'game-box';
                view.innerHTML = `
                    <h2>📖 Reorder the Story</h2>
                    <p class="instruction-text">Organize structural component entries into a coherent flowing narrative paragraph sequence manually.</p>
                    <div id="story-blocks-container"></div>
                    <button class="btn btn-accent" id="story-validate-btn" style="margin-top:15px;">Confirm Sequence Alignment</button>
                `;
                target.appendChild(view);

                const renderBlocks = () => {
                    const container = document.getElementById('story-blocks-container');
                    container.innerHTML = '';
                    workingArray.forEach((item, index) => {
                        const el = document.createElement('div');
                        el.className = 'story-block';
                        el.innerHTML = `
                            <div style="display:flex; align-items:center; gap:10px;">
                                <div style="display:flex; flex-direction:column; gap:4px;">
                                    <button class="btn-move-up" style="cursor:pointer; background:none; border:none; color:var(--text-main);" data-idx="${index}">🔼</button>
                                    <button class="btn-move-down" style="cursor:pointer; background:none; border:none; color:var(--text-main);" data-idx="${index}">🔽</button>
                                </div>
                                <p style="font-size:0.95rem; flex:1;">${item.text}</p>
                            </div>
                        `;
                        container.appendChild(el);
                    });

                    // Add actions to virtual control triggers safely
                    document.querySelectorAll('.btn-move-up').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            let currentIdx = parseInt(btn.getAttribute('data-idx'));
                            if(currentIdx > 0) {
                                [workingArray[currentIdx], workingArray[currentIdx - 1]] = [workingArray[currentIdx - 1], workingArray[currentIdx]];
                                renderBlocks();
                            }
                        });
                    });

                    document.querySelectorAll('.btn-move-down').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            let currentIdx = parseInt(btn.getAttribute('data-idx'));
                            if(currentIdx < workingArray.length - 1) {
                                [workingArray[currentIdx], workingArray[currentIdx + 1]] = [workingArray[currentIdx + 1], workingArray[currentIdx]];
                                renderBlocks();
                            }
                        });
                    });
                };

                document.getElementById('story-validate-btn').addEventListener('click', () => {
                    const blockElements = document.querySelectorAll('.story-block');
                    let mistakeFound = false;

                    workingArray.forEach((item, idx) => {
                        blockElements[idx].classList.remove('correct-pos', 'incorrect-pos');
                        if(item.originalIdx === idx) {
                            blockElements[idx].classList.add('correct-pos');
                        } else {
                            blockElements[idx].classList.add('incorrect-pos');
                            mistakeFound = true;
                        }
                    });

                    if(!mistakeFound) {
                        alert("¡Ganaste! The contextual paragraph exhibits absolute flawless chronology.");
                    } else {
                        alert("Discrepancies identified. Analyze contextual markers and reposition structural components.");
                    }
                });

                renderBlocks();
            }
        };

        // RUN UI PARSER BOOTSTRAP
        document.addEventListener('DOMContentLoaded', () => UI.init());

        // MANDATORY RUNTIME SECURITY INTERVAL COMPLIANCE VERIFICATION CHECK
        setInterval(() => {
            const firma = document.getElementById('firma-seguridad');
            const app = document.getElementById('app');
            const bloqueado = document.getElementById('acceso-denegated');
            if (!firma || firma.textContent.trim() !== 'Creado por Tony Salas & German Peña' ||
                getComputedStyle(firma).display === 'none' ||
                getComputedStyle(firma).opacity === '0' ||
                getComputedStyle(firma).visibility === 'hidden') {
                if (app) app.style.display = 'none';
                if (!bloqueado) {
                    const div = document.createElement('div');
                    div.id = 'acceso-denegated';
                    div.style.cssText = 'position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;';
                    div.innerHTML = '<p style="color:red;font-size:2rem;text-align:center;padding:2rem;">⚠️ ACCESO DENEGADO ⚠️<br><span style="font-size:1rem;">El código de seguridad y la firma han sido alterados. CREA TU VERGA TU, CARA E MONDA.</span></p>';
                    document.body.appendChild(div);
                }
            }
        }, 1000);
    </script>
</body>
