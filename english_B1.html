<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive English Portal - Level B1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- CSS ARCHITECTURE & RESET (ESTILO PORTAL) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        :root {
            --bg-base: #f1f5f9;
            --bg-card: #ffffff;
            --text-title: #0f172a;
            --text-body: #475569;
            --border-ui: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            
            /* Identidad Visual Exclusiva A1 - CAMBIADO A VERDE CLARO */
            --accent-g: linear-gradient(135deg, #4ade80, #16a34a);
            --accent-text: #16a34a;
        }

        [data-theme="dark"] {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --text-title: #f8fafc;
            --text-body: #94a3b8;
            --border-ui: #334155;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-body);
        }

        /* --- CONFIGURACIONES BOTÓN DE TEMA PORTAL --- */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1.5rem;
            background-color: var(--bg-card);
            border: 2px solid var(--border-ui);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            touch-action: manipulation;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* --- IDENTIDAD GRÁFICA UNIFICADA --- */
        .brand-color-text { color: var(--accent-text); }        
        .brand-color-bg { background: var(--accent-g); }      
        .brand-color-button { background: var(--accent-g); } 
        .brand-color-button:hover { filter: brightness(1.15); }
        
        .sidebar-btn.active { 
            background: var(--accent-g); 
            color: #ffffff !important; 
            border-color: transparent; 
            box-shadow: var(--shadow-lg);
        }

        /* Contenedores estilizados tipo Tarjeta Portal */
        .portal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-ui);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--accent-g);
        }

        .portal-card-interactive:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        /* --- ANIMACIONES DE ENTRADA --- */
        .animate-fade-down { animation: moveDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .animate-fade-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

        @keyframes moveDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilos obligatorios para la animación 3D de las Flashcards */
        .flashcard-scene { perspective: 1000px; }
        .flashcard-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { backface-visibility: hidden; }
        .flashcard-back { transform: rotateY(180deg); }

        /* =====================================================================
           🚀 ANTI-COLAPSO ONESCREEN: PRESERVADO INTEGRAMENTE
           ===================================================================== */
        #modal-game-stage > div { max-width: 100% !important; width: 100% !important; }
        #modal-game-stage text, #modal-game-stage p, #modal-game-stage span, #modal-game-stage div,
        #modal-game-stage button, #modal-game-stage h4, #modal-game-stage li {
            font-weight: 800 !important;              
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif !important; 
            text-shadow: 0px 1px 2px rgba(0,0,0,0.8) !important; 
            letter-spacing: 0.02em !important; 
        }
        #modal-game-stage p.text-sm, #modal-game-stage p.text-base, #modal-game-stage .text-center p,
        #modal-game-stage .text-xl, #modal-game-stage .text-2xl, #modal-game-stage [class*="text-"] h3,
        #modal-game-stage .mb-6.bg-slate-800\/50, #modal-game-stage .text-lg.font-semibold {
            font-size: 1.75rem !important;      
            line-height: 1.5 !important;        
            height: auto !important;            
            min-height: max-content !important; 
            padding: 1.5rem !important;        
            color: #ffffff !important;         
            word-break: break-word !important;  
        }
        #modal-game-stage button.w-full.text-left, #modal-game-stage .space-y-3 button, #modal-game-stage [onclick*="selectAnswer"] {
            min-height: 75px !important;        
            height: auto !important;            
            font-size: 1.35rem !important;     
            line-height: 1.3 !important;
            padding: 1.25rem 1.75rem !important;   
            color: #ffffff !important;         
            border-radius: 0.75rem !important;    
            border: 2px solid #334155 !important; 
            margin-bottom: 0.75rem !important;  
            display: flex !important;           
            align-items: center !important;
        }
        #modal-game-stage button.w-full.text-left span:first-child, #modal-game-stage [onclick*="selectAnswer"] span {
            font-size: 1.4rem !important; margin-right: 1rem !important; flex-shrink: 0 !important;          
        }
        #modal-game-stage .grid-cols-10 > div, #modal-game-stage .grid-cols-12 > div, #modal-game-stage [class*="grid-cols"] > div[class*="aspect-square"], #modal-game-stage button[data-row][data-col] {
            min-height: auto !important; aspect-ratio: 1 / 1 !important; font-size: 1.4rem !important; padding: 0 !important; display: flex !important; align-items: center !important; justify-content: center !important; border-radius: 0.375rem !important; 
        }
        #modal-game-stage .grid-cols-4 > div[onclick], #modal-game-stage .grid-cols-3 > div[onclick], #modal-game-stage [id*="memory"] button, #modal-game-stage [id*="card"] {
            min-height: 160px !important; font-size: 1.4rem !important; padding: 1.5rem !important; color: #ffffff !important; border-radius: 1rem !important; display: flex !important; align-items: center !important; justify-content: center !important; text-align: center !important;
        }
        #modal-game-stage .grid-cols-7 > button, #modal-game-stage [id*="keyboard"] button, #modal-game-stage button[onclick*="guess"], #modal-game-stage button[onclick*="Letter"] {
            min-height: 60px !important; font-size: 1.35rem !important; padding: 0.5rem !important;
        }
        #modal-game-stage #hangman-word-slots span { font-size: 2.2rem !important; font-weight: 900 !important; color: #22c55e !important; margin: 0 0.25rem !important; }
        #modal-game-stage .relative.w-full.bg-slate-700, #modal-game-stage [id="integrity-bar"] { height: 14px !important; border-radius: 9999px !important; }
        #modal-game-stage span.text-\[10px\], #modal-game-stage div > span { font-size: 1.15rem !important; color: #f87171 !important; }
        #modal-game-stage .italic, #modal-game-stage .text-gray-600 { font-size: 1.05rem !important; color: #94a3b8 !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="game-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">

            </div>
        </div>
    </div>

    <script>
        // --- THEME MANAGEMENT SYSTEM ---
        const ThemeEngine = {
            init() {
                const storedTheme = localStorage.getItem('inter_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', storedTheme);
                this.registerEvents();
            },
            registerEvents() {
                const btn = document.getElementById('themeSwitchBtn');
                if (btn) {
                    btn.addEventListener('click', () => {
                        const current = document.documentElement.getAttribute('data-theme');
                        const next = current === 'dark' ? 'light' : 'dark';
                        document.documentElement.setAttribute('data-theme', next);
                        localStorage.setItem('inter_theme', next);
                    });
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            ThemeEngine.init();
        });

        // Mock para las funciones globales de tus botones
        function selectBlock(blockId) {
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            const target = document.getElementById(`btn-${blockId}`);
            if(target) target.classList.add('active');
            console.log("Cambiando al bloque: " + blockId);
        }
        function generatePrompt() { console.log("Generando pregunta..."); }
        function openGame(gameName) {
            document.getElementById('modal-game-badge').innerText = "GAME";
            document.getElementById('modal-game-title').innerText = gameName.toUpperCase();
            document.getElementById('game-modal').classList.remove('hidden');
        }
        function closeActiveGameModal() {
            document.getElementById('game-modal').classList.add('hidden');
        }
    </script>
</body>

    <script>
        // Interceptor inteligente para limpiar y asegurar títulos al abrir juegos
        function openGame(gameType) {
            const modal = document.getElementById('game-modal');
            const badge = document.getElementById('modal-game-badge');
            const title = document.getElementById('modal-game-title');
            
            if (!modal || !badge || !title) return;

            // 1. Resetear estilos previos del badge y aplicar paleta según el juego
            badge.className = "px-3 py-1.5 rounded-xl font-mono text-xs font-black uppercase tracking-widest text-white shadow-md ";
            
            if (gameType === 'Hangman') {
                badge.classList.add('bg-purple-600');
                badge.innerText = "🚨 CORE SECURITY";
                title.innerText = "Lexical Hangman Decryption";
            } else if (gameType === 'Category Sort') {
                badge.classList.add('bg-amber-600');
                badge.innerText = "🗂️ CLASSIFIER";
                title.innerText = "Syntax Category Classifier";
            } else if (gameType === 'Memory Match') {
                badge.classList.add('bg-blue-600');
                badge.innerText = "🧠 SYNAPSE LAB";
                title.innerText = "Semantic Memory Match Arena";
            } else {
                badge.classList.add('brand-color-bg');
                badge.innerText = "🎮 CHALLENGE";
                title.innerText = gameType;
            }

            // 2. Mostrar el cascarón del modal expandido
            modal.classList.remove('hidden');

            // 3. Ejecutar de forma segura el motor del juego correspondiente
            if (gameType === 'Hangman' && typeof renderHangman === 'function') renderHangman();
            if (gameType === 'Category Sort' && typeof renderCategorySort === 'function') renderCategorySort();
            if (gameType === 'Memory Match' && typeof renderMemoryMatch === 'function') renderMemoryMatch();
            // ... añade aquí los desencadenadores de tus demás juegos ...
        }

        function closeActiveGameModal() {
            document.getElementById('game-modal').classList.add('hidden');
            // Opcional: Limpiar estados globales de los juegos al salir si es necesario
        }

        //DATA Cambia de aca en adelante dependiendo el libro, para la interfaz es arriba.
        const DATA = {
        "u1-2": {
        badge: "Units 1-2",
        title: "Relationships & City Life",
        details: "Grammar: Relative pronouns as subject/object, It clauses + adverbial clauses with when, Gerund phrases as subjects/objects | Vocab: Personality traits (easygoing, inflexible), Request formulas, Expressions with gerunds",
        
        prompts: [
            "What kind of people do you prefer to hang out with? Use a relative pronoun as a subject (e.g., 'I like friends who are...').",
            "Describe an ideal partner or classmate using a relative pronoun as an object (e.g., 'The type of person I look for is someone I can...').",
            "How do you feel about rainy days? Complete this: 'I love it when...' or 'I hate it when...'",
            "Is it easy or difficult for you to make new friends online? Start your answer with a gerund phrase (e.g., 'Meeting people online is...').",
            "Think about an inflexible or moody person you know. How do you handle their personality traits?",
            "What is something you enjoy doing on weekends? Use a gerund phrase as an object (e.g., 'I really enjoy going to...').",
            "Complete the sentence and explain why: 'I don't mind it when a friend...'",
            "Describe a supportive friend you have. What makes them so reliable?",
            "Is being modest an important quality in a boss, or do you prefer someone more ambitious?",

        grammarRules: [
            "Relative Pronouns as Subjects: The pronoun is followed immediately by a verb (e.g., 'I like people who speak clearly').",

            "It Clauses + When: Use 'it' as a dummy subject to express emotional reactions to situations (e.g., 'I hate it when people are late').",

            "Omission of Object Pronouns: Remember you can drop 'who' or 'that' only when it acts as an object clause (e.g., 'The friends I choose...').",

    "u3-4": {

        grammarRules: [
            "Comparisons with Nouns: Use 'more/fewer' for count nouns and 'more/less' for noncount nouns (e.g., 'less traffic, fewer cars').",

            "Comparisons with Participles: Use past participles like 'crowded' or 'interested' with 'more' or 'as...as' (e.g., 'more excited than').",
            "Polite Request Formulas: 'Would you mind + gerund' always requires an -ing verb (e.g., 'Would you mind helping me?').",
            "Indirect Requests Basics: When reporting a request for someone else, use 'ask/tell + object + to/not to + verb' (e.g., 'Tell him to call me').",
            "Past Continuous vs Simple Past: Use Past Continuous for the background action and Simple Past for the interrupting event.",
            "Past Perfect Definition: Use 'had + past participle' to show an action that occurred BEFORE another action in the past.",

            "Indirect Requests with If: For Yes/No questions, use 'if' or 'whether' in the indirect report (e.g., 'Ask her if she is coming').",
            "Feelings vs Descriptions: Be careful not to mix up adjectives ending in -ed (how you feel: anxious) with -ing descriptors."

    "u5-6": {
        badge: "Units 5-6",
        title: "Expectations & Problem Solving",
        details: "Grammar: Noun phrases + relative clauses, Expectations (supposed to, custom to), Describing problems (participles as adjectives vs. nouns), Need + gerund / passive infinitive, Keep + gerund | Vocab: Structural problems, Feelings",
        
        prompts: [

            "Look around your room or think about your phone. Describe a problem using a past participle as an adjective (e.g., 'The screen is scratched').",

            "Think about a car or a house that is old. What needs to be done? Use 'need + gerund' (e.g., 'The walls need painting').",
            "Change your previous answer to 'need + passive infinitive' (e.g., 'The walls need to be painted').",
            "What is a tech issue that keeps happening to you? Use 'keep + gerund' (e.g., 'My apps keep crashing').",
            "Describe an ideal neighborhood using a noun phrase containing a relative clause (e.g., 'A place that has good parks is...').",
            "Are you supposed to tip waiters in your country? What is the standard expectation?",
            "What do you do when your computer screen keeps flickering during an important call?",
            "Describe a structural problem in an apartment (like a leak or a crack) and explain how it should be fixed."

        vocabulary: [

            "scratched", "broken", "cracked", "damaged", "leaking", "flickering", "freezing",
            "scratch", "crack", "leak", "damage", "hole", "tear",
            "need fixing", "need to be fixed", "keeps crashing", "keeps dropping"
        ],

        grammarRules: [
            "Expectations with Supposed To: Use 'be supposed to + verb' to talk about rules, customs, or expected behaviors (e.g., 'We are supposed to wear uniform').",
            "Participles as Adjectives: Use the past participle form after 'is/are' to describe the state of an object (e.g., 'The plate is chipped').",
            "Problems with Nouns: Use 'There is a/an + noun' to name the specific defect (e.g., 'There is a chip in the plate').",
            "Need + Gerund: This structure has a passive meaning. 'The car needs washing' means the car must be washed by someone.",
            "Need + Passive Infinitive: This is completely synonymous with 'need + gerund' (e.g., 'The car needs to be washed').",
            "Keep + Gerund: Use 'keep + -ing' to show an action is repetitive, continuous, or happens unwantedly over and over again.",
            "Noun Phrases + Relative Clauses: These function as complex subjects or objects (e.g., 'A country that welcomes tourists is ideal').",
            "Negative Expectations: 'Not supposed to' indicates prohibition or a breach of standard cultural etiquette (e.g., 'You're not supposed to talk loudly').",
            "Matching Adjectives and Nouns: Be careful with shifts like: broken (adj) -> break (noun), cracked (adj) -> crack (noun), leaking (adj) -> leak (noun).",
            "Keep Verb Agreement: Remember to change 'keep' to 'keeps' for singular subjects in the present tense (e.g., 'My laptop keeps freezing')."
        ],

        quizQuestions: [

            { q: "My wireless headphones _______ dropping the connection every five minutes.", options: ["keep", "keeps", "keeping"], answer: "keep" },
            { q: "A neighborhood _______ has excellent security systems is highly valued nowadays.", options: ["that", "who", "whom"], answer: "that" },
            { q: "You are _______ to take photos inside this museum; it is strictly prohibited.", options: ["not supposed", "supposed", "customary"], answer: "not supposed" },
            { q: "Identify the mistake: 'The ancient wooden door needs to be fix as soon as possible.'", options: ["ancient", "needs", "to be fix"], answer: "to be fix" },
            { q: "I noticed a small _______ on the side of my brand new sports car.", options: ["scratch", "scratched", "scratching"], answer: "scratch" },
            { q: "The application keeps _______ every single time I try to upload a video file.", options: ["crashing", "crash", "crashed"], answer: "crashing" },
            { q: "These operational reports need _______ rewritten by the project manager.", options: ["to be", "being", "been"], answer: "to be" },
            { q: "In many Asian countries, it is the _______ to take off your shoes before entering a home.", options: ["custom", "supposed", "expect"], answer: "custom" },
            { q: "The crystal glass is _______; please throw it away so nobody gets cut.", options: ["broken", "break", "breaking"], answer: "broken" },
            { q: "My office computer is so old that its system screen keeps _______.", options: ["freezing", "freeze", "froze"], answer: "freezing" },
            { q: "Identify the mistake: 'There is a cracked in the front windshield of my truck.'", options: ["There is", "a cracked", "of my truck"], answer: "a cracked" },
            { q: "The old air conditioner is making weird noises; it needs _______.", options: ["servicing", "to service", "service"], answer: "servicing" },
            { q: "People _______ live in metropolitan areas often complain about the lack of space.", options: ["who", "which", "whose"], answer: "who" },
            { q: "The kitchen pipe is _______; we should call a plumber right away.", options: ["leaking", "leak", "leaks"], answer: "leaking" },

    "u7-8": {
        badge: "Units 7-8",
        title: "Passives, Causes & Suggestions",
        details: "Grammar: Passive in present continuous & present perfect, Prepositions of cause, Infinitive clauses/phrases, Would rather / would prefer, By + gerund | Vocab: Global challenges, Life skills, Phrasal verbs",
        
        prompts: [
            "What is a major problem in your city that is currently being solved? (Use Passive Present Continuous).",
            "Think about global warming. Name something important that has been destroyed or affected by it recently. (Use Passive Present Perfect).",
            "Many people lose their jobs due to economic crises. Rewrite this cause using 'because of' or 'as a result of'.",
            "Would you rather study a new language online or in an intensive face-to-face course? Explain using 'would rather'.",
            "How can someone improve their creative thinking or problem-solving skills? Start with 'By + gerund' (e.g., 'By reading books...').",
            "What is an interesting life skill that you would prefer to master next year?",
            "Describe a local school or hospital that has been recently renovated in your neighborhood.",
            "Complete this advice for someone who wants to get in shape: 'One excellent option is to...'",
            "Do you prefer looking forward to a long vacation, or do you prefer spontaneous weekend trips?",
            "Explain how a real community can deal with poverty using a sentence that starts with 'By + gerund'."
        ],

        vocabulary: [
            "is being built", "are being destroyed", "has been broken", "have been solved",
            "due to", "because of", "as a result of", "would rather", "would prefer to",
            "by practicing", "by collaborating", "by analyzing", "poverty", "unemployment",
            "break up with", "come up with", "look forward to", "get in shape"
        ],

        grammarRules: [
            "Passive Present Continuous: Use 'am/is/are + being + past participle' for actions happening right now to focus on the object (e.g., 'The road is being repaired').",
            "Passive Present Perfect: Use 'has/have + been + past participle' for completed actions with current relevance (e.g., 'The goal has been achieved').",
            "Prepositions of Cause: 'Due to', 'because of', and 'as a result of' must be followed by a noun or noun phrase, never a full clause.",
            "Would Rather Syntax: Followed by a base verb without 'to' (e.g., 'I would rather study grammar'). Negative form: 'would rather not'.",
            "Would Prefer Syntax: Followed by an infinitive with 'to' (e.g., 'I would prefer to study vocabulary').",
            "By + Gerund for Method: Explains *how* an outcome is achieved. Always use the -ing form after 'by' (e.g., 'By studying hard...').",
            "Three-Word Phrasal Verbs: Verbs like 'come up with' or 'look forward to' cannot be separated; the particle stays with the verb.",
            "Infinitive Phrases for Purpose: Use 'to + verb' at the beginning or end of a sentence to state a clear objective or suggestion.",
            "Passive Voice Object Focus: Remember that the person performing the action is either unknown or irrelevant in these process/status contexts.",
            "Rather vs Prefer Choice: Never mix the structures; avoid saying 'I would rather to go' or 'I would prefer go'."
        ],

        quizQuestions: [

            { q: "The flight was delayed _______ a sudden, unpredictable change in the local weather conditions.", options: ["due to", "because", "as a result"], answer: "due to" },

            { q: "You can easily improve your pronunciation _______ listening to English podcasts every day.", options: ["by", "for", "to"], answer: "by" },
            { q: "I would prefer _______ a specialized course on digital problem-solving skills.", options: ["to take", "take", "taking"], answer: "to take" },
            { q: "Our current office database system _______ updated by the tech team at this exact moment.", options: ["is being", "has been", "was"], answer: "is being" },
            { q: "Identify the mistake: 'He would rather to find a new job than accept a lower salary.'", options: ["would rather", "to find", "than accept"], answer: "to find" },
            { q: "The local problem of youth unemployment has risen sharply _______ the corporate factory closures.", options: ["because of", "due", "as a result"], answer: "because of" },
            { q: "We are really looking forward to _______ our international clients next month.", options: ["meeting", "meet", "to meet"], answer: "meeting" },
            { q: "All the structural errors in the blueprint _______ successfully resolved by the engineers.", options: ["have been", "is being", "has been"], answer: "have been" },
            { q: "The brilliant marketing team managed to come up _______ an innovative ad strategy.", options: ["with", "to", "for"], answer: "with" },
            { q: "I would rather not _______ my current apartment until the rental contract expires.", options: ["leave", "to leave", "leaving"], answer: "leave" },
            { q: "_______ reduce global warming, many nations are investing heavily in green energy fields.", options: ["To", "For", "By"], answer: "To" },
            { q: "Identify the mistake: 'Thousands of tropical trees are been cut down in the rainforest every year.'", options: ["are been", "cut down", "every year"], answer: "are been" },
            { q: "She would prefer _______ to a quiet seaside town rather than a massive city.", options: ["to move", "move", "moving"], answer: "to move" },
            { q: "By _______ with local charities, our company helped reduce extreme poverty.", options: ["collaborating", "collaborate", "collaborated"], answer: "collaborating" },
            { q: "The public transportation strike occurred as a result _______ unfair wage distributions.", options: ["of", "to", "for"], answer: "of" },
            { q: "New alternative energy solutions _______ explored by scientific groups across the globe.", options: ["are being", "have", "is being"], answer: "are being" },

    "u9-10": {

        title: "Services, Suggestions & Future Trends",
        details: "Grammar: Get or have something done, Making suggestions (modals, gerunds, negative questions), Predicting future (will + future continuous + future perfect), Time markers (during, in, ago) | Vocab: Historic events, Suggestions",

        grammarRules: [
            "Causative Have/Get: Use 'have/get + object + past participle' when someone else performs a professional service for you (e.g., 'I had my car fixed').",

            "Suggestions with Gerunds: 'What about...' or 'Have you thought about...' must be followed by an -ing verb (e.g., 'What about going out?').",
            "Future Continuous Structure: Use 'will be + verb-ing' to talk about an ongoing action at a specific time in the future.",
            "Future Perfect Reminder: Use 'will have + past participle' to show an action will be completed before a certain future limit (e.g., 'by 2030').",
            "Past Time Expressions: 'Ago' goes at the end of a time phrase (e.g., 'three days ago'). 'During' is followed by a noun event (e.g., 'during the meeting').",
            "In as a Time Marker: Use 'in' for specific decades, centuries, or future time lengths (e.g., 'in the 1980s', 'in three weeks').",
            "Causative Get vs Have: In casual speech, 'get' is slightly more informal than 'have', but they share the exact same structural layout.",
            "Negative Questions for Advice: 'Why don't you...?' sounds like a friendly, constructive suggestion rather than a direct, aggressive command.",
            "Future Continuous vs Future Perfect: Continuous focuses on the action in progress; Perfect focuses on the finished result before a deadline."

        quizQuestions: [
            { q: "I don't know how to fix my smartphone screen, so I am going to have it _______.", options: ["repaired", "repair", "reparing"], answer: "repaired" },

            { q: "This time tomorrow, we _______ flying across the Atlantic Ocean to London.", options: ["will be", "will have", "are"], answer: "will be" },
            { q: "Identify the mistake: 'I am going to get cut my hair at the new downtown salon tomorrow.'", options: ["going to", "get cut my hair", "tomorrow"], answer: "get cut my hair" },
            { q: "What about _______ a local community group to reduce noise pollution?", options: ["joining", "join", "to join"], answer: "joining" },

    "u11-12": { 
        badge: "Units 11-12", 
        title: "Time Clauses, Regrets & Purposes", 
        details: "Grammar: Time clauses (once, the moment, as soon as), Expressing regret (should not have + P.P.), Hypothetical situations (If + Past Perfect + would/could have), Purpose with infinitive clauses & 'for', Reasons (since, due to, because of) | Vocab: Personal traits (ambitious, carefree), Time markers, Qualities for success",

            "because", "since", "due to", "because of", "therefore", "in order to", "so that"
        ],

        grammarRules: [
            "Time Clauses for Sequence: Use 'as soon as', 'once', and 'the moment' to show an action happens immediately after another (e.g., 'As soon as I arrived, it rained').",
            "Regrets with Should Have: Use 'should (not) have + past participle' to express criticism or regret about past events that cannot be changed.",
            "Third Conditional Structure: Use 'If + Past Perfect' in the condition, and 'would/could have + past participle' in the result for hypothetical past scenarios.",
            "Purpose with Infinitives: Use 'to + verb' or 'in order to + verb' to express the purpose of an action (e.g., 'I study to improve').",
            "Purpose with 'For': Use 'for + noun' or 'for + gerund' to state the purpose or function of an object/action (e.g., 'This tool is for cutting').",
            "Conjunctions for Reasons: 'Because' and 'since' are followed by a subject + verb clause (e.g., 'Since it was late...').",
            "Prepositions for Reasons: 'Due to' and 'because of' must be followed by a noun phrase, not a verb clause (e.g., 'Due to the heavy rain').",
            "By the time syntax: 'By the time' means 'not later than the moment something else happens' and usually triggers a past perfect or future perfect in the main clause.",
            "Past Participle Reminder: Remember that irregular verbs change form in the third conditional and regrets (go -> gone, do -> done, spend -> spent).",

    "u13-14": {

        grammarRules: [
            "Past Modals for Certainty: Use 'must have + past participle' when you are almost 100% sure that something happened in the past.",
            "Past Modals for Possibility: Use 'may/might/could have + past participle' to express weak or uncertain past possibilities.",
            "Past Modals for Judgments: Use 'should have' or 'would have' to evaluate past behaviors or express how things could have been better.",
            "Passive Voice for Processes: Use 'is/are + past participle' to focus on the action or the object rather than who does it.",
            "Modal Passive Structure: Use 'modal + be + past participle' for processes, rules, or recommendations (e.g., 'This must be done').",
            "Defining Relative Clauses: Give essential information about a noun. No commas are used (e.g., 'The man who lives here is a host').",
            "Non-Defining Relative Clauses: Give extra, non-essential information trapped between commas. 'That' cannot be used (e.g., 'London, which is big, is old').",
            "Relative Pronouns Choice: Use 'who' or 'that' for people, and 'which' or 'that' for things/objects in defining clauses.",
            "Passive Agent with By: In process descriptions, omit 'by + agent' unless knowing who performed the action is absolutely critical.",

            "Tag Questions Basic Rule: If the main sentence is positive, the tag question is negative. If the sentence is negative, the tag is positive.",

        let currentBlock = "u1-2";

        function generatePrompt() {

            const randomIndex = Math.floor(Math.random() * prompts.length);
            document.getElementById("warmup-display").innerText = prompts[randomIndex];
        }
       // =====================================================================
        // MOTOR DE EJECUCIÓN Y RENDERIZADO DE JUEGOS EN EL MODAL (DETECTOR TOTAL)
        // =====================================================================
        function openGame(gameName) {
            const gameType = gameName.toLowerCase().trim(); 
            
            const modal = document.getElementById("game-modal");
            const badge = document.getElementById("modal-game-badge");
            const title = document.getElementById("modal-game-title");
            const stage = document.getElementById("modal-game-stage");

            if (!stage || !modal) return; 
            
            stage.innerHTML = "";
            modal.classList.remove("hidden");

            // 🔍 DETECTOR UNIVERSAL POR ESCANEO DE TEXTO EN PANTALLA
            try {
                // Paso A: Intentar leer selectores comunes de tu app
                const anySelect = document.querySelector("select") || document.getElementById("unit-select");
                if (anySelect && anySelect.value && DATA[anySelect.value]) {
                    currentBlock = anySelect.value;
                } else {
                    // Paso B: Si falla el selector, escaneamos los textos visibles en el documento (H1, H2, Spans, Títulos)
                    const pageElements = document.querySelectorAll("h1, h2, h3, p, span, .active, .current");
                    for (let el of pageElements) {
                        const txt = el.innerText || "";
                        // Si el texto dice algo como "Unit 15" o "Unit 05"
                        if (/Unit\s*(\d+)/i.test(txt)) {
                            const match = txt.match(/Unit\s*(\d+)/i);
                            if (match && match[1]) {
                                const unitNum = parseInt(match[1]);
                                // Construimos la llave de tu base de datos (ej: "u1-2" o "unit-15" o "u15-16")
                                // Ajusta este string según cómo llamaste a las llaves en tu objeto DATA
                                const posiblesLlaves = [`unit-${unitNum}`, `u${unitNum}`, `u${unitNum}-${unitNum+1}`, `u${unitNum-1}-${unitNum}`];
                                
                                for (let llave of posiblesLlaves) {
                                    if (DATA[llave]) {
                                        currentBlock = llave;
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                console.log("Error en el radar de escaneo visual:", err);
            }

            console.log("🎮 Juego iniciado apuntando al bloque de datos:", currentBlock);

            // =================================================================
            // 1. FLASHCARDS (CON AUTO-RESET OBLIGATORIO DE CACHÉ)
            // =================================================================
            if (gameType === "flashcards") {
                badge.className = "px-3 py-1 text-xs font-bold uppercase rounded-md text-white bg-[#d97706]";
                badge.innerText = "Flashcards";
                title.innerText = "Vocabulary & Grammar Concepts";
                
                // Forzar al motor a limpiar mazo y recargar desde la unidad descubierta por el radar
                if (window.flashcardsGameState) {
                    window.flashcardsGameState.activeBlock = null;
                    window.flashcardsGameState.itemsPool = [];
                }
                
                renderFlashcard();
            }

            // 2. QUIZ (MOTOR INTERACTIVO REAL)
            else if (gameType === "quiz") {
                badge.className = "px-3 py-1 text-xs font-bold uppercase rounded-md text-white bg-[#dc2626]";
                badge.innerText = "Quiz Challenge";
                title.innerText = "Test Your Knowledge (20 Questions)";
                currentQuizIndex = 0;
                quizScore = 0;
                renderQuizQuestion();
            } 
            // 3. FILL BLANKS (MOTOR INTERACTIVO REAL)
            else if (gameType === "fill blanks") {
                badge.className = "px-3 py-1 text-xs font-bold uppercase rounded-md text-white bg-[#db2777]";
                badge.innerText = "Fill Blanks";
                title.innerText = "Type the Correct Grammar Missing Word";
                currentQuizIndex = 0;
                quizScore = 0;
                renderFillBlanks();
            } 
            // 4. WORD SEARCH
            else if (gameType === "word search") {
                badge.className = "px-3 py-1 text-xs font-bold uppercase rounded-md text-white bg-[#2563eb]";
                badge.innerText = "Word Search";
                title.innerText = "Vocabulary Alphabet Soup";
                renderWordSearch();
            } 
            // 5. MEMORY MATCH

         // =====================================================================

// 2. STANDARD QUIZ (MOTOR REPARADO CON ALEATORIZACIÓN REAL DE OPCIONES)

window.quizGameState = {

    score: 0,
    selectedAnswerIndex: null,

};

function renderQuiz() {
    const stage = document.getElementById("modal-game-stage");
    if (!stage) return;
    const state = window.quizGameState;

    // Forzar carga limpia si el pool está vacío o se reinició desde openGame
    if (state.questionsPool.length === 0 || (state.currentQuestionIndex === 0 && !state.isAnswered && state.score === 0)) {
        const activeKey = typeof currentBlock !== 'undefined' ? currentBlock : 'u1-2';
        const currentData = (typeof DATA !== 'undefined' && DATA[activeKey]) ? DATA[activeKey] : null;
        
        // Buscador flexible de colecciones en tu objeto DATA
        const rawQuestions = currentData ? (currentData.quizQuestions || currentData.questions || []) : [];

        if (rawQuestions.length === 0) {
            stage.innerHTML = `
                <div class="text-center p-6 bg-[#161b22] border border-[#30363d] rounded-2xl max-w-sm mx-auto font-mono text-xs text-gray-400">
                    ⚠️ No quiz items found for block: [${activeKey.toUpperCase()}]
                </div>
            `;
            return;
        }

        // 🕵️‍♂️ AGENTE ESPÍA EN CONSOLA
        console.log("%c=== DETECTIVE DE DATOS DEL QUIZ REPARADO ===", "color: #00ffaa; font-weight: bold;");
        console.log("Unidad activa detectada:", activeKey);

        // Mapeo inteligente con mezcla (shuffle) interna de opciones para romper el patrón de la primera opción
        state.questionsPool = rawQuestions.map(q => {
            let autoDiscoveredText = null;
            const possibleCorrect = (q.correctAnswer || q.answer || "").toString().trim().toLowerCase();

            for (let key in q) {
                if (typeof q[key] === 'string' && key !== 'correctAnswer' && key !== 'answer') {
                    const valLower = q[key].trim().toLowerCase();
                    if (valLower !== possibleCorrect) {
                        autoDiscoveredText = q[key];
                        break;
                    }
                }
            }

            const extractedQuestion = q.question || q.text || q.sentence || q.phrase || autoDiscoveredText || "Select the correct option:";
            
            // --- 🔀 ALGORITMO ANTIPATRONES: MEZCLA DE OPCIONES ---
            let rawOptions = Array.isArray(q.options) ? [...q.options] : [];
            // Mezclamos las opciones de forma interna para esta pregunta usando Fisher-Yates
            for (let i = rawOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rawOptions[i], rawOptions[j]] = [rawOptions[j], rawOptions[i]];
            }
            
            return {
                question: extractedQuestion,
                options: rawOptions, // Guardadas con un orden completamente aleatorio
                correctAnswer: q.correctAnswer || q.answer || ""
            };
        }).sort(() => 0.5 - Math.random()).slice(0, 10); // Asegura extraer el pool completo de 10 elementos
    }

    if (state.currentQuestionIndex >= state.questionsPool.length) {
        renderQuizResults();
        return;
    }

    const currentQ = state.questionsPool[state.currentQuestionIndex];
    const progressPercent = (state.currentQuestionIndex / state.questionsPool.length) * 100;
    const qSizeClass = currentQ.question.length > 70 ? "text-xs font-medium text-gray-300 leading-relaxed" : "text-sm font-bold text-white";

    let optionsHtml = "";
    currentQ.options.forEach((option, idx) => {
        let btnStyle = "bg-[#0d1117] border-[#30363d] hover:bg-[#1f242c] text-gray-300";
        let statusIcon = "";

        if (state.isAnswered) {
            const isCurrent = idx === state.selectedAnswerIndex;
            const isCorrect = option === currentQ.correctAnswer; // Sigue validando perfectamente por string literal
            if (isCorrect) {
                btnStyle = "bg-emerald-500/10 border-emerald-500 text-emerald-400 font-bold";
                statusIcon = `<i class="fa-solid fa-circle-check text-emerald-400 text-xs ml-auto"></i>`;
            } else if (isCurrent) {
                btnStyle = "bg-rose-500/10 border-rose-500 text-rose-400 font-bold";
                statusIcon = `<i class="fa-solid fa-circle-xmark text-rose-400 text-xs ml-auto"></i>`;
            } else {
                btnStyle = "bg-[#0d1117]/40 border-[#30363d]/50 text-gray-600 cursor-not-allowed";
            }
        }

        optionsHtml += `
            <button onclick="evaluateQuizAnswer(${idx})" ${state.isAnswered ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-xl border text-xs flex items-center gap-3 cursor-pointer ${btnStyle}">
                <span class="w-5 h-5 rounded-md bg-[#161b22] border border-[#30363d] flex items-center justify-center text-[10px] font-mono text-gray-500 ${state.isAnswered ? 'hidden' : ''}">${String.fromCharCode(65 + idx)}</span>
                <span class="truncate pr-2">${option}</span>
                ${statusIcon}
            </button>
        `;
    });

    stage.innerHTML = `
        <div class="flex flex-col gap-4 max-w-md w-full mx-auto animate-fade-in text-gray-200">
            <div class="flex items-center justify-between w-full text-[10px] font-mono text-gray-500 px-1">
                <span>QUESTION ${state.currentQuestionIndex + 1} OF ${state.questionsPool.length}</span>
                <span class="text-emerald-400 font-bold">SCORE: ${state.score} PTS</span>
            </div>
            <div class="w-full h-1.5 bg-[#161b22] rounded-full overflow-hidden border border-[#30363d]/50">
                <div class="h-full bg-gradient-to-r from-rose-500 to-amber-500 transition-all duration-300" style="width: ${progressPercent}%"></div>
            </div>
            <div class="bg-[#161b22] border border-[#30363d] rounded-2xl p-5 shadow-xl flex items-center min-h-[85px]">
                <p class="${qSizeClass}">${currentQ.question}</p>
            </div>
            <div class="flex flex-col gap-2.5 w-full">${optionsHtml}</div>
            <div class="w-full flex justify-end mt-1">
                <button id="quiz-next-btn" ${!state.isAnswered ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl font-mono text-[10px] uppercase font-bold tracking-wider transition-all border flex items-center gap-2 ${state.isAnswered ? 'bg-[#21262d] hover:bg-[#30363d] text-white border-[#30363d] cursor-pointer' : 'bg-[#0d1117] text-gray-600 border-[#30363d]/40 cursor-not-allowed'}">Next Question <i class="fa-solid fa-chevron-right text-[9px]"></i></button>
            </div>
        </div>
    `;

    if (state.isAnswered) {
        document.getElementById("quiz-next-btn").addEventListener("click", () => {
            state.currentQuestionIndex++;
            state.selectedAnswerIndex = null;
            state.isAnswered = false;
            renderQuiz();
        });
    }
}

function evaluateQuizAnswer(selectedIndex) {
    const state = window.quizGameState;
    if (state.isAnswered) return;
    state.selectedAnswerIndex = selectedIndex;
    state.isAnswered = true;
    const currentQ = state.questionsPool[state.currentQuestionIndex];
    if (currentQ.options[selectedIndex] === currentQ.correctAnswer) {
        state.score += 10;
    }
    renderQuiz();
}

    stage.innerHTML = `

// 🏗️ MOTOR DE INYECCIÓN MATEMÁTICA Y COLISIONES H/V
// =====================================================================
function generateWordSearchGrid() {
    const state = window.wordSearchState;
    const size = state.gridSize;
    
    // Iniciar matriz vacía
    state.grid = Array(size).fill(null).map(() => Array(size).fill("-"));

    // Posicionar palabras en la matriz de manera aleatoria sin superposiciones erróneas
    state.wordsToFind.forEach(word => {
        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 100) {
            const direction = Math.random() > 0.5 ? "H" : "V"; 
            const row = Math.floor(Math.random() * size);
            const col = Math.floor(Math.random() * size);

            if (direction === "H" && col + word.length <= size) {
                let canPlace = true;
                for (let i = 0; i < word.length; i++) {
                    if (state.grid[row][col + i] !== "-" && state.grid[row][col + i] !== word[i]) {
                        canPlace = false;
                    }
                }
                if (canPlace) {
                    for (let i = 0; i < word.length; i++) {
                        state.grid[row][col + i] = word[i];
                    }
                    placed = true;
                }
            } else if (direction === "V" && row + word.length <= size) {
                let canPlace = true;
                for (let i = 0; i < word.length; i++) {
                    if (state.grid[row + i][col] !== "-" && state.grid[row + i][col] !== word[i]) {
                        canPlace = false;
                    }
                }
                if (canPlace) {
                    for (let i = 0; i < word.length; i++) {
                        state.grid[row + i][col] = word[i];
                    }
                    placed = true;
                }
            }
            attempts++;
        }
    });

    // Rellenar las celdas vacías de la sopa con letras aleatorias
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            if (state.grid[r][c] === "-") {
                state.grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
            }
        }
    }
}

function selectWordSearchCell(r, c) {
    const state = window.wordSearchState;
    if (!state) return;

    // Ignorar si la celda ya es parte de una palabra descubierta
    const alreadyFound = state.foundWords.some(fw => fw.coords.some(coord => coord.r === r && coord.c === c));
    if (alreadyFound) return;

    const index = state.selectedCells.findIndex(sc => sc.r === r && sc.c === c);
    if (index >= 0) {
        state.selectedCells.splice(index, 1); // Quitar selección si da doble clic
    } else {
        state.selectedCells.push({ r, c, letter: state.grid[r][c] });
    }

    // Comprobar combinaciones normales y en reversa
    const currentString = state.selectedCells.map(sc => sc.letter).join("");
    const reverseString = currentString.split("").reverse().join("");

    let matchFound = state.wordsToFind.find(w => 
        (w === currentString || w === reverseString) && !state.foundWords.some(fw => fw.word === w)
    );

    if (matchFound) {
        state.foundWords.push({
            word: matchFound,
            coords: [...state.selectedCells]
        });
        state.selectedCells = [];
    }

    renderWordSearch();
}

function clearWordSearchSelection() {
    if (window.wordSearchState) {
        window.wordSearchState.selectedCells = [];
        renderWordSearch();
    }
}

function renderMemoryMatch() {

            const foundRangeKey = Object.keys(DATA).find(key => {
                const rangeNumbers = key.replace(/[^0-9-]/g, "").split("-"); 
                return rangeNumbers.includes(cleanKey);
            });
            if (foundRangeKey) {
                currentData = DATA[foundRangeKey];
                activeKey = foundRangeKey; 
            }
        }
    }

    // 2. Inicializar el estado si cambiamos de unidad o se pide reinicio
    if (!window.memoryState || window.memoryState.activeUnit !== activeKey || window.memoryState.resetPending) {
        let pairs = [];

        if (currentData) {
            // Estrategia A: Si viene tu array masivo de preguntas de Quiz (q vs answer)
            if (currentData.quizQuestions && currentData.quizQuestions.length > 0) {
                currentData.quizQuestions.forEach(item => {
                    if (item.q && (item.answer || item.correctAnswer)) {
                        pairs.push({ 
                            textA: item.q, 
                            textB: (item.answer || item.correctAnswer).toUpperCase() 
                        });
                    }
                });
            }

            // Estrategia B: Si el vocabulario son strings planos, los cruzamos con reglas o contexto
            if (pairs.length < 8 && currentData.vocabulary && currentData.vocabulary.length > 0) {
                currentData.vocabulary.forEach((word, i) => {
                    let cleanWord = typeof word === 'string' ? word : (word.word || word.term || "WORD");
                    let context = "Key concept from this unit";
                    
                    if (currentData.grammarRules && currentData.grammarRules.length > 0) {
                        context = currentData.grammarRules[i % currentData.grammarRules.length];
                    } else if (currentData.prompts && currentData.prompts.length > 0) {
                        context = currentData.prompts[i % currentData.prompts.length];
                    }
                    
                    pairs.push({ textA: cleanWord.toUpperCase(), textB: context });
                });
            }
        }

        // Estrategia C: Fallback de seguridad absoluto (Garantiza que NUNCA se vea vacío)
        if (pairs.length < 8) {
            pairs = [
                { textA: "MIGHT / MAY", textB: "Modals used to express future possibility" },
                { textA: "ALREADY", textB: "Action happened sooner than expected" },
                { textA: "YET", textB: "Action expected, placed at the end" },
                { textA: "EVER", textB: "Used in questions meaning 'at any time'" },
                { textA: "NEVER", textB: "Used for zero experience in life" },
                { textA: "EXPERIENCE", textB: "Knowledge gained by doing things" },
                { textA: "ADVENTURE", textB: "An exciting or unusual experience" },
                { textA: "RECOMMEND", textB: "To advise or suggest a good choice" }
            ];
        }

        // Seleccionar exactamente 8 parejas para las 16 cartas
        let selectedPairs = pairs.sort(() => 0.5 - Math.random()).slice(0, 8);
        let cardsPool = [];

        selectedPairs.forEach((pair, index) => {
            // Limitar longitud de caracteres para que entren perfecto en la cuadrícula 4x4
            let cleanA = pair.textA.length > 40 ? pair.textA.substring(0, 37) + "..." : pair.textA;
            let cleanB = pair.textB.length > 40 ? pair.textB.substring(0, 37) + "..." : pair.textB;

            cardsPool.push({
                id: index * 2,
                pairId: index,
                text: cleanA,
                type: "concept",
                isFlipped: false,
                isMatched: false
            });
            cardsPool.push({
                id: index * 2 + 1,
                pairId: index,
                text: cleanB,
                type: "definition",
                isFlipped: false,
                isMatched: false
            });
        });

        // Mezclar las 16 cartas
        cardsPool.sort(() => 0.5 - Math.random());

        window.memoryState = {
            activeUnit: activeKey,
            cards: cardsPool,
            selectedCardIds: [],
            isLock: false,
            resetPending: false
        };
    }

    const state = window.memoryState;
    let cardsHtml = "";

    // 3. Generar las celdas de la cuadrícula

function flipMemoryCard(cardId) {
    const state = window.memoryState;
    if (!state || state.isLock || state.selectedCardIds.length >= 2) return;
    
    const card = state.cards.find(c => c.id === cardId);
    if (card.isFlipped || card.isMatched) return;

    card.isFlipped = true;
    state.selectedCardIds.push(cardId);
    renderMemoryMatch();

    if (state.selectedCardIds.length === 2) {
        state.isLock = true; 

        setTimeout(() => {
            const [id1, id2] = state.selectedCardIds;
            const c1 = state.cards.find(c => c.id === id1);
            const c2 = state.cards.find(c => c.id === id2);

            if (c1.pairId === c2.pairId && c1.type !== c2.type) {
                c1.isMatched = true;
                c2.isMatched = true;
            } else {
                c1.isFlipped = false;
                c2.isFlipped = false;
            }

            state.selectedCardIds = [];
            state.isLock = false; 
            renderMemoryMatch();
        }, 1200);
    }
}

function submitCategorySort(selectedCategory) {
    const state = window.categoryState;
    if (!state || !state.currentCard) return;

    const card = state.currentCard;

    // Verificar si la clasificación del estudiante es correcta
    if (card.category === selectedCategory) {
        state.feedback = "CORRECT";
        state.categories[selectedCategory].items.push(card);
        state.score.correct++;
    } else {
        state.feedback = "WRONG DIRECTION";
        // Si falla, devolvemos la tarjeta al final del mazo para que lo vuelvan a intentar
        state.pool.push(card);
    }

    // Remover la tarjeta procesada del frente del mazo
    state.pool.shift();
    state.currentCard = state.pool[0] || null;

    renderCategorySort();

    // Limpiar el texto flotante de feedback después de medio segundo
    setTimeout(() => {
        if (window.categoryState) {
            window.categoryState.feedback = null;
            renderCategorySort();
        }
    }, 600);
}

            // Recolectar preguntas o retos disponibles en el bloque actual
            let questionPool = [];
            
            if (block.quiz && block.quiz.questions) {
                questionPool = block.quiz.questions.map(q => q.question || q.text || "");
            }
            
            // Si el pool está muy vacío, inyectamos retos conversacionales basados en la gramática del bloque
            if (questionPool.length === 0) {
                const rules = block.grammarRules || block.grammar || [];
                rules.forEach(r => {
                    const concept = typeof r === 'object' ? (r.concept || r.rule || "") : r;
                    if (concept) questionPool.push(`Explain or give an example using the following system: "${concept}"`);
                });
            }

            // Respaldo de seguridad absoluta
            if (questionPool.length === 0) {
                questionPool = [
                    "How do you deploy this linguistic concept in a professional environment?",
                    "What is the structural difference between this block's grammar and your native syntax?",
                    "Can you construct a complex sentence utilizing the primary vocabulary term of this module?"
                ];
            }

            stage.innerHTML = `
                <div class="w-full max-w-sm mx-auto flex flex-col items-center gap-6 animate-fade-in text-center">
                    <p class="text-xs text-gray-400 font-medium">Spin the evaluation wheel to extract a random question from this unit:</p>
                    
                    <div class="relative w-36 h-36 my-2 flex items-center justify-center">
                        <div id="ww-wheel-graphic" class="absolute inset-0 rounded-full border-4 border-dashed border-orange-500/40 bg-gradient-to-tr from-[#161b22] to-[#21262d] transition-transform duration-500 ease-out flex items-center justify-center shadow-xl">
                            <i class="fa-solid fa-circle-notch text-6xl text-orange-500/20"></i>
                        </div>
                        <div class="z-10 w-16 h-16 rounded-full bg-[#161b22] border-2 border-orange-500 flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-sync text-xl text-orange-400 animate-spin" style="animation-duration: 8s;"></i>
                        </div>
                    </div>

                    <button id="btn-spin-wheel" onclick="spinQuestionWheel(${JSON.stringify(questionPool).replace(/"/g, '&quot;')})" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-widest transition-all shadow-lg cursor-pointer outline-none">
                        <i class="fa-solid fa-dice mr-2"></i>Spin the Wheel
                    </button>

                    <div id="ww-question-display" class="hidden w-full p-4 bg-[#161b22] border border-[#30363d] rounded-2xl animate-scale-up">
                        <span class="text-[10px] font-black uppercase tracking-widest text-orange-400 block mb-1.5">
                            <i class="fa-solid fa-clipboard-question mr-1"></i> Extracted Challenge:
                        </span>
                        <p id="ww-question-text" class="text-xs text-white font-bold leading-relaxed px-1"></p>
                    </div>
                </div>
            `;
        }

        // MOTOR DE ROTACIÓN Y SELECCIÓN DE PREGUNTAS
        function spinQuestionWheel(pool) {
            const wheel = document.getElementById("ww-wheel-graphic");
            const btn = document.getElementById("btn-spin-wheel");
            const display = document.getElementById("ww-question-display");
            const textTarget = document.getElementById("ww-question-text");

            if (!wheel || !btn || !display || !textTarget) return;

            // Deshabilitar controles mientras rueda
            btn.disabled = true;
            btn.innerText = "CRUNCHING DATA...";
            display.classList.add("hidden");

            // Generar una rotación aleatoria alta para el efecto cyberpunk
            const randomDegrees = Math.floor(Math.random() * 1000) + 720;
            wheel.style.transform = `rotate(${randomDegrees}deg)`;

            // Esperar a que la transición termine para revelar la pregunta
            setTimeout(() => {
                const randomQuestion = pool[Math.floor(Math.random() * pool.length)];
                
                // Pintar la pregunta seleccionada
                textTarget.innerText = randomQuestion;
                display.classList.remove("hidden");
                
                // Restaurar botón
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-dice mr-2"></i>Spin Again`;
            }, 600);
        }

        // 9. TIC-TAC-TOE EVOLUCIONADO (PURE GRID, WHITE BLOCKS & VERSUS MODES)
        let tttSize = 3;                  // Tamaño (3 o 6)
        let tttMode = "PC";               // "PC" o "PVP"
        let tttBoard = [];                // Matriz de juego

        // CONTROLADOR VISUAL DE SELECCIÓN DE BOTONES
        function setTTTConfig(type, value) {

                tttSize = value;
                document.getElementById("btn-scale-3").className = value === 3 ? "bg-[#21262d] border border-teal-500 text-white text-xs font-bold py-3 rounded-xl transition-all cursor-pointer outline-none" : "bg-[#21262d] border border-[#30363d] text-gray-400 text-xs font-bold py-3 rounded-xl transition-all cursor-pointer outline-none";

        // DESPLIEGUE FINAL DE ARRANQUE
        function initCustomPureTTT() {
            tttBoard = Array(tttSize * tttSize).fill("");
            tttCurrentTurn = "X"; // X siempre abre la jugada
            tttGameActive = true;

            const welcomeMsg = tttMode === "PC" ? "Your Turn (Player X). Claim a block node." : "Player X Turn. Make your move.";
            updateCustomPureTTTUI(welcomeMsg);

        // RENDERIZADOR ADAPTATIVO CON CASILLAS LIMPIAS (BLANCO INTERIOR)
        function updateCustomPureTTTUI(statusMessage) {
            const stage = document.getElementById("modal-game-stage");
            if (!stage) return;

            const gridColsClass = tttSize === 3 ? "grid-cols-3 gap-2.5 p-3" : "grid-cols-6 gap-1.5 p-2";
            const maxTableWidth = tttSize === 3 ? "max-w-sm" : "max-w-md";

            stage.innerHTML = `
                <div class="w-full ${maxTableWidth} mx-auto flex flex-col items-center gap-4 animate-fade-in text-center">

                        <button onclick="renderTicTacToe()" class="text-[10px] text-teal-400 hover:underline font-bold uppercase tracking-wider bg-teal-500/5 px-2 py-1 rounded-md border border-teal-500/10 cursor-pointer outline-none">Settings</button>
                    </div>

                    <div class="grid ${gridColsClass} w-full aspect-square bg-[#161b22] border border-[#30363d] rounded-2xl shadow-inner">
                        ${tttBoard.map((cell, idx) => {

                            if (cell === "X") {

                                cellClass = "bg-teal-950/20 border border-teal-500/30 pointer-events-none";
                            } else if (cell === "O") {
                                cellContent = `<i class="fa-solid fa-circle ${tttSize === 3 ? 'text-2xl' : 'text-xs'} text-fuchsia-400 animate-scale-up"></i>`;
                                cellClass = "bg-fuchsia-950/20 border border-fuchsia-500/30 pointer-events-none";
                            }

                            return `
                                <button onclick="clickCellCustom(${idx})" class="${cellClass} h-full rounded-xl flex items-center justify-center transition-all outline-none overflow-hidden select-none">

                </div>
            `;
        }

        // CONTROLADOR DE ACCIONES CON IA DEFENSIVA/OFENSIVA INTEGRADA
        function clickCellCustom(index) {
            if (!tttGameActive || tttBoard[index] !== "") return;

            // 1. Marcar la casilla del usuario (X)
            tttBoard[index] = tttCurrentTurn;

            // 2. Verificar si ganó el usuario
            if (checkPureWin(tttCurrentTurn)) {
                const winnerLabel = tttMode === "PVP" ? `Player ${tttCurrentTurn} is Victorious!` : "✓ Victory! Node layer successfully aligned.";
                endPureGame(winnerLabel, "text-teal-400");
                return;
            }

            // 3. Verificar empate
            if (!tttBoard.includes("")) {
                endPureGame("• Draw. All grid sectors are completely saturated.", "text-gray-400");
                return;
            }

            // 4. Manejo de Turnos
            if (tttMode === "PVP") {
                tttCurrentTurn = tttCurrentTurn === "X" ? "O" : "X";
                updateCustomPureTTTUI(`Player ${tttCurrentTurn} Turn. Claim an open block.`);
            } else {
                tttCurrentTurn = "O";
                updateCustomPureTTTUI("AI crunching responses...");
                
                setTimeout(() => {
                    // --- CEREBRO LOGÍSTICO DE LA PC ---
                    let aiChoice = null;
                    const emptyIndices = tttBoard.map((cell, idx) => cell === "" ? idx : null).filter(v => v !== null);

                    if (emptyIndices.length > 0) {
                        // REGLA 1: ¿La PC puede ganar en este movimiento? (Ofensiva)
                        for (let i of emptyIndices) {
                            tttBoard[i] = "O";
                            if (checkPureWin("O")) { aiChoice = i; tttBoard[i] = ""; break; }
                            tttBoard[i] = "";
                        }

                        // REGLA 2: ¿El usuario va a ganar en su próximo turno? ¡Bloquear! (Defensiva)
                        if (aiChoice === null) {
                            for (let i of emptyIndices) {
                                tttBoard[i] = "X";
                                if (checkPureWin("X")) { aiChoice = i; tttBoard[i] = ""; break; }
                                tttBoard[i] = "";
                            }
                        }

                        // REGLA 3: Posicionamiento táctico (Tomar el centro si está libre en 3x3)
                        if (aiChoice === null && tttSize === 3 && tttBoard[4] === "") {
                            aiChoice = 4;
                        }

                        // REGLA 4: Si no hay peligro ni victoria, elige una opción aleatoria del pool restante
                        if (aiChoice === null) {
                            aiChoice = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                        }

                        // Ejecutar la jugada final de la PC
                        tttBoard[aiChoice] = "O";

                        if (checkPureWin("O")) {
                            endPureGame("✗ Defeat. System routines successfully claimed the vector line.", "text-fuchsia-400");
                            return;
                        }

                        if (!tttBoard.includes("")) {
                            endPureGame("• Draw. All grid sectors are completely saturated.", "text-gray-400");
                            return;
                        }
                    }
                    
                    // Devolver control al usuario humano
                    tttCurrentTurn = "X";
                    updateCustomPureTTTUI("Your Turn. Neutralize the AI path.");
                }, 400); // Un poquitín más de delay simulando "pensamiento"
            }
        }

        // ALGORITMO COMPATIBLE CON TABLEROS VARIABLES
        function checkPureWin(player) {
            const targetLine = tttSize === 3 ? 3 : 4;

            // Filas
            for (let r = 0; r < tttSize; r++) {
                let count = 0;
                for (let c = 0; c < tttSize; c++) {
                    if (tttBoard[r * tttSize + c] === player) { count++; if (count === targetLine) return true; } else { count = 0; }
                }
            }
            // Columnas
            for (let c = 0; c < tttSize; c++) {
                let count = 0;
                for (let r = 0; r < tttSize; r++) {
                    if (tttBoard[r * tttSize + c] === player) { count++; if (count === targetLine) return true; } else { count = 0; }
                }
            }
            // Diagonales \
            for (let r = 0; r <= tttSize - targetLine; r++) {
                for (let c = 0; c <= tttSize - targetLine; c++) {
                    let match = true;
                    for (let i = 0; i < targetLine; i++) {
                        if (tttBoard[(r + i) * tttSize + (c + i)] !== player) { match = false; break; }
                    }
                    if (match) return true;
                }
            }
            // Diagonales /
            for (let r = targetLine - 1; r < tttSize; r++) {
                for (let c = 0; c <= tttSize - targetLine; c++) {
                    let match = true;
                    for (let i = 0; i < targetLine; i++) {
                        if (tttBoard[(r - i) * tttSize + (c + i)] !== player) { match = false; break; }
                    }
                    if (match) return true;
                }
            }
            return false;
        }

        function endPureGame(message, colorClass) {

            stage.innerHTML = `

                </div>
            `;
        }
        
        // 10. FIND ERRORS (DETECTOR DE ERRORES GRAMATICALES POR UNIDAD)
        let feCurrentChallenge = null;

        function renderFindErrors() {

                errorPool = [

                    ${feCurrentChallenge.clue ? `
                        <div class="w-full bg-rose-950/5 border border-rose-500/10 rounded-xl py-2 px-3 text-left">
                            <span class="text-[9px] font-black tracking-widest text-rose-400 uppercase block mb-0.5"><i class="fa-solid fa-circle-info mr-1"></i> Grammar Context:</span>

                    <div class="w-full flex flex-col gap-3">
                        <input type="text" id="fe-input" placeholder="Type the INCORRECT word here..." autocomplete="off" class="w-full bg-[#161b22] border border-[#30363d] focus:border-rose-500 rounded-xl px-4 py-3 text-sm text-center font-bold text-white tracking-wide outline-none transition-all placeholder-gray-600">
                        
                        <button id="btn-verify-error" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-widest transition-all shadow-lg">
                            Isolate Error Node
                        </button>
                    </div>

                    <div id="fe-feedback" class="hidden w-full py-2 rounded-xl font-bold text-xs border"></div>
                </div>
            `;

            // Asignar escuchadores
            const inputField = document.getElementById("fe-input");
            const verifyBtn = document.getElementById("btn-verify-error");

            if (inputField) {

                inputField.addEventListener("keydown", function(e) {

        // PROCESADOR DE VALIDACIÓN DE ERRORES
        function checkGrammarError() {
            const inputField = document.getElementById("fe-input");
            const feedback = document.getElementById("fe-feedback");
            if (!inputField || !feedback || !feCurrentChallenge) return;

            const userGuess = inputField.value.trim().toLowerCase();
            const targetIncorrect = feCurrentChallenge.incorrect.toLowerCase();
            const targetCorrect = feCurrentChallenge.correct;

            feedback.classList.remove("hidden");

            if (userGuess === targetIncorrect) {
                // ¡Acierto absoluto! Detectó el error
                feedback.className = "w-full py-2.5 rounded-xl font-bold text-xs bg-green-500/10 text-green-400 border border-green-500/20 leading-relaxed px-2 text-left flex items-start gap-2 animate-scale-up";
                feedback.innerHTML = `
                    <i class="fa-solid fa-circle-check text-sm mt-0.5"></i>
                    <div>
                        <p class="font-black">✓ Threat Isolated!</p>
                        <p class="text-[11px] text-gray-400 font-normal mt-0.5">"${feCurrentChallenge.incorrect}" is wrong. The perfect syntax requires: <span class="text-green-400 font-bold font-mono">${targetCorrect}</span></p>
                    </div>
                `;
                
                inputField.disabled = true;

                // Loop de recarga automática al ganar
                setTimeout(() => {
                    document.getElementById("modal-game-stage").innerHTML = `
                        <div class="text-center p-6 bg-[#161b22] border border-[#30363d] rounded-3xl max-w-sm mx-auto shadow-2xl animate-scale-up">
                            <i class="fa-solid fa-triangle-exclamation text-5xl text-rose-500 mb-3 animate-pulse"></i>
                            <h4 class="text-xl font-bold text-white">Syntax Restored</h4>
                            <p class="text-xs text-gray-400 mt-1 mb-4">You successfully debugged the grammar profile sequence.</p>
                            <button onclick="renderFindErrors()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wide transition-all shadow-md">Next Sentence</button>
                        </div>
                    `;
                }, 2500);

            } else {
                // Fallo de detección
                feedback.className = "w-full py-2 rounded-xl font-bold text-xs bg-red-500/10 text-red-400 border border-red-500/20 animate-scale-up";
                feedback.innerHTML = "✗ Incorrect word targeted. The sentence structure remains compromised.";
                
                inputField.classList.add("border-red-500");
                setTimeout(() => inputField.classList.remove("border-red-500"), 500);
            }
        }

       // =====================================================================
        // JUEGO 11: REORDER STEPS (MONOLITO AUTOCONTENIDO A PRUEBA DE FALLOS)
        // =====================================================================
        
        // Estado del juego centralizado en un único objeto global de control
        window.reorderGameData = {
            originalWords: [],   // Frase correcta en orden
            shuffledPool: [],    // Palabras desordenadas abajo
            userSequence: [],    // Palabras puestas por el alumno arriba
            correctCount: 0,     // Meta: 10
            wrongCount: 0        // Límite: 6
        };

        function renderReorderSteps() {
            const stage = document.getElementById("modal-game-stage");
            if (!stage) return;

            // 1. Inicializar contadores si la sesión es nueva
            if (!window.reorderGameData.correctCount) window.reorderGameData.correctCount = 0;
            if (!window.reorderGameData.wrongCount) window.reorderGameData.wrongCount = 0;

            let extractedPool = [];

            // 2. Extractor seguro desde la DATA del quiz de la unidad activa
            try {
                if (typeof DATA !== 'undefined' && DATA[currentBlock]) {
                    const block = DATA[currentBlock];
                    const questions = block.quizQuestions || [];

                    questions.forEach(item => {
                        if (item && item.q && item.answer) {
                            if (item.q.includes("_______")) {
                                let fullSentence = item.q.replace("_______", item.answer);
                                
                                // Limpieza manual segura letra por letra sin RegEx peligrosas
                                let cleanStr = "";
                                const allowed = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' ";
                                for (let i = 0; i < fullSentence.length; i++) {
                                    if (allowed.includes(fullSentence[i])) cleanStr += fullSentence[i];
                                }

                                const words = cleanStr.split(" ").filter(w => w.trim().length > 0);
                                // Filtrar frases que tengan un tamaño divertido de ordenar (3 a 8 palabras)
                                if (words.length >= 3 && words.length <= 8) {
                                    extractedPool.push(words);
                                }
                            }
                        }
                    });
