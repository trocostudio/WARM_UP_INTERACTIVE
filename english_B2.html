<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Interactive — Nivel B2</title>
    <style>
        :root {
            --bg-primary: #FFF8F0;
            --bg-card: #FFFFFF;
            --text-main: #3E1500;
            --text-muted: #7D4020;
            --color-primary: #E65100;
            --color-accent: #FFB300;
            --color-danger: #D84315;
            --color-success: #2E7D32;
            --border-radius-card: 16px;
            --border-radius-modal: 24px;
            --shadow-main: 0 8px 32px rgba(230, 81, 0, 0.15);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #1A0800;
            --bg-card: #2D1500;
            --text-main: #FFE0B2;
            --text-muted: #BCAAA4;
            --color-primary: #BF360C;
            --color-accent: #FFB300;
            --shadow-main: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: var(--transition-smooth);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #theme-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: var(--bg-card);
            border: 2px solid var(--color-primary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: var(--shadow-main);
            touch-action: manipulation;
        }

        header {
            background: var(--bg-card);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-main);
            border-bottom: 3px solid var(--color-primary);
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        main {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            min-height: 48px;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background-color: var(--color-primary);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn:active { transform: scale(0.98); }
        .btn-accent { background-color: var(--color-accent); color: #3E1500; }
        .btn-outline { background-color: transparent; border: 2px solid var(--color-primary); color: var(--text-main); }

        .grid-units {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        @media(min-width: 600px) { .grid-units { grid-template-columns: repeat(2, 1fr); } }
        @media(min-width: 900px) { .grid-units { grid-template-columns: repeat(3, 1fr); } }

        .card-unit {
            background: var(--bg-card);
            border-radius: var(--border-radius-card);
            padding: 20px;
            box-shadow: var(--shadow-main);
            border-left: 6px solid var(--color-primary);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .card-unit:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(230, 81, 0, 0.25);
        }

        .card-unit h3 { margin-bottom: 8px; color: var(--text-main); }
        .card-unit p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px; }

        .workspace-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media(min-width: 768px) { .workspace-layout { grid-template-columns: 1fr 1.2fr; } }

        .panel-column {
            background: var(--bg-card);
            border-radius: var(--border-radius-card);
            padding: 20px;
            box-shadow: var(--shadow-main);
        }

        .grid-games {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media(min-width: 480px) { .grid-games { grid-template-columns: repeat(2, 1fr); } }

        .instruction-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-style: italic;
        }

        /* Flashcards */
        .flashcard-wrapper { perspective: 1000px; width: 100%; height: 260px; margin: 20px 0; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--border-radius-card); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; text-align: center; box-shadow: var(--shadow-main); }
        .card-front { background: var(--color-primary); color: white; }
        .card-back { background: var(--bg-card); border: 3px solid var(--color-primary); color: var(--text-main); transform: rotateY(180deg); }

        /* Quiz Choices Layout */
        .quiz-option { background: var(--bg-card); border: 2px solid var(--text-muted); border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; width: 100%; text-align: left; font-size: 1rem; color: var(--text-main); transition: var(--transition-smooth); min-height: 48px; }
        .quiz-option.correct { background: var(--color-success); color: white; border-color: var(--color-success); }
        .quiz-option.incorrect { background: var(--color-danger); color: white; border-color: var(--color-danger); }

        /* Word Search */
        .wordsearch-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 15px auto; max-width: 400px; }
        .ws-cell { aspect-ratio: 1; background: var(--bg-card); border: 1px solid var(--text-muted); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1rem; cursor: pointer; user-select: none; border-radius: 4px; }
        .ws-cell.selected { background: var(--color-accent); color: #3E1500; }
        .ws-cell.found { background: var(--color-success); color: white; }

        /* Memory */
        .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
        .memory-card { aspect-ratio: 1.2; background: var(--color-primary); color: transparent; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; text-align: center; padding: 6px; border-radius: 8px; cursor: pointer; user-select: none; word-break: break-word; }
        .memory-card.flipped { background: var(--bg-card); border: 2px solid var(--color-primary); color: var(--text-main); }
        .memory-card.matched { background: var(--color-success); color: white; opacity: 0.6; }

        /* Roulette */
        .roulette-container { position: relative; width: 240px; height: 240px; margin: 20px auto; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--color-primary); position: relative; overflow: hidden; transition: transform 3s cubic-bezier(0.1, 0.8, 0.1, 1); background: conic-gradient(var(--color-primary) 0deg 45deg, var(--color-accent) 45deg 90deg, var(--color-primary) 90deg 135deg, var(--color-accent) 135deg 180deg, var(--color-primary) 180deg 225deg, var(--color-accent) 225deg 270deg, var(--color-primary) 270deg 315deg, var(--color-accent) 315deg 360deg); }
        .wheel-pointer { position: absolute; top: -10px; left: calc(50% - 15px); width: 30px; height: 30px; background: var(--text-main); clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 10; }

        /* Find Errors */
        .error-text-container { background: var(--bg-primary); padding: 20px; border-radius: 12px; border: 1px dashed var(--color-primary); line-height: 2; font-size: 1.1rem; }
        .err-word { position: relative; cursor: pointer; display: inline-block; padding: 0 4px; border-radius: 4px; transition: var(--transition-smooth); }
        .err-word:hover { background: rgba(230, 81, 0, 0.15); }
        .err-word.corrected { border: 2px solid var(--color-success); background: rgba(46, 125, 50, 0.1); color: var(--color-success); font-weight: bold; }
        .err-word.corrected::after { content: " ✓"; color: var(--color-success); font-size: 0.8rem; }

        /* Jeopardy Board */
        .jeopardy-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; overflow-x: auto; }
        .jeopardy-cat { background: var(--color-primary); color: white; padding: 10px; text-align: center; font-weight: bold; border-radius: 8px; font-size: 0.85rem; min-height: 48px; display: flex; align-items: center; justify-content: center; }
        .jeopardy-cell { background: var(--bg-card); border: 2px solid var(--color-primary); color: var(--color-primary); font-size: 1.2rem; font-weight: bold; aspect-ratio: 1.3; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; transition: var(--transition-smooth); }
        .jeopardy-cell.played { background: rgba(125,64,32,0.2); border-color: var(--text-muted); color: var(--text-muted); cursor: not-allowed; }
        .scoreboard { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
        .score-box { padding: 10px; border-radius: 8px; color: white; font-weight: bold; text-align: center; min-width: 100px; }
        .score-box.team-0 { background: #D32F2F; } .score-box.team-1 { background: #1976D2; } .score-box.team-2 { background: #388E3C; } .score-box.team-3 { background: #FBC02D; color: #3E1500; }

        /* Generic items layout */
        .word-display { font-size: 2rem; letter-spacing: 0.4rem; text-align: center; margin: 20px 0; font-weight: bold; }
        .keyboard-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 15px; }
        .key-btn { min-height: 44px; background: var(--bg-card); border: 1px solid var(--color-primary); border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--text-main); }
        .key-btn:disabled { opacity: 0.4; }
        .feedback-message { padding: 12px; border-radius: 8px; margin: 10px 0; text-align: center; font-weight: bold; display: none; }
        .progress-bar-container { width: 100%; background: #e0e0e0; border-radius: 10px; height: 8px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--color-accent); width: 0%; transition: width 0.3s ease; }
        .app-footer { text-align: center; padding: 20px; font-size: 0.85rem; color: var(--text-muted); margin-top: auto; }
    </style>
</head>
<body>

    <button id="theme-toggle" aria-label="Toggle structural theme">🌓</button>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" class="btn-back-nav" style="
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 0 16px;
                height: 42px;
                border-radius: 12px;
                background: var(--border-color);
                color: var(--primary-color);
                text-decoration: none;
                font-size: 0.95rem;
                font-weight: bold;
                transition: background 0.3s ease, transform 0.2s ease;
                border: none;
                cursor: pointer;
            " onmouseover="this.style.background='#FFCDD2'; this.style.transform='scale(1.03)';" onmouseout="this.style.background='var(--border-color)'; this.style.transform='scale(1)';">
                🏠 Home
            </a>
            <div class="header-logo">English Interactive — Level B2</div>
        </div>
    </header>

    <main id="app">
        <div id="screen-units" class="screen active">
            <h2 style="margin-bottom:15px; text-align:center;">Select Learning Module</h2>
            <div class="grid-units" id="units-list"></div>
        </div>

        <div id="screen-dashboard" class="screen">
            <button class="btn btn-outline" id="dash-back-btn">⬅️ Back to All Units</button>
            <h2 id="dash-title" style="margin: 15px 0 5px 0; color: var(--color-primary);"></h2>
            <p id="dash-grammar" style="font-size:0.95rem; margin-bottom:20px; color: var(--text-muted);"></p>
            
            <div class="workspace-layout">
                <div class="panel-column">
                    <h3 style="margin-bottom:10px;">💬 Section: Warm-Up Prompts</h3>
                    <p class="instruction-text">Answer the prompts aloud to practice conversation fluency.</p>
                    <div id="warmup-prompts-container"></div>
                </div>

                <div class="panel-column">
                    <h3 style="margin-bottom:15px;">🎮 Section: Learning Games</h3>
                    <div class="grid-games" id="games-hub-buttons">
                        <button class="btn" data-game="1">🃏 Flashcards</button>
                        <button class="btn" data-game="2">⚡ Quiz Mode</button>
                        <button class="btn" data-game="3">✏️ Fill Blanks</button>
                        <button class="btn" data-game="4">🔍 Word Search</button>
                        <button class="btn" data-game="5">🧠 Memory Pairs</button>
                        <button class="btn" data-game="6">📦 Drag & Sort</button>
                        <button class="btn" data-game="7">💀 Hangman</button>
                        <button class="btn" data-game="8">🎡 Roulette</button>
                        <button class="btn btn-accent" data-game="9">🔎 Find Errors</button>
                        <button class="btn btn-accent" data-game="10">🏆 Jeopardy</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-game" class="screen">
            <button class="btn btn-outline" id="game-back-btn">📋 Return to Workspace</button>
            <div id="game-container-zone"></div>
        </div>
    </main>

    <footer class="app-footer">
        English Interactive Platform &bull; Level B2 Core Engine
    </footer>

            playWordSearch(target) {
                const words = STATE.currentModule.wordsearch;
                const size = 10;
                let grid = Array(size).fill(null).map(() => Array(size).fill(''));
                let selected = [];
                let found = [];

                const view = document.createElement('div');
                view.innerHTML = `
                    <h2>🔍 Advanced Word Search</h2>
                    <p class="instruction-text">Click individual cell matrix keys to isolate the expected list targets vocabulary keys.</p>
                    <div style="margin-bottom:12px; font-weight:bold;">Targets: <span id="ws-keys-pool" style="color:var(--color-primary);"></span></div>
                    <div class="wordsearch-grid" id="ws-matrix"></div>
                    <button class="btn btn-accent" id="ws-evaluate-trigger">Submit Combination</button>
                `;
                target.appendChild(view);

                // Horizontal placement algorithm mapping strategy
                words.forEach(w => {
                    let placed = false;
                    while(!placed) {
                        let r = Math.floor(Math.random() * size);
                        let c = Math.floor(Math.random() * (size - w.length));
                        let clean = true;
                        for(let i=0; i<w.length; i++) { if(grid[r][c+i] !== '') clean = false; }
                        if(clean) {
                            for(let i=0; i<w.length; i++) grid[r][c+i] = w[i];
                            placed = true;
                        }
                    }
                });

                const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                for(let r=0; r<size; r++) {
                    for(let c=0; c<size; c++) { if(grid[r][c] === '') grid[r][c] = letters[Math.floor(Math.random() * 26)]; }
                }

                const printGrid = () => {
                    const mEl = document.getElementById('ws-matrix');
                    mEl.innerHTML = '';
                    document.getElementById('ws-keys-pool').innerText = words.filter(item => !found.includes(item)).join(", ");

                    for(let r=0; r<size; r++) {
                        for(let c=0; c<size; c++) {
                            const cell = document.createElement('div');
                            cell.className = 'ws-cell';
                            cell.innerText = grid[r][c];
                            cell.setAttribute('data-coord', `${r}-${c}`);
                            cell.addEventListener('click', () => {
                                cell.classList.toggle('selected');
                                toggleSelection(`${r}-${c}`);
                            });
                            mEl.appendChild(cell);
                        }
                    }
                };

                const toggleSelection = (coord) => {
                    const index = selected.indexOf(coord);
                    if(index > -1) selected.splice(index, 1);
                    else selected.push(coord);
                };

                document.getElementById('ws-evaluate-trigger').addEventListener('click', () => {
                    let collectedStr = selected.map(coord => {
                        const [r, c] = coord.split("-").map(Number);
                        return grid[r][c];
                    }).join("");

                    let reversedStr = collectedStr.split("").reverse().join("");
                    let match = words.find(w => (w === collectedStr || w === reversedStr) && !found.includes(w));

                    if(match) {
                        found.push(match);
                        selected.forEach(coord => {
                            const node = document.querySelector(`[data-coord="${coord}"]`);
                            if(node) { node.classList.remove('selected'); node.classList.add('found'); }
                        });
                        selected = [];
                        if(found.length === words.length) alert("Victory! Entire matrix grid parameters fully extracted.");
                        else document.getElementById('ws-keys-pool').innerText = words.filter(item => !found.includes(item)).join(", ");
                    } else {
                        alert("Selection does not correspond to an undetected targets term list component.");
                    }
                });

                printGrid();
            },

                    <p class="instruction-text">Map each grammatical segment card to its correct taxonomy box folder destination.</p>
                    <div id="ds-stack-area" style="display:flex; flex-direction:column; gap:10px; margin:20px 0;"></div>
                    <button class="btn btn-accent" id="ds-evaluate-btn">Verify Category Sorting</button>
                `;
                target.appendChild(view);

                const stack = document.getElementById('ds-stack-area');
                config.items.forEach((item, index) => {
                    const row = document.createElement('div');
                    row.className = 'quiz-option';
                    row.style.cssText = 'display:flex; align-items:center; justify-content:space-between; cursor:default;';
                    let selectOptions = config.categories.map(cat => `<option value="${cat}">${cat}</option>`).join("");
                    row.innerHTML = `
                        <span style="font-weight:600;">"${item.text}"</span>
                        <select id="ds-sel-${index}" style="padding:8px; border-radius:6px; background:var(--bg-primary); color:var(--text-main); font-weight:bold; border:1px solid var(--color-primary);">
                            ${selectOptions}
                        </select>
                    `;
                    stack.appendChild(row);
                });

                document.getElementById('ds-evaluate-btn').addEventListener('click', () => {
                    let correctCount = 0;
                    config.items.forEach((item, idx) => {
                        if(document.getElementById(`ds-sel-${idx}`).value === item.cat) correctCount++;
                    });
                    alert(`Evaluation complete: ${correctCount} out of ${config.items.length} segments aligned correctly.`);
                });
            },

            playHangman(target) {
                const pool = STATE.currentModule.hangman;
                const session = pool[Math.floor(Math.random() * pool.length)];
                let lettersPicked = [];
                let lives = 6;

                const view = document.createElement('div');
                view.innerHTML = `
                    <h2>💀 Digital Hangman Module</h2>
                    <p class="instruction-text">Deduce target lexical strings before exhausting systemic life tolerances.</p>
                    <p style="font-weight:bold; color:var(--color-primary); margin-bottom:8px;">HINT CLAUSE: "${session.hint}"</p>
                    <p style="font-size:1rem; font-weight:bold; margin-bottom:12px;">Remaining Lifelines: <span id="hm-life-span" style="color:var(--color-danger);">${lives}</span> 🩸</p>
                    <div class="word-display" id="hm-crypt-display"></div>
                    <div class="keyboard-grid" id="hm-onscreen-keyboard"></div>
                `;
                target.appendChild(view);

                const updateCrypt = () => {
                    let displayStr = "";
                    let complete = true;
                    for(let char of session.word) {
                        if(lettersPicked.includes(char)) displayStr += char + " ";
                        else { displayStr += "_ "; complete = false; }
                    }
                    document.getElementById('hm-crypt-display').innerText = displayStr.trim();
                    if(complete) endSession(true);
                    else if(lives <= 0) endSession(false);
                };

                const endSession = (win) => {
                    document.getElementById('hm-onscreen-keyboard').innerHTML = win ? 
                        `<h3 style="grid-column: span 7; text-align:center; color:var(--color-success);">Victory! Word resolved perfectly.</h3>` :
                        `<h3 style="grid-column: span 7; text-align:center; color:var(--color-danger);">Failed! Target sequence was: ${session.word}</h3>`;
                };

                const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
                const kb = document.getElementById('hm-onscreen-keyboard');
                abc.forEach(l => {
                    const btn = document.createElement('button');
                    btn.className = 'key-btn';
                    btn.innerText = l;
                    btn.addEventListener('click', () => {
                        btn.disabled = true;
                        lettersPicked.push(l);
                        if(!session.word.includes(l)) {
                            lives--;
                            document.getElementById('hm-life-span').innerText = lives;
                        }
                        updateCrypt();
                    });
                    kb.appendChild(btn);
                });

                updateCrypt();
            },

            playRoulette(target) {
                const prompts = STATE.currentModule.roulette;
                const view = document.createElement('div');
                view.innerHTML = `
                    <h2>🎡 Wheel of Questions</h2>
                    <p class="instruction-text">Spin the active radial wheel to select an existential conversation prompt statement.</p>
                    <div class="roulette-container">
                        <div class="wheel-pointer"></div>
                        <div class="wheel" id="ui-wheel-object"></div>
                    </div>
                    <button class="btn btn-accent" id="wheel-spin-trigger">Spin Radial Wheel</button>
                    <h3 id="wheel-output-panel" style="text-align:center; min-height:45px; margin-top:20px; color:var(--color-primary); padding:10px; line-height:1.4;"></h3>
                `;
                target.appendChild(view);

                let spinning = false;
                document.getElementById('wheel-spin-trigger').addEventListener('click', () => {
                    if(spinning) return;
                    spinning = true;
                    document.getElementById('wheel-output-panel').innerText = "";
                    const deg = Math.floor(Math.random() * 360) + 1440;
                    const wheel = document.getElementById('ui-wheel-object');
                    wheel.style.transform = `rotate(${deg}deg)`;

                    setTimeout(() => {
                        spinning = false;
                        const pick = prompts[Math.floor(Math.random() * prompts.length)];
                        document.getElementById('wheel-output-panel').innerText = `🎯 Selected Prompt: "${pick}"`;
                        wheel.style.transition = 'none';
                        wheel.style.transform = `rotate(${deg % 360}deg)`;
                        setTimeout(() => { wheel.style.transition = 'transform 3s cubic-bezier(0.1, 0.8, 0.1, 1)'; }, 50);
                    }, 3050);
                });
            },

            // ADVANCED B2 EXTRAS MODULES:
            playFindErrors(target) {
                const errorConfig = STATE.currentModule.errors;
                let textRaw = errorConfig.text;
                let foundErrors = 0;
                let totalToFind = errorConfig.targets.length;

                const view = document.createElement('div');
                view.innerHTML = `
                    <h2>🔎 Find Grammatical Errors</h2>
                    <p class="instruction-text">Analyze the paragraph block below. Click on individual wrong vocabulary or syntax structures to fix them inline.</p>
                    <div style="margin-bottom:10px; font-weight:bold;">Progress Tracker: <span id="err-score-span">0</span> / ${totalToFind} Errors Rectified</div>
                    <div class="error-text-container" id="err-text-hub"></div>
                `;
                target.appendChild(view);

                const containerHub = document.getElementById('err-text-hub');
                // Tokenize words based on structural markers safely
                let tokens = textRaw.split(" ");
                tokens.forEach(tok => {
                    if(tok.startsWith("*") && tok.endsWith("*")) {
                        let cleanWord = tok.replace(/\*/g, "");
                        const span = document.createElement('span');
                        span.className = "err-word";
                        span.innerText = cleanWord + " ";
                        span.addEventListener('click', () => {
                            if(span.classList.contains('corrected')) return;
                            span.classList.add('corrected');
                            foundErrors++;
                            document.getElementById('err-score-span').innerText = foundErrors;
                            if(foundErrors === totalToFind) {
                                alert("Fantastic proofreading! The entire text matrix repository aligns with strict B2 syntax guidelines.");
                            }
                        });
                        containerHub.appendChild(span);
                    } else {
                        const plainTextNode = document.createTextNode(tok + " ");
                        containerHub.appendChild(plainTextNode);
                    }
                });
            },

            playJeopardy(target) {
                const dataSet = STATE.currentModule.jeopardy;
                
                // Group dataset into categories dynamically
                let categories = {};
                dataSet.forEach(item => {
                    if(!categories[item.cat]) categories[item.cat] = [];
                    categories[item.cat].push(item);
                });

                const view = document.createElement('div');
                view.innerHTML = `
                    <h2>🏆 Interactive Jeopardy Tournament</h2>
                    <p class="instruction-text">Select values across knowledge tracks. Manage multi-team score configurations manually via control panels.</p>
                    <div class="jeopardy-grid" id="jp-board-grid"></div>
                    
                    <div class="scoreboard">
                        <div class="score-box team-0">🔴 Team A: $<span id="jp-s-0">0</span><br><button class="btn btn-accent" style="min-height:30px; height:30px; padding:2px; font-size:0.8rem; margin:4px 0 0 0;" onclick="adjustJpScore(0, 100)">+100</button> <button class="btn btn-outline" style="min-height:30px; height:30px; padding:2px; font-size:0.8rem; color:#fff; border-color:#fff; margin:4px 0 0 0;" onclick="adjustJpScore(0, -100)">-100</button></div>
                        <div class="score-box team-1">🔵 Team B: $<span id="jp-s-1">0</span><br><button class="btn btn-accent" style="min-height:30px; height:30px; padding:2px; font-size:0.8rem; margin:4px 0 0 0;" onclick="adjustJpScore(1, 100)">+100</button> <button class="btn btn-outline" style="min-height:30px; height:30px; padding:2px; font-size:0.8rem; color:#fff; border-color:#fff; margin:4px 0 0 0;" onclick="adjustJpScore(1, -100)">-100</button></div>
                        <div class="score-box team-2">🟢 Team C: $<span id="jp-s-2">0</span><br><button class="btn btn-accent" style="min-height:30px; height:30px; padding:2px; font-size:0.8rem; margin:4px 0 0 0;" onclick="adjustJpScore(2, 100)">+100</button> <button class="btn btn-outline" style="min-height:30px; height:30px; padding:2px; font-size:0.8rem; color:#fff; border-color:#fff; margin:4px 0 0 0;" onclick="adjustJpScore(2, -100)">-100</button></div>
                        <div class="score-box team-3">🟡 Team D: $<span id="jp-s-3">0</span><br><button class="btn btn-accent" style="min-height:30px; height:30px; padding:2px; font-size:0.8rem; margin:4px 0 0 0;" onclick="adjustJpScore(3, 100)">+100</button> <button class="btn btn-outline" style="min-height:30px; height:30px; padding:2px; font-size:0.8rem; color:var(--text-main); border-color:var(--text-main); margin:4px 0 0 0;" onclick="adjustJpScore(3, -100)">-100</button></div>
                    </div>

                    <div id="jp-modal-overlay" style="display:none; margin-top:20px; padding:20px; background:var(--bg-primary); border:3px solid var(--color-primary); border-radius:12px;">
                        <h4 id="jp-modal-cat-val" style="color:var(--color-primary);"></h4>
                        <p id="jp-modal-q-prompt" style="font-size:1.2rem; margin:15px 0; font-weight:bold;"></p>
                        <button class="btn btn-accent" id="jp-modal-reveal-trigger">Reveal System Answer</button>
                        <p id="jp-modal-a-reveal" style="display:none; margin-top:15px; font-style:italic; color:var(--color-success); font-size:1.1rem;"></p>
                    </div>
                `;
                target.appendChild(view);

                // Update displays locally
                window.adjustJpScore = (teamIdx, value) => {
                    STATE.jeopardyScores[teamIdx] += value;
                    document.getElementById(`jp-s-${teamIdx}`).innerText = STATE.jeopardyScores[teamIdx];
                };

                const gridBoard = document.getElementById('jp-board-grid');
                let catNames = Object.keys(categories);

                // Print headers row cleanly
                catNames.forEach(cat => {
                    const head = document.createElement('div');
                    head.className = "jeopardy-cat";
                    head.innerText = cat;
                    gridBoard.appendChild(head);
                });

                // Render 5 grid tiers rows sequentially (100 down to 500 values)
                for(let tierIndex = 0; tierIndex < 5; tierIndex++) {
                    catNames.forEach(cat => {
                        const cellData = categories[cat][tierIndex];
                        const cellNode = document.createElement('div');
                        cellNode.className = "jeopardy-cell";
                        cellNode.innerText = `$${cellData.val}`;
                        cellNode.addEventListener('click', () => {
                            if(cellNode.classList.contains('played')) return;
                            cellNode.classList.add('played');
                            
                            // Pop configuration options panel modal
                            const overlay = document.getElementById('jp-modal-overlay');
                            overlay.style.display = "block";
                            document.getElementById('jp-modal-cat-val').innerText = `${cellData.cat} — $${cellData.val}`;
                            document.getElementById('jp-modal-q-prompt').innerText = cellData.q;
                            
                            const revealNode = document.getElementById('jp-modal-a-reveal');
                            revealNode.style.display = "none";
                            revealNode.innerText = `Expected Resolution Key: ${cellData.a}`;
                        });
                        gridBoard.appendChild(cellNode);
                    });
                }

                document.getElementById('jp-modal-reveal-trigger').addEventListener('click', () => {
                    document.getElementById('jp-modal-a-reveal').style.display = "block";
                });
            }
        };

        // SETUP INITIALIZATION CORE LOGIC ON WINDOW LOAD
        document.addEventListener('DOMContentLoaded', () => UI.init());

        // HARD CODED RUNTIME COMPLIANCE VALIDATOR HOOK
        setInterval(() => {
            const signature = document.getElementById('firma-seguridad');
            const appWorkspace = document.getElementById('app');
            const failureOverlay = document.getElementById('acceso-denegado');
            if (!signature || signature.textContent.trim() !== 'Creado por Tony Salas & German Peña' ||
                getComputedStyle(signature).display === 'none' ||
                getComputedStyle(signature).opacity === '0' ||
                getComputedStyle(signature).visibility === 'hidden') {
                if (appWorkspace) appWorkspace.style.display = 'none';
                if (!failureOverlay) {
                    const blockDiv = document.createElement('div');
                    blockDiv.id = 'acceso-denegado';
                    blockDiv.style.cssText = 'position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;';
                    blockDiv.innerHTML = '<p style="color:red;font-size:2rem;text-align:center;padding:2rem;">⚠️ ACCESO DENEGADO ⚠️<br><span style="font-size:1rem;">El código de seguridad y la firma han sido alterados. CREA TU VERGA TU, CARA E MONDA.</span></p>';
                    document.body.appendChild(blockDiv);
                }
            }
        }, 1000);
    </script>
</body>
</html>
